name: Build Match Server Image

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
      - master
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "packages/**"
      - ".github/workflows/match-server-image.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: poneglyph-one-cluster
  ECS_SERVICE_DEV: poneglyph-one-sim-dev
  ECR_REPOSITORY: poneglyph-one-optcg-sim
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push match server image
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          docker build -t "$IMAGE_URI:sha-${GITHUB_SHA}" .
          docker push "$IMAGE_URI:sha-${GITHUB_SHA}"

          if [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_REF_NAME}" = "master" ]; then
            docker tag "$IMAGE_URI:sha-${GITHUB_SHA}" "$IMAGE_URI:latest"
            docker push "$IMAGE_URI:latest"
          fi

          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            docker tag "$IMAGE_URI:sha-${GITHUB_SHA}" "$IMAGE_URI:dev"
            docker push "$IMAGE_URI:dev"
          fi

      - name: Redeploy sim dev service
        if: github.ref_name == 'dev'
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE_DEV" \
            --force-new-deployment

      - name: Summarize image tag
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          echo "Pushed $IMAGE_URI:sha-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
