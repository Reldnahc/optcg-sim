name: Post-merge packet cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read
  pull-requests: read

jobs:
  preflight:
    name: cleanup-preflight
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node for cleanup tooling
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Write cleanup workflow input
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");

            const pr = context.payload.pull_request;
            if (!pr || !pr.merged) {
              core.setFailed("Post-merge cleanup preflight requires a merged pull request.");
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              pull_number: pr.number,
              repo: context.repo.repo,
            });

            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              pull_number: pr.number,
              repo: context.repo.repo,
            });

            fs.writeFileSync("cleanup-workflow-input.json", `${JSON.stringify({
              changedFiles: files.map((file) => ({ filename: file.filename })),
              defaultBranch: context.payload.repository.default_branch,
              eventSenderUserType: context.payload.sender?.type,
              issueComments: comments.map((comment) => ({
                authorAssociation: comment.author_association,
                body: comment.body || "",
                createdAt: comment.created_at,
                id: comment.id,
                updatedAt: comment.updated_at,
                userType: comment.user?.type || "",
              })),
              pullRequest: {
                baseRef: pr.base.ref,
                body: pr.body || "",
                createdAt: pr.created_at,
                headRef: pr.head.ref,
                mergeCommitSha: pr.merge_commit_sha,
                merged: pr.merged === true,
                mergedAt: pr.merged_at,
                number: pr.number,
                updatedAt: pr.updated_at,
              },
              reviews: reviews.map((review) => ({
                body: review.body || "",
                id: review.id,
                state: review.state,
                submittedAt: review.submitted_at,
                userType: review.user?.type || "",
              })),
            }, null, 2)}\n`);

      - name: Build cleanup evidence
        run: >
          node --experimental-strip-types tools/post-merge-cleanup.ts
          --workflow-evidence-json-file cleanup-workflow-input.json
          --metadata-source-output-file cleanup-metadata.md
          --evidence-json-output-file cleanup-evidence.json

      - name: Validate cleanup metadata and write preflight plan
        run: >
          node --experimental-strip-types tools/post-merge-cleanup.ts
          --metadata-source-file cleanup-metadata.md
          --evidence-json-file cleanup-evidence.json
          --preflight-plan-file bound-cleanup-plan.json

      - name: Upload bound cleanup plan
        if: ${{ success() && hashFiles('bound-cleanup-plan.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: bound-cleanup-plan.json
          path: bound-cleanup-plan.json
          if-no-files-found: error

  cleanup:
    name: cleanup-direct-push
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out trusted default branch for cleanup
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.POST_MERGE_PACKET_CLEANUP_TOKEN }}
          persist-credentials: true

      - name: Configure cleanup actor
        run: |
          git config user.name "optcg-packet-cleanup[bot]"
          git config user.email "optcg-packet-cleanup[bot]@users.noreply.github.com"

      - name: Set up Node for cleanup tooling
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Download validated cleanup plan
        uses: actions/download-artifact@v4
        with:
          name: bound-cleanup-plan.json
          path: .cleanup

      - name: Execute validated packet cleanup
        run: >
          node --experimental-strip-types tools/post-merge-cleanup.ts
          --execute-plan-file .cleanup/bound-cleanup-plan.json

      - name: Finalize cleanup-scoped lifecycle verification
        run: >
          node --experimental-strip-types tools/post-merge-cleanup.ts
          --finalize-plan-file .cleanup/bound-cleanup-plan.json

      - name: Push direct cleanup commit
        run: git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Build branch cleanup state
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const plan = JSON.parse(fs.readFileSync(".cleanup/bound-cleanup-plan.json", "utf8"));
            const pr = context.payload.pull_request;
            const branchStates = [];
            const associatedBranches = new Set([pr.head.ref]);
            for (const story of plan.stories) {
              const storyId = String(story.storyId).toLowerCase();
              for (const branch of plan.branches) {
                if (String(branch).toLowerCase().includes(storyId)) {
                  associatedBranches.add(branch);
                }
              }
            }

            for (const branch of plan.branches) {
              try {
                const branchResponse = await github.rest.repos.getBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch,
                });
                const compareResponse = await github.rest.repos.compareCommitsWithBasehead({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  basehead: `${context.payload.repository.default_branch}...${branch}`,
                });
                branchStates.push({
                  aheadByDefault: compareResponse.data.ahead_by,
                  associatedWithCleanup: associatedBranches.has(branch),
                  name: branch,
                  protected: branchResponse.data.protected === true,
                });
              } catch (error) {
                core.warning(`Unable to inspect cleanup branch ${branch}: ${error.message}`);
              }
            }

            fs.writeFileSync(".cleanup/branch-cleanup-state.json", `${JSON.stringify({
              branchStates,
              mergedPrHeadBranch: pr.head.ref,
              packetCleanupSucceeded: true,
            }, null, 2)}\n`);

      - name: Validate branch cleanup decisions
        run: >
          node --experimental-strip-types tools/post-merge-cleanup.ts
          --branch-cleanup-plan-file .cleanup/bound-cleanup-plan.json
          --branch-cleanup-state-json-file .cleanup/branch-cleanup-state.json
          --branch-cleanup-output-file .cleanup/branch-cleanup-decisions.json

      - name: Delete safe merged cleanup branches
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const cleanup = JSON.parse(fs.readFileSync(".cleanup/branch-cleanup-decisions.json", "utf8"));
            core.info(cleanup.log);
            for (const decision of cleanup.decisions) {
              if (decision.status !== "allowed") {
                continue;
              }
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${decision.branch}`,
                });
                core.info(`Deleted merged cleanup branch ${decision.branch}.`);
              } catch (error) {
                core.warning(`Failed to delete merged cleanup branch ${decision.branch}: ${error.message}`);
              }
            }

      - name: Log cleanup success
        if: ${{ success() }}
        run: echo "Post-merge packet cleanup completed with one direct cleanup commit to the default branch."

      - name: Log cleanup failure
        if: ${{ failure() }}
        run: echo "Post-merge packet cleanup failed closed. Use the documented manual fallback only after investigating this workflow run."
