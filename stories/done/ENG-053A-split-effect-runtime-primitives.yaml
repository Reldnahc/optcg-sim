title: Split effect-runtime primitives by draw, target K.O., and replacement responsibilities
type: refactor
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Split the mixed `effect-runtime-primitives.ts` implementation into cohesive
  draw primitive, selected-target K.O. primitive, and selected-target K.O.
  replacement-process modules without changing runtime behavior.
story_boundary: >
  Own only the behavior-preserving extraction of existing effect runtime
  primitive code from `packages/engine-core/src/effect-runtime-primitives.ts`
  into cohesive runtime modules and the minimal import updates required to keep
  existing consumers compiling. Do not add gameplay support, change event order,
  change state hashes, change hidden-information behavior, change DTOs, change
  replay or protocol behavior, or broaden replacement semantics.
allowed_touch_points:
  - packages/engine-core/src/effect-runtime-primitives.ts
