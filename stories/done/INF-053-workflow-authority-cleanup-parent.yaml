spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-053
epic_id: INF-053
title: Resolve stale workflow authority and process contradictions
type: tooling
area: docs
primary_concern: docs
priority: critical
status: done
summary: >
  Coordinate an ordered workflow-authority cleanup series that removes stale
  process contradictions across repo workflow docs, specs, PR templates,
  branch-protection guidance, schema authority, packet authority, and focused
  enforcement tests.
story_boundary: >
  Parent planning and integration story only. Do not implement this parent
  directly; implement the ordered INF-053 child stories one at a time on the
  parent integration branch and record reviewed substory commit evidence before
  the final parent PR to main.
allowed_touch_points:
  - stories/generated/INF-053*.yaml
  - stories/approved/INF-053*.yaml
spec_refs:
  - 24-story-schema.s016
  - 24-story-schema.s025
  - 24-story-schema.s031
  - 24-story-schema.s032
  - 27-spec-driven-story-generation-workflow.s008
  - 27-spec-driven-story-generation-workflow.s009
  - 27-spec-driven-story-generation-workflow.s015
  - 27-spec-driven-story-generation-workflow.s017
  - 32-codex-agent-integration.s008
  - 32-codex-agent-integration.s010
  - 32-codex-agent-integration.s013
  - 32-codex-agent-integration.s014
dependencies:
  - INF-027I
  - INF-049A
  - INF-052A
scope:
  - create one parent integration branch for the full INF-053 story set
  - execute the ordered INF-053A through INF-053I child stories one active child packet at a time
  - keep all substory commits on the parent integration branch without opening substory PRs
  - record substory commit evidence for every child before the final parent PR handoff
  - use one final parent PR to main with full-story integration review, parent revision response, current CI, current verification, cleanup metadata, and human review
non_scope:
  - direct implementation from this parent story
  - gameplay behavior, engine/card implementation behavior, server/client/replay behavior, persistence behavior, or UI behavior
  - unrelated workflow rewrites outside the named contradictions
  - broad automation redesign beyond the explicit cleanup-parser de-duplication child
  - substory branches or substory pull requests as the normal path
child_stories:
  - id: INF-053A
    title: Remove stale implementation model escalation language
    concern: Remove stale model-routing text from branch-protection and PR template guidance and enforce the canonical implementation worker routing default in workflow tests.
    depends_on: [INF-052A]
  - id: INF-053B
    title: Require human merge-gate review and fix story link wording
    concern: Make default-branch human review mandatory and replace stale story-issue linking text with approved-story-file plus synced-issue-when-present wording.
    depends_on: [INF-053A]
  - id: INF-053C
    title: Reconcile story schema prose and lifecycle status
    concern: Align story schema prose, JSON schema, validator behavior, and in_progress lifecycle status authority.
    depends_on: [INF-053B]
  - id: INF-053D
    title: Align packet role wording and planning authority order
    concern: Remove stale verification-agent wording and reconcile planning authority order with current execution authority.
    depends_on: [INF-053C]
  - id: INF-053E
    title: Clarify cleanup guard and handoff preflight evidence
    concern: Distinguish what remote cleanup-metadata-guard proves from the full cleanup handoff preflight evidence binding.
    depends_on: [INF-053D]
  - id: INF-053F
    title: Remove normal-path substory branch implications
    concern: Ensure specs, parent/substory workflow guidance, and PR template text do not imply substory branches or substory PRs are the normal path.
    depends_on: [INF-053E]
  - id: INF-053G
    title: Link CARD fixture workflow as mandatory for relevant stories
    concern: Add card fixture capture workflow guidance to mandatory entry points for CARD and card-fixture story work.
    depends_on: [INF-053F]
  - id: INF-053H
    title: Normalize default-branch wording
    concern: Normalize main/default-branch wording and document master compatibility only where current policy still needs it.
    depends_on: [INF-053G]
  - id: INF-053I
    title: Deduplicate post-merge cleanup parser and evidence construction
    concern: Move inline cleanup metadata parsing and evidence construction from the workflow into checked-in cleanup tooling while preserving fail-closed behavior.
    depends_on: [INF-053H]
acceptance_criteria:
  - INF-053 is not implemented directly
  - all nine child stories have separate story-review evidence before approval handoff
  - children are implemented in the requested order on one parent integration branch
  - every child has packet generation, packet verification, implementation-worker ownership, reviewer-subagent review, revision response, and verification evidence
  - the final parent PR includes one row of substory commit evidence for every child
  - the final parent PR includes full-story integration reviewer-subagent review, parent revision response, current CI, current parent-branch verification, cleanup metadata for all children, and human-review requirement
required_tests:
  - separate usable story-review evidence for INF-053 parent and every INF-053 child before approval handoff
  - child-specific required tests from INF-053A through INF-053I
  - run `corepack pnpm run stories:validate`
repo_rules:
  - use parent/substory workflow with one parent integration branch and no substory PRs
  - activate and packetize only one child story at a time
  - keep completed substory files under `stories/approved/` until the final parent PR merges to main
  - do not run packet completion until post-merge cleanup after the final parent PR lands on main
  - request human review only after review records, revision responses, cleanup handoff checks, and cleanup-metadata-guard status are current
ambiguity_policy: fail_and_escalate
