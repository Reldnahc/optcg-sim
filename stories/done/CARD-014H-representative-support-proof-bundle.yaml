summary: >
  Add representative generated-support proofs only for composed-effect shapes
  that have complete parser, schema, runtime, capability, source, metadata,
  test, and review evidence.
story_boundary: >
  Own only packages/cards representative support proofs, fixture/source
  integrity evidence, generated support/report assertions, and tests for shapes
  already implemented by earlier CARD-014 children. Do not broaden parser rules
  or runtime behavior to make chosen cards pass.
