spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-021
epic_id: KICK-001
title: Enforce committed story schema validation
type: tooling
area: infra
primary_concern: tooling
priority: critical
status: done
summary: >
  Add an executable validation lane that checks committed story files against
  the canonical story schema so malformed generated, approved, blocked, done,
  ambiguity, or replaced stories fail local verification and CI.
story_boundary: >
  Own only committed story-file schema validation and its local/CI enforcement.
  Stop before adding story-review metadata fields, changing packet lifecycle
  semantics, changing GitHub issue or board sync behavior, or changing story
  approval rules.
allowed_touch_points:
  - package.json
  - contracts/story.schema.json
  - tools/**
  - tests/contracts/**
  - tests/ci/**
  - .github/workflows/**
spec_refs:
  - 24-story-schema.s001 (Story schema purpose)
  - 24-story-schema.s002 (Story schema goals)
  - 24-story-schema.s004 (Required fields)
  - 24-story-schema.s008 (Story schema version)
  - 24-story-schema.s014 (Status)
  - 24-story-schema.s016 (Spec refs)
  - 27-spec-driven-story-generation-workflow.s007 (Story normalization rules)
  - 27-spec-driven-story-generation-workflow.s008 (Approval rules)
  - 27-spec-driven-story-generation-workflow.s012 (Minimum viable process)
  - 31-github-board-and-story-ops.s010 (Automation contract)
  - 23-repo-tooling-and-enforcement.s005 (Package scripts)
  - 23-repo-tooling-and-enforcement.s016 (CI merge gates)
  - 23-repo-tooling-and-enforcement.s021 (Generated artifacts and deterministic outputs)
  - 23-repo-tooling-and-enforcement.s023 (Definition of done for repo tooling)
scope:
  - add a root validation command for committed story YAML files under the story lifecycle directories
  - validate each committed story file against `contracts/story.schema.json`
  - fail with deterministic, useful diagnostics that identify the invalid story path and schema errors
  - include generated, approved, blocked, done, ambiguity, and replaced story locations as applicable
  - wire the story validation command into the canonical local verification path and CI path
  - add tests proving valid committed stories pass and invalid story fixtures fail for schema violations
non_scope:
  - adding new story schema fields such as reviewer identity, review status, timestamps, or approval metadata
  - changing packet generation, packet verification, packet completion, or active-story manifest semantics
  - changing story-review, worker handoff, implementation review, or human review rules
  - changing GitHub issue, board sync, or project field behavior
  - requiring spec-ref existence validation unless a later story explicitly scopes it
  - changing gameplay, engine, server, client, replay, database, card, or hidden-info behavior
dependencies:
  - INF-019
  - INF-020
acceptance_criteria:
  - a committed-story validation command exists and is exposed from `package.json`
  - the command validates committed story YAML files against `contracts/story.schema.json`
  - malformed committed story files fail with deterministic diagnostics that name the file and schema failure
  - local `pnpm verify` includes the story validation lane
  - CI includes the story validation lane through the canonical command path or a clearly named job/step
  - tests fail if the story validation command is removed from local verification or CI enforcement
required_tests:
  - contract/tooling test proving a valid committed story fixture passes schema validation
  - contract/tooling test proving an invalid story fixture fails schema validation with a deterministic message
  - package-script or CI smoke test proving `pnpm verify` includes the committed-story validation lane
  - CI workflow smoke test proving the committed-story validation lane runs in CI through the canonical command
  - "`corepack pnpm exec vitest run tests/contracts tests/ci` must pass"
  - "`corepack pnpm run verify` must pass"
repo_rules:
  - keep this story limited to schema validation of committed story files
  - do not add review-state metadata or approval automation fields to story files
  - do not broaden into spec-ref indexing or GitHub board sync unless story-review finds that schema validation is not meaningful without it
  - generated story must receive per-story story-review before it is presented as approval-ready
ambiguity_policy: fail_and_escalate
