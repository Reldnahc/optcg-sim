spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-025C
epic_id: KICK-001
title: Validate trigger order response
type: implementation
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Add engine-side validation for chooseTriggerOrder orderedIds responses without
  yet resuming queued effect processing after a valid response.
story_boundary: >
  Own only applyAction decision routing and validation for chooseTriggerOrder.
  This story may reorder the pending queue according to a valid response but
  must not resolve queued effects after the response.
allowed_touch_points:
  - packages/engine-core/src/actions.ts
  - packages/engine-core/src/actions.test.ts
  - packages/engine-core/src/effect-runtime.ts
  - packages/engine-core/src/effect-runtime.test.ts
  - packages/engine-core/src/trigger-order-actions.ts
  - packages/engine-core/src/trigger-order-actions.test.ts
  - stories/approved/ENG-025C-validate-trigger-order-response.yaml
  - agent-packets/ENG-025C.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s004 (Engine result shape)
  - 03-game-state-events-decisions.s005 (Event journal)
  - 03-game-state-events-decisions.s009 (Decisions)
  - 03-game-state-events-decisions.s010 (Trigger order decision)
  - 03-game-state-events-decisions.s017 (Canonical decision routing)
  - 03-game-state-events-decisions.s020 (State hashing)
  - 04-effect-runtime.s006 (Effect queue entry)
  - 04-effect-runtime.s009 (Queue ordering and timing)
  - 04-effect-runtime.s012 (Pending decisions)
  - 11-testing-quality.s007 (Interaction tests)
  - 23-repo-tooling-and-enforcement.s006 (TypeScript enforcement)
  - 23-repo-tooling-and-enforcement.s016 (CI merge gates)
scope:
  - route respondToDecision for pending chooseTriggerOrder decisions
  - accept only response.type orderedIds
  - require ids to exactly match decision.triggerIds with no missing, extra, or duplicate ids
  - reject wrong decision id, wrong response type, stale ids, duplicates, missing ids, and extra ids without mutation
  - on valid response, clear pendingDecision and deterministically mark or reorder the current same-player group for later queue resume
  - emit deterministic decisionResolved event for valid responses
non_scope:
  - resolving queued effects after a valid response
  - creating chooseTriggerOrder decisions
  - CLI response grammar
  - hidden-info PlayerView projection
  - new trigger categories
  - Life Trigger reveal path
  - optional activation
  - target selection
  - replacement effects
  - server/client/UI
dependencies:
  - ENG-025B
acceptance_criteria:
  - valid orderedIds response succeeds and clears the pending chooseTriggerOrder decision
  - valid response preserves all non-selected queue entries and records selected group order deterministically
  - valid response leaves queued entries pending/unresolved and emits no effect-resolution lifecycle events after decisionResolved
  - invalid responses fail closed without changing state or state hash
  - applyAction continues to reject unsupported pending decisions and phase actions while a decision is pending
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/trigger-order-actions.test.ts packages/engine-core/src/actions.test.ts packages/engine-core/src/effect-runtime.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-025C packet while implementing this story
  - run corepack pnpm run packets:verify before implementation and review handoff
  - stay within allowed_touch_points
  - target the ENG-025 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - if validation requires Action or PendingDecision type changes, stop and split or record the blocker
ambiguity_policy: fail_and_escalate
