id: ENG-056
epic_id: ENG-056
title: Trigger and On K.O. reusable wrapper runtime parent
type: implementation
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Coordinate engine-only runtime work that lets existing supported queued effect
  bodies run under life [Trigger] and [On K.O.] timing wrappers without adding
  parser support, card generated-support metadata, or new effect primitives.
story_boundary: >
  Parent planning story only. Do not implement this parent directly. Implement
  ENG-056A and ENG-056B one at a time. This parent owns only engine runtime
  wrapper reachability and fail-closed tests for already-supported queued effect
  bodies under [Trigger] and [On K.O.] timing. It must not add CARD parser rules,
  generated-support capability records, real-card support, or new effect body
  primitives.
