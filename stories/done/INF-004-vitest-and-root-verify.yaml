spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-004
epic_id: KICK-001
title: Add Vitest baseline and root verification orchestration
type: tooling
area: infra
primary_concern: verification
priority: critical
status: done
summary: >
  Add the baseline Vitest setup and the root verification command contract so local
  quality checks run through one repeatable entry point.
story_boundary: >
  Own the test-runner baseline and root verification orchestration only. Do not add git
  hooks, CI workflows, contract validators, or hidden-information assertions beyond the
  minimum needed to wire the verification lanes.
allowed_touch_points:
  - package.json
  - vitest.config.ts
  - vitest.workspace.ts
  - packages/*/package.json
  - packages/*/vitest.config.ts
  - tests/setup/**
spec_refs:
  - 23-repo-tooling-and-enforcement.s003 (Canonical toolchain)
  - 23-repo-tooling-and-enforcement.s005 (Workspace structure and task naming)
  - 23-repo-tooling-and-enforcement.s010 (Test tooling requirements)
  - 23-repo-tooling-and-enforcement.s022 (Required implementation sequence for tooling)
  - 23-repo-tooling-and-enforcement.s023 (Definition of done for repo tooling)
scope:
  - add the baseline Vitest configuration for package unit and integration lanes
  - wire root test, coverage, and verify commands to the workspace task model
  - define the local verification command contract that later stories extend
non_scope:
  - contract/schema validator implementation
  - hidden-information regression assertions
  - git hooks
  - CI workflow definitions
dependencies:
  - INF-001
  - INF-002
  - INF-003
acceptance_criteria:
  - root test and coverage commands exist and route through a shared Vitest baseline
  - root verify exists as the canonical local pre-push entry point
  - verify is structured so later contract and hidden-information lanes can be added without redefining the command contract
required_tests:
  - test-runner smoke test proving root test executes a minimal package test
  - coverage smoke test proving coverage output is generated in a supported format
  - verify smoke test proving lint, typecheck, and test orchestration runs through one command
repo_rules:
  - verify must remain aligned with the main merge CI pipeline
  - test tooling must stay decoupled from browser, Redis, Postgres, or live HTTP requirements
  - no verification story may bypass root task naming conventions
ambiguity_policy: implement_if_clearly_implied
