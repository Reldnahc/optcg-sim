title: Life Trigger reusable queued-body runtime
type: implementation
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Generalize life [Trigger] activation so the existing life-trigger reveal,
  no-zone queue, resolution, and trash-after-resolution path can execute
  supported trigger-compatible queued effect bodies beyond exact draw 1.
story_boundary: >
  Own only engine-core life-trigger support gates, queue-entry creation, cleanup,
  and tests needed for existing supported queued effect bodies to run under
  `trigger: { type: "trigger" }`. Do not add new effect primitives, parser
  support, generated support metadata, real-card fixtures, or CARD package
  changes.
