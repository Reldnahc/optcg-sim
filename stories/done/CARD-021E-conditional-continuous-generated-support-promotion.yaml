title: Conditional continuous generated-support promotion
type: implementation
area: cards
primary_concern: rules
priority: high
status: done
summary: >
  Complete the CARD-021 card-layer chain by promoting fully recognized
  conditional continuous condition, keyword-grant, and field-removal protection
  components into certified generated support after the required TYP and ENG
  prerequisites exist. This story is the card-layer bridge that turns the
  reusable parser components into a schema-valid, capability-gated generated
  EffectDefinition without hardcoding any real card.
story_boundary: >
  Own only cards-layer generated-support composition, parser-rule evidence,
  runtime-capability gating, support-probe/report output, and synthetic proof
  tests for the conditional continuous composition shape. Do not add engine
  runtime behavior, shared contract/schema authority, real-card fixtures,
  source hash changes, behavior hash changes, overlays, support manifest edits,
  cards-produced manifest regeneration, or card-specific branches.
