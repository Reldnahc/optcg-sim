id: SUP-003A
epic_id: SUP-003
title: Optional choose-one trash cost contract authorability
type: implementation
area: contracts
primary_concern: contract
priority: high
status: done
summary: >
  Authorize optional choose-one cost segments in the shared Effect DSL so engine
  sequence runtime can represent text shaped like `You may trash A or B:` as a
  multi-option optional cost decision rather than an exact printed sentence.
story_boundary: >
  Contract/schema/type story only. Do not implement runtime payment behavior,
  parser support, generated support, runtime capability metadata, support
  reports, real-card fixture evidence, or card promotion.
allowed_touch_points:
  - stories/generated/SUP-003A-optional-choose-one-trash-cost-contract-authorability.yaml
  - stories/approved/SUP-003A-optional-choose-one-trash-cost-contract-authorability.yaml
