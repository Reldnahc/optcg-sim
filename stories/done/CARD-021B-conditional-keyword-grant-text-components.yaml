story_schema_version: 1.0.0
id: CARD-021B
epic_id: CARD-021
title: Conditional keyword-grant text components
type: implementation
area: cards
primary_concern: rules
priority: high
status: done
summary: >
  Add reusable cards-side parsing and diagnostics for continuous self keyword
  grant text using the engine-supported keyword allowlist, while keeping
  generated support fail-closed unless every schema and runtime bridge gate is
  truthfully proven.
story_boundary: >
  Own only cards-side parser/component diagnostics, generated-support evidence
  modeling, runtime-capability gating, and tests for self keyword-grant text
  components. Do not add engine behavior, shared schema authority, real-card
  fixtures, source hash changes, behavior hash changes, overlays, support
  manifest edits, field-removal protection text parsing, or real-card support
  promotion.
