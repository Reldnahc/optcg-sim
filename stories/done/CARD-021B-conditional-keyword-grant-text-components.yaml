dependencies:
  - CARD-020D
  - ENG-059B
scope:
  - parse keyword-grant body primitives equivalent to target "this Character", grant verb "gains", and a supported keyword token
  - admit exactly `blocker`, `banish`, `rush`, `rushCharacter`, and `doubleAttack` as the parser-owned keyword token allowlist because ENG-059B proved those conditional continuous grants through reusable runtime behavior
  - support printed keyword token variants `[Blocker]`, `[Banish]`, `[Rush]`, `[Rush: Character]`, and `[Double Attack]`
  - emit deterministic diagnostic/component IDs and narrow source spans for target, grant verb, and keyword token components
  - integrate keyword-grant components with support-probe and generated-support-report diagnostics so partial parses show the recognized grant instead of only whole-line unsupported text
  - add generated-support component evidence or missing-gate evidence only where it truthfully reflects current parser/schema/runtime support
  - keep complete generated support fail-closed unless the implementation proves that the cards layer can schema-validate and runtime-capability-gate a generated representation consumed by the current engine
  - preserve standalone printed keyword support from CARD-012 and CARD-013
non_scope:
  - field-removal protection body parsing
  - trash-count condition parser work except consuming existing condition diagnostics when present
  - adding support for unsupported keywords or hidden/private keyword grants
  - claiming playable generated support when the continuous keyword-grant schema/runtime bridge is missing
  - engine runtime behavior
  - shared TYP/contracts/schema changes
  - real card IDs, fixture capture, source hash updates, behavior hash updates, overlays, support manifest edits, or cards-produced manifest regeneration
  - human-held adjacent-card list usage in story text, tests, implementation logic, parser branches, source-integrity evidence, or support proof
  - exact full-card text branches, exact full-effect sentence branches, keyword-only special cases for grant text, or sample-specific parser branches
card_source_integrity:
  - this story does not enable or change real-card gameplay support for any target card
  - no target real card IDs are in scope
  - do not edit source fixtures, source hashes, behavior hashes, overlays, supported-card manifests, cards-produced manifests, or manually reviewed source evidence
engine_capability_preflight:
  - ENG-059B is reusable runtime authority for conditional continuous grants of `blocker`, `banish`, `rush`, `rushCharacter`, and `doubleAttack`
  - this cards story must verify whether current generated-support schema and engine consumption paths can represent the keyword-grant continuous component
  - if a safe generated-support bridge is missing, this story must record that as missing schema/runtime bridge evidence and keep the component diagnostic-only or unsupported rather than marking support complete
  - this story introduces no new engine behavior
acceptance_criteria:
  - supported keyword-grant text components are recognized through reusable target, verb, and keyword parsers
  - all five allowlisted keywords use the same parser/component path, with no Blocker-only production path
  - unsupported keyword tokens and unsupported target/verb shapes fail closed with narrow diagnostics
  - standalone printed keyword support remains unchanged
  - complete generated support is not produced unless every generated-support gate truthfully passes
  - support-probe/report output can show recognized keyword-grant components while final playable decision remains no when required gates are missing
  - no production code or tests depend on real card IDs, exact full card text, or the human-held adjacent-card list
required_tests:
  - story-review for CARD-021B before approval handoff
  - parser/component tests for "this Character gains [Blocker]" and at least one other allowlisted keyword proving the shared path
  - parser/component matrix tests covering `[Banish]`, `[Rush]`, `[Rush: Character]`, and `[Double Attack]`
  - variation tests proving keyword-grant parsing is value-generic across allowlisted keyword tokens and not an exact full-sentence branch
  - fail-closed tests for unsupported keyword tokens, unsupported targets, unsupported verbs, missing keyword token, and trailing unsupported residue
  - support-probe/report diagnostic tests showing recognized keyword-grant components and final unsupported status when complete generated-support gates are missing
  - generated-support evidence or runtime-capability tests proving complete support is gated by truthful schema/runtime bridge evidence
  - regression tests proving standalone printed keyword generated support remains unchanged
  - negative tests proving no real card ID, full-card text, adjacent-card list, or exact sample sentence is required for parser success
  - run `corepack pnpm run packets:verify`
  - run `corepack pnpm run stories:validate`
  - run `corepack pnpm --filter @optcg/cards test`
  - full `corepack pnpm verify`
repo_rules:
  - generate and activate the CARD-021B packet before implementation
  - stay within allowed_touch_points
  - do not add field-removal protection parsing in this child
  - do not add engine runtime behavior, shared schema authority, fixture support, source hash updates, overlays, or card-specific templates
  - fail closed if keyword grant semantics, generated-support schema shape, runtime bridge evidence, or wording boundaries are ambiguous
ambiguity_policy: fail_and_escalate
