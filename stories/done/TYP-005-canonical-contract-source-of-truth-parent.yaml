story_schema_version: 1.0.0
id: TYP-005
epic_id: TYP-005
title: Make canonical contracts the source of truth for @optcg/types
type: tooling
area: contracts
primary_concern: tooling
priority: critical
status: done
summary: >
  Replace the failed package-type migration tail with a classification-first
  path so canonical contracts become authoritative without blindly absorbing
  package or engine implementation drift.
story_boundary: >
  This parent replaces the existing approved parent authority in one lifecycle
  transaction, preserves reviewed TYP-005A and TYP-005B evidence once available,
  and coordinates replacement child stories TYP-005C through TYP-005G only. It
  is not directly implementable and must not change contract shapes, package
  source files, or tooling outside child stories.
allowed_touch_points:
  - stories/approved/TYP-005-canonical-contract-source-of-truth-parent.yaml
  - stories/approved/TYP-005A-package-type-authority-strategy.yaml
  - stories/approved/TYP-005B-deterministic-package-type-sync.yaml
  - stories/approved/TYP-005C-classify-canonical-package-downstream-type-gaps.yaml
  - stories/approved/TYP-005D-align-classified-canonical-shared-contract-omissions.yaml
  - stories/approved/TYP-005E-migrate-engine-core-consumers-off-package-only-type-drift.yaml
  - stories/approved/TYP-005F-migrate-package-projections-to-settled-canonical-output.yaml
  - stories/approved/TYP-005G-whole-surface-type-parity-guard.yaml
  - stories/replaced/TYP-005C-migrate-package-types-to-canonical-output.yaml
  - stories/replaced/TYP-005D-whole-surface-type-parity-guard.yaml
  - stories/ambiguities/TYP-005C-canonical-package-migration-downstream-consumers.md
