scope:
  - replace the existing approved TYP-005 parent authority without leaving duplicate approved TYP-005 parent stories
  - preserve reviewed TYP-005A and TYP-005B commits as parent-series evidence after TYP-005B has review or completion evidence
  - supersede the old approved TYP-005C and TYP-005D child path that failed closed on downstream consumer drift
  - require field classification before canonical contract edits, engine consumer migration, package projection sync, or parity guard enforcement
  - require deterministic sync tooling and settled downstream consumers before package projection migration
  - require whole-surface parity guard after package projection migration
non_scope:
  - direct implementation from this parent story
  - packetizing or activating this parent story as an active implementation story
  - deciding field dispositions directly in the parent
  - gameplay rules, engine behavior, server protocol behavior, client behavior, replay behavior, persistence, or UI work
dependencies: []
acceptance_criteria:
  - approved replacement child stories exist for classification, optional canonical alignment, engine consumer migration, package projection migration, and guard enforcement
  - old approved TYP-005C and TYP-005D path has been lifecycle-transitioned to replaced before replacement TYP-005C approval or activation
  - replacement TYP-005C activation waits for TYP-005B review or completion evidence
  - each child story is narrow, concern-scoped, and has explicit allowed touch points and non-scope
  - this parent remains non-implementable and is not directly packetized
required_tests:
  - set-level story-review before presenting these generated stories as approval-ready
  - exact per-story story-review for the parent and every replacement child before approval
  - run `corepack pnpm run stories:validate` after replacement story lifecycle changes are checked in
repo_rules:
  - do not packetize this parent as an active implementation story
  - use child packets only and keep one active child packet at a time
  - if the approved parent integration workflow is used, close the non-packetized parent only through validated parent-mode cleanup after the parent PR merges
  - child stories must fail closed on any contract authority gap that would require gameplay, validation, protocol, replay, or hidden-information behavior decisions
ambiguity_policy: fail_and_escalate
child_stories:
  - id: TYP-005A
    title: Define the package type authority strategy
    concern: contract
    depends_on: []
  - id: TYP-005B
    title: Add deterministic package type sync tooling
    concern: tooling
    depends_on: [TYP-005A]
  - id: TYP-005C
    title: Classify canonical/package downstream type authority gaps
    concern: contract
    depends_on: [TYP-005B]
  - id: TYP-005D
    title: Align classified canonical shared contract omissions
    concern: contract
    depends_on: [TYP-005C]
  - id: TYP-005E
    title: Migrate engine-core consumers off package-only type drift
    concern: contract
    depends_on: [TYP-005C]
  - id: TYP-005F
    title: Migrate package projections to settled canonical output
    concern: contract
    depends_on: [TYP-005D, TYP-005E]
  - id: TYP-005G
    title: Add whole-surface type parity guard
    concern: verification
    depends_on: [TYP-005F]
