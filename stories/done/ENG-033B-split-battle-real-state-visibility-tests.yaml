spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-033B
epic_id: KICK-001
title: Split battle real-state visibility tests
type: refactor
area: engine
primary_concern: visibility
priority: medium
status: done
summary: >
  Move battle real-state PlayerView visibility assertions out of
  filter-state-for-player.real-states.test.ts into a focused battle visibility
  test file without changing filtering behavior, hidden-info policy, fixtures,
  assertions, or expected outputs.
story_boundary: >
  Own only behavior-preserving test-file organization for vanilla battle,
  Blocker, damage, and other non-trigger battle real-state PlayerView
  visibility coverage currently in filter-state-for-player.real-states.test.ts.
  The On K.O. trigger visibility scenario remains owned by ENG-033C.
allowed_touch_points:
  - packages/engine-core/src/filter-state-for-player.real-states.test.ts
  - packages/engine-core/src/filter-state-for-player.real-states-battle.test.ts
  - stories/generated/ENG-033B-split-battle-real-state-visibility-tests.yaml
  - stories/approved/ENG-033B-split-battle-real-state-visibility-tests.yaml
  - agent-packets/ENG-033B.md
  - agent-packets/active.json
spec_refs:
  - 06-visibility-security.s003
  - 06-visibility-security.s004
  - 06-visibility-security.s005
  - 06-visibility-security.s007
  - 03-game-state-events-decisions.s015
  - 03-game-state-events-decisions.s018
  - 11-testing-quality.s008
  - 18-acceptance-tests.s004
scope:
  - move vanilla battle, Blocker, damage, and other non-trigger battle real-state visibility assertions from filter-state-for-player.real-states.test.ts
  - leave the existing On K.O. trigger battle visibility test in filter-state-for-player.real-states.test.ts for ENG-033C
  - preserve hidden-information assertions, public-zone expectations, legal-action projection checks, helper behavior, and expected PlayerView output
  - keep helper extraction local to the moved tests unless a later approved child story explicitly owns shared helper movement
non_scope:
  - changing production filterStateForPlayer behavior
  - changing PlayerView, PublicDecision, or PublicLegalAction contracts
  - changing hidden-information policy
  - moving baseline, trigger, On K.O., no-zone, revealed-card, or target-selection real-state coverage
  - adding new real-state scenarios beyond direct coverage preservation
dependencies:
  - ENG-033A
acceptance_criteria:
  - filter-state-for-player.real-states.test.ts no longer contains the moved battle scenario group
  - filter-state-for-player.real-states-battle.test.ts covers the same battle real-state visibility scenarios with behavior-equivalent expectations
  - no production files change
  - focused tests, hidden-info tests, coverage, and full verify pass
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/filter-state-for-player.real-states.test.ts packages/engine-core/src/filter-state-for-player.real-states-baseline.test.ts packages/engine-core/src/filter-state-for-player.real-states-battle.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run test:hidden-info
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-033B packet while implementing this story
  - target the ENG-033 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - this is a behavior-preserving test organization story; if a production change appears necessary, stop and split or record an ambiguity
ambiguity_policy: fail_and_escalate
