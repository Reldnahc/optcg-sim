summary: >
  Repair the first-run failures discovered after post-merge packet cleanup
  automation merged: ensure the cleanup workflow runs on a Node version that
  supports checked-in TypeScript tooling, and ensure cleanup validation tests do
  not depend on an approved story file that successful cleanup removes.
story_boundary: >
  Own the immediate post-merge cleanup automation repair and the exact INF-027
  manual packet-cleanup fallback required because automation failed. Do not
  redesign cleanup metadata, branch protection, packet completion semantics, or
  gameplay behavior.
