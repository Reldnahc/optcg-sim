scope:
  - "add Node setup to the post-merge packet cleanup workflow before any `node --experimental-strip-types` command runs"
  - "preserve the workflow's trusted default-branch checkout, fail-closed validation, direct-push policy, and cleanup actor/token behavior"
  - "update cleanup validation tests so they do not require an approved INF-027 story file after that story has been completed"
  - "keep cleanup tests representative of real approved-story validation without depending on lifecycle state for already-completed stories"
  - "add a narrow cleanup CLI test seam, if needed, so tests can validate against temporary repository fixtures without changing production workflow inputs"
  - "repair committed-story validation for pre-commit packet cleanup moves from `stories/approved` to `stories/done` without broadly validating unrelated untracked story drafts"
  - "include the exact manual packet-completion fallback output for INF-027A through INF-027I because the merged automation failed operationally"
non_scope:
  - cleanup metadata schema redesign
  - branch-protection policy changes
  - packet completion command semantic changes
  - cleanup pull request creation
  - arbitrary branch deletion changes
  - gameplay, engine, replay, client, or server behavior
dependencies:
  - INF-027I
acceptance_criteria:
  - the cleanup workflow installs/configures a Node runtime compatible with `node --experimental-strip-types`
  - the cleanup workflow still checks out trusted main/default-branch code and does not run unreviewed PR branch code
  - post-merge cleanup tests pass after INF-027A through INF-027I have been moved from approved to done
  - cleanup tests still prove valid approved-story metadata is accepted using stable test-owned fixtures or setup
  - any cleanup CLI test seam is opt-in and production workflow invocations continue using the checked-out repository root by default
  - story validation accepts a packet-completion move from approved to done before commit while still ignoring unrelated untracked story files
  - the INF-027 manual fallback cleanup diff is limited to exact packet completion output
  - "`pnpm verify` passes with INF-027 cleanup applied"
required_tests:
  - workflow structure test proving post-merge cleanup sets up Node before TypeScript tooling commands
  - cleanup validation test proving accepted story metadata does not depend on completed INF-027 approved story files
  - story validation test proving tracked approved-to-done lifecycle moves validate the done story before commit
  - "`pnpm run packets:verify`"
  - "`pnpm verify`"
repo_rules:
  - do not weaken cleanup validation, required checks, typecheck, lint, or test rules
  - do not broaden the cleanup actor/token permissions
  - do not make cleanup tests pass by disabling lifecycle validation
  - preserve exact INF-027 manual cleanup output unless verification requires a separately reviewed tooling/test fix
ambiguity_policy: fail_and_escalate
