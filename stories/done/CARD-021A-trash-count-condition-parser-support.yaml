spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: CARD-021A
epic_id: CARD-021
title: Trash-count condition parser support
type: implementation
area: cards
primary_concern: rules
priority: high
status: done
summary: >
  Add reusable cards-side parser, component evidence, and runtime-capability
  linkage for public trash-count condition phrases so generated support can
  represent self or opponent trash-count predicates without card-specific text.
story_boundary: >
  Own only packages/cards condition parsing, condition-to-DSL mapping,
  generated-support component evidence, runtime capability matrix records,
  diagnostics, and tests for public trash-count condition components. Do not
  add engine behavior, real-card fixtures, source hash changes, behavior hash
  changes, overlays, support manifest edits, or continuous keyword/protection
  body support.
