dependencies:
  - CARD-019B
  - CARD-020D
  - ENG-059A
scope:
  - extend the existing cards-side condition parser component model with `trashCount` for self and opponent public trash counts
  - parse phrase primitives equivalent to "you have", "your opponent has", numeric comparator phrases, "cards in your trash", and "cards in their trash"
  - support numeric comparator phrases that the condition model and runtime can truthfully represent, including `N or more` as `gte N`, `N or less` as `lte N`, and exact-count wording only if the parser can recognize it unambiguously
  - preserve safe positive-integer parsing rules, including rejecting zero, negative, decimal, word-number, leading-zero, and unsafe-integer quantities
  - 'map parsed components to block-level `condition: { type: "trashCount", player, op, value }`'
  - add component evidence and runtime capability linkage for public trash-count conditions backed by ENG-059A
  - compose trash-count conditions with existing CARD-019B supported conditional wrappers and already-supported bodies in synthetic generated-support tests
  - preserve boolean `and` and `or` condition composition behavior where every child condition is supported and connector boundaries are unambiguous
non_scope:
  - continuous keyword-grant body parsing
  - field-removal protection body parsing
  - real card IDs, fixture capture, source hash updates, behavior hash updates, overlays, support manifest edits, or cards-produced manifest regeneration
  - human-held adjacent-card list usage in story text, tests, implementation logic, or support evidence
  - engine runtime behavior
  - shared TYP/contracts/schema changes
  - private-zone count conditions, filtered trash-count predicates, name/type/color trash filters, or arbitrary zone-count grammar
  - exact full-card text branches, exact full-effect sentence branches, card-specific allowlists, or sample-specific parser branches
card_source_integrity:
  - this story does not enable or change real-card gameplay support for any target card
  - no target real card IDs are in scope
  - do not edit source fixtures, source hashes, behavior hashes, overlays, supported-card manifests, cards-produced manifests, or manually reviewed source evidence
engine_capability_preflight:
  - ENG-059A is reusable runtime authority for public self and opponent `trashCount` condition evaluation with supported comparators
  - CARD-019B is reusable cards-layer authority for block-level condition composition on existing generated-support wrappers and bodies
  - this story introduces no new engine behavior
  - if a comparator, player relation, filter, or condition composition is not supported by current runtime evidence, generated support must report the missing or unsupported component and fail closed
acceptance_criteria:
  - supported trash-count phrases parse into deterministic condition component IDs and narrow source spans
  - 'generated DSL for supported synthetic conditional snippets uses block-level `trashCount` conditions and does not emit an effect-level `{ type: "conditional" }`'
  - "`or more` and `or less` remain numeric comparator phrases and are not misclassified as boolean `or`"
  - unsupported trash-count shapes remain unsupported with diagnostic spans and do not create generated support
  - existing CARD-019 condition parsing and existing generated-support behavior remain compatible
  - no production code or tests depend on real card IDs, exact full card text, or the human-held adjacent-card list
required_tests:
  - story-review for CARD-021A before approval handoff
  - condition parser tests for self trash-count `N or more` and `N or less`
  - condition parser tests for opponent trash-count `N or more` and `N or less`
  - parser tests for at least two numeric values proving value-generic behavior rather than exact threshold branching
  - parser tests proving `or more` and `or less` are not boolean connectors
  - fail-closed tests for word numbers, zero, negative values, decimals, leading zeros, unsafe integers, unsupported filters, private zones, and ambiguous player/zone ownership wording
  - generated-support tests for a synthetic existing supported conditional body using `trashCount`
  - runtime capability matrix and component evidence tests for `condition:trashCount`
  - support-probe/report diagnostic tests naming trash-count component support or missing layer
  - regression tests proving CARD-019 supported and unsupported condition behavior remains compatible
  - run `corepack pnpm run packets:verify`
  - run `corepack pnpm run stories:validate`
  - run `corepack pnpm --filter @optcg/cards test`
  - full `corepack pnpm verify`
repo_rules:
  - generate and activate the CARD-021A packet before implementation
  - stay within allowed_touch_points
  - do not add continuous keyword-grant or protection body parser support in this child
  - do not add engine runtime behavior, shared schema authority, fixture support, source hash updates, overlays, or card-specific templates
  - fail closed on condition wording ambiguity
ambiguity_policy: fail_and_escalate
