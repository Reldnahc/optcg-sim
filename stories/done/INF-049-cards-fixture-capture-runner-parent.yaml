id: INF-049
epic_id: CARD-003
title: Cards fixture capture runner reproducibility parent
type: tooling
area: cards
primary_concern: tooling
priority: high
status: done
summary: >
  Coordinate the narrow tooling repair that makes the cards fixture capture
  script run through declared repository tooling instead of an undeclared
  `tsx` executable.
story_boundary: >
  This parent is not directly implementable. It coordinates the single child
  story that updates the cards package fixture capture runner and script
  contract coverage without changing fixture capture behavior.
allowed_touch_points:
  - stories/generated/INF-049*.yaml
  - stories/approved/INF-049*.yaml
spec_refs:
  - 23-repo-tooling-and-enforcement.s005
  - 23-repo-tooling-and-enforcement.s006
  - 18-acceptance-tests.s002
scope:
  - coordinate one executable cards tooling child story
  - require the cards fixture capture script to use declared repo tooling
  - require focused script-contract coverage for the fixture capture runner
non_scope:
  - direct implementation from this parent story
  - packetizing or activating this parent story as an active implementation story
  - changing fixture capture behavior or output
  - changing live Poneglyph fetching semantics
  - changing card normalization, generated support output, engine behavior, DTOs, hidden-info behavior, or gameplay behavior
dependencies:
  - CARD-003
child_stories:
  - id: INF-049A
    title: Make cards fixture capture runner declared
    concern: Update the cards package fixture capture script to use declared repo tooling and add focused script-contract coverage.
    depends_on: []
acceptance_criteria:
  - INF-049A is the only executable child for this parent
  - cards fixture capture no longer depends on an undeclared executable
  - fixture capture behavior and output semantics are unchanged
  - verification evidence is recorded on the child PR
required_tests:
  - story-review for the INF-049 parent story set using `corepack pnpm run stories:review-plan -- --parent stories/generated/INF-049-cards-fixture-capture-runner-parent.yaml`
  - story-specific tests from INF-049A
  - full `corepack pnpm verify` on the child PR
repo_rules:
  - do not implement INF-049 directly
  - use the parent/substory workflow even though this parent has one child
  - keep one active child packet at a time
  - do not add dependencies unless the repo-local Node runner path cannot support the script
ambiguity_policy: fail_and_escalate
