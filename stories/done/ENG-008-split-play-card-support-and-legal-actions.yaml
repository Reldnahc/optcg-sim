spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-008
epic_id: M1-001
title: Split play-card support and legal-action concerns
type: refactor
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Reduce `play-card.ts` complexity after Character, Stage, overflow, and Event
  play support by extracting play-card support-policy and legal-action
  projection concerns into focused engine-core modules without changing
  gameplay behavior.
story_boundary: >
  Own only behavior-preserving separation of play-card support eligibility,
  playable-card discovery, payment-response legal-action generation, and
  decision-id parsing helpers. Stop before changing play-card rules, event
  sequencing, placement/trash/overflow behavior, CLI behavior, replay schema,
  or any new card capability.
allowed_touch_points:
  - packages/engine-core/src/play-card.ts
  - packages/engine-core/src/play-card-support.ts
  - packages/engine-core/src/play-card-legal-actions.ts
  - packages/engine-core/src/play-card-support.test.ts
  - packages/engine-core/src/play-card.test.ts
  - packages/engine-core/src/replay-smoke.test.ts
