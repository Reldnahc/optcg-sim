spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-027H
epic_id: KICK-001
title: Bind parent cleanup evidence and reviewed metadata source
type: tooling
area: infra
primary_concern: tooling
priority: high
status: done
summary: >
  Fix the post-merge cleanup workflow evidence gap found during parent
  integration review by making the workflow use a reviewed, durable cleanup
  metadata source and emit the parent lifecycle evidence required for parent
  cleanup validation.
story_boundary: >
  Own only the post-merge cleanup workflow evidence handoff needed to make the
  already-approved single-story and parent cleanup validation paths viable. Do
  not widen cleanup authority, weaken reviewed metadata binding, change packet
  completion semantics, or alter branch deletion policy.
allowed_touch_points:
  - .github/pull_request_template.md
  - .github/review-comments/equivalent-human-review-fallback.md
  - .github/workflows/post-merge-packet-cleanup.yml
  - docs/workflow/review-gate.md
  - docs/workflow/parent-integration-branches.md
  - docs/workflow/story-execution.md
  - tools/post-merge-cleanup.ts
  - tools/post-merge-cleanup/**
  - tests/contracts/post-merge-cleanup-*.test.mjs
  - tests/github/**
  - tests/fixtures/post-merge-cleanup/**
  - stories/generated/INF-027H-*.yaml
  - stories/approved/INF-027H-*.yaml
  - agent-packets/INF-027H.md
  - agent-packets/active.json
spec_refs:
  - 23-repo-tooling-and-enforcement.s016
  - 23-repo-tooling-and-enforcement.s023
  - 26-agent-packet-template.s005
  - 27-spec-driven-story-generation-workflow.s015
  - 27-spec-driven-story-generation-workflow.s017
  - 32-codex-agent-integration.s013
scope:
  - make the post-merge cleanup workflow support a durable handoff-comment cleanup metadata source in addition to PR-body metadata
  - add a concrete non-circular source-ref preview path for reviewers, such as a tool mode that hashes an explicit metadata source file/body with a caller-provided source kind and source id before human review
  - require durable handoff-comment metadata to live in a source comment whose content is the reviewed cleanup metadata source, while any comment or PR text that publishes the computed source ref is only guidance and is not itself the metadata source
  - document the exact reviewed cleanup metadata source reference that human merge-gate review or equivalent-human-review fallback must confirm
  - make workflow-built evidence include sourceRefs for human merge-gate approvals or equivalent-human-review fallback records only when the approval/fallback references the exact metadata source
  - make parent-mode workflow evidence include the parentLifecycle object required by cleanup validation
  - bind parentLifecycle includedStories to the listed cleanup stories, trusted packets, included substory PR numbers, and durable substory AI review records
  - make the workflow fail closed when parent cleanup metadata lacks parent lifecycle evidence or when included substory review evidence cannot be found
  - update docs and PR-template guidance so parent PRs use completed gates and a reviewed cleanup metadata source before human review
  - add tests proving the workflow can validate parent cleanup evidence and handoff-comment metadata without weakening existing fail-closed checks
non_scope:
  - changing `packets:complete` or `packets:complete-many` command semantics
  - changing story schema shape
  - changing branch deletion policy except for consuming the already-validated metadata source and story list
  - adding cleanup PR creation
  - broad branch-protection redesign
  - remote GitHub branch-protection mutation
  - gameplay, engine, effect runtime, replay, server, client, or UI behavior
dependencies:
  - INF-027G
acceptance_criteria:
  - a reviewer or agent can compute the exact `pr-body:...:<sha256>` or `handoff-comment:...:<sha256>` source ref before human review without embedding that ref into the hashed source itself
  - workflow metadata extraction can use a durable handoff comment as the reviewed metadata source and passes it to the existing cleanup validator as a handoff-comment source
  - workflow PR-body metadata remains fail-closed unless the required human merge-gate review or equivalent-human-review fallback references the exact metadata source used for validation
  - docs, PR template, and fallback review template explain how to provide and confirm the exact reviewed cleanup metadata source reference before human review or fallback review
  - parent-mode workflow evidence includes parentLifecycle with cleanupPlanRecordedAt, parent integration AI review record, parent revision response, and includedStories
  - parentLifecycle includedStories entries are derived from the reviewed cleanup story list and durable substory PR review records rather than invented from story IDs alone
  - parent cleanup validation fails closed when required parent lifecycle or substory review evidence is missing
  - existing single-story cleanup evidence binding, direct cleanup push, and branch deletion tests remain valid
required_tests:
  - contract test for source-ref preview output proving the pre-review ref matches workflow validation for PR-body and handoff-comment sources
  - contract test for handoff-comment metadata source parsing and source-ref binding through the workflow preflight path
  - contract test proving parent-mode workflow-built evidence includes parentLifecycle and passes validation
  - contract test proving parent-mode workflow-built evidence fails when included substory review evidence is missing
  - contract or workflow tests proving arbitrary issue comments, unreferenced handoff comments, non-durable comments, and post-review handoff-comment changes are rejected
  - GitHub workflow test proving the workflow reads durable handoff comments, exposes the metadata source ref, and still checks out trusted main code
  - PR template, fallback review template, and workflow docs tests proving reviewers are told to confirm the exact cleanup metadata source reference
  - full `corepack pnpm run packets:verify`
  - full `corepack pnpm verify`
repo_rules:
  - do not weaken validator requirements that cleanup metadata is only a request bound to reviewed evidence
  - do not treat unreviewed PR body text or unreferenced comments as sufficient cleanup authority
  - do not make arbitrary issue comments authoritative; only durable handoff comments with exact reviewed source refs may be used
  - do not hash a metadata-source ref embedded in the same source content when deriving that ref
  - if the exact source-ref review requirement remains impossible for normal human review, stop and report the blocker instead of relaxing validation silently
ambiguity_policy: fail_and_escalate
