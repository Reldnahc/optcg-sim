spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-014
epic_id: KICK-001
title: Add story lifecycle and active packet cleanup
type: tooling
area: infra
primary_concern: tooling
priority: high
status: done
summary: >
  Make completed workflow stories stop remaining active by documenting and
  enforcing a one-active-story lifecycle: active packets are only for the
  current implementation or review handoff, completed stories move to done
  history, and stale active-story state is cleared before the next story starts.
story_boundary: >
  Own story lifecycle cleanup for merged workflow stories, active packet
  manifest invariants, packet-tool enforcement, and workflow tests/docs that
  prevent stale active stories. Do not change board sync, gameplay behavior,
  story schema shape, CI status checks, package boundaries, or feature code in
  this story.
allowed_touch_points:
  - AGENTS.md
  - package.json
  - specs/26-agent-packet-template.md
  - specs/27-spec-driven-story-generation-workflow.md
  - specs/32-codex-agent-integration.md
  - agent-packets/**
  - stories/approved/INF-014-story-lifecycle-and-active-packet-cleanup.yaml
  - stories/done/INF-011-subagent-orchestration-and-review-workflow.yaml
  - stories/done/INF-012-checked-in-active-story-packet-generation.yaml
  - stories/done/INF-013-subagent-model-routing-policy.yaml
  - stories/done/**
  - tools/build-agent-packet.ts
  - tests/contracts/**
  - tests/github/**
spec_refs:
  - 26-agent-packet-template.s005
  - 27-spec-driven-story-generation-workflow.s009
  - 27-spec-driven-story-generation-workflow.s012
  - 27-spec-driven-story-generation-workflow.s013
  - 27-spec-driven-story-generation-workflow.s015
  - 32-codex-agent-integration.s008
  - 32-codex-agent-integration.s013
  - 32-codex-agent-integration.s014
scope:
  - define that `agent-packets/active.json` may contain zero or one active story, never multiple active implementation targets
  - make packet activation replace the prior active story entry instead of accumulating active stories
  - make active packet verification reject manifests with more than one active story
  - add a completion command that moves the active approved story to done history, removes its active packet, and clears the active manifest
  - replace workflow tests that hard-code a specific active story with structural invariants for the current active story
  - move merged workflow stories INF-011, INF-012, and INF-013 out of approved backlog into done history
  - activate this story with a current checked-in packet for implementation and review handoff
non_scope:
  - changing the story schema JSON contract
  - GitHub board sync automation
  - CI branch protection or required status check changes
  - adding Husky or lint-staged hooks
  - changing `pnpm verify` coverage semantics
  - gameplay, contract, engine, server, client, or replay feature work
dependencies:
  - INF-012
  - INF-013
acceptance_criteria:
  - active packet verification passes for zero active stories and for exactly one current active story
  - active packet verification fails when `agent-packets/active.json` contains more than one active story
  - packet activation for one story replaces any prior active story entry in the manifest instead of leaving multiple active stories
  - packet completion for the active story moves the approved story to `stories/done/`, changes its status to done, removes the active packet, and leaves an empty verified active manifest
  - GitHub workflow tests assert active-story manifest structure, packet existence, approved story status, and path consistency without hard-coding a stale story ID
  - merged workflow stories INF-011, INF-012, and INF-013 are recorded under `stories/done/` with done status and are no longer present under `stories/approved/`
  - repo guidance documents post-merge story cleanup and parent ownership of story-state transitions
required_tests:
  - active packet contract tests covering multiple-active rejection
  - active packet contract tests covering activation replacement semantics
  - active packet contract tests covering automated completion cleanup
  - review workflow tests covering structural active-story invariants and done-history cleanup
repo_rules:
  - one approved story may be active for implementation or review handoff at a time
  - dormant approved backlog stories do not require checked-in packets
  - completed stories must move to done history and must not remain in the active packet manifest
  - the parent agent owns story-state transitions and active-packet cleanup
  - packet tooling should enforce lifecycle invariants rather than relying on reviewer memory
ambiguity_policy: implement_if_clearly_implied
