spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-016
epic_id: KICK-001
title: Add story-review gate before story presentation
type: tooling
area: infra
primary_concern: docs
priority: high
status: done
summary: >
  Require generated or normalized story sets to receive a separate story-review
  agent pass before the parent agent presents them to the human for approval.
story_boundary: >
  Own workflow documentation and enforcement tests for the pre-presentation
  story-review gate only. Do not change story schema shape, packet-generation
  tooling, GitHub board sync behavior, implementation review workflow, or CI jobs.
allowed_touch_points:
  - AGENTS.md
  - specs/27-spec-driven-story-generation-workflow.md
  - specs/32-codex-agent-integration.md
  - tests/github/review-workflow.test.mjs
  - stories/approved/INF-016-story-review-gate-before-presentation.yaml
  - agent-packets/INF-016.md
  - agent-packets/active.json
spec_refs:
  - 27-spec-driven-story-generation-workflow.s017 (Pre-presentation story-review gate)
  - 27-spec-driven-story-generation-workflow.s007 (Story normalization rules)
  - 27-spec-driven-story-generation-workflow.s008 (Approval rules)
  - 27-spec-driven-story-generation-workflow.s013 (Stronger process)
  - 32-codex-agent-integration.s007 (Skill usage model)
  - 32-codex-agent-integration.s014 (Subagent model routing)
scope:
  - document a required pre-presentation story-review pass for generated or normalized stories
  - require a set-level story review before presenting a decomposed story group to the human
  - require individual story reviews before presenting each candidate for approval
  - specify story-review agent model routing as `gpt-5.5` with `high` reasoning
  - add workflow tests that fail if the story-review gate or model routing is removed
non_scope:
  - story schema changes
  - packet generator behavior changes
  - GitHub board sync changes
  - implementation worker model routing changes
  - PR code-review gate changes
  - CI workflow changes
dependencies:
  - INF-011
  - INF-013
  - INF-015
acceptance_criteria:
  - AGENTS.md requires story-review agent review before generated or normalized stories are presented for human approval
  - the story-generation workflow spec describes set-level and per-story review gates before approval
  - the Codex integration spec records the `gpt-5.5 high` story-review agent role separately from implementation reviewers
  - workflow tests enforce the new story-review gate and model routing language
required_tests:
  - review workflow test covering AGENTS.md pre-presentation story-review requirements
  - review workflow test covering spec story-review gate and `gpt-5.5 high` story-review model routing
repo_rules:
  - story-review agents review story authority and decomposition, not implementation patches
  - story-review output must be considered before the parent presents stories as approval-ready
  - implementation patch review remains a separate gate and still uses the existing reviewer subagent policy
ambiguity_policy: fail_and_escalate
