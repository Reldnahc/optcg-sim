spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-023A
epic_id: KICK-001
title: Queue When Attacking effects
type: implementation
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Queue and resolve supported attacker When Attacking effects immediately after
  attackDeclared during attack declaration.
story_boundary: >
  Own only attacker-side When Attacking trigger detection, queueing, no-choice
  resolution handoff, source-presence checks, and battle-continuation checks
  after attackDeclared.
allowed_touch_points:
  - packages/engine-core/src/battle-actions.ts
  - packages/engine-core/src/battle-support.ts
  - packages/engine-core/src/attack-timing.ts
  - packages/engine-core/src/effect-runtime.ts
  - packages/engine-core/src/effect-runtime.test.ts
  - packages/engine-core/src/battle-declare-attack.test.ts
  - packages/engine-core/src/battle-pipeline-regression.test.ts
  - packages/engine-core/src/event-sequencing-regression.test.ts
  - packages/engine-core/src/battle-actions-test-fixtures.ts
  - packages/engine-core/src/action-test-fixtures.ts
  - stories/approved/ENG-023A-queue-when-attacking-effects.yaml
  - agent-packets/ENG-023A.md
  - agent-packets/active.json
spec_refs:
  - 02-engine-mechanics.s018 (Attack Step)
  - 02-engine-mechanics.s022 (End of Battle)
  - 02-engine-mechanics.s041 (Timing windows)
  - 03-game-state-events-decisions.s005 (Event journal)
  - 03-game-state-events-decisions.s020 (State hashing)
  - 04-effect-runtime.s007 (Source presence policy)
  - 04-effect-runtime.s008 (Trigger detection from events)
  - 04-effect-runtime.s009 (Effect queue ordering)
  - 09-card-data-and-support-policy.s011 (Support policy by mode)
  - 11-testing-quality.s007 (Interaction tests)
  - 11-testing-quality.s008 (Invariant tests)
  - 23-repo-tooling-and-enforcement.s006 (TypeScript enforcement)
  - 23-repo-tooling-and-enforcement.s008 (Boundary enforcement)
  - 23-repo-tooling-and-enforcement.s016 (CI merge gates)
scope:
  - detect supported attacker-controlled When Attacking effect definitions from the attacking source after attackDeclared
  - queue supported no-choice When Attacking effects using deterministic queue entry IDs, timing window IDs, payloads, and event ordering
  - support only deterministic no-order-choice queueing; fail closed or split if multiple same-player attacker timing effects require chooseTriggerOrder or other unsupported ordering choice
  - resolve supported no-choice attacker timing entries before the battle proceeds to existing defender decision or damage flow
  - enforce mustRemainInSameZone source presence for queued attacker timing entries
  - if attacker or target leaves legal battle participation after attacker timing, skip to existing End of Battle cleanup without adding new cleanup behavior
non_scope:
  - defender On Your Opponent's Attack queueing
  - Counter implementation changes
  - Blocker changes
  - Life Triggers
  - On K.O.
  - replacement effects
  - target selection unless already supported
  - new effect primitives, custom handlers, server/client/UI, database, Redis, WebSocket, replay schema, or CLI behavior
dependencies:
  - ENG-022
acceptance_criteria:
  - accepted attack declaration emits attackDeclared before any When Attacking effectQueued or effectResolved events
  - supported attacker When Attacking no-choice effects queue and resolve deterministically
  - source presence uses mustRemainInSameZone and fails closed without mutation when violated
  - battle continues through the existing battle pipeline when participants remain legal
  - eventJournal and state hashes remain stable for identical inputs
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/battle-declare-attack.test.ts packages/engine-core/src/battle-pipeline-regression.test.ts packages/engine-core/src/effect-runtime.test.ts packages/engine-core/src/effect-queue-ordering.test.ts packages/engine-core/src/event-sequencing-regression.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-023A packet while implementing this story
  - run corepack pnpm run packets:verify before implementation and review handoff
  - stay within allowed_touch_points
  - target the ENG-023 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - if implementation requires defender timing, Counter, Blocker, target-selection, Life Trigger, On K.O., or replacement behavior, stop and split or record the blocker
  - implementation-review gate is required after the PR is opened
ambiguity_policy: fail_and_escalate
