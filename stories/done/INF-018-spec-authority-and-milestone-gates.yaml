spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-018
epic_id: KICK-001
title: Clarify spec authority, DSL schema coverage, and terminal-engine completion gates
type: tooling
area: docs
primary_concern: contract
priority: high
status: done
summary: >
  Tighten spec authority, Effect DSL schema coverage policy, event sequencing
  requirements, and Milestone 1 exit gates so future agents cannot treat
  historical drafts, planned DSL primitives, or partial terminal-engine work as
  complete authority.
story_boundary: >
  Own only documentation and contract/spec tests that clarify existing authority
  and completion gates. Do not implement gameplay behavior, expand the Effect
  DSL JSON schema, change runtime package code, or move server/client/card-pool
  work into Milestone 1.
allowed_touch_points:
  - specs/README.md
  - specs/03-game-state-events-decisions.md
  - specs/05-effect-dsl-reference.md
  - specs/12-roadmap.md
  - specs/15-implementation-kickoff.md
  - specs/16-typescript-interface-draft.md
  - tests/contracts/**
  - package.json
  - stories/approved/INF-018-spec-authority-and-milestone-gates.yaml
  - agent-packets/INF-018.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s004 (Engine result)
  - 03-game-state-events-decisions.s005 (Event journal)
  - 03-game-state-events-decisions.s020 (State hashing)
  - 03-game-state-events-decisions.s022 (Internal state sequencing)
  - 05-effect-dsl-reference.s002 (Purpose)
  - 05-effect-dsl-reference.s023 (v3 additions from real Poneglyph examples)
  - 12-roadmap.s005 (Milestone 1: terminal engine)
  - 15-implementation-kickoff.s008 (First milestone scope)
  - 15-implementation-kickoff.s011 (Definition of done for kickoff)
  - 16-typescript-interface-draft.s002 (v6 supersession)
  - 23-repo-tooling-and-enforcement.s005 (Workspace structure and task naming)
  - 23-repo-tooling-and-enforcement.s016 (CI merge gates)
scope:
  - add a concise spec authority index separating canonical files from historical/explanatory files
  - mark the TypeScript interface draft metadata and first normative section as historical/non-normative
  - add explicit event journal and EngineResult.events sequence requirements to the game-state/events spec
  - add an Effect DSL schema coverage policy that identifies the current schema-supported fixture subset and planned/not fixture-authorable primitives
  - tighten Milestone 1 exit criteria in roadmap and kickoff specs so completion requires a full vanilla CLI match, replay hash reconstruction, event sequencing, and real-engine hidden-info filtering tests
  - add contract/spec tests that fail if these authority and gate requirements disappear
non_scope:
  - gameplay implementation
  - Effect DSL JSON schema expansion or fixture broadening
  - runtime package code changes
  - server, client, Poneglyph live adapter, Redis, ranked, or broad card pool work
  - changing package scripts unless contract tests prove an additional script is necessary
dependencies:
  - INF-006B
  - INF-017
acceptance_criteria:
  - specs include a short authority index for GameState/events/decisions, Effect DSL, terminal engine milestone, and workflow authority
  - specs/16-typescript-interface-draft.md is metadata-marked and prose-marked as historical/non-normative and subordinate to canonical contracts/package source types
  - event sequencing requirements require append-order seq allocation, strictly increasing EngineResult.events, strictly increasing final eventJournal, and no multi-event push when seq/id depends on events.length
  - Effect DSL prose states contracts/effect-dsl.schema.json is the executable JSON fixture contract and classifies primitives as schema-supported or planned/not fixture-authorable
  - Milestone 1 exit criteria require the listed terminal-engine behaviors and exclude server/client/Poneglyph live adapter/Redis/ranked/broad card pool work
  - contract/spec tests enforce the new authority, DSL schema coverage, and Milestone 1 gate text
required_tests:
  - contract/spec test proving specs/16-typescript-interface-draft.md is not canonical
  - contract/spec test proving the Effect DSL schema coverage policy and primitive classification remain present
  - contract/spec test proving Milestone 1 requires CLI vanilla match, replay hash reconstruction, event sequencing, and filterStateForPlayer real-engine hidden-info tests
  - corepack pnpm run test:contracts
  - corepack pnpm run typecheck
  - corepack pnpm run verify
repo_rules:
  - stay within allowed_touch_points
  - do not add new gameplay behavior or runtime implementation
  - do not expand contracts/effect-dsl.schema.json in this story
  - do not broaden Milestone 1 into server, client, Poneglyph live adapter, Redis, ranked, or broad card pool work
  - must pass corepack pnpm run test:contracts
  - must pass corepack pnpm run typecheck
  - must pass corepack pnpm run verify
ambiguity_policy: fail_and_escalate
