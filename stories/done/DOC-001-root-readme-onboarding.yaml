spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: DOC-001
epic_id: KICK-001
title: Add root repository README
type: design
area: docs
primary_concern: docs
priority: medium
status: done
summary: >
  Add a concise root README that orients humans and agents to the repository,
  points to the authoritative specs and workflow docs, documents local setup and
  verification commands, and defines the stable-change rule for future README
  updates.
story_boundary: >
  Own only the root onboarding README and story/packet lifecycle files needed to
  deliver it. The README must summarize existing repository structure,
  commands, workflow links, architecture links, current stable development
  focus, deferred areas, and README update policy without changing tooling,
  specifications, runtime behavior, gameplay behavior, server/client behavior,
  or workflow semantics.
allowed_touch_points:
  - README.md
  - stories/generated/DOC-001-root-readme-onboarding.yaml
  - stories/approved/DOC-001-root-readme-onboarding.yaml
  - agent-packets/DOC-001.md
  - agent-packets/active.json
spec_refs:
  - README.s001
  - 00-project-overview.s002
  - 00-project-overview.s004
  - 00-project-overview.s005
  - 00-project-overview.s006
  - 00-project-overview.s008
  - 00-project-overview.s015
  - 01-system-architecture.s003
  - 12-roadmap.s003
  - 12-roadmap.s005
  - 12-roadmap.s006
  - 27-spec-driven-story-generation-workflow.s009
  - 27-spec-driven-story-generation-workflow.s012
  - 32-codex-agent-integration.s004
  - 32-codex-agent-integration.s008
scope:
  - add a root `README.md` with a brief project description grounded in the canonical project overview
  - include a concise package/repo map covering the currently present packages and authority directories
  - document local setup commands using existing package-manager and package scripts only
  - document verification commands using existing package scripts only
  - summarize the story/packet workflow and link to `AGENTS.md` and the mandatory `docs/workflow/` procedure docs
  - link architecture readers to `specs/README.md` and core spec files rather than duplicating the full spec
  - state the current stable development focus at onboarding level, consistent with the roadmap and current repo reality
  - include a "Not Yet" section for deferred areas such as browser UI, live match server, matchmaking, production replay/rollback, card-data adapter, and deck builder
  - include a "When To Update This README" section that distinguishes stable onboarding/interface changes from ordinary story progress and branch handoff status
non_scope:
  - daily progress log, active story handoff, current branch or PR tracker, or blocker tracker
  - duplicate full workflow docs, full spec content, or detailed milestone acceptance matrix
  - new package scripts, tooling, CI jobs, schema changes, generated metadata behavior, or story workflow behavior
  - gameplay behavior, engine behavior, CLI behavior, server/client protocol, replay behavior, hidden-info filtering, database contracts, or card-data integration
  - implementation of UI, match server, matchmaking, replay viewer, card-data adapter, deck builder, or browser client
dependencies: []
acceptance_criteria:
  - root `README.md` exists and is concise enough for onboarding without replacing authoritative specs or workflow docs
  - README includes a brief project description, package/repo map, local setup commands, verification commands, story/packet workflow overview, architecture/spec links, current stable development focus, deferred "Not Yet" areas, and README update rules
  - README update rule says to update for stable onboarding/interface changes and milestone closeout focus changes, and not for ordinary story progress, active story handoff, daily status, branch state, blockers, or detailed acceptance tracking
  - README links to `AGENTS.md`, `docs/workflow/story-execution.md`, `docs/workflow/review-gate.md`, `docs/workflow/parent-integration-branches.md`, `docs/workflow/reporting-and-github-sync.md`, `specs/README.md`, and core spec files relevant to onboarding
  - README does not introduce new commands or imply deferred systems are currently implemented
  - no production code, tests, specs, workflow docs, package scripts, or generated metadata are changed
required_tests:
  - "`corepack pnpm run format:check` must pass"
  - "`corepack pnpm run packets:verify` must pass after packet activation"
  - "`corepack pnpm run stories:validate` must pass"
  - "`corepack pnpm run verify` must pass"
repo_rules:
  - generated or normalized story must receive per-story story-review before it is presented as approval-ready
  - after story-review passes, move or leave the story in `stories/approved/`, generate and activate its packet, and run `packets:verify` before implementation
  - keep the implementation to `README.md` plus story/packet lifecycle files
  - use existing commands only; do not add scripts, tooling, CI, specs, runtime behavior, or workflow semantics
  - run the normal implementation review gate after opening the PR
ambiguity_policy: fail_and_escalate
