spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-028C
epic_id: KICK-001
title: Handle activated life trigger no-zone
type: implementation
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Validate activateTrigger responses, reveal the Life card publicly, and hold it
  in no zone while supported Trigger resolution is pending.
story_boundary: >
  Own only the activated life-trigger transition from decision to public reveal
  and no-zone resolving state. Do not implement the Trigger effect body or final
  trash-after-resolution in this story.
allowed_touch_points:
  - packages/engine-core/src/life-trigger-actions.ts
  - packages/engine-core/src/life-trigger-actions.test.ts
  - packages/engine-core/src/actions.ts
  - packages/engine-core/src/actions.test.ts
  - packages/engine-core/src/battle-damage-banish.test.ts
  - packages/engine-core/src/effect-runtime.ts
  - packages/engine-core/src/effect-runtime.test.ts
  - packages/engine-core/src/filter-state-for-player.ts
  - packages/engine-core/src/filter-state-for-player.test.ts
  - stories/approved/ENG-028C-handle-activated-life-trigger-no-zone.yaml
  - agent-packets/ENG-028C.md
  - agent-packets/active.json
spec_refs:
  - 02-engine-mechanics.s023
  - 02-engine-mechanics.s040
  - 03-game-state-events-decisions.s005
  - 03-game-state-events-decisions.s014
  - 03-game-state-events-decisions.s017
  - 03-game-state-events-decisions.s018
  - 03-game-state-events-decisions.s020
  - 04-effect-runtime.s005
  - 04-effect-runtime.s006
  - 04-effect-runtime.s007
  - 04-effect-runtime.s010
  - 04-effect-runtime.s017
  - 05-effect-dsl-reference.s005
  - 06-visibility-security.s004
  - 06-visibility-security.s005
  - 06-visibility-security.s006
  - 11-testing-quality.s011
scope:
  - accept respondToDecision lifeTrigger activateTrigger only from the pending decision player and matching decision id
  - emit deterministic decisionResolved, cardRevealed, and triggerActivated events with public visibility for the activated card
  - represent the activated card as temporarily resolving from no zone using the current runtime/transient state model
  - clear the confirmLifeTrigger pending decision, keep the activated card in no-zone/transient runtime state, and create only the deterministic pending/resolving runtime record required for later Trigger effect execution without executing the effect body or trash cleanup
  - keep no-zone data hidden-info safe while exposing the public reveal to both players
  - fail closed without mutation if the Trigger definition is unsupported for no-zone activation
  - update existing battle-damage life-trigger regression coverage only to remove the stale unconditional activation-unsupported assertion
non_scope:
  - executing the Trigger effect body
  - trashing the activated Trigger after resolution
  - Banish changes
  - Double Attack or multiple damage handling
  - replacement effects
  - complex Trigger effects
  - search, look, or reveal primitives
  - target selection
  - server/client/UI
dependencies:
  - ENG-028B
acceptance_criteria:
  - activateTrigger response publicly reveals the card and moves it out of Life into no-zone runtime state
  - both players can see the activated card identity during the reveal/no-zone resolution window
  - the card is not in hand, trash, deck, board, or Life while activated resolution is pending
  - pendingDecision is cleared and runtime work is deterministic and bounded to the activated Trigger card
  - unsupported no-zone Trigger definitions fail closed without mutation
  - event sequencing and state hash output are stable for identical activation inputs
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/life-trigger-actions.test.ts packages/engine-core/src/effect-runtime.test.ts packages/engine-core/src/actions.test.ts packages/engine-core/src/filter-state-for-player.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-028C packet while implementing this story
  - run corepack pnpm run packets:verify before implementation and review handoff
  - stay within allowed_touch_points
  - target the ENG-028 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - if no-zone activation requires new effect primitives, replacement behavior, or target selection, stop and split or record the blocker
ambiguity_policy: fail_and_escalate
