spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-031A
epic_id: KICK-001
title: Split play-card legality tests
type: refactor
area: engine
primary_concern: verification
priority: medium
status: done
summary: >
  Move existing play-card legal-action and initial rejection/precondition tests
  out of play-card.test.ts into a focused legality test file without changing
  assertions, fixtures, legal actions, errors, events, state hashes, or behavior.
story_boundary: >
  Own only behavior-preserving test-file organization for card-play legality,
  precondition, and initial action rejection coverage currently in
  play-card.test.ts.
allowed_touch_points:
  - packages/engine-core/src/play-card.test.ts
  - packages/engine-core/src/play-card-legality.test.ts
  - stories/generated/ENG-031A-split-play-card-legality-tests.yaml
  - stories/approved/ENG-031A-split-play-card-legality-tests.yaml
  - agent-packets/ENG-031A.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s015
  - 06-visibility-security.s007
  - 11-testing-quality.s007
  - 11-testing-quality.s008
  - 23-repo-tooling-and-enforcement.s006
  - 23-repo-tooling-and-enforcement.s016
scope:
  - move vanilla Character and Stage getLegalActions coverage from play-card.test.ts into play-card-legality.test.ts
  - move card-play precondition omission coverage from play-card.test.ts into play-card-legality.test.ts
  - move initial playCard rejection coverage for direct payment payloads, forged card references, insufficient active DON!!, and missing printed cost into play-card-legality.test.ts
  - preserve existing test names or equivalent names that identify the same behavior
  - keep assertions, fixtures, legal-action visibility checks, errors, event expectations, and mutation checks behavior-equivalent
non_scope:
  - changing production code
  - changing legal-action behavior
  - changing payment, Stage replacement, Character overflow, Event play, or On Play runtime behavior
  - broad test-helper refactors outside moved legality tests
dependencies: []
acceptance_criteria:
  - play-card.test.ts no longer contains the moved legality and initial rejection test groups
  - play-card-legality.test.ts covers the same legality and initial rejection scenarios with behavior-equivalent expectations
  - no production files change
  - focused tests, coverage, and full verify pass
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/play-card.test.ts packages/engine-core/src/play-card-legality.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-031A packet while implementing this story
  - target the ENG-031 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - this is a behavior-preserving test organization story; if a production change appears necessary, stop and split or record an ambiguity
ambiguity_policy: fail_and_escalate
