spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-038D
epic_id: KICK-001
title: Defer Main Event target-effect resolution
type: verification
area: engine
primary_concern: verification
priority: high
status: done
summary: >
  Record and test that target-based Main Event resolution remains deferred
  because the current runtime has no supported target-effect primitive
  continuation.
story_boundary: >
  Own only omission and fail-closed regression coverage for target-requiring Main
  Event effects. This story must not add target-based Event resolution, new
  target-effect primitives, or changes to the current target-selection
  continuation behavior.
allowed_touch_points:
  - packages/engine-core/src/play-card-support.ts
  - packages/engine-core/src/play-card-event.test.ts
  - packages/engine-core/src/target-selection-actions.test.ts
  - packages/engine-core/src/filter-state-for-player.real-states-targeting.test.ts
  - stories/approved/ENG-038D-main-event-target-effect-boundary.yaml
  - agent-packets/ENG-038D.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s017
  - 03-game-state-events-decisions.s020
  - 04-effect-runtime.s007
  - 04-effect-runtime.s008
  - 04-effect-runtime.s010
  - 04-effect-runtime.s011
  - 04-effect-runtime.s012
  - 06-visibility-security.s006
  - 06-visibility-security.s007
  - 09-card-data-and-support-policy.s010
  - 09-card-data-and-support-policy.s011
  - 11-testing-quality.s007
  - 11-testing-quality.s008
scope:
  - record that current target selection can resolve candidates and validate responses, but selected-target continuation intentionally fails closed because no target-effect primitive resolves today
  - keep target-requiring Main Events out of the support gate for this parent story
  - add regression coverage proving target-requiring Main Events do not become legal playable Main Events
  - add or preserve regression coverage proving existing selected-target continuation fails closed without partial mutation
  - preserve existing PlayerView safety coverage for target decisions and legal actions without introducing Main Event target decisions
non_scope:
  - adding new KO, trash, rest, modifyPower, search, look, reveal, or replacement primitives
  - adding target selection to unsupported timing categories
  - Counter Events
  - Life Trigger changes
  - replacement effects
  - optional activation
  - once-per-turn tracking
  - custom handlers
  - server/client/UI
dependencies:
  - ENG-038C
  - ENG-029D
acceptance_criteria:
  - story-review records target-based Main Event resolution as deferred for this story set
  - target-requiring Main Events do not become playable because their full target effect cannot resolve through an already supported primitive
  - unsupported target-based Main Event work fails closed deterministically without partial mutation and without leaking private candidates
  - existing target-selection response validation and fail-closed continuation behavior remains unchanged
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/play-card-event.test.ts packages/engine-core/src/target-selection-actions.test.ts packages/engine-core/src/filter-state-for-player.real-states-targeting.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-038D packet while implementing this story
  - run corepack pnpm run packets:verify before implementation and review handoff
  - stay within allowed_touch_points
  - target the ENG-038 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - if target integration requires a new gameplay primitive, new decision schema, client-provided candidate trust, optional activation, or replacement effects, keep it deferred and split a later exact primitive story
ambiguity_policy: fail_and_escalate
