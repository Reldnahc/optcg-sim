summary: >
  Prove the SUP-003 cards-layer primitives compose across representative leader
  text without exact full-card branches: certified non-runtime deck rule,
  start-of-game Stage play, and Activate Main optional choose-one cost into
  draw.
story_boundary: >
  Cards-layer composition and proof story only. SUP-003E, SUP-003F, and
  SUP-003G must already be implemented. Do not add new engine runtime behavior,
  shared contract/schema changes, deck validation enforcement, real-card fixture
  promotion, source hashes, behavior hashes, overlays, or card-specific branches.
