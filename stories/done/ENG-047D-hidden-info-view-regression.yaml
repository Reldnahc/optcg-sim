spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-047D
epic_id: KICK-001
title: Add hidden-info view and legal-action regressions
type: implementation
area: engine
primary_concern: visibility
priority: high
status: done
summary: >
  Prove the supported transient reveal set path does not leak deck order,
  hidden card identities, private candidates, or stale reveal metadata through
  PlayerView, events, legal actions, or public metadata.
story_boundary: >
  Own hidden-info regressions and minimal projection fixes required by the
  supported ENG-047 path. Do not broaden public DTO contracts, server protocol,
  replay viewer behavior, or client UI.
allowed_touch_points:
  - packages/engine-core/src/filter-state-for-player.ts
  - packages/engine-core/src/filter-state-for-player*.test.ts
  - packages/engine-core/src/actions-*.ts
  - packages/engine-core/src/actions-*.test.ts
  - packages/engine-core/src/search-reveal*.test.ts
  - tests/hidden-info/**
  - stories/generated/ENG-047D-hidden-info-view-regression.yaml
  - stories/approved/ENG-047D-hidden-info-view-regression.yaml
  - agent-packets/ENG-047D.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s006
  - 03-game-state-events-decisions.s015
  - 03-game-state-events-decisions.s018
  - 06-visibility-security.s002
  - 06-visibility-security.s003
  - 06-visibility-security.s004
  - 06-visibility-security.s006
  - 06-visibility-security.s007
  - 06-visibility-security.s023
  - 11-testing-quality.s004
  - 22-v6-implementation-tightening.s009
scope:
  - ensure PlayerView exposes active eligible top-card candidates only to the chooser while the chooser-only reveal is active
  - ensure opponent views see only deck counts and public progress when reveal visibility is chooser-only
  - ensure public events do not leak hidden deck order or unchosen hidden card identities
  - ensure legal actions and metadata remain content-agnostic for hidden candidates
  - ensure stale reveal candidates disappear from all public/player-facing outputs after cleanup
non_scope:
  - changing full GameState ownership
  - replay viewer behavior
  - server/client/API/UI work
  - broad hidden-info helper rewrites
dependencies:
  - ENG-047A
  - ENG-047B
  - ENG-047C
acceptance_criteria:
  - chooser PlayerView can see active revealed candidates according to chooser-only effect visibility
  - unauthorized PlayerView does not include hidden candidate identities, deck order, or stale transient state
  - legal actions remain hidden-content agnostic
  - public event payloads do not leak private reveal data
required_tests:
  - focused PlayerView/event/legal-action hidden-info regressions
  - run `corepack pnpm run test:hidden-info`
  - run `corepack pnpm --filter @optcg/engine-core typecheck`
  - run `corepack pnpm run packets:verify`
  - run `corepack pnpm run verify`
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-047D packet while implementing this story
  - stay within allowed_touch_points
  - target the ENG-047 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
ambiguity_policy: fail_and_escalate
