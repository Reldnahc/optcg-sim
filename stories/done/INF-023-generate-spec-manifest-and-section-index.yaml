spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-023
epic_id: KICK-001
title: Generate spec manifest and section index
type: tooling
area: infra
primary_concern: tooling
priority: critical
status: done
summary: >
  Add deterministic tooling that generates and verifies the machine-readable
  spec package manifest and section index required by the v6 specification
  bundle, so automation can consume stable document metadata and SECTION_REF
  lookups without scraping specs ad hoc at runtime.
story_boundary: >
  Own only generation, checked-in output, and stale-artifact verification for
  the spec package manifest and section index. Stop before changing story schema
  semantics, GitHub board sync behavior, packet lifecycle behavior, or any
  gameplay/runtime code.
allowed_touch_points:
  - package.json
  - specs/spec-manifest.json
  - specs/section-index.json
  - tools/**
  - tests/contracts/**
  - tests/ci/**
  - tests/fixtures/**
  - .github/workflows/**
spec_refs:
  - SPEC_VERSION.s002
  - SPEC_VERSION.s003
  - SPEC_VERSION.s005
  - SPEC_VERSION.s007
  - 28-machine-readable-conventions.s002 (Parsing contract)
  - 28-machine-readable-conventions.s003 (Required file-level metadata)
  - 28-machine-readable-conventions.s004 (Canonical package identity)
  - 28-machine-readable-conventions.s007 (Preferred extraction targets)
  - 28-machine-readable-conventions.s008 (Stable heading usage)
  - 28-machine-readable-conventions.s009 (Section index)
  - 28-machine-readable-conventions.s012 (Recommended downstream tooling behavior)
  - 31-github-board-and-story-ops.s010 (Automation contract)
  - 23-repo-tooling-and-enforcement.s005 (Package scripts)
  - 23-repo-tooling-and-enforcement.s016 (CI merge gates)
  - 23-repo-tooling-and-enforcement.s021 (Generated code and codegen policy)
scope:
  - add a deterministic spec metadata generator for the checked-in Markdown spec package under `specs/`
  - generate `specs/spec-manifest.json` from `SPEC_VERSION.md`, canonical document order, and spec front matter
  - generate `specs/section-index.json` from in-document `SECTION_REF` markers, visible Section Ref lines, headings, source paths, and document metadata
  - fail closed on duplicate section refs, missing visible Section Ref companions, mismatched document IDs, or missing required front matter
  - add a verify mode or command that fails when the checked-in manifest or section index is stale
  - wire stale artifact verification into the canonical local verification path and CI path
  - add deterministic diagnostics that identify the spec file and section ref problem
non_scope:
  - changing gameplay, engine, cards, server, client, replay, database, or hidden-info behavior
  - changing spec prose or renumbering existing SECTION_REF markers except for fixture data created only for tests
  - changing story schema fields or approval semantics
  - enforcing story `spec_refs` against `section-index.json` unless a later story explicitly scopes that validator
  - changing GitHub issue, board sync, project field, or packet lifecycle behavior
  - adding production replay, match-server, browser-client, or external publishing behavior
dependencies:
  - INF-021
acceptance_criteria:
  - a root-accessible command can generate `specs/spec-manifest.json` and `specs/section-index.json`
  - generated outputs are deterministic, sorted according to `SPEC_VERSION.s005`, and stable across repeated runs with unchanged inputs
  - "`specs/spec-manifest.json` records canonical package identity and document metadata from the spec package"
  - "`specs/section-index.json` records every canonical `SECTION_REF` with enough metadata for tooling to locate the source document and heading"
  - malformed spec metadata or section refs fail closed with deterministic diagnostics naming the offending file and ref
  - local `pnpm verify` fails when the checked-in generated artifacts are stale
  - CI includes stale spec-metadata verification through the canonical command path or a clearly named job/step
required_tests:
  - contract/tooling test proving the generator emits deterministic manifest and section-index output from fixture specs
  - contract/tooling test proving duplicate or malformed SECTION_REF metadata fails with deterministic diagnostics
  - contract/tooling test proving stale checked-in manifest or section-index artifacts fail verification
  - package-script or CI smoke test proving `pnpm verify` includes spec metadata verification
  - "`corepack pnpm exec vitest run tests/contracts tests/ci` must pass"
  - "`corepack pnpm run verify` must pass"
repo_rules:
  - keep this story limited to spec metadata generation and stale-artifact enforcement
  - generated artifacts must be reproducible and checked in deliberately
  - do not broaden into story spec-ref validation or GitHub board sync behavior without a new approved story
  - generated story must receive per-story story-review before it is presented as approval-ready
ambiguity_policy: fail_and_escalate
