story_schema_version: 1.0.0
id: ENG-013
epic_id: M1-001
title: Integrate Banish keyword into supported battle damage
type: implementation
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Promote printed Banish from a fail-closed combat keyword into the narrow
  supported Leader-damage path: when a Banish attacker deals battle damage to a
  Leader with Life, the top Life card is trashed instead of added to hand and
  no Life Trigger path is offered.
story_boundary: >
  Own only printed Banish behavior during deterministic supported battle damage
  against Leaders. Stop before Double Attack, Life Trigger decisions,
  replacement effects, Blocker, Counter, protection, effect-runtime trigger
  queueing, replay schema changes, CLI/server/client behavior, or card-specific
  effect behavior.
