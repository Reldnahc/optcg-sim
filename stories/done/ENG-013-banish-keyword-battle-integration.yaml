scope:
  - preserve the existing supported declare-attack battle resolution path and add Banish only as a deterministic modifier to Leader damage destination
  - detect Banish from the attacker's computed-view keyword metadata during Damage Step after the existing supported battle guards pass
  - when a Banish attacker deals damage to a Leader with at least one Life card, remove `player.life[0]`, reindex remaining Life, and put the damaged Life card into that player's trash instead of hand
  - emit deterministic public `damageDealt`, `lifeTaken`, and content-safe `cardMoved` or trash movement events that do not expose the face-down Life card identity
  - emit card-identifying movement details only with private visibility for the damaged player or replay-only visibility, following existing Life movement patterns
  - skip Life Trigger reveal/activation handling for Banish damage, including when the damaged Life card has trigger metadata
  - preserve the existing zero-Life Leader damage terminal-defeat path for Banish attackers without inventing multi-damage behavior
  - preserve existing Character target behavior: a Banish attacker that battles a rested Character still uses normal battle K.O., trash, attached-DON return, event sequencing, invariant checks, and state hashing
  - preserve fail-closed behavior for Banish combined with Double Attack, replacement effects, active unsupported battle steps, pending effect queues, deferred triggers, Blocker, Counter, and non-vanilla timing windows
  - preserve the existing protection guard when protection metadata is reachable, without implementing new protection or continuous-effect behavior
non_scope:
  - Double Attack or multiple damage processing
  - Life Trigger reveal, activation, decline, no-zone resolution, or trigger-card trash after trigger resolution
  - replacement effects that modify damage, Life movement, trashing, or Trigger handling
  - Blocker, Counter, Unblockable, protection, or battle-duration continuous effects
  - On K.O., On Block, End of Battle, Trigger, When Attacking, or On Opponent Attack effect queueing
  - new effect-runtime primitives or source-presence behavior
  - changing canonical Action, PendingDecision, replay fixture, CLI, server, client, database, Redis, WebSocket, React, or live Poneglyph behavior
dependencies:
  - ENG-003C
  - ENG-003D
  - ENG-010G
  - ENG-011
acceptance_criteria:
  - a supported Banish attacker dealing battle damage to a Leader with Life moves `life[0]` to trash, not hand
  - Banish damage reindexes both remaining Life and trash deterministically and returns a stable state hash
  - public events for Banish damage do not expose face-down Life card IDs, while private or replay-only event details are sufficient for the damaged player or replay reconstruction
  - a damaged Life card with Trigger metadata is trashed by Banish without creating a Life Trigger decision and without failing closed solely because the card has Trigger text
  - Banish on an attacker does not change Character target battle resolution or attached-DON return behavior
  - Banish combined with Double Attack, replacement metadata, unsupported battle steps, pending effect queues, deferred triggers, Blocker, Counter, or unsupported timing windows still fails closed without mutating input state
  - existing protection guard behavior remains unchanged when reachable by current test fixtures or helper setup
  - no new public action, decision, replay schema, CLI, server, or client behavior is introduced
required_tests:
  - unit test proving `applyAction(declareAttack)` with a supported Banish attacker against a Leader moves the top Life card to trash instead of hand
  - unit test proving Banish Leader damage reindexes remaining Life and trash with correct zone refs
  - unit test proving public Banish Life movement events do not expose the face-down Life card identity
  - unit test proving card-identifying Banish Life-to-trash details are private to the damaged player or replay-only
  - unit test proving a Banish-damaged Life card with Trigger metadata is trashed without creating a pending Life Trigger decision
  - unit test proving Banish attacking a rested Character still follows existing K.O. and attached-DON return behavior
  - negative test proving Banish combined with Double Attack remains fail-closed without mutation
  - negative test proving Banish combined with replacement metadata remains fail-closed without mutation
  - negative test proving Banish combined with pending effect queue or deferred trigger state remains fail-closed without mutation
  - negative test proving Banish combined with Blocker or Counter metadata remains fail-closed without mutation
  - preserve existing protection-guard test coverage if current fixtures can reach `targetView.protectedFrom`; do not add protection implementation solely for this story
  - existing vanilla Leader damage, Character K.O., Rush, unsupported keyword, and replay smoke tests must pass without weakened assertions
  - "`corepack pnpm exec vitest run packages/engine-core/src/battle-actions.test.ts packages/engine-core/src/compute-view.test.ts packages/engine-core/src/replay-smoke.test.ts` must pass"
  - "`corepack pnpm --filter @optcg/engine-core typecheck` must pass"
  - "`corepack pnpm run verify` must pass"
repo_rules:
  - do not activate, packetize, or implement this story until it is approved and moved to `stories/approved/`
  - keep the patch inside the current battle legality and supported battle resolution surface
  - if implementation requires Life Trigger decisions, replacement effects, Double Attack damage iteration, effect-runtime queueing, or replay schema changes, stop and split or record the ambiguity
  - do not silently reveal face-down Life identity through public events or public views
  - keep engine-core deterministic and pure
  - do not introduce React, browser APIs, WebSocket transport, Redis, Postgres, live HTTP, CLI modules, or test-only helpers into production engine-core modules
  - do not introduce live Poneglyph access or a card-data package dependency into engine-core
  - prefer named exports and strict TypeScript types; do not introduce `any`, routine non-null assertions, `@ts-ignore`, or `@ts-nocheck`
  - must pass `corepack pnpm run verify`
ambiguity_policy: fail_and_escalate
