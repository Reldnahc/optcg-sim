spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: SEC-002
epic_id: KICK-001
title: Add real-state PlayerView filtering regression coverage
type: verification
area: security
primary_concern: visibility
priority: critical
status: done
summary: >
  Prove the production `filterStateForPlayer` path remains hidden-info safe on
  representative real engine and CLI `GameState` outputs, not only static JSON
  fixtures or hand-shaped filter fixtures.
story_boundary: >
  Own only regression coverage that runs production PlayerView filtering against
  real engine-core and CLI fixture states. Stop before adding gameplay support,
  changing filter behavior, changing shared DTO contracts, introducing server or
  browser protocols, spectator filtering, replay filtering, rollback policy, or
  static-only hidden-info fixture expansion.
allowed_touch_points:
  - packages/engine-core/src/filter-state-for-player.real-states.test.ts
  - packages/engine-core/src/filter-state-for-player.test.ts
  - packages/cli/src/player-view-filtering.test.ts
spec_refs:
  - 00-project-overview.s011 (Hidden information is a security boundary)
  - 00-project-overview.s016 (Launch blockers)
  - 03-game-state-events-decisions.s002 (Canonical state model)
  - 03-game-state-events-decisions.s006 (Event visibility)
  - 03-game-state-events-decisions.s009 (Pending decisions)
  - 03-game-state-events-decisions.s015 (Legal actions)
  - 03-game-state-events-decisions.s021 (Hidden-information tests)
  - 06-visibility-security.s002 (Security principle)
  - 06-visibility-security.s003 (Player zone visibility)
  - 06-visibility-security.s004 (PlayerView shape)
  - 06-visibility-security.s007 (Legal-action visibility)
  - 06-visibility-security.s017 (Filter checklist)
  - 11-testing-quality.s008 (Invariant tests)
scope:
  - "add regression tests that call the production `filterStateForPlayer` function against real `GameState` objects produced by existing engine-core setup, mulligan, main-phase, card-play, battle, Blocker, and concession/completed-match paths"
  - "add CLI-package coverage that filters the `GameState` returned by the production CLI `bootFixtureMatch` path"
  - "cover representative states: setup/boot, mulligan, main phase, after card play, after attack/damage, after Blocker when the landed ENG-014 path is available, and a completed match when reachable by existing concession support"
  - "assert recipient self hand identities remain visible in each filtered `PlayerView`"
  - "assert opponent hand contents remain absent and only opponent hand count is exposed"
  - "assert both players' deck and DON!! deck card identities/order remain absent and only counts are exposed"
  - "assert face-down Life card IDs and instance IDs remain absent while public face-up Life cards, if present in the tested state, remain visible"
  - "assert public board, trash, cost, leader, character, and stage data remains visible when present in the tested state"
  - "assert RNG state, server-only metadata, and non-public queue internals remain absent from serialized `PlayerView` output"
  - "assert pending decisions are visible only to the decision recipient and wrong-player private decision details are absent"
  - "assert public legal actions are included for the recipient without leaking hidden hand, deck, or face-down Life card identities"
non_scope:
  - production `filterStateForPlayer` behavior changes
  - new gameplay behavior, card behavior, or rule support
  - match server, transport envelopes, browser client, or server/client protocol
  - spectator mode or `filterStateForSpectator`
  - replay viewer, replay filtering, completed-replay visibility policy, or replay schema changes
  - rollback policy or rollback consent behavior
  - static-only hidden-info fixture expansion that does not consume real engine or CLI states
dependencies:
  - ENG-015
  - ENG-014E
  - CLI-001A
acceptance_criteria:
  - "engine-core regression coverage filters real setup/boot, mulligan, main-phase, after-card-play, after-attack/damage, after-Blocker, and completed-match states"
  - "CLI regression coverage filters the real `bootFixtureMatch` state"
  - "every filtered view exposes the recipient's hand identities but never opponent hand contents"
  - "filtered views expose deck and DON!! deck counts without deck card IDs, instance IDs, or ordering"
  - "face-down Life identities are absent for both players, with face-up Life visibility preserved when tested"
  - "public board/trash/cost/leader/character/stage data remains visible when present"
  - "serialized views exclude RNG state, server-only metadata, effect queues, deferred triggers, replacement state, continuous-effect internals, and non-public queue internals"
  - "wrong-recipient pending decisions and private response details are absent"
  - "recipient legal actions are present where legal actions exist and do not leak hidden card identities"
  - "no production files are changed; if the tests reveal a production leak, stop and split or raise an ambiguity instead of broadening this verification story"
required_tests:
  - "new engine-core real-state PlayerView regression test covering setup/boot, mulligan, main phase, after card play, after attack/damage, after Blocker, and completed match using real engine outputs"
  - "new CLI PlayerView regression test covering `bootFixtureMatch().state` with production filtering"
  - "`corepack pnpm exec vitest run packages/engine-core/src/filter-state-for-player.real-states.test.ts packages/cli/src/player-view-filtering.test.ts tests/hidden-info` must pass"
  - "`corepack pnpm --filter @optcg/engine-core typecheck` must pass"
  - "`corepack pnpm --filter @optcg/cli typecheck` must pass"
  - "`corepack pnpm run packets:verify` must pass"
  - "`corepack pnpm run verify` must pass"
repo_rules:
  - story-review must pass before this story is moved or treated as approval-ready
  - packet generation and packet verification must pass before implementation handoff
  - keep this story test-only
  - use an implementation worker subagent after packet activation when subagents are available
  - open or prepare a PR before the implementation reviewer-subagent gate
  - run separate implementation reviewer-subagent review after PR creation
  - fail closed on hidden-information, gameplay-rule, replay, protocol, or security-sensitive ambiguity
ambiguity_policy: fail_and_escalate
