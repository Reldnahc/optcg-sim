spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-005A
epic_id: M1-001
title: Add no-overflow vanilla Character and Stage play from hand
type: implementation
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Add `playCard` legal-action generation and application for vanilla Character
  and Stage cards from the turn player's hand when the destination zone has
  room, routing nonzero DON!! payment through canonical `PayCostDecision`.
story_boundary: >
  Own only direct no-overflow play of vanilla Character and Stage cards from
  hand during the turn player's Main Phase. Stop before Stage replacement,
  Character overflow choice, Event cards, On Play effect queueing, and cost
  modifier behavior.
allowed_touch_points:
  - packages/engine-core/**
  - tests/engine/**
spec_refs:
  - 02-engine-mechanics.s007 (Card categories)
  - 02-engine-mechanics.s014 (Main Phase)
  - 02-engine-mechanics.s016 (Playing a card)
  - 02-engine-mechanics.s036 (DON!! card mechanics)
  - 03-game-state-events-decisions.s003 (Base state vs. computed view)
