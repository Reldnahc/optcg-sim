dependencies:
  - CARD-017C
  - ENG-056A
  - ENG-056B
  - ENG-057A
child_stories:
  - id: CARD-018A
    title: ENG-056 and ENG-057 component generated support
    concern: Enable cards-side component generated support for reviewed ENG-056 Trigger and On K.O. wrapper reachability plus reviewed ENG-057 zero-choice choose continuous runtime, with no exact-template regression.
    depends_on: [CARD-017C, ENG-056A, ENG-056B, ENG-057A]
scope:
  - coordinate CARD-018A as the only implementation child
  - keep CARD-018A focused on cards-side parser/component evidence, runtime capability matrix records, generated-support indexing, diagnostics, and tests
  - consume ENG-056A, ENG-056B, and ENG-057A as runtime authority without adding engine behavior
  - require CARD-018A to preserve CARD-016 and CARD-017 componentized generated-support architecture and avoid exact wrapper/body template IDs
  - require CARD-018A to fail closed when wrapper, body, source policy, schema, runtime capability, metadata, source integrity, review, or test evidence is missing
non_scope:
  - direct parent implementation
  - engine runtime behavior
  - new effect primitives
  - shared TYP/contracts/schema changes
  - real-card fixture support, fixture capture, fixture recapture, source hash updates, behavior hash updates, overlays, or supported-card manifest changes
  - broad trigger families beyond life Trigger and On K.O.
  - replacement generalization
  - disappeared selected-target no-op behavior for nonzero choose selections
  - server, client, API, UI, database, replay, WebSocket, Redis, or live Poneglyph work
card_source_integrity:
  - not applicable for direct parent implementation because this parent does not enable or change gameplay support for any card
  - CARD-018A must not edit source fixtures, source hashes, behavior hashes, overlays, supported-card manifests, or manually reviewed source evidence
engine_capability_preflight:
  - not applicable for direct parent implementation because this parent adds no runtime capability or gameplay behavior
  - CARD-018A must use completed ENG-056A, ENG-056B, and ENG-057A evidence as the support boundary and must not hide missing engine behavior inside cards-layer work
acceptance_criteria:
  - CARD-018 is not implemented directly
  - CARD-018A is independently reviewable and can be activated as the only child story
  - parent and child story-review artifacts exist with distinct assignment identity and distinct durable artifact identity before approval handoff, packet generation, activation, implementation handoff, or PR handoff
  - a compact story-review matrix records the parent row and child row before approval handoff
  - CARD-018A uses component evidence and representative composition tests rather than wrapper/body cartesian-product testing
  - no engine behavior, shared schema authority, fixture support, source hash updates, or exact-template parser regression is added by this parent set
  - parent/substory cleanup metadata lists CARD-018A and binds the non-packetized CARD-018 parent closeout after merge to main
required_tests:
  - story-review for CARD-018 parent before approval handoff
  - story-review for CARD-018A child before approval handoff
  - reconstruct a parent/child story-review matrix with distinct assignment and artifact identities per row before approval or implementation handoff
  - story-specific tests from CARD-018A
  - run `corepack pnpm run stories:validate`
  - run `corepack pnpm run packets:verify`
  - run `corepack pnpm --filter @optcg/cards test`
  - full `corepack pnpm verify`
repo_rules:
  - use the parent/substory workflow even though this set has exactly one child
  - do not activate or implement CARD-018 directly
  - generate and activate the CARD-018A packet before implementation
  - keep one active child packet at a time
  - do not complete the child packet until the parent branch lands on main
  - use one final parent PR to main
  - fail closed on generated-support ambiguity that could accidentally mark unsupported text playable
ambiguity_policy: fail_and_escalate
