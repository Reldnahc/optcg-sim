title: Detect life trigger and create decision
type: implementation
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Detect a supported Trigger card taken from Life by ordinary Leader damage and
  pause with a confirmLifeTrigger decision for the damaged player.
story_boundary: >
  Own only life-trigger detection and decision creation for non-Banish Leader
  damage. Do not implement decision response handling, activated trigger
  resolution, no-zone resolution, new effect primitives, or hidden-info
  integration beyond the initial decision projection needed for this path.
