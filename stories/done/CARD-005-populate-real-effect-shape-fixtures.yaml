story_schema_version: 1.0.0
id: CARD-005
epic_id: CARD-005
title: Populate distinct real effect-shape fixtures
type: implementation
area: cards
primary_concern: verification
priority: high
status: done
summary: >
  Add a curated corpus of roughly 50 additional real Poneglyph card-detail
  fixtures whose printed effects are intentionally different from the currently
  implemented EB01-023 no-choice draw fixture, so upcoming effect stories have
  reviewed real payloads to map against without pretending unsupported
  gameplay is implemented.
story_boundary: >
  Own only real fixture population and fail-closed tests for distinct printed
  effect shapes. Do not add new effect primitives, custom handlers, gameplay
  support, full catalog sync, live-network CI, server/client integration, or
  engine runtime execution for unsupported cards.
