id: ENG-036A
epic_id: KICK-001
title: Split trigger queueing behavior tests
type: refactor
area: engine
primary_concern: verification
priority: medium
status: done
summary: >
  Move trigger queueing tests out of effect-runtime-trigger-queueing.test.ts
  into focused behavior suites without changing assertions, fixtures, expected
  queue entries, errors, events, or state hashes.
story_boundary: >
  Own only behavior-preserving test organization for existing trigger queueing
  coverage. Production runtime code may not change in this story.
allowed_touch_points:
  - packages/engine-core/src/effect-runtime-trigger-queueing.test.ts
  - packages/engine-core/src/effect-runtime-trigger-queueing-on-play.test.ts
  - packages/engine-core/src/effect-runtime-trigger-queueing-attack.test.ts
  - packages/engine-core/src/effect-runtime-trigger-queueing-source-presence.test.ts
  - packages/engine-core/src/effect-runtime-trigger-queueing-test-support.ts
  - stories/generated/ENG-036A-split-trigger-queueing-behavior-tests.yaml
  - stories/approved/ENG-036A-split-trigger-queueing-behavior-tests.yaml
  - agent-packets/ENG-036A.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s005
  - 03-game-state-events-decisions.s020
  - 04-effect-runtime.s006
  - 04-effect-runtime.s007
  - 04-effect-runtime.s008
  - 04-effect-runtime.s009
  - 04-effect-runtime.s016
  - 06-visibility-security.s006
  - 11-testing-quality.s007
  - 11-testing-quality.s008
  - 23-repo-tooling-and-enforcement.s016
scope:
  - move existing On Play queueing, deterministic payload, no-match, and event cardPlayed ignore tests into an On Play focused suite
  - move existing When Attacking and On Your Opponent's Attack queueing and stale-zone tests into an attack focused suite
  - move existing source-presence, unsupported metadata, unsupported shape, and source snapshot tests into focused source-presence/fail-closed coverage
  - extract shared test builders only into effect-runtime-trigger-queueing-test-support.ts when assertions remain unchanged
non_scope:
  - changing effect-runtime-trigger-queueing.ts
  - changing trigger queueing behavior, source-presence behavior, queue entry shape, lifecycle events, state hashes, or visibility
  - changing queue processing behavior
  - changing production engine, server, client, replay, or CLI code
dependencies: []
acceptance_criteria:
  - focused trigger queueing suites cover the same scenarios and expected outcomes as the original test file
  - effect-runtime-trigger-queueing.test.ts is removed or reduced to a justified minimal compatibility shim
  - helper extraction remains test-local and behavior-preserving
  - focused trigger queueing tests, coverage, and full verify pass
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/effect-runtime-trigger-queueing-on-play.test.ts packages/engine-core/src/effect-runtime-trigger-queueing-attack.test.ts packages/engine-core/src/effect-runtime-trigger-queueing-source-presence.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-036A packet while implementing this story
  - target the ENG-036 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - this is a behavior-preserving test organization story; if production changes appear necessary, stop and split or record an ambiguity
ambiguity_policy: fail_and_escalate
