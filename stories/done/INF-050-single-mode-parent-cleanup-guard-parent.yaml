spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-050
epic_id: INF-027
title: Guard single-mode cleanup from parent story drift
type: tooling
area: infra
primary_concern: tooling
priority: high
status: done
summary: >
  Coordinate the cleanup-tooling repair required after PR #351 cleanup completed
  the child story but left its non-packetized parent story approved because the
  PR used single-mode cleanup metadata while also changing parent-story scope.
story_boundary: >
  This parent is not directly implementable. It coordinates one cleanup-tooling
  child story that fails closed when single-mode post-merge cleanup is requested
  for a PR that also changed an approved parent story, and closes the stale
  ENG-053 parent story left behind by the same workflow gap.
allowed_touch_points:
  - stories/generated/INF-050*.yaml
  - stories/approved/INF-050*.yaml
spec_refs:
  - 24-story-schema.s004
  - 24-story-schema.s016
  - 24-story-schema.s025
  - 27-spec-driven-story-generation-workflow.s002
  - 27-spec-driven-story-generation-workflow.s008
  - 27-spec-driven-story-generation-workflow.s009
  - 27-spec-driven-story-generation-workflow.s012
  - 27-spec-driven-story-generation-workflow.s017
  - 32-codex-agent-integration.s013
scope:
  - coordinate one executable cleanup-tooling child story
  - require cleanup handoff validation to reject single-mode metadata when the reviewed PR changed an approved parent story outside the listed cleanup story
  - require post-merge cleanup planning to fail closed for the same single-mode parent-story mismatch if pre-merge validation did not stop it
  - preserve parent-mode cleanup with exactly one child story as the valid path for parent/substory work
  - close the stale ENG-053 parent story left in approved after PR #351 child cleanup
non_scope:
  - direct implementation from this parent story
  - packetizing or activating this parent story as an active implementation story
  - changing cleanup metadata syntax
  - changing human review, AI review, cleanup metadata guard, merge authority, or branch deletion authority
  - changing story schema fields beyond this story set
  - changing gameplay, engine, cards, server, client, replay, database, security, or UI behavior
dependencies:
  - INF-048
child_stories:
  - id: INF-050A
    title: Reject single-mode cleanup when parent stories changed
    concern: Add fail-closed cleanup validation and focused contract coverage so single-mode cleanup cannot leave changed approved parent stories stale, while preserving one-child parent-mode cleanup and closing the known ENG-053 stale parent.
    depends_on: []
acceptance_criteria:
  - INF-050A is the only executable child for this parent
  - single-mode cleanup handoff validation rejects reviewed PR evidence that includes a changed approved parent story outside the listed cleanup story path
  - post-merge cleanup planning fails closed for the same evidence shape
  - parent-mode cleanup with exactly one child remains valid and still binds the non-packetized parent story
  - the stale ENG-053 parent story is moved to done with done status
  - story validation passes with no approved parent story whose declared children are all done
required_tests:
  - story-review for the INF-050 parent story set
  - story-specific tests from INF-050A
  - full `corepack pnpm run verify` on the child PR if feasible
repo_rules:
  - do not implement INF-050 directly
  - use the parent/substory workflow even though this parent has one child
  - keep one active child packet at a time
  - use TDD and verify the single-mode parent-story cleanup regression fails before changing cleanup validator code
ambiguity_policy: fail_and_escalate
