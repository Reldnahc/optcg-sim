id: ENG-032F
epic_id: KICK-001
title: Split Character K.O. tests
type: refactor
area: engine
primary_concern: verification
priority: medium
status: done
summary: >
  Move existing Character K.O. and On K.O. battle tests out of
  battle-damage-banish.test.ts into a focused Character K.O. test file without
  changing assertions, fixtures, events, state hashes, or behavior.
story_boundary: >
  Own only behavior-preserving test-file organization for battle Character K.O.,
  attached DON!! return, reindexing, and On K.O. runtime coverage currently in
  battle-damage-banish.test.ts.
allowed_touch_points:
  - packages/engine-core/src/battle-damage-banish.test.ts
  - packages/engine-core/src/battle-damage-character-ko.test.ts
  - stories/generated/ENG-032F-split-character-ko-tests.yaml
  - stories/approved/ENG-032F-split-character-ko-tests.yaml
  - agent-packets/ENG-032F.md
  - agent-packets/active.json
spec_refs:
  - 02-engine-mechanics.s006
  - 02-engine-mechanics.s021
  - 02-engine-mechanics.s041
  - 04-effect-runtime.s007
  - 04-effect-runtime.s008
  - 04-effect-runtime.s009
  - 04-effect-runtime.s011
  - 06-visibility-security.s007
  - 11-testing-quality.s007
  - 11-testing-quality.s008
  - 23-repo-tooling-and-enforcement.s006
  - 23-repo-tooling-and-enforcement.s016
scope:
  - move equal-or-greater power Character K.O. and attached DON!! return coverage from battle-damage-banish.test.ts
  - move Banish attacker against rested Character normal K.O. coverage from battle-damage-banish.test.ts
  - move surviving defender Character reindexing coverage from battle-damage-banish.test.ts
  - move lower-power Character combat no-K.O. and no-Life-movement boundary coverage from battle-damage-banish.test.ts
  - move reviewed supported On K.O. metadata and invalid non-K.O. runtime metadata fail-closed coverage from battle-damage-banish.test.ts
  - preserve event ordering, state hash, zone reindexing, and mutation expectations
non_scope:
  - changing production code
  - changing Character K.O., attached DON!! return, On K.O., or runtime behavior
  - moving vanilla damage, Banish Leader damage, Life Trigger, Blocker, Counter, attack timing, or pipeline regression tests
dependencies:
  - ENG-032E
acceptance_criteria:
  - battle-damage-banish.test.ts no longer contains the moved Character K.O. test groups
  - battle-damage-character-ko.test.ts covers the same Character K.O. scenarios with behavior-equivalent expectations
  - no production files change
  - focused tests, coverage, and full verify pass
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/battle-damage-banish.test.ts packages/engine-core/src/battle-damage-banish-only.test.ts packages/engine-core/src/battle-damage-character-ko.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-032F packet while implementing this story
  - target the ENG-032 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - this is a behavior-preserving test organization story; if a production change appears necessary, stop and split or record an ambiguity
ambiguity_policy: fail_and_escalate
