spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-033
epic_id: INF-027
title: Close parent story during parent cleanup
type: tooling
area: infra
primary_concern: tooling
priority: high
status: done
summary: >
  Make post-merge parent cleanup close the reviewed non-packetized parent story
  after completing its packetized child stories so cleanup verification does not
  fail on a stale approved parent.
story_boundary: >
  Own only parent-mode post-merge lifecycle cleanup for non-packetized parent
  stories by making bound parent closeout exact packet-completion command output
  for parent cleanup. Do not change single-story cleanup, branch deletion policy,
  cleanup metadata authority, story schema semantics, or feature implementation
  behavior.
allowed_touch_points:
  - AGENTS.md
  - .github/branch-protection.md
  - .github/pull_request_template.md
  - tools/build-agent-packet.ts
  - tools/agent-packet-lifecycle.ts
  - tools/post-merge-cleanup.ts
  - tools/post-merge-cleanup/**
  - tests/contracts/post-merge-cleanup-*.test.mjs
  - tests/fixtures/post-merge-cleanup/**
  - docs/workflow/story-execution.md
  - docs/workflow/parent-integration-branches.md
  - stories/generated/INF-033-*.yaml
  - stories/approved/INF-033-*.yaml
  - agent-packets/INF-033.md
  - agent-packets/active.json
spec_refs:
  - 23-repo-tooling-and-enforcement.s016
  - 24-story-schema.s004
  - 24-story-schema.s014
  - 24-story-schema.s025
  - 27-spec-driven-story-generation-workflow.s015
  - 32-codex-agent-integration.s008
  - 32-codex-agent-integration.s013
  - 32-codex-agent-integration.s014
scope:
  - bind parent-mode cleanup to exactly one approved parent story changed by the merged parent PR
  - require the bound parent story's child_stories IDs to exactly match the cleanup child story IDs
  - include parent story path and SHA evidence in the bound cleanup plan
  - extend the multi-story packet completion command with a guarded parent-story argument used only by parent-mode cleanup
  - make the multi-story packet completion command move only the bound non-packetized parent story from stories/approved/ to stories/done/ with status done after completing child packets
  - keep direct parent cleanup commits limited to exact packet-completion command output: child packet completion plus the command-owned bound parent story closeout
  - revalidate cleanup output so parent story closeout is allowed only when present in the bound cleanup plan and produced by the packet completion command
  - fail closed when no matching parent exists, multiple parents match, child IDs mismatch, the parent is already done, or parent evidence is stale
  - document that parent-mode cleanup direct commits are limited to the packet completion command output, not arbitrary post-packet manual mutations
non_scope:
  - changing how story schema validates parent stories
  - weakening the stale approved parent story validator
  - changing single-story packet completion behavior
  - allowing parent-story completion without the multi-story parent cleanup command path
  - changing branch deletion behavior
  - changing cleanup metadata source selection or human merge-gate evidence rules
  - adding packets for parent stories that are explicitly non-packetized
  - manual cleanup of CARD-001 or other already-merged stories
dependencies:
  - INF-027I
  - INF-031
  - INF-032
acceptance_criteria:
  - parent-mode cleanup can produce a verified packet-completion diff that completes child packets and closes the matching non-packetized parent story
  - cleanup planning fails closed when parent evidence is absent, ambiguous, stale, already done, or does not exactly match listed child stories
  - cleanup execution/finalization rejects any parent story closeout that is not present in the bound plan
  - stories:validate still rejects stale approved parents outside the validated cleanup path
  - existing single-story cleanup and parent child-packet cleanup tests continue to pass
required_tests:
  - contract test reproducing the CARD-001 failure shape: child stories complete and matching parent story is closed by exact packet-completion output
  - packet command contract test proving packets:complete-many rejects parent closeout unless supplied through the bound parent-mode cleanup evidence path
  - contract test for parent cleanup rejection when no changed approved parent story matches the child set
  - contract test for parent cleanup rejection when multiple changed approved parent stories match the child set
  - contract test for parent cleanup rejection when parent child_stories do not exactly match cleanup metadata stories
  - contract test for parent cleanup rejection when the matching parent is already done
  - contract test for parent cleanup rejection when parent path or SHA evidence is stale
  - executor/finalizer contract test proving parent story closeout is allowed only when bound in the plan
  - full corepack pnpm verify
repo_rules:
  - use TDD for the cleanup failure regression and fail-closed cases
  - keep cleanup metadata a reviewed request bound to PR evidence, merge state, trusted story files, packet evidence, and parent/substory evidence
  - do not weaken stories:validate; stale approved parent stories must remain invalid outside successful cleanup closeout
  - do not require parent stories to have packets
  - do not make parent closeout a standalone cleanup bypass; it must be exact packet-completion command output bound to reviewed parent-mode cleanup metadata and verified cleanup evidence
ambiguity_policy: fail_and_escalate
