spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-001
epic_id: KICK-001
title: Add root workspace bootstrap and strict TypeScript base config
type: tooling
area: infra
primary_concern: tooling
priority: critical
status: done
summary: >
  Establish the root workspace files, canonical task names, and shared strict TypeScript
  base config required for the rest of the tooling foundation.
story_boundary: >
  Own root workspace/bootstrap files and the shared TypeScript strictness contract only.
  Do not add lint rules, formatter config, test runner setup, hooks, or CI workflows.
allowed_touch_points:
  - package.json
  - pnpm-workspace.yaml
  - tsconfig.base.json
  - .editorconfig
  - .gitignore
  - .gitattributes
  - packages/*/package.json
  - packages/*/tsconfig.json
spec_refs:
  - 15-implementation-kickoff.s010 (Required repo tooling before feature expansion)
  - 22-v6-implementation-tightening.s018 (Repository tooling is now required)
  - 23-repo-tooling-and-enforcement.s003 (Canonical toolchain)
  - 23-repo-tooling-and-enforcement.s004 (Required root files)
  - 23-repo-tooling-and-enforcement.s005 (Workspace structure and task naming)
  - 23-repo-tooling-and-enforcement.s006 (TypeScript enforcement)
  - 23-repo-tooling-and-enforcement.s022 (Required implementation sequence for tooling)
scope:
  - add the root workspace bootstrap files required for a pnpm-based monorepo
  - define canonical root task names for lint, typecheck, test, coverage, and verify
  - add a shared strict TypeScript base config for future packages to extend
non_scope:
  - ESLint rule implementation
  - Prettier configuration
  - Vitest configuration
  - git hooks
  - CI workflow definitions
dependencies: []
acceptance_criteria:
  - required root workspace files exist for the chosen pnpm-based layout
  - root task names are defined consistently with the spec contract
  - tsconfig.base.json enables the required strict compiler options from the spec
  - future packages can extend the shared TypeScript base config without redefining strictness locally
required_tests:
  - config parse smoke test for package.json, pnpm-workspace.yaml, and tsconfig.base.json
  - typecheck smoke test for a minimal package extending tsconfig.base.json
  - root script invocation smoke test for lint, typecheck, test, coverage, and verify
repo_rules:
  - must follow the canonical pnpm and strict TypeScript baseline
  - must not weaken the required compiler options
  - must preserve package-boundary readiness for later enforcement stories
ambiguity_policy: implement_if_clearly_implied
