scope:
  - add or tighten tests proving M2-001 On Play draw queues and resolves through the supported action path
  - add regression tests proving unsupported effect types, choice-required queues, deferred triggers, Event effects, custom handlers, and replacement/continuous/battle timing effects remain fail-closed
  - construct non-fixture-authorable unsupported shapes as test-only in-memory objects rather than committed canonical effect DSL fixtures
  - add hash-stability coverage only if existing fixture conventions support it without schema changes
  - preserve all existing replay smoke hashes and do not add replay fixtures in this story
non_scope:
  - production code changes
  - new runtime primitives
  - CLI/server/client behavior
  - replay fixture or replay schema changes
  - approving additional runtime behavior beyond no-choice On Play draw
dependencies:
  - ENG-012F
acceptance_criteria:
  - no production files are changed
  - M2-001 has explicit regression coverage at the action/runtime boundary
  - unsupported runtime paths remain fail-closed with no partial mutation
  - state hash and event journal stability coverage exists for the supported vertical
required_tests:
  - regression test for On Play draw action/runtime event ordering and final state hash stability
  - regression test proving unresolved runtime work still gates ordinary legal actions
  - regression tests for unsupported Event/custom/choice/replacement/continuous/battle effect shapes, using committed fixtures only when the schema supports the fixture shape
  - existing replay smoke tests pass with unchanged hashes
  - "`corepack pnpm --filter @optcg/engine-core typecheck` must pass"
  - "`corepack pnpm run verify` must pass"
repo_rules:
  - keep this story test-only
  - if production behavior must change, stop and split or record the ambiguity
  - fail closed on replay or hidden-information ambiguity
ambiguity_policy: fail_and_escalate
