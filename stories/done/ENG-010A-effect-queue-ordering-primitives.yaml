spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-010A
epic_id: M1-001
title: Add pending effect queue validation and timing-window rank contract
type: implementation
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Add the first focused effect-queue helper surface: validate pending
  `EffectQueueEntry` inputs and require explicit caller-supplied timing-window
  rank data before any later grouping or ordering helper can operate.
story_boundary: >
  Own only pure validation and timing-window rank normalization for
  already-constructed pending effect queue entries. Stop before grouping,
  deterministic tie-break ordering, queue processing, trigger detection,
  source-presence checks, pending decisions, legal-action gating, or integration
  into phase, play-card, or battle paths.
allowed_touch_points:
  - packages/engine-core/src/effect-queue-ordering.ts
  - packages/engine-core/src/effect-queue-ordering.test.ts
spec_refs:
  - 02-engine-mechanics.s004 (Authority and official-rules defaults)
  - 04-effect-runtime.s006 (Effect queue entry)
  - 04-effect-runtime.s009 (Queue ordering)
  - 03-game-state-events-decisions.s020 (State hashing)
  - 03-game-state-events-decisions.s022 (Internal state sequencing)
  - 23-repo-tooling-and-enforcement.s006 (TypeScript enforcement)
  - 23-repo-tooling-and-enforcement.s008 (Boundary enforcement)
  - 15-implementation-kickoff.s012 (Guardrails)
scope:
  - create a pure `effect-queue-ordering.ts` module with named exports for validating existing pending `EffectQueueEntry` values and caller-supplied timing-window rank data
  - reject non-pending `EffectQueueEntry.state` values with a deterministic fail-closed validation result rather than ignoring them or including them in ordering
  - require callers to provide explicit timing-window rank data shaped as one `(timingWindowId, rank)` entry for every distinct queue `timingWindowId`
  - require ranks to be non-negative integer values, unique, contiguous from `0` to `windowCount - 1`, and free of missing, duplicate, extra, or conflicting timing-window ids
  - treat lower normalized rank as older timing-window authority for later stories, without sorting queue entries in this story
  - do not infer timing-window order from `timingWindowId` text or input array discovery order
  - normalize valid timing-window rank data into a deterministic internal rank map that later ENG-010E/ENG-010F helpers can consume
  - preserve the input queue array without mutation
  - keep helpers independent from `GameState` mutation, event creation, pending decision creation, rule processing, legal-action projection, and effect execution
non_scope:
  - creating effect queue entries
  - assigning timing window ids
  - deriving timing-window age from branded string ids
  - grouping entries by player bucket or `controllerId`
  - sorting no-choice entries with created event, source instance, or effect id tie-breakers
  - detecting triggers from events
  - processing or executing queued effects
  - creating pending decisions
  - integrating with phases, battle, play-card, actions, replay, CLI, server, client, database, Redis, WebSocket, React, live HTTP, or Poneglyph code
dependencies:
  - TYP-001F
acceptance_criteria:
  - non-pending queue entries return a deterministic fail-closed validation result and are not silently ignored or ordered
  - valid timing-window rank input contains exactly one rank entry for every distinct queue `timingWindowId` and no extra timing-window ids
  - valid ranks are non-negative integers, unique, and contiguous from `0` to `windowCount - 1`
  - missing timing-window order data returns a deterministic fail-closed result rather than falling back to timing-window id text, input array order, or JavaScript discovery order
  - duplicate timing-window ids, duplicate rank values, non-integer ranks, negative ranks, gaps, missing ranks, extra ranks, and conflicting rank entries return deterministic fail-closed results
  - valid inputs return deterministic normalized timing-window ranks for identical input across repeated runs, with lower rank representing an older timing window for later stories
  - input queues are not mutated
  - engine-core boundary remains pure and package entrypoints are unchanged
required_tests:
  - unit test proving non-pending queue entries return a deterministic fail-closed validation result
  - unit test covering valid caller-supplied timing-window rank normalization without sorting queue entries
  - unit test proving missing timing-window order data fails closed without using timing-window id text or input order
  - unit test proving duplicate timing-window ids, duplicate rank values, non-integer ranks, negative ranks, gaps, missing ranks, extra ranks, and conflicting rank entries fail closed deterministically
  - unit test proving valid timing-window rank normalization is deterministic
  - unit test proving input queue entries are not mutated or reordered in place
  - "`corepack pnpm --filter @optcg/engine-core typecheck` must pass"
  - "`corepack pnpm run verify` must pass"
repo_rules:
  - do not introduce `any`, routine non-null assertions, `@ts-ignore`, or `@ts-nocheck`
  - do not export helper APIs from package entrypoints unless an existing production caller needs them
  - keep engine-core deterministic and pure
ambiguity_policy: fail_and_escalate
