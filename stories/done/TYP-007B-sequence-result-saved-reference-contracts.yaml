spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: TYP-007B
epic_id: TYP-007
title: Sequence execution result and saved-reference contracts
type: implementation
area: contracts
primary_concern: contract
priority: high
status: done
summary: >
  Add canonical contracts for sequence segment result metadata and saved
  references that later runtime stories can use for "that Character" and
  similar composed effect text.
story_boundary: >
  Own only contracts, exported types, and contract tests for externally visible
  or runtime-needed sequence result metadata and saved reference shapes. Do not
  implement runtime frame behavior.
allowed_touch_points:
  - contracts/canonical-types.ts
  - contracts/types/effects.ts
  - contracts/types/runtime.ts
  - packages/types/src/effects.ts
  - packages/types/src/effects.test.ts
  - packages/types/src/export-cohesion.test.ts
  - packages/types/src/export-ownership.manifest.ts
  - packages/types/src/runtime.ts
  - packages/types/src/runtime.test.ts
  - packages/types/src/index.ts
  - tests/contracts/**
  - stories/generated/TYP-007*.yaml
  - stories/approved/TYP-007*.yaml
  - agent-packets/TYP-007B.md
  - agent-packets/active.json
spec_refs:
  - 04-effect-runtime.s010
  - 04-effect-runtime.s012
  - 05-effect-dsl-reference.s013
  - 05-effect-dsl-reference.s026
  - 05-effect-dsl-reference.s027
  - 22-v6-implementation-tightening.s007
scope:
  - define segment result metadata contract for attempted, succeeded, changedState, selectedCards, selectedTargets, paidCost, and playerDeclined
  - define saved selection/result reference shapes for later sequence steps that refer to the same object
  - add exported type and contract tests for saved references and segment result metadata
  - update export ownership/cohesion coverage for any new package exports
non_scope:
  - execution context implementation, frame stacks, pause/resume behavior, or event emission
  - card parser or generated-support behavior
  - replacement generalization
  - server, client, API, UI, replay, database, or gameplay behavior
dependencies: []
acceptance_criteria:
  - sequence result metadata and saved-reference contracts are canonical and exported
  - tests cover valid saved-reference and result-metadata shapes
  - tests prove malformed, unsupported, or ambiguous saved-reference and segment-result shapes reject
  - no runtime behavior is implemented
required_tests:
  - focused contract/type tests for sequence result metadata and saved-reference shapes
  - negative contract/type tests for malformed saved-reference and segment-result shapes
  - focused export ownership/cohesion tests if new package exports are added
  - run `corepack pnpm run types:sync:check`
  - run `corepack pnpm run test:contracts`
  - run `corepack pnpm run stories:validate`
repo_rules:
  - keep result metadata minimal and contract-driven
  - do not expose hidden card identity through public DTOs
  - fail closed on visibility or replay ambiguity
ambiguity_policy: fail_and_escalate
