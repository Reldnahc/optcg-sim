id: ENG-020
epic_id: KICK-001
title: Verify Counter integration battle pipeline regression coverage
type: verification
area: engine
primary_concern: verification
priority: high
status: done
summary: >
  Add focused integration regression coverage proving the landed Counter Step
  rules compose with the supported battle pipeline, existing Blocker, Banish,
  Rush legality, PlayerView hidden-info filtering, event sequencing, and
  deterministic state hashing.
story_boundary: >
  Own only engine-core regression coverage and minimal test fixture helpers for
  already-supported battle behavior. Do not add Counter behavior, legal actions,
  effect primitives, gameplay keywords, server/client/UI behavior, or replay
  schema behavior. If this coverage exposes a missing rule implementation rather
  than a regression gap, stop and split or record the blocker.
