scope:
  - add engine-core integration regression tests for supported battle paths that exercise the existing attack, Block Step, Counter Step, Damage Step, and End of Battle pipeline
  - prove a vanilla attack with no Blocker and no legal Counter actions still reaches Damage Step through the current battle pipeline
  - prove Blocker activation followed by supported Character Counter composes through Damage Step using the landed Blocker and Counter behavior
  - prove explicit Counter pass reaches Damage Step when the current battle participants remain legal
  - prove supported Character Counter temporary battle power can change the current battle outcome
  - prove Banish still only changes Leader life destination from normal hand/trigger flow to trash, without changing Character battle or unrelated battle behavior
  - prove Rush and Rush: Character attack legality remains unchanged by the Counter integration coverage
  - prove production PlayerView filtering does not leak opponent counter-card hand contents while preserving recipient-visible legal counter actions
  - assert event sequencing, appended eventJournal ordering, invariant checks, and state hash stability for the covered accepted battle scripts
  - keep assertions tied to existing landed behavior; do not add behavior to make a scenario pass
non_scope:
  - new Counter behavior, new legal actions, or Counter Event resolution
  - Life Triggers
  - When Attacking, On Opponent Attack, On Block, On K.O., End of Battle, replacement, protection, restriction, or once-per-turn behavior
  - new effect-runtime DSL primitives, target selection, triggers, replacements, or custom handlers
  - replay schema, rollback, recovery, replay viewer, persisted replay storage, or production replay fixtures
  - match server, browser client, spectator mode, UI, database, deck validation, or CLI behavior
dependencies:
  - ENG-014E
  - ENG-015
  - ENG-016
  - ENG-018
  - ENG-019C
acceptance_criteria:
  - a focused engine-core regression test covers vanilla attack to Damage Step with no Blocker and no legal Counter actions
  - a focused engine-core regression test covers Blocker activation followed by supported Character Counter and then Damage Step using existing landed behavior
  - a focused engine-core regression test covers Counter pass progressing to Damage Step
  - a focused engine-core regression test proves Character Counter can change the battle outcome using the supported temporary battle-power behavior
  - Banish regression coverage proves Leader life moves to trash instead of hand while unrelated battle outcomes remain unchanged
  - Rush and Rush: Character legality coverage proves the supported attack legality rules remain unchanged
  - PlayerView regression coverage proves opponent counter-card hand identities are absent from the wrong player view and recipient legal counter actions do not leak hidden opponent hand contents
  - covered accepted scripts assert strictly increasing EngineResult event seq values, unique event IDs per result, appended eventJournal suffix equality, full eventJournal ordering, invariant validity, and repeated-script state hash stability
  - no production engine, CLI, server, client, replay, database, or schema files are changed; if coverage exposes a real behavior gap, stop and split or record the blocker
required_tests:
  - add packages/engine-core/src/battle-pipeline-regression.test.ts
  - update only package-local battle/action test fixtures if needed to build supported landed battle states
  - run corepack pnpm exec vitest run packages/engine-core/src/battle-pipeline-regression.test.ts packages/engine-core/src/filter-state-for-player.real-states.test.ts
  - run corepack pnpm run test -- packages/engine-core/src
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - if story-review says this is too broad or implements new behavior rather than verification, stop and split or report the blocker
  - generate and activate the packet before worker handoff
  - run corepack pnpm run packets:verify before implementation and review handoff
  - keep this story test-only except for package-local test fixture helpers
  - use an implementation worker subagent after packet activation when subagents are available
  - stay within allowed_touch_points
  - open or prepare a PR before the implementation-review gate
  - run separate implementation-review gate after the PR is opened
  - fail closed on gameplay-rule, hidden-information, replay, and security-sensitive ambiguity
ambiguity_policy: fail_and_escalate
