spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-003
epic_id: KICK-001
title: Add ESLint quality and package-boundary enforcement
type: tooling
area: infra
primary_concern: tooling
priority: critical
status: done
summary: >
  Add type-aware ESLint rules and import restrictions so the repo can mechanically reject
  quality regressions and cross-layer boundary violations.
story_boundary: >
  Own ESLint configuration, quality rules, and package-boundary restrictions only. Do not
  add test runner behavior, hook orchestration, or CI workflows except local lint command wiring.
allowed_touch_points:
  - eslint.config.js
  - eslint.config.mjs
  - .eslintignore
  - package.json
  - packages/*/package.json
  - packages/*/eslint.config.*
  - tests/fixtures/eslint/**
spec_refs:
  - 15-implementation-kickoff.s012 (Guardrails)
  - 23-repo-tooling-and-enforcement.s007 (ESLint enforcement)
  - 23-repo-tooling-and-enforcement.s008 (Boundary enforcement)
  - 23-repo-tooling-and-enforcement.s022 (Required implementation sequence for tooling)
  - 23-repo-tooling-and-enforcement.s023 (Definition of done for repo tooling)
scope:
  - add root ESLint configuration with type-aware quality rules required by the spec
  - add restricted import rules for engine, view, client, server, and replay boundaries
  - enforce strict escape-hatch policy for unsafe TypeScript shortcuts where lint can detect them
  - block focused tests, floating promises, misused promises, and other listed quality failures
non_scope:
  - Prettier configuration
  - Vitest configuration
  - git hook setup
  - CI job setup
dependencies:
  - INF-001
acceptance_criteria:
  - root lint command fails on the required quality-rule violations named in the spec
  - prohibited cross-layer imports can be demonstrated as lint failures through fixture coverage or equivalent rule tests
  - explicit `any`, non-null assertions, `@ts-ignore`, and `@ts-nocheck` are lint-restricted or otherwise mechanically flagged according to the repo's strictness policy
  - default exports and ad hoc production `console` usage are either forbidden or explicitly governed by the repo lint contract
  - focused tests and disallowed console usage in production packages are mechanically rejected
required_tests:
  - lint smoke test for no-floating-promises and no-misused-promises enforcement
  - import-boundary fixture test showing engine/client/server restrictions fail as expected
  - lint fixture coverage for explicit `any`, non-null assertion, and `@ts-ignore` rejection or warning behavior
  - focused-test rejection smoke test for committed only-tests
repo_rules:
  - boundary enforcement must match the architecture guardrails in the spec
  - linting must run locally and later in CI without a weaker fallback path
  - strict TypeScript escape hatches should be blocked mechanically wherever ESLint can enforce them
  - hidden-state helper imports into client bundles must be rejectable mechanically
ambiguity_policy: fail_and_escalate
