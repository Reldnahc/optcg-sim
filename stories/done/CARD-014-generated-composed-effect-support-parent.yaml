summary: >
  Coordinate the cards/parser/generated-support layer for reusable composed
  effect support that consumes completed TYP contract/schema authority and
  ENG-055 runtime capability evidence without adding engine runtime behavior.
story_boundary: >
  Parent planning story only. Do not implement this parent directly. Implement
  CARD-014A through CARD-014I one active child at a time on a parent integration
  branch. Keep this series above the ENG runtime layer: parser, generated DSL,
  runtime capability evidence, support metadata, source integrity, reports, and
  cards-package tests only.
