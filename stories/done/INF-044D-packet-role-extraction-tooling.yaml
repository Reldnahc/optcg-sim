spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-044D
epic_id: INF-044
title: Add deterministic role packet extraction
type: tooling
area: infra
primary_concern: tooling
priority: high
status: done
summary: >
  Add a packet extraction command that emits role-scoped Markdown and JSON for
  post-approval agent handoffs without manual packet trimming.
story_boundary: >
  Own only packet extraction tooling, package scripts, and packet extraction
  tests. Do not change role policy docs beyond command references, packet
  completion lifecycle, cleanup automation, or application behavior.
allowed_touch_points:
  - package.json
  - tools/agent-packet-renderer.ts
  - tools/agent-packet-parser.ts
  - tools/build-agent-packet.ts
  - tests/contracts/agent-packet-contract.test.mjs
  - tests/contracts/agent-packet-rendering-contract.test.mjs
  - tests/contracts/agent-packet-parser-contract.test.mjs
  - tests/contracts/agent-packet-verification-contract.test.mjs
  - tests/contracts/agent-packet-extraction-contract.test.mjs
  - stories/generated/INF-044D-packet-role-extraction-tooling.yaml
spec_refs:
  - 23-repo-tooling-and-enforcement.s010
  - 23-repo-tooling-and-enforcement.s016
  - 23-repo-tooling-and-enforcement.s023
  - 27-spec-driven-story-generation-workflow.s006
  - 27-spec-driven-story-generation-workflow.s008
  - 27-spec-driven-story-generation-workflow.s015
  - 32-codex-agent-integration.s008
  - 32-codex-agent-integration.s013
scope:
  - add deterministic extraction for active packet role sections
  - support roles story-orchestrator, implementation, code-review, and pr-gate
  - support Markdown output for direct agent prompts
  - support JSON output for tooling and tests
  - make extraction fail when the active packet is missing, stale, or lacks the requested role section
  - make extraction fail for pre-approval roles story-author and story-review
  - add package script for role extraction
non_scope:
  - drafting story-author prompt tooling
  - story-review prompt tooling before approval
  - changing packet generation activation semantics
  - changing review or cleanup workflow docs beyond command reference
dependencies:
  - INF-044C
acceptance_criteria:
  - "`packets:extract` or equivalent script emits Markdown for each supported post-approval role"
  - "`packets:extract` or equivalent script emits JSON for each supported post-approval role"
  - JSON and Markdown outputs contain the same role identity, story identity, shared authority summary, responsibilities, forbidden actions, and required outputs
  - extraction fails for unsupported roles and missing role sections
  - extraction fails when no active packet exists unless an explicit story or packet path is supported by the implemented command
required_tests:
  - packet extraction test for implementation Markdown output
  - packet extraction test for implementation JSON output
  - packet extraction test for story-orchestrator Markdown and JSON output
  - packet extraction test for code-review Markdown and JSON output
  - packet extraction test for pr-gate Markdown and JSON output
  - packet extraction test rejecting story-author and story-review roles
  - packet extraction test rejecting stale or missing active packet state
  - run targeted packet extraction tests
  - run `corepack pnpm run packets:verify`
repo_rules:
  - do not make orchestrators manually trim packet content as part of the command
  - keep extraction deterministic and testable
ambiguity_policy: fail_and_escalate
