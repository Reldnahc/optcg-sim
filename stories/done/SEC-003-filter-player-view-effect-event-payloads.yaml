spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: SEC-003
epic_id: KICK-001
title: Filter PlayerView effect event payloads
type: implementation
area: security
primary_concern: visibility
priority: critical
status: done
summary: >
  Repair the production PlayerView event projection so public or recipient
  visible engine events do not expose effect queue internals such as queue entry
  identifiers through payloads or causality.
story_boundary: >
  Own only the player-facing event projection in filterStateForPlayer and
  regression coverage for queue-internal event payload leakage. Do not change
  authoritative EngineEvent schema, replay/full-state event journals, effect
  queue behavior, legal-action generation, spectator views, or client/server
  protocol.
allowed_touch_points:
  - packages/engine-core/src/filter-state-for-player.ts
  - packages/engine-core/src/filter-state-for-player.test.ts
  - packages/engine-core/src/filter-state-for-player.real-states.test.ts
  - tests/hidden-info/hidden-info-lane-smoke.test.mjs
  - stories/approved/SEC-003-filter-player-view-effect-event-payloads.yaml
  - agent-packets/SEC-003.md
  - agent-packets/active.json
spec_refs:
  - 00-project-overview.s011 (Hidden information is a security boundary)
  - 00-project-overview.s016 (Launch blockers)
  - 03-game-state-events-decisions.s002 (Canonical state model)
  - 03-game-state-events-decisions.s006 (Event visibility)
  - 04-effect-runtime.s006 (Effect queue entry)
  - 06-visibility-security.s002 (Security principle)
  - 06-visibility-security.s004 (PlayerView shape)
  - 06-visibility-security.s006 (Effect event visibility)
  - 11-testing-quality.s008 (Invariant tests)
  - 11-testing-quality.s011 (Hidden-information tests)
scope:
  - add failing coverage showing a PlayerView event projection strips effect queue internals from otherwise visible events
  - sanitize player-facing event payloads for effect queue lifecycle events so queueEntryId and other queue-internal identifiers are absent from PlayerView
  - sanitize player-facing event causedBy data when it references internal effect queue entries
  - 'use this exact PlayerView event projection for effectQueued: keep id, seq, type, actor, source, affected, visibility, and createdAtStateSeq; set payload to { status: "queued" }; omit causedBy if it is effect-queue causality'
  - 'use this exact PlayerView event projection for effectResolved: keep id, seq, type, actor, source, affected, visibility, and createdAtStateSeq; set payload to { status: "resolved" }; omit causedBy if it is effect-queue causality'
  - "preserve non-effect causedBy values only when they do not contain queue internals; do not expose causedBy.queueEntryId in PlayerView"
  - preserve public event identity, sequence, event type, visibility, createdAtStateSeq, actor/source/affected fields when already safe for the recipient
  - prove non-public events remain filtered by recipient visibility
  - prove the authoritative GameState.eventJournal and EngineResult events are not mutated or rewritten by filtering
  - add or update hidden-info regression coverage so queue internals cannot leak through serialized PlayerView events
acceptance_criteria:
  - filterStateForPlayer does not expose queueEntryId, triggerIds, sourceSnapshot, orderedIds, or internal queue entry values through view.events
  - 'effectQueued events remain visible as public lifecycle markers when their event visibility allows it, with payload exactly { status: "queued" }'
  - 'effectResolved events remain visible as public lifecycle markers when their event visibility allows it, with payload exactly { status: "resolved" }'
  - causedBy values in PlayerView events do not expose queue entry identifiers and effect-queue causedBy is omitted from the PlayerView projection
  - private events remain visible only to the recipient after sanitization; hidden, replayOnly, and serverOnly events remain absent
  - filtering does not mutate the authoritative GameState.eventJournal
  - existing PlayerView zone, decision, legal-action, and reveal filtering behavior is unchanged
  - no effect runtime, replay schema, spectator, server/client protocol, or gameplay behavior changes are introduced
non_scope:
  - changing EngineEvent or canonical GameState contracts
  - changing authoritative eventJournal contents or EngineResult.events
  - changing effect queue ordering, queue processing, or lifecycle event emission
  - changing legal-action generation
  - changing pending decision semantics
  - changing spectator views or replay views
  - server/client protocol, browser client, or UI
  - adding new gameplay, trigger categories, target selection, replacement effects, or optional effects
dependencies:
  - SEC-002
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/filter-state-for-player.test.ts packages/engine-core/src/filter-state-for-player.real-states.test.ts
  - run corepack pnpm exec vitest run tests/hidden-info
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - if story-review says this overlaps existing landed work, lacks authority, or is broader than one visibility repair, split it or stop before implementation
  - generate and activate only the SEC-003 packet while implementing this story
  - run corepack pnpm run packets:verify before implementation and review handoff
  - stay within allowed_touch_points
  - use a worker subagent for implementation after packet activation when subagents are available
  - open or prepare a PR before the implementation reviewer-subagent gate
  - fail closed on hidden-information, replay, protocol, or security-sensitive ambiguity
ambiguity_policy: fail_and_escalate
