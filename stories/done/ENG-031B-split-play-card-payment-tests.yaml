spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-031B
epic_id: KICK-001
title: Split play-card payment tests
type: refactor
area: engine
primary_concern: verification
priority: medium
status: done
summary: >
  Move existing generic play-card payment decision and payment response
  validation tests out of play-card.test.ts into a focused payment test file
  without changing assertions, fixtures, errors, events, state hashes, or
  behavior.
story_boundary: >
  Own only behavior-preserving test-file organization for payCost decision,
  payment response, and zero/nonzero Character or Stage payment coverage that
  is not specific to Stage replacement, Character overflow, Event play, or On
  Play runtime.
allowed_touch_points:
  - packages/engine-core/src/play-card.test.ts
  - packages/engine-core/src/play-card-payment.test.ts
  - packages/engine-core/src/play-card-legality.test.ts
  - stories/generated/ENG-031B-split-play-card-payment-tests.yaml
  - stories/approved/ENG-031B-split-play-card-payment-tests.yaml
  - agent-packets/ENG-031B.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s015
  - 03-game-state-events-decisions.s017
  - 04-effect-runtime.s011
  - 06-visibility-security.s007
  - 11-testing-quality.s007
  - 11-testing-quality.s008
  - 23-repo-tooling-and-enforcement.s006
  - 23-repo-tooling-and-enforcement.s016
scope:
  - move nonzero playCard payCost decision creation and legal decision response visibility tests into play-card-payment.test.ts
  - move valid nonzero Character and Stage payment resolution tests into play-card-payment.test.ts
  - move zero-cost Character and Stage direct play tests into play-card-payment.test.ts
  - move generic DON!! payment response rejection coverage into play-card-payment.test.ts
  - preserve existing payment event ordering, visibility, state hash, and mutation assertions
non_scope:
  - changing production code
  - moving Stage replacement-specific coverage
  - moving Character overflow-specific coverage
  - moving Event play-specific coverage
  - moving On Play runtime-specific coverage
  - changing payment semantics or decision response shapes
dependencies:
  - ENG-031A
acceptance_criteria:
  - play-card-payment.test.ts owns generic payment and zero/nonzero Character or Stage play coverage
  - moved tests preserve the same scenarios and expected outcomes
  - no production files change
  - focused tests, coverage, and full verify pass
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/play-card.test.ts packages/engine-core/src/play-card-legality.test.ts packages/engine-core/src/play-card-payment.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-031B packet while implementing this story
  - target the ENG-031 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - this is a behavior-preserving test organization story; if a production change appears necessary, stop and split or record an ambiguity
ambiguity_policy: fail_and_escalate
