spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-028B
epic_id: KICK-001
title: Resolve life trigger decline to hand
type: implementation
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Validate addToHand life-trigger responses and complete the hidden
  life-to-hand path for declined Trigger cards.
story_boundary: >
  Own only the decline response for an existing confirmLifeTrigger decision.
  Do not implement activated Trigger reveal, no-zone handling, effect
  resolution, or trash-after-resolution behavior.
allowed_touch_points:
  - packages/engine-core/src/life-trigger-actions.ts
  - packages/engine-core/src/life-trigger-actions.test.ts
  - packages/engine-core/src/actions.ts
  - packages/engine-core/src/actions.test.ts
  - packages/engine-core/src/battle-damage-banish.test.ts
  - packages/engine-core/src/filter-state-for-player.ts
  - packages/engine-core/src/filter-state-for-player.test.ts
  - stories/approved/ENG-028B-resolve-life-trigger-decline-to-hand.yaml
  - agent-packets/ENG-028B.md
  - agent-packets/active.json
spec_refs:
  - 02-engine-mechanics.s023
  - 03-game-state-events-decisions.s014
  - 03-game-state-events-decisions.s016
  - 03-game-state-events-decisions.s017
  - 03-game-state-events-decisions.s018
  - 03-game-state-events-decisions.s020
  - 06-visibility-security.s004
  - 06-visibility-security.s005
  - 06-visibility-security.s007
  - 11-testing-quality.s011
scope:
  - accept respondToDecision lifeTrigger addToHand only from the pending decision player and matching decision id
  - move the taken Life card to the damaged player's hand without public reveal
  - clear the pending decision, emit deterministic decisionResolved and hidden/private card movement events according to current event policy, and continue through supported battle cleanup
  - reject wrong-player, wrong response type, stale decision, and missing-card responses without mutation
  - keep declined Trigger identity hidden from the opponent in events, legal actions, and PlayerView
non_scope:
  - activateTrigger response handling
  - public reveal records for activated Triggers
  - no-zone representation
  - effect queueing or effect resolution
  - trash-after-resolution
  - Banish changes
  - Double Attack or multiple damage handling
  - replacement effects
  - complex Trigger effects
  - search, look, or reveal primitives
  - target selection
  - server/client/UI
dependencies:
  - ENG-028A
acceptance_criteria:
  - addToHand response from the damaged player moves the Trigger card from Life to that player's hand and clears pendingDecision
  - declined Trigger cards are never publicly revealed before they enter hand
  - battle cleanup continues through the currently supported ordinary-damage path after the decline response
  - wrong-player, stale, malformed, or unsupported responses fail closed without mutation
  - event sequencing and state hash output are stable for identical decline inputs
  - opponent PlayerView and legal actions do not expose the declined card identity or Trigger metadata
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/life-trigger-actions.test.ts packages/engine-core/src/actions.test.ts packages/engine-core/src/battle-damage-banish.test.ts packages/engine-core/src/filter-state-for-player.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-028B packet while implementing this story
  - run corepack pnpm run packets:verify before implementation and review handoff
  - stay within allowed_touch_points
  - target the ENG-028 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - if decline handling requires activated Trigger or effect resolution work, stop and split or record the blocker
ambiguity_policy: fail_and_escalate
