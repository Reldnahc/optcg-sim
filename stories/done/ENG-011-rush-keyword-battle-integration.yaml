scope:
  - prove `getDeclareAttackLegalActions` exposes legal attacks for a Character played this turn when its manifest metadata has printed `rush`
  - prove a played-this-turn `rush` Character can legally attack the opponent Leader through the battle action surface
  - prove a played-this-turn `rush` Character can legally attack a rested opposing Character through the battle action surface
  - prove `getDeclareAttackLegalActions` exposes only Character targets, not Leader targets, for a Character played this turn when its manifest metadata has printed `rushCharacter`
  - prove a played-this-turn `rushCharacter` Character can legally attack a rested opposing Character through the battle action surface
  - preserve the existing restriction that a non-Rush Character played this turn cannot attack
  - preserve fail-closed behavior for unsupported printed combat keywords, including `blocker`, `doubleAttack`, `banish`, and `unblockable`
  - keep battle resolution on the existing vanilla declare-attack path with current event sequencing, mutation behavior, invariant checks, and state hashing
non_scope:
  - implementing Blocker, Block Step decisions, blocker activation actions, blocker target redirection, or unblockable blocker skipping
  - implementing Counter Step decisions, Counter events, temporary battle power modifiers, or counter-card legality
  - implementing Double Attack, Banish, trigger-from-life, replacement effects, automatic effects, activated effects, continuous effects, or keyword-grant/removal effects
  - changing attack target rules for Characters that were not played this turn
  - changing turn structure, phase progression, pending decision semantics, event id format, event visibility, state sequence increments, replay schema, package exports, CLI grammar, terminal UX, server protocol, browser UI, database, Redis, WebSocket, React, or live HTTP behavior
