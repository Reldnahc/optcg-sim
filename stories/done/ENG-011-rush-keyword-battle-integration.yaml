story_schema_version: 1.0.0
id: ENG-011
epic_id: M1-001
title: Harden Rush keyword battle integration
type: implementation
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Promote Rush and Rush: Character from computed-view keyword support into
  explicit battle action coverage, proving legal-action exposure and attack
  application agree for played-this-turn Characters without adding new battle
  timing windows.
story_boundary: >
  Own only Rush and Rush: Character attack legality through the existing
  engine-core battle action surface. Stop before implementing Blocker, Counter,
  Double Attack, Banish, Unblockable, trigger/effect behavior, replacement
  behavior, continuous keyword grant/removal, replay schema changes, CLI
  behavior, server behavior, or client behavior.
allowed_touch_points:
  - packages/engine-core/src/compute-view.ts
  - packages/engine-core/src/compute-view.test.ts
  - packages/engine-core/src/battle-actions.ts
  - packages/engine-core/src/battle-actions.test.ts
