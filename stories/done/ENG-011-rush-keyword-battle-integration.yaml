acceptance_criteria:
  - a played-this-turn Character with printed `rush` can appear in legal declare-attack actions against the opponent Leader and rested opposing Characters
  - applying the legal `rush` attacks through `applyDeclareAttack` succeeds and follows the current vanilla battle resolution path
  - a played-this-turn Character with printed `rushCharacter` can appear in legal declare-attack actions against rested opposing Characters but not against the opponent Leader
  - applying the legal `rushCharacter` attack through `applyDeclareAttack` succeeds and follows the current vanilla battle resolution path
  - non-Rush played-this-turn Characters remain unable to attack through both computed view and battle action application
  - unsupported combat keywords remain fail-closed and do not accidentally enable attacks, blocker behavior, damage replacement, extra damage, or trigger handling
  - no new public engine-core exports, replay fixture format changes, CLI behavior, server behavior, or client behavior are introduced
required_tests:
  - unit tests in `packages/engine-core/src/battle-actions.test.ts` covering legal-action exposure and accepted `applyDeclareAttack` behavior for played-this-turn `rush` attacks into Leader and rested Character targets
  - unit tests in `packages/engine-core/src/battle-actions.test.ts` covering legal-action exposure and accepted `applyDeclareAttack` behavior for played-this-turn `rushCharacter` attacks into rested Character targets
  - unit tests proving played-this-turn `rushCharacter` Characters cannot target Leaders through legal actions or attack application
  - existing `packages/engine-core/src/compute-view.test.ts` Rush, Rush: Character, non-Rush played-this-turn, and unsupported-keyword fail-closed coverage must pass without weakening assertions
  - "`corepack pnpm exec vitest run packages/engine-core/src/battle-actions.test.ts packages/engine-core/src/compute-view.test.ts` must pass"
  - "`corepack pnpm --filter @optcg/engine-core typecheck` must pass"
  - "`corepack pnpm run verify` must pass"
repo_rules:
  - keep the patch inside the current battle legality and vanilla battle resolution surface; if a required fix needs Block Step, Counter Step, effect runtime behavior, or replay schema work, stop and split or record the ambiguity
  - keep engine-core deterministic and pure
  - do not introduce React, browser APIs, WebSocket transport, Redis, Postgres, live HTTP, CLI modules, or test-only helpers into production engine-core modules
  - do not introduce live Poneglyph access or a card-data package dependency into engine-core
  - prefer named exports and strict TypeScript types; do not introduce `any`, routine non-null assertions, `@ts-ignore`, or `@ts-nocheck`
  - must pass `corepack pnpm run verify`
ambiguity_policy: fail_and_escalate
