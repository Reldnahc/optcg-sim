spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-030G
epic_id: KICK-001
title: Extract queue processing helpers
type: refactor
area: engine
primary_concern: rules
priority: medium
status: done
summary: >
  Extract existing effect queue processing and trigger-order continuation
  helpers from effect-runtime.ts into a focused module without changing queue
  ordering, decisions, events, errors, state hashes, or runtime behavior.
story_boundary: >
  Own only behavior-preserving production helper extraction for queue
  processing logic currently inside effect-runtime.ts. If the extraction is too
  broad to review safely, stop and split before implementation.
allowed_touch_points:
  - packages/engine-core/src/effect-runtime.ts
  - packages/engine-core/src/effect-runtime-queue-processing.ts
  - packages/engine-core/src/effect-runtime-queue-processing.test.ts
  - packages/engine-core/src/effect-runtime-trigger-order.test.ts
  - packages/engine-core/src/effect-runtime.test.ts
  - stories/generated/ENG-030G-extract-queue-processing-helpers.yaml
  - stories/approved/ENG-030G-extract-queue-processing-helpers.yaml
  - agent-packets/ENG-030G.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s004
  - 03-game-state-events-decisions.s005
  - 03-game-state-events-decisions.s020
  - 04-effect-runtime.s006
  - 04-effect-runtime.s007
  - 04-effect-runtime.s009
  - 04-effect-runtime.s010
  - 04-effect-runtime.s011
  - 04-effect-runtime.s012
  - 11-testing-quality.s008
  - 23-repo-tooling-and-enforcement.s006
  - 23-repo-tooling-and-enforcement.s008
scope:
  - move existing queue ordering, no-choice queue processing, selectTargets pause, trigger-order decision, trigger-order response, and queue-processing result assembly into effect-runtime-queue-processing.ts when behavior remains equivalent
  - preserve existing source-presence checks and policies before queued effect resolution
  - preserve existing stateHash output through existing hash/result helpers; do not move or redesign shared hash infrastructure
  - preserve exported API from effect-runtime.ts for existing consumers by re-exporting or keeping wrapper exports as needed
  - preserve event ordering, queue ordering, decision IDs, errors, state hashes, and hidden-information behavior
  - update internal imports only as required by extraction
non_scope:
  - changing queue processing behavior
  - changing trigger-order behavior
  - changing selectTargets decision behavior
  - changing source-presence behavior
  - moving or redesigning shared hash/result infrastructure
  - changing effect primitive or trigger queueing behavior
  - changing event ordering, state hashes, public contracts, or visibility
dependencies:
  - ENG-030F
acceptance_criteria:
  - effect-runtime-queue-processing.ts owns extracted queue processing helper logic
  - effect-runtime.ts remains behavior-compatible for all existing imports and tests
  - no event, error, queue ordering, decision, state hash, or hidden-information output changes
  - focused tests, coverage, and full verify pass
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/effect-runtime-queue-processing.test.ts packages/engine-core/src/effect-runtime-trigger-order.test.ts packages/engine-core/src/effect-runtime.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-030G packet while implementing this story
  - target the ENG-030 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - this is a behavior-preserving production refactor story; if any behavior delta appears, stop and split or record an ambiguity
ambiguity_policy: fail_and_escalate
