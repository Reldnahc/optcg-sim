summary: >
  Move selectTargets real-state PlayerView visibility and legal-action
  assertions out of filter-state-for-player.real-states.test.ts into a focused
  target-selection visibility test file without changing filtering behavior,
  hidden-info policy, fixtures, assertions, or expected outputs.
story_boundary: >
  Own only behavior-preserving test-file organization for selectTargets
  real-state PlayerView visibility and legal-action projection coverage
  currently in filter-state-for-player.real-states.test.ts.
allowed_touch_points:
  - packages/engine-core/src/filter-state-for-player.real-states.test.ts
  - packages/engine-core/src/filter-state-for-player.real-states-targeting.test.ts
  - stories/generated/ENG-033D-split-target-selection-real-state-visibility-tests.yaml
  - stories/approved/ENG-033D-split-target-selection-real-state-visibility-tests.yaml
  - agent-packets/ENG-033D.md
  - agent-packets/active.json
spec_refs:
  - 06-visibility-security.s003
  - 06-visibility-security.s004
  - 06-visibility-security.s005
  - 06-visibility-security.s007
  - 03-game-state-events-decisions.s015
  - 03-game-state-events-decisions.s018
