scope:
  - move selectTargets real-state visibility and legal-action assertions from filter-state-for-player.real-states.test.ts
  - preserve candidate hiding, legal response hiding, private queue metadata hiding, legal-action projection checks, helper behavior, and expected PlayerView output
  - keep helper extraction local to the moved tests unless the story implementation needs local duplicated helpers to preserve behavior
non_scope:
  - changing production filterStateForPlayer behavior
  - changing PlayerView, PublicDecision, or PublicLegalAction contracts
  - changing hidden-information policy
  - moving baseline, battle, trigger, no-zone, On K.O., or revealed-card real-state coverage
  - adding new real-state scenarios beyond direct coverage preservation
dependencies:
