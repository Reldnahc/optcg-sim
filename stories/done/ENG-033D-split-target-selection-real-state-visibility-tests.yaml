acceptance_criteria:
  - filter-state-for-player.real-states.test.ts no longer contains the moved selectTargets scenario group
  - filter-state-for-player.real-states-targeting.test.ts covers the same selectTargets real-state visibility scenarios with behavior-equivalent expectations
  - no production files change
  - focused tests, hidden-info tests, coverage, and full verify pass
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/filter-state-for-player.real-states.test.ts packages/engine-core/src/filter-state-for-player.real-states-baseline.test.ts packages/engine-core/src/filter-state-for-player.real-states-battle.test.ts packages/engine-core/src/filter-state-for-player.real-states-triggers.test.ts packages/engine-core/src/filter-state-for-player.real-states-targeting.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run test:hidden-info
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-033D packet while implementing this story
  - target the ENG-033 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - this is a behavior-preserving test organization story; if a production change appears necessary, stop and split or record an ambiguity
ambiguity_policy: fail_and_escalate
