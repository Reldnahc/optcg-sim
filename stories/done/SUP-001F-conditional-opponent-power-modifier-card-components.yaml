spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: SUP-001F
epic_id: SUP-001
title: Conditional opponent power modifier card components
type: implementation
area: cards
primary_concern: rules
priority: high
status: done
summary: >
  Compose When Attacking conditional wrappers, public DON field-count
  conditions, up-to-one opponent Character targeting, and this-turn power
  modifiers as reusable cards-layer components.
story_boundary: >
  Own only cards-layer parser/component composition, diagnostics,
  runtime-capability evidence, and synthetic tests for the conditional
  opponent-Character power modifier line. Do not add engine runtime behavior,
  shared contract/schema authority, real-card fixtures, source hashes, behavior
  hashes, overlays, support manifests, or full two-line generated-support
  promotion.
allowed_touch_points:
  - packages/cards/src/**
  - stories/generated/SUP-001*.yaml
  - stories/approved/SUP-001*.yaml
  - agent-packets/SUP-001F.md
  - agent-packets/active.json
spec_refs:
  - 02-engine-mechanics.s018
  - 02-engine-mechanics.s027
  - 02-engine-mechanics.s029
  - 04-effect-runtime.s004
  - 04-effect-runtime.s005
  - 04-effect-runtime.s007
  - 04-effect-runtime.s011
  - 05-effect-dsl-reference.s006
  - 05-effect-dsl-reference.s012
  - 05-effect-dsl-reference.s029
  - 09-card-data-and-support-policy.s016
  - 09-card-data-and-support-policy.s018
  - 11-testing-quality.s020
dependencies:
  - SUP-001B
  - SUP-001E
  - CARD-014G
  - CARD-019B
  - ENG-057A
  - ENG-058B
scope:
  - compose `[When Attacking]` wrapper, supported DON field-count condition, up-to-one opponent Character target, and this-turn power modifier
  - support numeric power modifier values with ASCII and Unicode minus where parsing is unambiguous
  - reuse existing target-selection and modifyPower capability evidence for up-to-one public opponent Character choices and legal zero-choice resolution
  - preserve fail-closed diagnostics for unsupported conditions, unsupported targets, malformed power values, unsupported durations, missing runtime capability, and ambiguous composition
  - prove the component path with synthetic snippets only
non_scope:
  - engine runtime behavior
  - shared contract/schema changes
  - DON-minus On Play draw support
  - full two-line generated-support promotion
  - real-card fixtures, source hashes, behavior hashes, overlays, support manifests, or cards-produced manifests
  - exact full-card or full-effect sentence branches
card_source_integrity:
  - this story does not name or target any real card and must not edit source integrity evidence
engine_capability_preflight:
  - "parsed shape is `[When Attacking]` queued effect with a block-level public DON field-count condition, up-to-one public opponent Character target selection, and `modifyPower` this-turn negative value effect"
  - "supported runtime capabilities: public DON field-count condition evaluation from SUP-001B; conditional queued wrapper reachability from ENG-058B/CARD-019B; `modifyPower:choose:thisTurn` from CARD-014G; `modifyPower:choose:thisTurn:zeroChoiceBranch` from ENG-057A; existing When Attacking timing and public target-choice support"
  - "missing runtime capabilities: SUP-001B/SUP-001E until merged; no additional runtime primitive is owned by this child"
  - this story must fail closed if any required runtime capability evidence is missing
acceptance_criteria:
  - synthetic conditional When Attacking opponent-Character power modifier text can parse into a schema-valid EffectBlock when all gates pass
  - the parser path is generic over threshold and power value, not hardcoded to exactly `6 or less` or `-1000`
  - zero-choice up-to-one behavior remains represented by existing target-selection capability evidence
  - unsupported nearby variants remain non-playable with narrow diagnostics
  - existing CARD-014 power-modifier generated-support behavior remains compatible
required_tests:
  - story-review for SUP-001F before approval handoff
  - parser/generated-support component test for the supported conditional When Attacking power modifier line
  - multi-value parser proof covering at least two condition thresholds and at least two power values through the same component path
  - support-probe/report diagnostics proving condition, target, power, and duration evidence
  - negative tests for malformed power, unsupported duration, unsupported target, unsupported condition, missing runtime capability, and ambiguous composition
  - regression tests for existing CARD-014 modifyPower support
  - production-code search or lint-style assertion proving no exact full-card or real-card branch
  - run `corepack pnpm --filter @optcg/cards test`
  - run `corepack pnpm run stories:validate`
repo_rules:
  - generate and activate the SUP-001F packet before implementation
  - do not activate SUP-001F until SUP-001B and SUP-001E have merged
  - stay within allowed touch points
  - do not add engine runtime behavior or shared contract/schema authority
ambiguity_policy: fail_and_escalate
