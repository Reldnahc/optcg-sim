title: Implemented-DSL continuous modifier materialization
type: implementation
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Add the reusable engine bridge that consumes schema-authorable permanent
  continuous Effect DSL blocks and exposes the corresponding keyword-grant and
  field-removal protection continuous modifiers to the existing runtime paths.
  This is the runtime prerequisite between TYP-012B authorability and CARD-021
  generated-support promotion.
story_boundary: >
  Own only engine-core consumption of reviewed implemented-DSL permanent
  continuous modifier definitions for keyword grants and field-removal
  protection grants. Do not change shared contracts/schema, card parser
  support, generated-support records, runtime capability matrix files in
  packages/cards, real-card fixtures, overlays, source hashes, behavior hashes,
  or cards-produced manifests.
