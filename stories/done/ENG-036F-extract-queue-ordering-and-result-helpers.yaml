scope:
  - move timing-window rank inference and queue ordering glue into effect-runtime-queue-ordering.ts while preserving deterministic order
  - move target choice shape checks, target request extraction, selectTargets decision construction, and unsupported target continuation handling into effect-runtime-queue-target-decisions.ts
  - move exact-id validation, queue-processing result assembly, state hash handoff, event aggregation, and continuation helper glue into effect-runtime-queue-results.ts
  - keep createEffectRuntimeQueueProcessing and exported compatibility surface stable in effect-runtime-queue-processing.ts
  - preserve event ordering, queue ordering, decision IDs, errors, state hashes, rollback behavior, and hidden-information behavior
non_scope:
  - changing queue ordering or trigger-order decision behavior
  - changing selectTargets decision behavior or target candidate visibility
  - changing source-presence or Life Trigger cleanup behavior beyond imports from ENG-036E helpers
  - changing effect primitive execution or trigger queueing behavior
  - changing public contracts or package boundaries
dependencies:
  - ENG-036E
acceptance_criteria:
  - focused queue ordering, target-decision, and result helper modules own the remaining queue processing helper logic
  - effect-runtime-queue-processing.ts remains behavior-compatible for createEffectRuntimeQueueProcessing consumers
  - no event, error, queue ordering, decision, rollback, state hash, or hidden-information output changes
  - focused queue processing tests, coverage, and full verify pass
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/effect-runtime-queue-processing-no-choice.test.ts packages/engine-core/src/effect-runtime-queue-processing-ordering.test.ts packages/engine-core/src/effect-runtime-queue-processing-targets.test.ts packages/engine-core/src/effect-runtime-queue-processing-stability.test.ts packages/engine-core/src/effect-runtime-trigger-order.test.ts packages/engine-core/src/effect-runtime.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-036F packet while implementing this story
  - target the ENG-036 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - this is a behavior-preserving production refactor story; if any behavior delta appears, stop and split or record an ambiguity
ambiguity_policy: fail_and_escalate
