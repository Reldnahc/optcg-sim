title: Extract queue ordering and result helpers
type: refactor
area: engine
primary_concern: rules
priority: medium
status: done
summary: >
  Extract queue ordering, trigger-order continuation, target-decision, and
  result assembly helpers from effect-runtime-queue-processing.ts without
  changing deterministic ordering, decisions, events, errors, state hashes, or
  runtime behavior.
story_boundary: >
  Own only behavior-preserving production helper extraction for remaining queue
  processing bodies after source-presence and cleanup helpers have been split.
  If the extraction is too broad to review safely, stop and split before
  implementation.
