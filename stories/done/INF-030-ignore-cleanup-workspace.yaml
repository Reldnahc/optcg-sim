spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-030
epic_id: KICK-001
title: Ignore cleanup workflow scratch workspace
type: tooling
area: infra
primary_concern: tooling
priority: high
status: done
summary: >
  Exclude the post-merge cleanup workflow's transient `.cleanup/` scratch
  workspace from repository verification so generated internal plan artifacts do
  not fail formatting before the cleanup commit is finalized.
story_boundary: >
  Own verification ignores for the cleanup workflow scratch workspace and the
  exact INF-029 manual packet-cleanup fallback required because automation
  failed during verification. Do not change cleanup validation, packet
  lifecycle semantics, workflow authorization, or branch protection.
allowed_touch_points:
  - .prettierignore
  - .eslintignore
  - eslint.config.mjs
  - tests/format/prettier-workflow.test.mjs
  - tests/github/post-merge-cleanup-closeout.test.mjs
  - tests/lint/**
  - agent-packets/INF-029.md
  - agent-packets/INF-030.md
  - agent-packets/active.json
  - stories/approved/INF-029-repair-cleanup-packet-command.yaml
  - stories/approved/INF-030-ignore-cleanup-workspace.yaml
  - stories/done/INF-029-repair-cleanup-packet-command.yaml
spec_refs:
  - 23-repo-tooling-and-enforcement.s010
  - 23-repo-tooling-and-enforcement.s016
  - 23-repo-tooling-and-enforcement.s023
  - 27-spec-driven-story-generation-workflow.s015
  - 32-codex-agent-integration.s013
scope:
  - "exclude `.cleanup/` workflow scratch artifacts from Prettier formatting checks"
  - "exclude `.cleanup/` workflow scratch artifacts from any repo lint surface that would otherwise scan generated cleanup plans"
  - "add or update tests proving the cleanup scratch workspace is ignored by verification-relevant tooling"
  - "include the exact manual packet-completion fallback output for INF-029 because the merged automation failed operationally during repo verification"
non_scope:
  - cleanup metadata schema redesign
  - cleanup executor behavior changes
  - packet completion command semantic changes
  - cleanup workflow trigger or authorization changes
  - branch-protection or token changes
  - gameplay, engine, replay, client, or server behavior
dependencies:
  - INF-029
acceptance_criteria:
  - Prettier no longer checks `.cleanup/bound-cleanup-plan.json`
  - lint and verification surfaces do not treat `.cleanup/` as source code or committed artifacts
  - cleanup workflow still runs verification after packet completion before pushing
  - the INF-029 manual fallback cleanup diff is limited to exact packet completion output
  - "`pnpm verify` passes with INF-029 cleanup applied"
required_tests:
  - tooling test proving `.cleanup/` is ignored by formatting or workflow verification guidance
  - "`pnpm run packets:verify`"
  - "`pnpm verify`"
repo_rules:
  - do not weaken source lint, typecheck, test, packet, or cleanup validation rules
  - do not ignore real source, story, packet, spec, fixture, or generated manifest paths
  - preserve exact INF-029 manual cleanup output unless verification requires a separately reviewed tooling/test fix
ambiguity_policy: fail_and_escalate
