spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-031E
epic_id: KICK-001
title: Split Event play tests
type: refactor
area: engine
primary_concern: verification
priority: medium
status: done
summary: >
  Move existing Event card play legal action, payment, execution, visibility,
  reindexing, rejection, determinism, and state-hash tests out of
  play-card.test.ts into a focused Event play test file without changing
  assertions, fixtures, errors, events, state hashes, or behavior.
story_boundary: >
  Own only behavior-preserving test-file organization for supported [Main]
  Event play coverage currently in play-card.test.ts.
allowed_touch_points:
  - packages/engine-core/src/play-card.test.ts
  - packages/engine-core/src/play-card-event.test.ts
  - packages/engine-core/src/play-card-character-overflow.test.ts
  - stories/generated/ENG-031E-split-event-play-tests.yaml
  - stories/approved/ENG-031E-split-event-play-tests.yaml
  - agent-packets/ENG-031E.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s015
  - 03-game-state-events-decisions.s017
  - 04-effect-runtime.s011
  - 06-visibility-security.s007
  - 11-testing-quality.s007
  - 11-testing-quality.s008
  - 23-repo-tooling-and-enforcement.s006
  - 23-repo-tooling-and-enforcement.s016
scope:
  - move supported [Main] vanilla Event legal action coverage into play-card-event.test.ts
  - move Event invalid timing, trigger text, missing manifest, unsupported status, pending decision, active battle, and non-Event manifest category omission coverage into play-card-event.test.ts
  - move unsupported Event effect execution fail-closed coverage into play-card-event.test.ts
  - move nonzero and zero-cost [Main] Event play execution coverage into play-card-event.test.ts
  - move Event play public event visibility, hand/trash reindexing, payment response rejection, stale/forged card rejection, and repeated execution determinism coverage into play-card-event.test.ts
  - preserve existing event order, visibility, mutation, zone reindexing, error, state hash, and replay-only rule-processing expectations
non_scope:
  - changing production code
  - changing Event play behavior
  - adding Event effect support
  - changing generic payment, Stage replacement, Character overflow, or On Play runtime behavior
dependencies:
  - ENG-031D
acceptance_criteria:
  - play-card-event.test.ts owns existing supported Event play coverage
  - moved tests preserve the same scenarios and expected outcomes
  - no production files change
  - focused tests, coverage, and full verify pass
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/play-card.test.ts packages/engine-core/src/play-card-event.test.ts packages/engine-core/src/play-card-character-overflow.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-031E packet while implementing this story
  - target the ENG-031 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - this is a behavior-preserving test organization story; if a production change appears necessary, stop and split or record an ambiguity
ambiguity_policy: fail_and_escalate
