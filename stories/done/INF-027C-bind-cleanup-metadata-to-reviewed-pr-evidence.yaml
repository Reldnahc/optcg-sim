spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-027C
epic_id: KICK-001
title: Bind cleanup metadata to reviewed PR evidence
type: tooling
area: infra
primary_concern: tooling
priority: high
status: done
summary: >
  Extend cleanup validation so PR cleanup metadata is treated only as a cleanup
  request and must be bound to reviewed PR evidence, merge state, trusted
  checked-in story files, and current packet evidence before cleanup can run.
story_boundary: >
  Own GitHub/PR evidence validation and binding only. Do not add the post-merge
  GitHub Actions workflow, run packet completion, push commits, delete branches,
  or change packet completion command semantics in this story.
allowed_touch_points:
  - package.json
  - tools/post-merge-cleanup.ts
  - tools/post-merge-cleanup/**
  - tools/tsconfig.json
  - tests/contracts/**
  - tests/github/**
  - tests/fixtures/post-merge-cleanup/**
  - stories/generated/INF-027C-*.yaml
  - stories/approved/INF-027C-*.yaml
  - agent-packets/INF-027C.md
  - agent-packets/active.json
spec_refs:
  - 23-repo-tooling-and-enforcement.s016
  - 26-agent-packet-template.s005
  - 27-spec-driven-story-generation-workflow.s015
  - 27-spec-driven-story-generation-workflow.s017
  - 32-codex-agent-integration.s008
  - 32-codex-agent-integration.s010
  - 32-codex-agent-integration.s013
scope:
  - define the PR evidence inputs needed by cleanup validation without giving PR text standalone authority
  - define the required review point as the latest human merge-gate approval or equivalent human review fallback recorded before merge
  - define acceptable reviewed cleanup metadata sources as the merged PR body or a durable handoff comment only when the human merge-gate review explicitly references that exact source
  - define acceptable single-story evidence as the reviewed PR story reference, active packet reference, changed story/packet artifacts, and merge SHA matching trusted main after merge
  - define acceptable parent cleanup evidence as the parent PR included-substory list, included substory PR references, substory AI review records, parent integration review record, parent revision response, and post-merge cleanup plan recorded before human review
  - validate the PR is merged into main/default branch before cleanup is eligible
  - validate requested story paths and story IDs are present in trusted checked-in approved story/packet state after merge
  - validate the merged PR evidence associates the requested cleanup stories with the reviewed implementation or parent integration scope
  - validate parent cleanup metadata includes enough evidence to bind every listed child story to the parent PR lifecycle
  - fail closed when metadata was added or changed after the required review point, unless a later human merge-gate review explicitly references the exact updated metadata source
  - emit deterministic bound-cleanup JSON for workflow preflight consumption
non_scope:
  - parsing basic metadata syntax already owned by INF-027B except as needed to integrate evidence binding
  - GitHub Actions workflow creation
  - running packet completion commands
  - direct cleanup commits
  - branch deletion
  - cleanup PR creation
  - remote GitHub branch-protection mutation
dependencies:
  - INF-027B
acceptance_criteria:
  - cleanup metadata alone is rejected unless it binds to reviewed PR evidence and trusted main-branch story/packet state
  - merged PR target branch must be main/default branch
  - metadata edited after the required review point fails closed unless a later human merge-gate review explicitly references the exact updated metadata source
  - story paths not associated with the merged PR or parent integration evidence fail closed
  - parent cleanup with missing substory evidence fails closed
  - stale packet evidence, missing packet evidence, or story/packet mismatches fail closed
  - deterministic bound-cleanup JSON includes story IDs, story paths, packet paths, branch requests, merged PR number, merge SHA, and verification inputs
required_tests:
  - PR evidence binding test for valid single-story cleanup
  - PR evidence binding test for valid parent cleanup with multiple child stories
  - rejection test for metadata that does not match the merged PR
  - rejection test for post-review metadata mutation without later human review of the exact updated source
  - positive test for a durable handoff comment explicitly referenced by the human merge-gate review
  - rejection test for a durable handoff comment not explicitly referenced by the human merge-gate review
  - rejection test for missing parent/substory inclusion evidence
  - rejection test for stale packet or story/packet mismatch after merge
repo_rules:
  - do not use write-capable GitHub tokens in this story
  - do not add the post-merge workflow in this story
  - fail closed if review evidence or story association cannot be established
ambiguity_policy: fail_and_escalate
