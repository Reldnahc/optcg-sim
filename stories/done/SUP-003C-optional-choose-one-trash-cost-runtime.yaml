dependencies:
  - SUP-002B
  - SUP-003A
scope:
  - support optional `payCost` sequence segments whose cost is a scoped optional choose-one over `trashFromField` and `trashFromHand` alternatives
  - create one private pay-cost decision with a decline response and one payment option per payable alternative when at least one legal payment path exists, without leaking hand candidates to the opponent
  - when neither alternative is payable, apply optional-if-possible semantics: create no pay-cost decision, record the optional cost segment as not paid, and skip dependent `ifYouDo` segments without public payment events
  - support filtered self Character field-trash alternatives using reusable CardFilter category and `typesAny` matching
  - support unfiltered self hand-trash alternatives using existing hidden-info protections for hand payment
  - generate legal payment responses for each valid chooser-visible field candidate combination and each valid private hand-card combination for the decision player only; opponent views may infer only board-public field state and must not receive private hand candidates
  - on field-trash payment, move selected self Character cards from character area to trash with deterministic public cardMoved, cardTrashed, and costPaid events
  - on hand-trash payment, preserve existing public trashed-card event behavior and hidden-info view protections
  - on decline or failed payment, record `paidCost: false`, set player-declined or failed-payment evidence, and skip dependent `ifYouDo` segments
  - preserve existing optional rest/return DON and optional hand-trash cost behavior
  - produce engine test evidence that later cards-layer runtime capability records can cite; do not edit the cards runtime capability matrix in this engine story
non_scope:
  - shared contract/schema changes beyond consuming SUP-003A
  - card parser, generated-support, runtime capability matrix edits in cards package, support reports, fixtures, overlays, card IDs, source hashes, or behavior hashes
  - non-optional choose-one costs, nested choose-one costs, discard aliases, opponent-field costs, trashSelf, restSelf, or broad arbitrary cost families
  - field-trash filters beyond self Characters with reusable category and type filters
  - K.O. semantics for cost trash; paying this cost must trash the card and must not count as battle K.O.
  - Activate Main legal action support; SUP-003B owns activation timing
  - server, client, UI, database, API, or live card-data work
acceptance_criteria:
  - optional choose-one cost payment and decline both resolve deterministically through the sequence frame model
  - "`ifYouDo` effects after optional choose-one cost run only when one alternative was paid"
  - field-trash and hand-trash alternatives are represented as payment options, not as exact printed text branches
  - field-trash alternative filters by variable type name and does not hardcode one type
  - tests vary type name, field candidate count, hand candidate count, and selected alternative to prove no exact branch
  - chooser views expose only the active pay-cost decision and legal responses allowed by the public/legal-action projection model; opponent views may see board-public field state but must not receive private hand candidates or chooser-only decision payloads
  - malformed, duplicate, wrong-player, stale, wrong-count, wrong-option, insufficient-card, and cross-zone responses fail closed without mutation
  - no engine code imports `@optcg/cards` or checks real card IDs or exact printed text
required_tests:
  - engine test for optional choose-one cost accepting typed field-trash and then running dependent draw
  - engine test for optional choose-one cost accepting hand-trash and then running dependent draw
  - engine test for optional choose-one cost decline recording paidCost false and skipping dependent draw
  - engine test with only field option payable, only hand option payable, both payable, and neither payable
  - engine test varying field type filter values without changing runtime path
  - engine hidden-information/view test for private hand candidates, chooser-visible field payment options, and opponent-safe filtered decision projection
  - engine event-order and state-hash tests for field payment, hand payment, decline, and malformed/failure branches
  - engine regression proving existing optional rest DON, return DON, and hand-trash cost behavior remains compatible
  - engine malformed/stale/forged response tests for each payment option family
  - "`corepack pnpm --filter @optcg/engine-core test`"
  - "`corepack pnpm run stories:validate`"
  - "`corepack pnpm run packets:verify`"
repo_rules:
  - implement only SUP-003C while its packet is active
  - do not activate or implement SUP-003C until SUP-003A has landed as reviewed prerequisite evidence on the active parent integration branch
  - keep engine-core free of cards package imports and live card-data adapters
  - stop and split if filtered field-trash payment requires new shared contract fields
ambiguity_policy: fail_and_escalate
