summary: >
  Execute optional pay-cost sequence segments whose cost offers a choose-one
  payment between filtered self-field Character trash and unfiltered
  trash-from-hand, then resume dependent ifYouDo effects.
story_boundary: >
  Engine runtime story only. Do not add card parser/generated-support behavior,
  real-card fixture evidence, support manifests, source hashes, behavior hashes,
  or contract changes beyond consuming SUP-003A.
