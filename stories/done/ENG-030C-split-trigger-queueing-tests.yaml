spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-030C
epic_id: KICK-001
title: Split trigger queueing tests
type: refactor
area: engine
primary_concern: verification
priority: medium
status: done
summary: >
  Move existing trigger detection and queueing tests out of
  effect-runtime.test.ts into focused test files without changing trigger
  queueing behavior, source-presence behavior, events, errors, or state hashes.
story_boundary: >
  Own only behavior-preserving test-file organization for On Play, attack
  timing, On K.O., and Life Trigger queueing tests currently covered by
  effect-runtime.test.ts.
allowed_touch_points:
  - packages/engine-core/src/effect-runtime.test.ts
  - packages/engine-core/src/effect-runtime-trigger-queueing.test.ts
  - packages/engine-core/src/effect-runtime-ko-triggers.test.ts
  - stories/generated/ENG-030C-split-trigger-queueing-tests.yaml
  - stories/approved/ENG-030C-split-trigger-queueing-tests.yaml
  - agent-packets/ENG-030C.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s005
  - 03-game-state-events-decisions.s020
  - 04-effect-runtime.s006
  - 04-effect-runtime.s007
  - 04-effect-runtime.s008
  - 04-effect-runtime.s009
  - 06-visibility-security.s006
  - 11-testing-quality.s007
  - 11-testing-quality.s008
  - 23-repo-tooling-and-enforcement.s006
scope:
  - move On Play trigger queueing tests into focused trigger queueing test coverage
  - move When Attacking and On Opponent Attack trigger queueing tests into focused trigger queueing test coverage
  - move battle K.O. trigger candidate detection and queueing tests into a focused K.O. trigger test file
  - preserve assertions, fixture semantics, errors, event payloads, state hashes, and hidden-information checks
non_scope:
  - changing trigger detection or queueing behavior
  - changing source-presence policy behavior
  - changing effect queue entry shape, lifecycle events, event visibility, or state hashes
  - moving effect-resolved follow-up trigger tests that are part of queue processing; those belong to ENG-030D
  - adding new trigger categories
  - changing production code
dependencies:
  - ENG-030B
acceptance_criteria:
  - effect-runtime.test.ts no longer contains the trigger queueing and K.O. trigger test groups moved by this story
  - new focused test files cover the same scenarios and expected outcomes
  - no production files change
  - focused tests, coverage, and full verify pass
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/effect-runtime.test.ts packages/engine-core/src/effect-runtime-trigger-queueing.test.ts packages/engine-core/src/effect-runtime-ko-triggers.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-030C packet while implementing this story
  - target the ENG-030 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - this is a behavior-preserving test organization story; if production behavior changes appear necessary, stop and split or record an ambiguity
ambiguity_policy: fail_and_escalate
