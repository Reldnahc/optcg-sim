title: Zero-target choose continuous runtime parent
type: implementation
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Coordinate the engine-only runtime evidence needed to unblock CARD-014G
  `up to 1` choose-target continuous modifier and restriction support without
  adding card-layer parser or generated-support behavior in this parent.
story_boundary: >
  Parent planning story only. Do not implement this parent directly. Implement
  the approved ENG-057A child story as the single active implementation story.
  Keep this parent and child in engine-core runtime behavior and tests; do not
  change cards/parser/generated-support metadata in this story set.
