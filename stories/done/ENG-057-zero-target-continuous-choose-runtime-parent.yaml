  - TYP-007E
  - TYP-009B
  - TYP-010
  - ENG-055J
  - CARD-014G
child_stories:
  - id: ENG-057A
    title: Zero-target choose continuous runtime
    concern: Resolve valid zero-target `choose` continuous modifier/restriction responses as deterministic no-ops for ENG-055J-supported effect families.
    depends_on: [TYP-007E, TYP-009B, TYP-010, ENG-055J, CARD-014G]
scope:
  - record a parent/substory workflow for the deferred CARD-014G engine blocker
  - define the single ENG-057A implementation child that supplies separate ENG zero-choice runtime evidence for `modifyPower`, `cannotAttack`, and `cannotBlock`
  - keep runtime behavior separate from card parser certification, generated-support capability records, source fixtures, and support-probe/report behavior
  - require distinct story-review evidence for this parent and the ENG-057A child before approval or implementation handoff
non_scope:
  - direct parent implementation
  - parser/card support
  - cards runtime capability matrix, generated-support metadata, support-probe output, or real-card fixture updates
  - new shared TYP/contracts/schema authority
  - new effect primitives, modifier families, or restriction families
  - replacement generalization
  - server, client, API, UI, database, replay UI, WebSocket, Redis, or live Poneglyph work
acceptance_criteria:
  - ENG-057 is not implemented directly
  - ENG-057 and ENG-057A have distinct story-review assignment identities and distinct durable story-review artifacts before approval handoff
  - ENG-057A remains independently reviewable and implements only engine-core runtime behavior
  - the parent story set records the CARD-014G deferred blocker and does not alter card-layer support state
  - engine-core does not import @optcg/cards
required_tests:
  - record parent story-review for ENG-057 before approval handoff
  - record child story-review for ENG-057A before approval handoff
  - run `corepack pnpm run stories:validate`
repo_rules:
  - do not implement the parent directly
  - approve and activate only ENG-057A for implementation
  - keep one active child packet at a time
  - do not import @optcg/cards
  - do not add parser/generated-support/card fixture work
ambiguity_policy: fail_and_escalate
