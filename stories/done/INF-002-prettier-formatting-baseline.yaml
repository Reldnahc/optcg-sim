spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-002
epic_id: KICK-001
title: Add Prettier formatting baseline and root format checks
type: tooling
area: infra
primary_concern: tooling
priority: high
status: done
summary: >
  Add the canonical formatting configuration and root format-check workflow so formatting
  stops being review-by-opinion.
story_boundary: >
  Own formatting configuration and root format check wiring only. Do not add lint rules,
  test lanes, hooks, or CI workflows beyond what is required to expose formatting checks locally.
allowed_touch_points:
  - .prettierrc
  - .prettierignore
  - package.json
  - packages/*/package.json
spec_refs:
  - 23-repo-tooling-and-enforcement.s003 (Canonical toolchain)
  - 23-repo-tooling-and-enforcement.s004 (Required root files)
  - 23-repo-tooling-and-enforcement.s009 (Formatting enforcement)
  - 23-repo-tooling-and-enforcement.s022 (Required implementation sequence for tooling)
scope:
  - add canonical Prettier config files at the repo root
  - expose root commands to check and apply formatting across supported file types
  - define ignore rules for generated or unsupported paths where needed
non_scope:
  - ESLint quality rules
  - staged-file hook integration
  - CI workflow integration
  - package-boundary checks
dependencies:
  - INF-001
acceptance_criteria:
  - Prettier config exists for Markdown, JSON, YAML, TypeScript, JavaScript, and other supported root file types
  - a root format-check command exists and fails on formatting drift
  - formatting can be applied consistently without relying on reviewer preference
required_tests:
  - format-check smoke test over at least one representative file per supported file family
  - ignore-path smoke test confirming intentionally skipped paths do not fail formatting checks
repo_rules:
  - formatting must be mechanically enforced instead of handled as subjective review feedback
  - formatting coverage must include the canonical config and spec artifact file types
  - no formatting story may weaken later verify or CI enforcement
ambiguity_policy: implement_if_clearly_implied
