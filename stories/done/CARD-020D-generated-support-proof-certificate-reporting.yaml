spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: CARD-020D
epic_id: CARD-020
title: Generated support proof/certificate reporting
type: implementation
area: cards
primary_concern: verification
priority: high
status: done
summary: >
  Add generated-support proof/certificate reporting so support-probe and
  generated-support-report output distinguish parsed text, schema-valid DSL,
  runtime capability coverage, engine proof evidence, and verified playable
  support.
story_boundary: >
  Own only cards-side diagnostic/reporting output for generated-support proof
  chain status. This story may expose structured proof/certificate sections in
  support-probe and generated-support-report output, but it must not add new
  generated playable support, engine behavior, runtime capability records,
  parser certification, fixture/hash changes, overlays, or per-card bespoke
  proof logic.
allowed_touch_points:
  - packages/cards/src/support-probe.ts
  - packages/cards/src/support-probe.test.ts
  - packages/cards/src/generated-support-report.ts
  - packages/cards/src/generated-support-report.test.ts
  - packages/cards/src/generated-support-index.ts
  - packages/cards/src/generated-support-types.ts
  - packages/cards/src/*support*.test.ts
  - packages/cards/src/*diagnostic*.ts
  - packages/cards/src/*diagnostic*.test.ts
  - agent-packets/CARD-020D.md
  - stories/generated/CARD-020*.yaml
  - stories/approved/CARD-020*.yaml
  - agent-packets/active.json
spec_refs:
  - 01-system-architecture.s023
  - 04-effect-runtime.s005
  - 05-effect-dsl-reference.s003
  - 05-effect-dsl-reference.s004
  - 05-effect-dsl-reference.s005
  - 05-effect-dsl-reference.s006
  - 05-effect-dsl-reference.s009
  - 09-card-data-and-support-policy.s010
  - 09-card-data-and-support-policy.s011
  - 09-card-data-and-support-policy.s012
  - 09-card-data-and-support-policy.s013
  - 09-card-data-and-support-policy.s014
  - 09-card-data-and-support-policy.s015
  - 09-card-data-and-support-policy.s016
  - 09-card-data-and-support-policy.s022
  - 09-card-data-and-support-policy.s024
  - 11-testing-quality.s020
dependencies:
  - CARD-020B
scope:
  - expose a generated-support proof/certificate section in support-probe output and generated-support-report structured output
  - keep the proof/certificate section diagnostic and reporting-only; it must explain support-chain state but must not create source evidence, generated DSL, runtime capability evidence, engine proof, or playable support
  - report source hash and behavior hash status, including stale or missing status where existing metadata can represent it
  - report parse completeness independently from later schema, capability, proof, and playable decisions
  - report generated DSL schema validation status independently from parse completeness and playable support
  - report parser-rule certification or parser-evidence status independently from parse completeness and scanner/parser recognition, and report missing, unknown, or unavailable status explicitly when existing metadata cannot prove it
  - report component evidence IDs where existing generated-support metadata provides them, and report missing component evidence rather than treating parser/scanner recognition as support evidence
  - report required runtime capability IDs from existing generated-support metadata
  - report missing runtime capability IDs when any required capability is absent or unsupported
  - report engine-proof/test-evidence status for each required runtime capability or composition where the repo can currently represent that evidence
  - report unknown or unavailable engine-proof/test-evidence status explicitly when the repo cannot currently represent proof for a required capability or composition
  - report support metadata, review state, and tested-state gates independently, and report missing, unknown, or unavailable status explicitly when existing metadata cannot prove them
  - "derive the final playable decision from the full ordered support chain: current source/behavior hashes, complete parse, valid generated DSL schema, mapped component evidence IDs, required runtime capability IDs, no missing runtime capability IDs, represented engine-proof/test-evidence status, and existing support metadata"
  - clearly separate diagnostic discovery from playable support authority in wording and structured fields
  - preserve existing unsupported and blocker codes, including `stale-hash`, `invalid-dsl-schema`, `missing-runtime-capability`, `unsupported-primitive`, `custom-handler-required`, `ambiguous-wording`, and `unparsed-span`
non_scope:
  - generated playable support for new cards or effects
  - parser certification for new support
  - generated DSL construction
  - engine runtime behavior
  - runtime capability records or marking new runtime capabilities supported
  - engine proof/test-evidence production beyond reporting evidence already represented by existing repo metadata
  - shared contracts/schema changes
  - source fixture, source hash, behavior hash, overlay, or support manifest changes
  - server, client, API, UI, database, replay, WebSocket, Redis, or live Poneglyph work
  - per-card bespoke proof logic, per-card bespoke tests, exact card ID branches, exact full-effect text branches, or sample-shaped proof templates
  - requiring a test per card
card_source_integrity:
  - not applicable because CARD-020D is diagnostic/reporting-only and does not enable or change real-card gameplay support, fixture provenance, source hashes, behavior hashes, overlays, manifests, or supported-card status
  - this story must not edit source fixtures, source hashes, behavior hashes, overlays, supported-card manifests, or manually reviewed source evidence
  - proof/certificate output may report existing source and behavior hash status, but it must not refresh, rewrite, or promote any source evidence
engine_capability_preflight:
  - not applicable for gameplay implementation because CARD-020D is reporting-only and does not implement gameplay behavior or create parsed-effect-shape authority
  - no new engine capability is introduced by this story
  - existing runtime capability metadata is read-only reporting input
  - missing runtime capabilities and missing engine-proof/test-evidence must remain reported as missing or unavailable proof-chain layers
acceptance_criteria:
  - support-probe output exposes a generated-support proof/certificate section that lists the support chain in order
  - generated-support-report structured output exposes equivalent proof/certificate data where report metadata can safely carry it
  - the proof/certificate chain reports source hash status and behavior hash status before parser/schema/capability/proof/playable decision fields
  - the proof/certificate chain reports parse completeness independently from generated DSL schema validation
  - the proof/certificate chain reports parser-rule certification or parser-evidence status independently from parse completeness and scanner/parser recognition
  - the proof/certificate chain reports generated DSL schema validation independently from runtime capability coverage
  - the proof/certificate chain reports component evidence IDs independently from scanner/parser recognition
  - the proof/certificate chain reports required runtime capability IDs and missing runtime capability IDs
  - the proof/certificate chain reports engine-proof/test-evidence status where the repo can currently represent it, and reports unavailable or missing proof status explicitly where it cannot
  - the proof/certificate chain reports support metadata, review state, and tested-state gates explicitly, including missing, unknown, or unavailable status when existing metadata cannot prove them
  - a fully parsed card with missing runtime capability evidence reports parsed, schema, and component success but final playable decision no
  - a fully parsed card with missing engine-proof evidence reports the missing proof layer instead of silently treating parse success as support
  - existing supported generated-support cards continue to report supported only when every current gate is green
  - existing unsupported cards remain unsupported
  - no new card becomes playable in CARD-020D
  - no per-card bespoke proof logic is introduced
  - proof/certificate output is derived from generic generated-support metadata and capability evidence, not exact card IDs or exact full printed text
  - parsing alone is never reported as card works, playable, supported, or verified playable support
  - schema-valid generated DSL alone is never reported as card works, playable, supported, or verified playable support
required_tests:
  - story-review for CARD-020D before approval handoff
  - support-probe tests proving the generated-support proof/certificate section lists the support chain in order
  - generated-support-report tests proving equivalent structured proof/certificate data is emitted
  - tests proving parsed-success/schema-valid/component-evidence success with missing runtime capability evidence reports final playable decision no
  - tests proving parsed-success/schema-valid/component-evidence success with missing engine-proof/test-evidence reports the missing proof layer and final playable decision no
  - tests proving missing parser-rule certification or parser-evidence reports the missing proof layer and final playable decision no
  - tests proving missing support metadata, review state, or tested-state evidence reports the missing proof layer and final playable decision no
  - tests proving existing supported generated-support cards report supported only when every current gate is green
  - tests proving existing unsupported cards remain unsupported
  - negative tests proving parse success, scanner recognition, component evidence, and schema validity do not individually create playable support
  - regression tests proving existing blocker codes remain stable for stale hash, invalid schema, missing runtime capability, unsupported primitive, custom handler required, ambiguous wording, and unparsed span
  - tests proving proof/certificate reporting is generic metadata-driven and does not use exact card IDs, exact full printed text, sample-shaped templates, or per-card bespoke proof branches
  - run `corepack pnpm run packets:verify`
  - run `corepack pnpm run stories:validate`
  - run `corepack pnpm --filter @optcg/cards test`
  - full `corepack pnpm verify`
repo_rules:
  - generate and activate the CARD-020D packet before implementation
  - stay within allowed_touch_points
  - keep proof/certificate reporting diagnostic-only and separate from playable support authority
  - do not mark any new card, effect, runtime capability, or engine proof as supported
  - do not add per-card bespoke tests or require a test per card
  - do not weaken CARD-020A, CARD-020B, or CARD-020C generic scanner and proof-bundle requirements
  - fail closed when proof-chain evidence is missing, unknown, stale, or not representable
ambiguity_policy: fail_and_escalate
