repo_rules:
  - use the parent/substory workflow
  - do not activate or implement SUP-003 directly
  - generate and activate one SUP-003 child packet at a time
  - implement SUP-003A before SUP-003C, SUP-003F, or SUP-003H
  - implement SUP-003B and SUP-003C before SUP-003F
  - implement SUP-003I before SUP-003D
  - implement SUP-003D before SUP-003G
  - implement SUP-003J before SUP-003G
  - implement SUP-003E, SUP-003F, and SUP-003G before SUP-003H
  - do not complete child packets until the parent branch lands on main
  - keep SUP-003A through SUP-003J work on one parent integration branch with reviewed child commits
  - do not open child PRs to main; use one final parent PR to main
  - parent PR cleanup metadata must list SUP-003A through SUP-003J and bind the non-packetized SUP-003 parent closeout
  - run role packet extraction before implementation and code-review handoffs
  - fail closed on any parser, schema, runtime capability, source integrity, metadata, review, test, or wording ambiguity that could accidentally mark unsupported text playable
ambiguity_policy: fail_and_escalate
