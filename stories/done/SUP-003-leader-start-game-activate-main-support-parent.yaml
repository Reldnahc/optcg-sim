child_stories:
  - id: SUP-003A
    title: Optional choose-one trash cost contract authorability
    concern: Authorize optional choose-one cost clauses whose alternatives can include typed field trash and unfiltered hand trash without changing runtime behavior or cards generated support.
    depends_on: []
  - id: SUP-003B
    title: Activate Main once-per-turn runtime
    concern: Expose and apply reusable Activate Main effect blocks during the main phase, including once-per-turn commitment semantics, without card IDs or printed-text checks.
    depends_on: []
  - id: SUP-003C
    title: Optional choose-one trash cost runtime
    concern: Execute optional pay-cost sequence segments with choose-one alternatives for typed self Character field trash or unfiltered hand trash, then resume dependent ifYouDo effects.
    depends_on: [SUP-003A]
  - id: SUP-003D
    title: Start-of-game typed Stage play runtime
    concern: Execute setup-time start-of-game effects that select up to 1 typed Stage card from self deck and play it before opening draw and Life setup.
    depends_on: [SUP-002D, SUP-003I]
  - id: SUP-003E
    title: External deck-rule parser evidence
    concern: Parse parameterized leader deck-construction restriction text as certified non-runtime evidence with no engine primitive or EffectBlock.
    depends_on: []
  - id: SUP-003F
    title: Activate Main choose-one cost card components
    concern: Parse and promote reusable Activate Main Once Per Turn optional choose-one trash-cost-to-draw support.
    depends_on: [SUP-003A, SUP-003B, SUP-003C]
  - id: SUP-003G
    title: Start-of-game typed Stage play card components
    concern: Parse and promote reusable start-of-game play-up-to-1 typed Stage from deck support, consuming setup runtime capability evidence.
    depends_on: [SUP-003D, SUP-003J]
  - id: SUP-003H
    title: Leader support composition card proof
    concern: Prove certified non-runtime deck-rule evidence, start-of-game setup support, and Activate Main support compose across representative leader text without exact full-card branches.
    depends_on: [SUP-003E, SUP-003F, SUP-003G]
  - id: SUP-003I
    title: Setup continuation state contract
    concern: Add focused raw GameState setup continuation state so setup-time start-of-game decisions can use canonical PendingDecision/respondToDecision and resume deterministic setup finalization without out-of-band selected IDs.
    depends_on: []
  - id: SUP-003J
    title: Start-of-game Stage search schema authorability
    concern: Authorize the narrow contract/schema fixture shape for setup start-of-game typed Stage search to Stage Area followed by matching playSelected, without runtime or cards-layer support.
    depends_on: [SUP-003I]
scope:
  - keep the full support chain in one parent story so prerequisite contract and engine work is visible before cards-layer work starts
  - decompose representative leader text into reusable primitives rather than exact full-card text, exact full-effect sentence branches, card IDs, or a human-held adjacent-card list
  - cover the parameterized external deck-construction rule primitive `Under the rules of this game, you cannot include <category plural> with a cost of N or more in your deck`
  - treat external deck-construction rule parsing as certified non-runtime evidence with no EffectBlock, no generated DSL schema requirement, and no engine runtime capability ID
  - do not implement deck validation semantics in this parent; the validator may consume the parsed non-runtime primitive in a later story
  - cover start-of-game setup timing for effects that can modify deck contents before opening draw, mulligan, and Life setup
  - cover `play up to 1 {TYPE} type Stage card from your deck` through reusable selection, type/category filter, play-from-deck, and setup-order primitives
  - cover `[Activate: Main] [Once Per Turn]` as a reusable activation wrapper over implemented-dsl effect blocks, not as a one-off card line
  - cover optional choose-one cost clauses shaped like `You may trash A or B:` using a reusable pay-cost decision with multiple payment options and optional decline semantics
  - cover the field-trash alternative as `trash N of your {TYPE} type Characters` using reusable public field selection and CardFilter primitives
  - cover the hand-trash alternative as `trash N card(s) from your hand` using existing hidden-info hand payment protections where possible
  - cover draw after paid optional cost through reusable `ifYouDo` sequence continuation and existing draw capability evidence
  - cards-layer parser work must name the primitive inventory first, then compose primitives; varying literals inside one full-sentence regex is not acceptable evidence of scalability
  - each supported larger phrase implies its valid smaller primitive variants unless the story explicitly excludes them before implementation
  - promote complete generated support only after parser certification, schema validation where applicable, runtime capability evidence, support metadata, review state, tested state, source integrity, and behavior hash gates pass
non_scope:
  - direct parent implementation
  - a single child that changes contracts, engine runtime, and cards generated support together
  - deck validation enforcement for leader-scoped construction restrictions
  - real card IDs, real-card fixture capture, real-card source hash updates, real-card behavior hash updates, overlays, support manifest edits, or cards-produced manifest regeneration
  - production branches for exact full card text, exact full effect lines, one external card list, one real card, or sample-specific sentence templates
  - broad natural-language parsing for arbitrary deck-building rules, arbitrary start-of-game effects, comma-separated alternative costs, or unsupported setup searches
  - generic event/counter activation, Activate Main costs outside scoped optional choose-one trash costs, or optional cost alternatives outside scoped field-trash/hand-trash payment
  - server, client, API, UI, database, replay UI, WebSocket, Redis, or live Poneglyph work
acceptance_criteria:
  - SUP-003 is not implemented directly
  - SUP-003A through SUP-003J are independently reviewable child stories
  - parent and every child story-review artifact exists with distinct assignment identity and distinct durable artifact identity before approval handoff, packet generation, activation, implementation handoff, or PR handoff
  - contract/schema children land before engine or cards children consume optional choose-one, optional field-trash, or multi-option pay-cost shapes
  - engine children prove reusable runtime capability before cards generated-support promotion cites those capabilities
  - cards children recognize representative clauses through reusable parser components and capability gates without exact full-line or card-specific branches
  - cards children must prove primitive composition by positive and negative matrix tests, not only by varying literals inside one representative sentence
  - the external deck rule is never reported as unparsed text and is never treated as runtime-executable engine work
  - a generated-support proof can distinguish certified non-runtime clauses from runtime clauses that require engine capability evidence
  - complete generated support remains unsupported unless the full generated-support chain passes, including parser certification, schema validation where applicable, runtime capability evidence, engine proof/test evidence, metadata, review, tested state, source integrity, and behavior hash evidence
  - cards children that claim generated-support promotion must validate produced Effect DSL with the real schema validator; fake validators or manually injected parser-certification/runtime-evidence shortcuts do not count as approval evidence
  - lower-level parser, component, or generated-index tests are not sufficient when the production/default support-evaluator or support-probe path would still report missing parser-certification, schema, or runtime-capability blockers
  - existing generated-support behavior for SUP-001, SUP-002, CARD-014, CARD-021, CARD-022, and CARD-023 remains compatible
  - no implementation or test depends on real card IDs, a human-held adjacent-card list, exact full printed text, or one-off full-effect sentence branches
  - parent PR cleanup metadata lists SUP-003A through SUP-003J and binds the non-packetized SUP-003 parent closeout after merge to main
card_source_integrity:
  - parent does not implement directly and does not name or target any real card
  - children must not edit source fixtures, source hashes, behavior hashes, overlays, supported-card manifests, cards-produced manifests, or manually reviewed source evidence unless a later approved CARD story explicitly owns real-card promotion
  - representative lines are parser/runtime examples only; matching real cards may be discovered by generated-support probing only through reviewed generic support gates
engine_capability_preflight:
  - parent does not implement directly and delegates capability proof to SUP-003A through SUP-003J
  - supported prerequisite groups include CARD-009A draw execution, ENG-055B/CARD-014A generic sequence frames, SUP-002A/SUP-002B optional hand-trash cost behavior, SUP-002D/SUP-002G top-N search and selected-card movement/remainder support, and ENG-005A/ENG-005B Stage play plus Stage replacement baseline behavior where applicable
  - missing prerequisite groups are represented by SUP-003A through SUP-003D and SUP-003I until each child lands: optional choose-one cost contract authorability, optional field-trash cost authorability, Activate Main legal action/runtime, optional choose-one pay-cost runtime, typed field-trash payment runtime, setup continuation state, start-of-game setup timing, and typed Stage play-from-deck setup runtime
  - cards-layer children must cite engine capabilities by reusable capability IDs and must fail closed when a required runtime capability is absent
