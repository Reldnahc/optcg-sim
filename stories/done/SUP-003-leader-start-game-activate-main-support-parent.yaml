summary: >
  Coordinate the contract, engine, and cards-layer work needed for reusable
  leader support families: certified non-runtime deck-construction rule
  parsing, start-of-game setup effects that play a typed Stage from deck, and
  Activate Main once-per-turn effects with optional choose-one trash costs that
  gate draw.
