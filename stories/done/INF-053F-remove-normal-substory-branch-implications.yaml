spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-053F
epic_id: INF-053
title: Remove normal-path substory branch implications
type: refactor
area: docs
primary_concern: docs
priority: high
status: done
summary: >
  Ensure parent/substory workflow specs, docs, and PR template examples do not
  imply substory branches or substory PRs are the normal path when the current
  normal workflow is one parent integration branch.
story_boundary: >
  Own only parent integration branch guidance, canonical integration spec
  wording, PR template cleanup examples, and focused workflow tests for substory
  branch wording. Do not change branch cleanup automation behavior unless
  required to remove misleading docs.
allowed_touch_points:
  - docs/workflow/parent-integration-branches.md
  - specs/32-codex-agent-integration.md
  - .github/pull_request_template.md
  - tests/github/review-workflow.test.mjs
spec_refs:
  - 27-spec-driven-story-generation-workflow.s015
  - 32-codex-agent-integration.s013
dependencies:
  - INF-053E
scope:
  - remove or explicitly legacy-scope spec text that says substory pull requests merge into the parent integration branch
  - remove examples that make optional substory branches appear normal
  - mark substory branch cleanup as exceptional or legacy if retained
  - reinforce one parent integration branch and no substory PRs as the normal workflow path
  - update tests to reject normal-path substory branch implications
non_scope:
  - changing branch deletion automation
  - changing cleanup metadata parser syntax
  - opening or documenting substory PRs as a normal path
acceptance_criteria:
  - specs/32 does not present substory pull requests as the normal parent integration workflow
  - parent integration docs clearly say the normal path uses one parent integration branch
  - PR template examples no longer encourage optional substory branches as normal
  - tests fail if substory branches or substory PRs are reintroduced as normal workflow
required_tests:
  - run `corepack pnpm run specs:verify-metadata`
  - run `corepack pnpm run test -- tests/github/review-workflow.test.mjs`
  - run `corepack pnpm verify`, or record why unavailable
repo_rules:
  - stay inside the listed touch points
  - preserve parent-mode cleanup metadata shape unless explicitly justified
ambiguity_policy: fail_and_escalate
