scope:
  - require the human-facing Session Orchestrator to present story path tradeoffs and record the human-selected path instead of treating single-story execution as the default
  - define the role hierarchy as Human to Session Orchestrator to story-author, story-review, and story-orchestrator agents, with story-orchestrator owning implementation, code-review, and pr-gate agents
  - define that story-author and story-review agents operate before packet activation and receive specs/story drafts rather than active packets
  - define that post-approval role packets are extracted only for story-orchestrator, implementation, code-review, and pr-gate roles
  - define lifecycle and reuse rules for story-author, story-review, story-orchestrator, implementation, code-review, and pr-gate agents
  - define severity-based reuse rules for story-review and implementation revisions
  - update spec authority and workflow docs together so role model routing does not conflict with higher-authority spec text
  - define model routing by role, including gpt-5.5 high for story-author and story-review, gpt-5.4 medium by default and high for parent series or complex workflow state for story-orchestrator, gpt-5.3-codex medium by default for implementation, gpt-5.4 high for code-review, and gpt-5.4 medium by default and high for parent PRs or cleanup/check failures for pr-gate
  - define pr-gate ownership of PR body state, review records, revision response tracking, CI/check state, cleanup metadata validation, human-review handoff, and post-merge cleanup/sync confirmation for the assigned PR
  - define that packet-agent, cleanup-sync-agent, and revision-agent are not roles in this workflow, with packet generation owned by deterministic tooling, cleanup/sync owned by pr-gate, and revision handled by implementation-agent reuse or fresh-agent rules
  - update packet rendering to include role-scoped post-approval sections without requiring agents to receive the full canonical packet
  - add deterministic packet extraction for role-scoped Markdown and JSON output
  - update workflow docs and tests so role handoffs use extraction output instead of manual packet trimming
non_scope:
  - gameplay rules or engine runtime behavior
  - card parser, generated support, fixture, or manifest behavior
  - server, client, API, database, Redis, replay, or UI behavior
  - replacing packet generation or packet completion lifecycle commands
  - changing post-merge cleanup automation semantics
  - adding an AI packet agent, cleanup-sync agent, or revision agent role
  - adding a new mutable workflow status source of truth
dependencies:
  - INF-038
acceptance_criteria:
  - workflow docs state there is no implicit single-story default and that the human driving the Session Orchestrator chooses single-story or parent/substory path after tradeoffs are presented
  - workflow docs define the role hierarchy and make clear that only the Session Orchestrator talks to the human
  - workflow docs define one story-orchestrator for a whole parent/substory series and one pr-gate agent per PR
  - workflow docs define one code-review agent per PR reused for re-review on that PR only
  - workflow docs define fresh implementation agent per standalone story or substory, reuse for low/medium fixes, and fresh agent for high/critical fixes with agreed guardrails
  - workflow docs define fresh story-author per new story or story set, reused only within that story or set
  - workflow docs define story-review reuse within a story set and fresh reviewer requirements after high/critical story-review findings
  - specs and workflow docs define matching role model routing for all roles and require recorded rationale for deviations
  - workflow docs define pr-gate responsibilities for PR body state, review records, revision response tracking, CI/check state, cleanup metadata validation, human-review handoff, and post-merge cleanup/sync confirmation
  - workflow docs explicitly do not introduce packet-agent, cleanup-sync-agent, or revision-agent roles
  - packet output includes role-scoped post-approval sections for story-orchestrator, implementation, code-review, and pr-gate
  - packet output and extraction do not expose role-scoped packet sections for pre-approval story-author or story-review roles
  - packet extraction command emits Markdown and JSON for each supported post-approval role
  - tests prove role handoff docs require extraction output and prohibit manual packet trimming as the normal path
required_tests:
  - workflow docs test covering human-selected story path with no implicit single-story default
  - workflow docs test covering the role hierarchy and human interaction boundary
  - workflow docs test covering agent lifecycle and reuse rules by role and severity
  - workflow docs test covering role model routing and deviation rationale
  - spec metadata verification after updating model-routing authority in specs
  - workflow docs test covering pr-gate responsibilities
  - workflow docs test proving packet-agent, cleanup-sync-agent, and revision-agent are not introduced roles
  - packet renderer or contract test covering role-scoped packet sections
  - packet extraction tests covering Markdown output for story-orchestrator, implementation, code-review, and pr-gate
  - packet extraction tests covering JSON output for story-orchestrator, implementation, code-review, and pr-gate
  - packet extraction tests proving story-author and story-review are not supported post-approval packet extraction roles
  - workflow docs test covering extraction-based handoff and no manual packet trimming
  - run `corepack pnpm run packets:verify`
  - run targeted packet and workflow tests
  - run full `corepack pnpm verify`
repo_rules:
  - story-review must pass before approving or implementing any INF-044 child
  - keep AGENTS.md concise and move detailed role guidance to docs/workflow
  - do not introduce a manual current-status file or second authority over story files
  - implement one approved substory at a time unless using the approved parent integration workflow
  - if packet extraction requires broader packet schema changes than this story set anticipates, stop and split a follow-up tooling story
ambiguity_policy: fail_and_escalate
