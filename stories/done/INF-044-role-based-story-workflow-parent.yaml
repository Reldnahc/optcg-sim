id: INF-044
epic_id: INF-044
title: Role-based story workflow orchestration
type: tooling
area: infra
primary_concern: tooling
priority: high
status: done
summary: >
  Replace the current implicit single-story, parent-owned workflow with an
  explicit human-selected story path and role-based agent hierarchy backed by
  specialized role packets and deterministic packet extraction.
story_boundary: >
  Own only workflow documentation, packet rendering/extraction tooling,
  workflow tests, and story/operator role guidance. Do not change gameplay,
  card support behavior, engine runtime behavior, server/client behavior,
  cleanup automation semantics, or story lifecycle commands beyond role-packet
  extraction.
