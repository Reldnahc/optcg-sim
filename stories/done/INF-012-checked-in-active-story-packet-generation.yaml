spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-012
epic_id: KICK-001
title: Add checked-in packet generation for active stories
type: tooling
area: infra
primary_concern: tooling
priority: critical
status: done
summary: >
  Implement checked-in packet generation and active-story packet enforcement so an
  approved story receives a reviewable execution packet before implementation,
  subagent assignment, or PR handoff.
story_boundary: >
  Own packet-generation tooling, checked-in packet artifacts, active-story packet
  enforcement, and the docs/tests needed to keep those packets current. Do not
  change backlog schema semantics, board sync, or feature-specific gameplay or
  contract behavior in this story.
allowed_touch_points:
  - AGENTS.md
  - stories/approved/INF-012-checked-in-active-story-packet-generation.yaml
  - pnpm-lock.yaml
  - specs/26-agent-packet-template.md
  - specs/27-spec-driven-story-generation-workflow.md
  - specs/32-codex-agent-integration.md
  - agent-packets/**
  - tools/**
  - package.json
  - tests/contracts/**
spec_refs:
  - 24-story-schema.s026
  - 26-agent-packet-template.s001
  - 26-agent-packet-template.s002
  - 26-agent-packet-template.s003
  - 26-agent-packet-template.s005
  - 26-agent-packet-template.s006
  - 26-agent-packet-template.s007
  - 27-spec-driven-story-generation-workflow.s009
  - 27-spec-driven-story-generation-workflow.s010
  - 27-spec-driven-story-generation-workflow.s012
  - 32-codex-agent-integration.s003
  - 32-codex-agent-integration.s005
  - 32-codex-agent-integration.s008
  - 32-codex-agent-integration.s012
scope:
  - add a checked-in `agent-packets/` directory and a packet builder for one approved story at a time
  - generate `agent-packets/<STORY-ID>.md` from an approved story plus cited spec material using the canonical packet template
  - enforce that an active story must have a current checked-in packet before implementation, subagent assignment, or PR handoff
  - add packet validation tests or smoke checks for packet presence, packet freshness, and required packet sections
  - wire packet generation and packet validation into the local verification commands used before implementation work
non_scope:
  - requiring packets for dormant approved stories
  - GitHub board sync integration
  - gameplay or contract-specific feature implementation
  - automatic branch creation flows
dependencies:
  - INF-004
  - INF-007
  - INF-011
acceptance_criteria:
  - "`agent-packets/` exists as a checked-in repo directory and the repo can generate a packet for a chosen approved story from the canonical template"
  - the generated packet includes story metadata, authoritative spec refs, relevant spec excerpts, story boundary, scope, non-scope, allowed touch points, repo rules, required tests, acceptance criteria, and ambiguity instructions
  - repo guidance states that approved stories may exist without packets until they become active, but active stories cannot proceed to implementation, subagent assignment, or PR handoff without a current checked-in packet
  - verification fails when an active story is missing its required packet or when a packet is stale relative to its source approved story
  - packet enforcement does not require checked-in packets for inactive approved backlog items
required_tests:
  - packet generation smoke test for one approved story
  - active-story packet presence and freshness enforcement test
repo_rules:
  - packet is a derived authority only; the cited specification and approved story win on conflict
  - active story means a story selected for implementation or review handoff, not every approved backlog item
  - checked-in packets must be deterministic and reviewable in pull requests
  - if packet generation reveals multiple unrelated concerns, split the story before assignment rather than broadening the packet
ambiguity_policy: implement_if_clearly_implied
