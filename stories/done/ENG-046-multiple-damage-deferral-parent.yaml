spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-046
epic_id: KICK-001
title: Multiple damage and damage-trigger deferral parent
type: implementation
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Coordinate the first narrow multiple-damage foundation so Double Attack
  leader damage is processed one damage point at a time, Life Trigger behavior
  remains per-point, and non-Trigger effects created during damage processing
  wait until the complete damage process finishes.
story_boundary: >
  This parent is not directly implementable. It coordinates ENG-046A through
  ENG-046E on a parent integration branch. The first supported multiple-damage
  source is Double Attack leader damage if story-review confirms that scope.
  Do not broaden to real-card fixtures, damage modifiers, replacement effects,
  Banish plus multiple damage, or unrelated combat keyword behavior.
allowed_touch_points:
  - stories/generated/ENG-046*.yaml
  - stories/approved/ENG-046*.yaml
spec_refs:
  - 02-engine-mechanics.s004
  - 02-engine-mechanics.s021
  - 02-engine-mechanics.s023
  - 02-engine-mechanics.s025
  - 02-engine-mechanics.s039
  - 02-engine-mechanics.s044
  - 03-game-state-events-decisions.s006
  - 03-game-state-events-decisions.s014
  - 03-game-state-events-decisions.s018
  - 03-game-state-events-decisions.s020
  - 04-effect-runtime.s009
  - 05-effect-dsl-reference.s012
  - 11-testing-quality.s004
  - 18-acceptance-tests.s002
  - 22-v6-implementation-tightening.s008
  - 22-v6-implementation-tightening.s009
  - 24-story-schema.s004
  - 24-story-schema.s016
  - 27-spec-driven-story-generation-workflow.s015
  - 27-spec-driven-story-generation-workflow.s017
scope:
  - coordinate a parent integration branch for ENG-046A through ENG-046E
  - support only the first narrow multiple-damage source, Double Attack leader damage, if story-review confirms it is the correct first source
  - process damage greater than one one point at a time in official order
  - preserve supported Life Trigger decision, activation, decline, reveal, and cleanup behavior per damage point
  - defer non-Trigger effects created during damage processing until all damage points in that process complete, using the existing supported custom `effectResolved:<life-trigger-effect-id>` draw follow-up path as the first concrete source
  - preserve existing Banish single-damage support while failing closed for Banish combined with multiple damage unless a child story is explicitly revised by story-review
  - prove deterministic event ordering, state hashes, canonical nonmutation on failures, and PlayerView hidden-info safety
non_scope:
  - direct implementation from this parent story
  - packetizing or activating this parent story as an active implementation story
  - real-card fixture capture or card-data integration
  - replacement effects or damage replacement integration
  - broad damage modifiers
  - full keyword expansion beyond the reviewed Double Attack path
  - Banish plus Double Attack support
  - custom handlers
  - server, client, API, WebSocket, database, Redis, live Poneglyph, or UI work
  - engine-core importing @optcg/cards
dependencies:
  - ENG-045
child_stories:
  - id: ENG-046A
    title: Add narrow multiple-damage loop structure
    concern: Allow supported Double Attack leader damage to iterate each damage point while preserving single-damage behavior.
    depends_on: []
  - id: ENG-046B
    title: Preserve Life Trigger per-point behavior
    concern: Ensure each damage point can create and complete its own supported Life Trigger path before the next point continues.
    depends_on: [ENG-046A]
  - id: ENG-046C
    title: Defer damage-created non-Trigger effects
    concern: Hold non-Trigger effects created during damage processing until the full damage process completes, then release them in deterministic queue order.
    depends_on: [ENG-046A, ENG-046B]
  - id: ENG-046D
    title: Guard Banish and unsupported multiple-damage interactions
    concern: Preserve existing Banish single-damage behavior and fail closed for unsupported Banish plus multiple damage or unsupported damage-count shapes.
    depends_on: [ENG-046A]
  - id: ENG-046E
    title: Add event hash and hidden-info regressions
    concern: Prove integrated multiple-damage event order, state hashes, PlayerView safety, and baseline single-damage behavior.
    depends_on: [ENG-046A, ENG-046B, ENG-046C, ENG-046D]
acceptance_criteria:
  - ENG-046A through ENG-046E are reviewed as a coherent multiple-damage foundation group
  - each child story has a usable exact per-story story-review result before approval
  - child PRs target the ENG-046 parent integration branch if the group is approved
  - Double Attack leader damage deals two damage points in official order
  - each point uses the top Life card at `player.life[0]` at the time that point is processed
  - supported Life Trigger behavior remains available per point and does not skip the remaining damage process
  - non-Trigger custom effect-resolved follow-up effects created by a supported Life Trigger during damage processing do not resolve until all damage points finish
  - Banish plus multiple damage remains fail-closed unless explicitly revised by story-review
  - unsupported damage-count and keyword combinations fail closed without mutation
  - deterministic event ordering, state hashes, and PlayerView hidden-info safety are covered
  - parent PR cleanup metadata and lifecycle evidence bind ENG-046 plus ENG-046A through ENG-046E, and cleanup is deferred until the parent PR lands on main
required_tests:
  - set-level story-review for ENG-046 parent and children
  - per-story story-review for ENG-046 parent before approval
  - per-story story-review for ENG-046A through ENG-046E before approval
  - story-specific tests from every child story
  - full `corepack pnpm run verify` on every child PR and parent PR
repo_rules:
  - do not implement ENG-046 directly
  - use the parent integration branch workflow if this group is approved
  - keep one active child packet at a time
  - do not run packet completion for child stories until the parent branch lands on main
  - require parent PR cleanup metadata and lifecycle evidence for ENG-046 and every included child story
  - use `packets:complete-many` only after the parent PR lands on main or as documented operational fallback
  - if story-review finds Double Attack or damage-trigger deferral ambiguous, record the ambiguity and stop instead of implementing
ambiguity_policy: fail_and_escalate
