spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-018
epic_id: KICK-001
title: Allow supported non-vanilla cards as combat bodies
type: implementation
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Let cards with supported combat-only metadata participate in normal combat
  even when their support status is `implemented-dsl`, while preserving
  fail-closed behavior for unsupported keywords, unsupported timings, and
  unsupported effect bodies.
story_boundary: >
  Own only the engine-core support-policy gate used by computed combat view and
  supported battle resolution for Leader/Character combat bodies. Preserve the
  existing vanilla, Rush, Banish, and landed Blocker behavior. Do not redesign
  the support registry, add new gameplay keywords, add new effect-runtime
  primitives, or broaden unsupported timing/effect handling.
allowed_touch_points:
  - packages/engine-core/src/compute-view.ts
  - packages/engine-core/src/compute-view.test.ts
  - packages/engine-core/src/battle-actions.ts
  - packages/engine-core/src/battle-actions.test.ts
  - packages/engine-core/src/actions.test.ts
  - packages/engine-core/src/battle-actions-test-fixtures.ts
  - packages/engine-core/src/action-test-fixtures.ts
  - stories/approved/ENG-018-supported-non-vanilla-combat-bodies.yaml
  - agent-packets/ENG-018.md
  - agent-packets/active.json
