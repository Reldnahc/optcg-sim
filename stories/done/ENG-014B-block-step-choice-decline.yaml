spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-014B
epic_id: M1-001
title: Open Block Step decline decision
type: implementation
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Add the supported Block Step pause and an executable defender decline/pass
  path using the existing `PendingDecision` / `respondToDecision` routing, so a
  legal blocker window never creates a stuck battle before blocker selection is
  implemented.
story_boundary: >
  Own only entering/skipping Block Step, creating the defender Block Step
  decision, legal response filtering, and the empty-choice decline response.
  Stop before exposing blocker candidates, accepting a blocker selection,
  resting blockers, redirecting targets, resolving blocked battles, or adding
  Counter/On Block behavior.
allowed_touch_points:
  - packages/engine-core/src/actions.ts
  - packages/engine-core/src/actions.test.ts
  - packages/engine-core/src/battle-actions.ts
  - packages/engine-core/src/battle-actions.test.ts
  - packages/engine-core/src/action-test-fixtures.ts
  - packages/engine-core/src/battle-actions-test-fixtures.ts
spec_refs:
