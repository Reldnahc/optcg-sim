spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-043
epic_id: KICK-001
title: Once-per-turn foundation parent
type: implementation
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Coordinate the first narrow once-per-turn runtime foundation so supported
  effect paths track use by stable card instance, effect id, and turn number,
  and consume that use only at the reviewed legal commitment point.
story_boundary: >
  This parent is not directly implementable. It coordinates ENG-043A through
  ENG-043E on a parent integration branch so once-per-turn state helpers,
  commitment-point consumption, failed-cost and failed-target regressions,
  optional activation integration, and turn-boundary/fizzle regressions land as
  one reviewed gameplay group.
allowed_touch_points:
  - stories/generated/ENG-043*.yaml
  - stories/approved/ENG-043*.yaml
spec_refs:
  - 02-engine-mechanics.s024
  - 02-engine-mechanics.s042
  - 03-game-state-events-decisions.s005
  - 03-game-state-events-decisions.s017
  - 03-game-state-events-decisions.s020
  - 03-game-state-events-decisions.s022
  - 04-effect-runtime.s004
  - 04-effect-runtime.s011
  - 04-effect-runtime.s012
  - 05-effect-dsl-reference.s001
  - 05-effect-dsl-reference.s027
  - 06-visibility-security.s002
  - 06-visibility-security.s017
  - 11-testing-quality.s004
  - 11-testing-quality.s008
  - 24-story-schema.s004
  - 24-story-schema.s016
  - 27-spec-driven-story-generation-workflow.s015
  - 27-spec-driven-story-generation-workflow.s017
scope:
  - coordinate a parent integration branch for ENG-043A through ENG-043E
  - track once-per-turn usage in `GameState.oncePerTurn` by `cardInstanceId + effectId + turnNumber`
  - block repeated supported once-per-turn effect use in the same turn
  - consume use only at legal commitment after costs, activation-time targets, and optional acceptance
  - preserve non-consumption for failed cost, failed activation-time target selection, and optional decline
  - consume accepted optional automatic effects when their queue entry begins resolution
  - keep legally committed effects consumed even if later resolution fizzles or does as much as possible
  - prove deterministic turn-boundary behavior, event ordering, state hashes, and fail-closed behavior with synthetic tests
non_scope:
  - direct implementation from this parent story
  - packetizing or activating this parent story as an active implementation story
  - real-card fixture capture or card-data integration
  - implementing Optional Effects; this parent depends on ENG-042 being done
  - broad activation redesign
  - replacement effects
  - custom handlers
  - unrelated new primitives
  - server, client, API, WebSocket, database, Redis, live Poneglyph, or UI work
  - engine-core importing @optcg/cards
dependencies:
  - ENG-042
child_stories:
  - id: ENG-043A
    title: Add once-per-turn state helpers
    concern: Add small pure helpers for once-per-turn key construction, lookup, and immutable consumption without integrating effect paths yet.
    depends_on: []
  - id: ENG-043B
    title: Consume automatic no-choice effects at commitment
    concern: Gate and consume supported non-optional queued effects when the queue entry begins resolution, blocking repeated use in the same turn.
    depends_on: [ENG-043A]
  - id: ENG-043C
    title: Commit target activations and preserve failed attempts
    concern: Add the existing supported target-selection continuation path to once-per-turn commitment and prove failed cost/target attempts do not consume use.
    depends_on: [ENG-043A, ENG-043B]
  - id: ENG-043D
    title: Integrate optional activation commitment
    concern: Keep optional decline unconsumed and consume accepted optional automatic effects when their accepted queue entry begins resolution.
    depends_on: [ENG-043A, ENG-043B, ENG-043C]
  - id: ENG-043E
    title: Verify committed fizzle and turn-boundary behavior
    concern: Prove consumed use survives committed later-fizzle/do-as-much-as-possible paths and resets by turn number with deterministic event/hash coverage.
    depends_on: [ENG-043A, ENG-043B, ENG-043C, ENG-043D]
acceptance_criteria:
  - ENG-043A through ENG-043E are reviewed as a coherent once-per-turn foundation group
  - each child story has a usable exact per-story story-review result before approval
  - child PRs target the ENG-043 parent integration branch if the group is approved
  - the final parent PR tracks use by card instance id, effect id, and turn number
  - repeated supported once-per-turn use in the same turn is blocked
  - successful supported activation-time target paths consume once at legal commitment
  - failed costs, failed activation-time target selection, invalid target responses, and optional decline do not consume use
  - accepted optional automatic effects consume when their queue entry begins resolution
  - legally committed later-fizzle behavior remains consumed
  - parent PR cleanup metadata and lifecycle evidence bind ENG-043 plus ENG-043A through ENG-043E, and cleanup is deferred until the parent PR lands on main
required_tests:
  - set-level story-review for ENG-043 parent and children
  - per-story story-review for ENG-043 parent before approval
  - per-story story-review for ENG-043A through ENG-043E before approval
  - story-specific tests from every child story
  - full `corepack pnpm run coverage` before parent PR completion
  - full `corepack pnpm run verify` on every child PR and parent PR
repo_rules:
  - do not implement ENG-043 directly
  - use the parent integration branch workflow if this group is approved
  - keep one active child packet at a time
  - do not run packet completion for child stories until the parent branch lands on main
  - require parent PR cleanup metadata and lifecycle evidence for ENG-043 and every included child story
  - use `packets:complete-many` only after the parent PR lands on main or as documented operational fallback
  - if story-review finds optional integration unavailable or too broad, block or narrow the optional child before approval
ambiguity_policy: fail_and_escalate
