spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: CARD-011
epic_id: CARD-011
title: Generated-support playability from authoritative Poneglyph data parent
type: implementation
area: cards
primary_concern: verification
priority: high
status: done
summary: >
  Split generated-support playability into a small substory series: a card-data
  evaluator, a read-only support probe CLI, and fixture-only manifest boundary
  guardrails. Cards are not admitted or preloaded; support is evaluated from
  authoritative Poneglyph card data and certified mechanics evidence.
story_boundary: >
  Parent planning story only. Do not implement this parent directly. Implement
  the approved child stories one at a time, preserving Poneglyph as the owned
  authoritative card-data source and preserving real-card manifests only as
  fixture/integration-test evidence. Use the parent-integration-branch workflow:
  child implementation branches are created from the parent branch, child PRs
  target the parent branch, child packet completion is deferred until the parent
  PR lands on main, and the final parent PR carries the human review gate.
allowed_touch_points:
