summary: >
  Reopen the conditional protection runtime line for the missing
  implemented-DSL materialization bridge needed after the reusable condition,
  keyword, protection, and composition primitives have landed. This parent
  coordinates only the engine story that consumes reviewed permanent Effect DSL
  definitions and derives existing continuous keyword/protection modifiers.
