  Reopened parent planning story only. Do not implement this parent directly.
  ENG-059A through ENG-059E remain completed prerequisites from the earlier
  closeout. Implement ENG-059F as the only executable child in this reopened
  pass after distinct reopened-parent and child story-review artifacts exist.
  This parent owns engine-only runtime capability work and must not add shared
  contract/schema, card parser, generated-support, runtime capability matrix,
  real-card fixture, overlay, source hash, behavior hash, server, client, or UI
  work.
