child_stories:
  - id: ENG-059F
    title: Implemented-DSL continuous modifier materialization
    concern: Consume reviewed implemented-DSL permanent continuous definitions and derive existing keyword-grant and field-removal protection modifiers without card-specific branches.
    depends_on: [TYP-012B, ENG-059A, ENG-059B, ENG-059C, ENG-059E]
scope:
  - record that ENG-059 has reopened because the primitive engine paths landed before the implemented-DSL bridge that materializes reviewed permanent Effect DSL definitions into those paths
  - coordinate one engine-only child story for implemented-DSL permanent continuous materialization
  - preserve the historical fact that ENG-059A through ENG-059E remain completed prerequisites and are not reimplemented or repacketized by this reopened pass
  - require production behavior to consume reusable Effect DSL primitives and existing runtime modifier paths, not card IDs, full-card text, exact sentence branches, or external-card-list knowledge
  - keep downstream CARD/parser/generated-support promotion separate so later stories can cite runtime capability evidence without hiding card-layer work here
  - preserve deterministic events, replay behavior, state hashes, hidden information, source presence, stale-source handling, and fail-closed unsupported behavior
non_scope:
  - direct parent implementation
  - changes to completed ENG-059A through ENG-059E behavior except as cited prerequisite authority
  - shared contracts/schema/type changes
  - production references to any real card ID or external card list
  - full-card text matching or production branches for one printed effect
  - packages/cards changes, runtime capability matrix changes, parser certification, generated-support component evidence, support reports, support probes, real-card fixtures, overlays, source hashes, behavior hashes, or cards-produced manifests
  - making any real card playable
  - parser diagnostic wording cleanup
  - new continuous-effect families beyond keyword grants and TYP-012A field-removal protection grants
  - protection against battle K.O., rule-process trash, controller costs, controller-owned effects, or unsupported/ambiguous removal processes beyond the existing field-removal protection runtime shape
  - server, client, API, UI, database, replay UI, WebSocket, Redis, or live Poneglyph work
acceptance_criteria:
  - ENG-059 is not implemented directly
  - ENG-059 is visibly no longer done while this reopened pass is active
  - ENG-059F is the only executable child story in this reopened parent pass
  - ENG-059A through ENG-059E remain recorded as completed prerequisites and are not reimplemented or repacketized by this reopened pass
  - ENG-059 has one distinct reopened-parent story-review assignment and durable artifact before approval handoff
  - ENG-059F has one distinct child-story review assignment and durable artifact before approval handoff
  - the reconstructed reopened parent/child review-status matrix records distinct assignment and artifact identities for both rows before approval handoff, packet generation, activation, implementation handoff, or PR handoff
  - the child stays engine-only and does not import @optcg/cards
  - no production engine code checks a real card ID, the full effect text as one string, or any external-card-list identifier
  - reviewed implemented-DSL permanent continuous definitions can be consumed only through reusable condition, keyword, and field-removal protection primitives
  - similar cards can benefit later only because they use the same runtime primitives, not because their full text or IDs were known during implementation
  - later CARD/parser work may add partial or complete generated-support evidence for cards with matching primitives, but this reopened ENG-059 pass does not add parser or generated-support behavior
  - unsupported or ambiguous condition, modifier, protection, process, source-policy, hidden-info, replay, or ordering cases continue to fail closed
required_tests:
  - story-review for reopened ENG-059 parent before approval handoff
  - story-review for ENG-059F before approval handoff
  - reconstruct a reopened parent/child story-review matrix with distinct assignment and artifact identities per row before approval or implementation handoff
  - run `corepack pnpm run stories:validate`
repo_rules:
  - use the parent/substory workflow
  - do not activate or implement ENG-059 directly
  - ENG-059F is the only worker-ready activation target in this reopened parent set
  - keep one active child packet at a time
  - do not activate or hand off ENG-059F until TYP-012B is merged and ENG-059A through ENG-059E have landed as reviewed evidence
  - do not complete child packets until the parent branch lands on main
  - do not open child PRs to main; use one final reopened-parent PR after the child is reviewed on the parent branch
  - fail closed on hidden-information, event-order, replay, source-presence, protection, or condition ambiguity
ambiguity_policy: fail_and_escalate
