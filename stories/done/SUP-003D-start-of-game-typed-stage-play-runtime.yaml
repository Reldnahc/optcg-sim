summary: >
  Execute setup-time start-of-game effects that let a player select up to 1
  typed Stage card from their deck and play the selected card before opening
  hand, mulligan, and Life setup.
story_boundary: >
  Engine runtime story only. Do not add card parser/generated-support behavior,
  real-card fixture evidence, support manifests, source hashes, behavior hashes,
  or contract/schema changes.
