spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: CARD-008C
epic_id: CARD-008
title: Complete-parse generated support index
type: implementation
area: cards
primary_concern: contract
priority: high
status: done
summary: >
  Generate deterministic support index entries only when parser output is
  complete, generated DSL validates, and every parsed component has runtime
  capability evidence.
story_boundary: >
  Own only the generated support index builder, narrow DSL-schema validation
  integration, support-evidence exports, and tests for supported, partial,
  unsupported-capability, and reproducibility behavior.
allowed_touch_points:
  - packages/cards/src/generated-support-index.ts
  - packages/cards/src/generated-support-index.test.ts
  - packages/cards/src/certified-card-text-parser.ts
  - packages/cards/src/generated-support-types.ts
  - packages/cards/src/runtime-capability-matrix.ts
  - packages/cards/src/index.ts
  - packages/cards/package.json
  - stories/generated/CARD-008C-complete-parse-generated-support-index.yaml
  - stories/approved/CARD-008C-complete-parse-generated-support-index.yaml
  - agent-packets/CARD-008C.md
  - agent-packets/active.json
spec_refs:
  - 04-effect-runtime.s005
  - 05-effect-dsl-reference.s022
  - 09-card-data-and-support-policy.s010
  - 09-card-data-and-support-policy.s011
  - 09-card-data-and-support-policy.s012
  - 09-card-data-and-support-policy.s013
  - 09-card-data-and-support-policy.s014
  - 09-card-data-and-support-policy.s015
  - 09-card-data-and-support-policy.s016
  - 09-card-data-and-support-policy.s022
  - 11-testing-quality.s005
  - 11-testing-quality.s016
  - 11-testing-quality.s020
scope:
  - build a generated support index entry from Poneglyph-shaped card text and parser output
  - validate generated DSL against the existing DSL schema before marking a card supported
  - mark a card supported only when every parsed component is complete and covered by runtime capabilities
  - mark partial parse, unparsed residue, missing runtime capability, ambiguous wording, stale hash, and custom-handler requirements unsupported with blocker evidence
  - keep generated support index output deterministic and reproducible
  - expose narrow support evidence that deck validation can consume, or record a focused follow-up if direct deck validation integration is too large for this story
non_scope:
  - support report generation
  - full released-card parsing
  - broad catalog auto-unlock
  - replacing existing simulator overlays
  - changing gameplay behavior
  - broad deck validation rewrite
  - custom handlers
  - server, client, API, UI, Redis, database, replay, or live Poneglyph work
dependencies:
  - CARD-008A
  - CARD-008B
acceptance_criteria:
  - exact supported template produces a supported generated support index entry
  - generated DSL validates against the existing DSL schema
  - unparsed residue makes the card unsupported
  - unsupported runtime capability makes the card unsupported
  - generated support index output is reproducible
  - generated support evidence is consumable by deck validation or a narrow follow-up is recorded with rationale
required_tests:
  - exact candidate story-review before implementation
  - focused generated support index tests for supported, partial, unsupported-capability, schema-validation, and reproducibility behavior
  - run `corepack pnpm run packets:verify`
  - run `corepack pnpm run stories:validate`
  - run `corepack pnpm --filter @optcg/cards test`
  - full `corepack pnpm verify`
repo_rules:
  - generate and activate the CARD-008C packet before implementation
  - stay within allowed_touch_points
  - do not implement report generation, broad parser grammar, server/client/API/UI, or runtime behavior in this story
  - keep normal play fail-closed when generated support evidence is incomplete or unsupported
ambiguity_policy: fail_and_escalate
