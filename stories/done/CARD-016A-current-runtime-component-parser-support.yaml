story_schema_version: 1.0.0
id: CARD-016A
epic_id: CARD-016
title: Current runtime component parser support
type: implementation
area: cards
primary_concern: rules
priority: high
status: done
summary: >
  Add package-local reusable parser grammar/components so generated support can
  parse every currently runtime-capability-supported shape without growing by
  one-off exact text templates, while preserving fail-closed diagnostics for
  unsupported, incomplete, stale, or ambiguous text.
story_boundary: >
  Own only cards-side parser grammar/components, generated-support parse
  construction over existing effect DSL schema and runtime capability evidence,
  parser trace diagnostics for failures, support probe/report propagation, and
  tests. This story must not add runtime behavior, runtime capability records,
  shared schema authority, fixture evidence, or card-specific one-off exact text
  templates. Generated support may become playable only for complete parses that
  pass existing schema, source integrity, metadata, review/test, and runtime
  capability gates.
