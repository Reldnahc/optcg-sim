id: CARD-020C
epic_id: CARD-020
title: Arbitrary-card probe proof bundle
type: implementation
area: cards
primary_concern: verification
priority: high
status: done
summary: >
  Add representative support-probe/report proof cases showing that arbitrary
  unsupported card text is decomposed by reusable diagnostics instead of exact
  card or full-effect branches.
story_boundary: >
  Own only proof/regression tests and small diagnostic integration corrections
  needed to make the CARD-020A/B generic diagnostics demonstrably useful on
  representative arbitrary card text. Do not add new generated playable support,
  runtime behavior, runtime capability records, parser certification, fixture
  support, source hash updates, behavior hash updates, or exact-card prop-ups.
allowed_touch_points:
  - packages/cards/src/support-probe.ts
  - packages/cards/src/support-probe.test.ts
  - packages/cards/src/generated-support-report.ts
  - packages/cards/src/generated-support-report.test.ts
  - packages/cards/src/generated-support-index.ts
  - packages/cards/src/generated-support-types.ts
  - packages/cards/src/*support*.test.ts
  - packages/cards/src/*diagnostic*.ts
  - packages/cards/src/*diagnostic*.test.ts
  - agent-packets/CARD-020C.md
  - stories/generated/CARD-020*.yaml
  - stories/approved/CARD-020*.yaml
  - agent-packets/active.json
