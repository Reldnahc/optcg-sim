spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-024
epic_id: KICK-001
title: Add MIT license and publish repository
type: implementation
area: infra
primary_concern: docs
priority: high
status: done
summary: >
  Add the repository-level MIT license and perform the explicit GitHub
  repository visibility change needed to make the source repository public.
story_boundary: >
  Own only repository licensing metadata, stable onboarding license wording, the
  story/packet lifecycle files needed for this work, and the external GitHub
  repository visibility setting. This story does not launch a public simulator,
  deploy a service, change gameplay, add assets, publish packages, or alter
  product legal/content policy beyond licensing this repository's source code
  under MIT.
allowed_touch_points:
  - LICENSE
  - README.md
  - tests/contracts/spec-authority-gates.test.mjs
  - stories/generated/INF-024-add-mit-license-and-publish-repository.yaml
  - stories/approved/INF-024-add-mit-license-and-publish-repository.yaml
  - agent-packets/INF-024.md
  - agent-packets/active.json
  - GitHub repository visibility setting for Reldnahc/optcg-sim
spec_refs:
  - 13-content-publication-policy.s002
  - 13-content-publication-policy.s008
  - 13-content-publication-policy.s010
  - 13-content-publication-policy.s011
  - 13-content-publication-policy.s013
  - 23-repo-tooling-and-enforcement.s004
  - 23-repo-tooling-and-enforcement.s005
  - 27-spec-driven-story-generation-workflow.s012
  - 32-codex-agent-integration.s004
  - 32-codex-agent-integration.s008
scope:
  - add a root `LICENSE` file containing the standard MIT license text
  - use the explicitly human-confirmed copyright holder and year `Chandler Lee 2026`
  - add concise root README license wording that points to the MIT license file without duplicating the full license text
  - make the README wording clear that the MIT license applies to this repository's own source code, specs, docs, tests, and tooling and does not grant rights to third-party card names, card text, images, set symbols, trademarks, logos, or other third-party content
  - keep the README update stable and onboarding-level; do not add active story status, branch state, or daily progress
  - after the license change lands on `main`, change the GitHub repository visibility for `Reldnahc/optcg-sim` to public using an explicit admin action
  - verify the GitHub repository visibility after the admin action and report whether it is public
non_scope:
  - launching public ranked, unranked, custom-lobby, spectator, tournament, or browser gameplay
  - adding terms of service, privacy policy, takedown policy, content moderation policy, or official asset usage policy
  - changing card image handling, card text storage, trademarks, branding, monetization, package publishing, CI settings, branch protection, deployment, server/client behavior, gameplay, engine behavior, replay behavior, database behavior, or hidden-info filtering
  - making any repository other than `Reldnahc/optcg-sim` public
dependencies: []
acceptance_criteria:
  - root `LICENSE` exists and contains the standard MIT license text with `Copyright (c) 2026 Chandler Lee`
  - root `README.md` includes a concise license section or line linking to `LICENSE`
  - root `README.md` license wording limits MIT licensing to this repository's own source code, specifications, documentation, tests, and tooling and excludes third-party card names, card text, images, set symbols, trademarks, logos, and other third-party content
  - story-review confirms this story is approval-ready and distinguishes repository publication from public simulator launch
  - implementation review confirms no code/runtime/product behavior or public gameplay launch work was included
  - after merge to `main`, GitHub repository visibility for `Reldnahc/optcg-sim` is changed to public and verified
  - if GitHub visibility cannot be changed or verified with available credentials, the story stops with that blocker recorded instead of claiming publication
required_tests:
  - "add or update a contract/onboarding test that pins the root LICENSE holder/year and README third-party-content boundary"
  - "`corepack pnpm run test:contracts` must pass"
  - "`corepack pnpm run format:check` must pass"
  - "`corepack pnpm run packets:verify` must pass after packet activation"
  - "`corepack pnpm run stories:validate` must pass"
  - "`corepack pnpm run verify` must pass"
  - "`gh repo view Reldnahc/optcg-sim --json visibility` or equivalent must verify repository visibility after the admin action"
repo_rules:
  - do not skip story-review; if story-review says this lacks authority, is too broad, or should be split, stop before implementation
  - generated or normalized story must receive per-story story-review before it is presented as approval-ready
  - after story-review passes and human approval is given, move or leave the story in `stories/approved/`, generate and activate its packet, and run `packets:verify` before implementation
  - keep file implementation to `LICENSE`, `README.md`, and story/packet lifecycle files
  - perform the GitHub visibility change only after the license/README PR has merged to `main` and only with explicit human approval for the admin action
  - run the normal implementation-review gate after opening the PR
ambiguity_policy: fail_and_escalate
