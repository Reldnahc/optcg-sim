spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: CARD-012
epic_id: CARD-012
title: Blocker and empty-effect generated support enablement
type: implementation
area: cards
primary_concern: rules
priority: high
status: done
summary: >
  Enable two already-supported generated-support card-data cases: standalone
  printed `[Blocker]` keyword text, including the standard parenthetical
  reminder text, and Poneglyph cards whose printed effect is null or empty and
  normalizes to empty source text. Both cases should become playable support
  evidence without adding new engine behavior or manually admitting individual
  cards.
story_boundary: >
  Own only @optcg/cards parser, generated-support evaluator, runtime capability
  metadata, report/probe rendering, and package-local tests needed to recognize
  standalone Blocker, EB01-017-shaped Blocker reminder text, and empty effect
  text using EB01-005 as the named vanilla proof target. Do not implement
  opponent-turn power modifiers, conditional effects, new combat rules, server
  Redis loading, broad fixture-corpus refreshes, unrelated fixture-only manifest
  regeneration, or per-card manual support records.
allowed_touch_points:
  - fixtures/poneglyph/cards/EB01-005.*.json
  - fixtures/poneglyph/cards/EB01-017.*.json
  - packages/cards/src/certified-card-text-parser.ts
  - packages/cards/src/certified-card-text-parser.test.ts
  - packages/cards/src/generated-support-index.ts
  - packages/cards/src/generated-support-index.test.ts
