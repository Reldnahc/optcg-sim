spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-022
epic_id: KICK-001
title: Add hidden-info to branch-protection required check
type: tooling
area: infra
primary_concern: tooling
priority: critical
status: done
summary: >
  Align the checked-in branch-protection baseline with the existing hidden-info
  CI lane so repository protection guidance requires the hidden-information
  regression check before merge.
story_boundary: >
  Own only checked-in branch-protection guidance and smoke tests that keep the
  required status-check list aligned with the existing CI hidden-info job. Do
  not change hidden-info tests, filtering behavior, CI job semantics, package
  scripts, or GitHub branch settings through live API calls in this story.
allowed_touch_points:
  - .github/branch-protection.md
  - tests/ci/**
  - tests/github/**
spec_refs:
  - 11-testing-quality.s022 (Required repo enforcement linkage)
  - 23-repo-tooling-and-enforcement.s005 (Package scripts)
  - 23-repo-tooling-and-enforcement.s012 (Hidden-information safety enforcement)
  - 23-repo-tooling-and-enforcement.s016 (CI merge gates)
  - 23-repo-tooling-and-enforcement.s023 (Definition of done for repo tooling)
scope:
  - add `hidden-info` to the checked-in branch-protection required status check list
  - add or update smoke tests so the branch-protection baseline requires every intended merge-blocking CI lane, including `hidden-info`
  - verify the branch-protection required-check names remain aligned with `.github/workflows/ci.yml` job names
  - keep the existing hidden-info CI job and root `test:hidden-info` command unchanged
non_scope:
  - changing the hidden-info test harness, fixtures, or assertions
  - changing production hidden-info filtering or player-view behavior
  - changing `.github/workflows/ci.yml` job structure unless tests reveal a name-alignment typo that must be fixed
  - changing `package.json` scripts or root verify wiring
  - applying live GitHub branch-protection settings through API, GitHub CLI, Terraform, or repository admin UI
  - changing reviewer-subagent workflow, PR templates, story schema, or packet lifecycle behavior
dependencies:
  - SEC-001C
acceptance_criteria:
  - "`.github/branch-protection.md` lists `hidden-info` as a required status check before merge"
  - branch-protection smoke tests fail if `hidden-info` is removed from the required-check list
  - branch-protection smoke tests fail if the documented required-check names drift from CI workflow job names
  - no hidden-info tests, production filtering code, package scripts, or live GitHub settings are changed
required_tests:
  - CI/branch-protection smoke test proving the required-check list includes `hidden-info`
  - CI/branch-protection smoke test proving documented required checks match `.github/workflows/ci.yml` job names
  - "`corepack pnpm exec vitest run tests/ci tests/github` must pass"
  - "`corepack pnpm run verify` must pass"
repo_rules:
  - keep this story documentation/test-only unless story-review identifies an existing name mismatch that must be corrected
  - do not change the hidden-info lane implementation; SEC-001C already added the lane
  - do not make live repository-settings changes from this story
  - generated story must receive per-story story-review before it is presented as approval-ready
ambiguity_policy: fail_and_escalate
