spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-049
epic_id: KICK-001
title: Document acceptance closeout matrix
type: implementation
area: engine
primary_concern: verification
priority: high
status: done
summary: >
  Close the current engine/effect foundation milestone with an explicit
  acceptance matrix that maps required acceptance items to committed stories,
  tests, fixture or card-data integration coverage, and known unsupported or
  fail-closed gaps.
story_boundary: >
  Own only closeout verification documentation and the milestone pointer needed
  by repo convention. Do not add gameplay behavior, new card implementations,
  new primitives, fixture capture, server/client/API/UI behavior, or broad
  roadmap rewrites.
allowed_touch_points:
  - docs/effect-runtime-acceptance-closeout.md
  - README.md
  - stories/generated/ENG-049-acceptance-closeout-matrix.yaml
  - stories/approved/ENG-049-acceptance-closeout-matrix.yaml
  - agent-packets/ENG-049.md
  - agent-packets/active.json
spec_refs:
  - 04-effect-runtime.s005
  - 06-visibility-security.s002
  - 06-visibility-security.s004
  - 06-visibility-security.s017
  - 09-card-data-and-support-policy.s010
  - 09-card-data-and-support-policy.s011
  - 09-card-data-and-support-policy.s012
  - 09-card-data-and-support-policy.s013
  - 09-card-data-and-support-policy.s022
  - 11-testing-quality.s004
  - 11-testing-quality.s005
  - 11-testing-quality.s016
  - 11-testing-quality.s020
  - 18-acceptance-tests.s004
  - 18-acceptance-tests.s007
scope:
  - add a milestone closeout matrix document for the current engine/effect foundation
  - map each relevant acceptance item to committed stories, tests, fixture or card-data integration coverage, and known unsupported or fail-closed gaps
  - separate engine behavior coverage from card-data and real-card fixture integration coverage
  - include explicit coverage columns for primitive/unit coverage, synthetic regression coverage, hidden-info coverage, fail-closed unsupported-card coverage, and card-data/fixture integration coverage
  - ensure no engine behavior acceptance row is marked complete solely because a real-card fixture exists
  - identify remaining unsupported behavior and fail-closed gaps explicitly
  - update the README milestone focus pointer only if repo convention requires a stable closeout link
  - add no gameplay behavior unless story-review identifies a tiny missing verification hook and the story is revised before implementation
non_scope:
  - new card implementations
  - new effect primitives
  - new fixture capture
  - server, client, API, WebSocket, database, Redis, replay, or UI behavior
  - broad roadmap rewrites
  - full card catalog coverage
  - packet generator changes
  - story schema changes
dependencies:
  - ENG-048
  - INF-037
acceptance_criteria:
  - "`docs/effect-runtime-acceptance-closeout.md` exists"
  - the closeout document maps current milestone acceptance items to committed stories, tests, fixtures, and known unsupported or fail-closed gaps
  - the matrix separates engine behavior coverage from card-data and fixture integration coverage
  - the matrix includes primitive/unit, synthetic regression, hidden-info, fail-closed unsupported-card, and card-data/fixture integration coverage columns
  - engine behavior rows are not marked complete solely because real-card fixtures exist
  - remaining unsupported behavior and fail-closed gaps are explicit
  - README links the closeout document if story-review confirms the milestone closeout convention applies
  - no gameplay, card implementation, fixture capture, server/client/API/UI, or broad roadmap behavior is added
  - full `corepack pnpm run verify` passes
required_tests:
  - exact candidate story-review before implementation
  - "`corepack pnpm run stories:validate`"
  - "`corepack pnpm run packets:verify`"
  - full `corepack pnpm run verify`
repo_rules:
  - do not skip story-review
  - keep this as one verification/docs story unless story-review finds a missing acceptance item that must become a blocker or follow-up implementation story
  - if the matrix finds a missing acceptance item, record it as a blocker or follow-up instead of declaring broad closeout complete
  - keep real-card fixture and card-data integration coverage separate from engine behavior coverage
  - stay within allowed_touch_points
ambiguity_policy: fail_and_escalate
