story_schema_version: 1.0.0
id: ENG-032
epic_id: KICK-001
title: Battle test suite boundaries
type: refactor
area: engine
primary_concern: verification
priority: medium
status: done
summary: >
  Split oversized battle test suites by existing battle behavior area without
  changing battle legality, timing, damage, Blocker, Counter, Banish, K.O.,
  event, state hash, or hidden-information behavior.
story_boundary: >
  This parent story is not directly implementable. It coordinates
  behavior-preserving test-organization child stories for battle test files that
  exceed the repo size threshold.
allowed_touch_points:
  - stories/generated/ENG-032-battle-test-suite-boundaries-parent.yaml
  - stories/generated/ENG-032A-*.yaml
