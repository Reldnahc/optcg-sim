scope:
  - split battle-declare-attack.test.ts by existing declare attack, Rush, attack timing, and rejection behavior
  - split battle-damage-banish.test.ts by existing vanilla damage, Banish, character K.O., On K.O., fail-closed, and Life Trigger behavior
  - split battle-blocker.test.ts by existing Blocker open, decline, selection, deterministic, invalid, and unsupported paths
  - split battle-counter.test.ts by existing Counter pass, Character Counter, unsupported Counter Event, and fail-closed paths
  - split battle-pipeline-regression.test.ts by existing cross-mechanic regression groups
  - preserve battle event ordering, state hash stability, hidden-information guarantees, and all current assertions
non_scope:
  - adding new battle mechanics
  - changing battle timing, attack legality, Blocker, Counter, Banish, K.O., Life Trigger, or cleanup behavior
  - changing effect runtime behavior
  - changing legal-action or PlayerView projection behavior
  - server/client/UI/replay behavior
dependencies: []
child_stories:
  - id: ENG-032A
    title: Split declare attack legality tests
    concern: Move declare attack legal action and rejection tests into focused files with no behavior change.
    depends_on: []
  - id: ENG-032B
    title: Split Rush legality tests
    concern: Move Rush and Rush Character legality tests into focused files with no behavior change.
    depends_on: [ENG-032A]
  - id: ENG-032C
    title: Split attack timing tests
    concern: Move When Attacking and On Opponent Attack tests into focused files with no behavior change.
    depends_on: [ENG-032B]
  - id: ENG-032D
    title: Split vanilla damage tests
    concern: Move normal Leader damage, Life movement, terminal damage, and public/private damage event tests into focused files.
    depends_on: [ENG-032C]
  - id: ENG-032E
    title: Split Banish damage tests
    concern: Move Banish-specific Life-to-trash and trigger-suppression tests into focused files with no behavior change.
    depends_on: [ENG-032D]
  - id: ENG-032F
    title: Split Character K.O. tests
    concern: Move character K.O., attached DON return, reindexing, and On K.O. battle tests into focused files.
    depends_on: [ENG-032E]
  - id: ENG-032J
    title: Split battle Life Trigger tests
    concern: Move battle-damage Life Trigger decision and response tests into focused files with no behavior change.
    depends_on: [ENG-032F]
  - id: ENG-032G
    title: Split Blocker tests
    concern: Move Blocker open, decline, selection, deterministic, invalid, and unsupported path tests into focused files.
    depends_on: [ENG-032J]
  - id: ENG-032H
    title: Split Counter tests
    concern: Move Counter pass, Character Counter, unsupported Counter Event, and fail-closed tests into focused files.
    depends_on: [ENG-032G]
  - id: ENG-032I
    title: Split battle pipeline regression tests
    concern: Move cross-mechanic battle pipeline regressions into focused files by mechanic group.
    depends_on: [ENG-032H]
acceptance_criteria:
  - every child story is explicitly behavior-preserving and includes no battle behavior change
  - moved tests continue to exercise the same scenarios with the same expected outcomes
  - battle event ordering, state hash stability, hidden-info assertions, and fail-closed assertions remain covered
  - parent integration review confirms the targeted battle test files are smaller or records justified exceptions
required_tests:
  - run corepack pnpm run stories:validate
  - run corepack pnpm run packets:verify for each active child story
  - run focused battle test files for each child story
  - run corepack pnpm run coverage
  - run corepack pnpm run verify before parent PR handoff
repo_rules:
  - do not approve, packetize, or activate ENG-032 itself as an implementation story
  - story-review must confirm the child split is behavior-preserving before any child is approved
  - child stories must be implemented one at a time on a parent integration branch
  - no child may add or alter battle rules behavior
  - line-count reduction is secondary to preserving behavior and reviewability
ambiguity_policy: fail_and_escalate
