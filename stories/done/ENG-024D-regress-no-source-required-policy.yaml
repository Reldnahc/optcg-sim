spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-024D
epic_id: KICK-001
title: Regress no-source-required policy
type: implementation
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Add deterministic coverage for noSourceRequired policy behavior under the
  existing effect queue entry shape.
story_boundary: >
  Own only noSourceRequired helper/runtime fixture coverage and any narrow
  helper adjustments required by that coverage.
allowed_touch_points:
  - packages/engine-core/src/source-presence.ts
  - packages/engine-core/src/source-presence.test.ts
  - packages/engine-core/src/effect-runtime.test.ts
  - stories/approved/ENG-024D-regress-no-source-required-policy.yaml
  - agent-packets/ENG-024D.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s005 (Event journal)
  - 03-game-state-events-decisions.s020 (State hashing)
  - 04-effect-runtime.s006 (Effect queue entry)
  - 04-effect-runtime.s007 (Source presence policy)
  - 04-effect-runtime.s011 (Conditions and costs)
  - 09-card-data-and-support-policy.s011 (Support policy by mode)
  - 11-testing-quality.s007 (Interaction tests)
  - 23-repo-tooling-and-enforcement.s006 (TypeScript enforcement)
  - 23-repo-tooling-and-enforcement.s016 (CI merge gates)
scope:
  - add policy coverage proving noSourceRequired does not require live source-zone presence
  - keep the current EffectQueueEntry source field shape unless story-review requires a separate type/schema story
  - prove unsupported noSourceRequired queue work still fails closed when the effect definition or primitive is unsupported
  - preserve deterministic error/event behavior and state hashes
non_scope:
  - making EffectQueueEntry.source optional
  - queue processor integration
  - global rule-created effect implementation
  - Life Triggers
  - new DSL primitives
  - target selection
  - replacement effects
  - custom handlers
  - server/client/UI or replay schema
dependencies:
  - ENG-024C
acceptance_criteria:
  - noSourceRequired policy has deterministic accepted helper coverage independent of live source location
  - unsupported runtime work under noSourceRequired still fails closed without partial mutation
  - tests do not change public card DSL, queue schema, or gameplay timing behavior
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/source-presence.test.ts packages/engine-core/src/effect-runtime.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-024D packet while implementing this story
  - run corepack pnpm run packets:verify before implementation and review handoff
  - stay within allowed_touch_points
  - target the ENG-024 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - if implementation requires queue processor production wiring or changing processNoChoiceEffectQueue, stop and defer to ENG-024E
  - if implementation requires optional queue-entry sources, global rule-created effects, or new trigger timing, stop and split or record the blocker
  - implementation-review gate is required after the PR is opened
ambiguity_policy: fail_and_escalate
