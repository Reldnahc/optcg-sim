title: Implement narrow Counter Event foundation
type: implementation
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Support the first narrow playable `[Counter]` Event path during the Counter
  Step by reusing existing Counter Step, Event support-gate, DON payment,
  hand-to-trash movement, and battle-duration counter-power behavior.
story_boundary: >
  Own only engine-core Counter Event legality and resolution for one reviewed
  implemented-dsl shape: a mandatory `[Counter]` Event that grants battle-duration
  power to the current battle target. Stop before real-card fixture capture,
  optional effects, once-per-turn, replacement effects, search/reveal, a general
  continuous-effect system, server/client/API/UI work, or card-data integration.
