story_schema_version: 1.0.0
id: ENG-059B
epic_id: ENG-059
title: Conditional continuous keyword grants
type: implementation
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Add a reusable engine path for conditionally granting supported public
  keywords through continuous runtime modifiers, proving the allowlisted
  public combat keywords through the same generic computed-view path without
  mutating canonical card state.
story_boundary: >
  Own only engine-core continuous keyword-grant support, computed-view
  derivation, and tests for supported public keyword grants. Do not change
  parser support, generated-support records, real-card fixtures, or field
  removal protection.
