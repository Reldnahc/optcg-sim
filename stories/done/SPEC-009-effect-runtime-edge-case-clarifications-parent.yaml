child_stories:
  - id: SPEC-009A
    title: drawUpTo short-deck runtime semantics
    concern: Clarify short-deck and partial-deck drawUpTo runtime behavior, including replay and state-hash authority.
    depends_on: [SPEC-008B, SPEC-008C, SPEC-008D]
  - id: SPEC-009B
    title: playSelected stale saved-selection failure policy
    concern: Clarify fail-closed runtime behavior when playSelected consumes stale, illegal, or non-hand saved selections.
    depends_on: [SPEC-008C, SPEC-008D]
scope:
  - define the SPEC-009 child stories for the two ENG-055 review findings that require new or clearer specification authority
  - clarify drawUpTo short-deck behavior before ENG-055H is regenerated and reviewed
  - clarify playSelected stale saved-selection behavior before ENG-055G and saved-reference consumers are regenerated and reviewed
  - keep citation-only ENG-055 story review findings out of this SPEC series unless they reveal a true spec authority gap
non_scope:
  - direct parent implementation
  - TypeScript contract changes, effect DSL schema changes, engine runtime behavior, parser behavior, generated-support metadata, real-card fixtures, or support reports
  - revision of ENG-055 implementation stories except to list this SPEC series as a future dependency after the SPEC stories are reviewed
  - server, client, API, UI, replay implementation, database, infrastructure, or gameplay implementation
acceptance_criteria:
  - SPEC-009 is not implemented directly
  - SPEC-009A and SPEC-009B are independently reviewable child stories
  - the resulting spec wording gives ENG-055H stable authority for short-deck drawUpTo behavior
  - the resulting spec wording gives ENG-055G and saved-reference consumers stable authority for stale saved hand-selection failure policy
  - no runtime, schema, parser, or card-support behavior is changed by this SPEC series
required_tests:
  - run story-review for the SPEC-009 parent story set
  - run `corepack pnpm run stories:validate`
repo_rules:
  - use the parent/substory workflow
  - activate only one approved SPEC-009 child packet at a time
  - do not implement runtime, schema, parser, generated-support, or card behavior in this SPEC series
  - update spec metadata whenever spec sections change
ambiguity_policy: fail_and_escalate
