id: CARD-008D
epic_id: CARD-008
title: Generated support report smoke
type: implementation
area: cards
primary_concern: verification
priority: high
status: done
summary: >
  Produce a deterministic generated-support report over inline synthetic smoke
  inputs showing supported cards, unsupported blockers, missing primitives,
  unparsed spans, and parser rules used.
story_boundary: >
  Own only generated-support report construction, inline synthetic smoke inputs
  needed for the report tests, exports, tests, and any tiny runtime capability
  evidence correction required for the already-approved composition rule. Do
  not broaden parser grammar, support indexing semantics, deck validation,
  gameplay behavior, or live catalog access in this story.
allowed_touch_points:
  - packages/cards/src/generated-support-report.ts
  - packages/cards/src/generated-support-report.test.ts
  - packages/cards/src/generated-support-index.ts
  - packages/cards/src/generated-support-types.ts
  - packages/cards/src/runtime-capability-matrix.ts
  - packages/cards/src/runtime-capability-matrix.test.ts
  - packages/cards/src/index.ts
  - stories/generated/CARD-008D-generated-support-report-smoke.yaml
  - stories/approved/CARD-008D-generated-support-report-smoke.yaml
  - agent-packets/CARD-008D.md
  - agent-packets/active.json
spec_refs:
  - 04-effect-runtime.s005
  - 05-effect-dsl-reference.s022
  - 09-card-data-and-support-policy.s010
  - 09-card-data-and-support-policy.s011
  - 09-card-data-and-support-policy.s012
  - 09-card-data-and-support-policy.s013
  - 09-card-data-and-support-policy.s014
  - 09-card-data-and-support-policy.s015
  - 09-card-data-and-support-policy.s016
  - 09-card-data-and-support-policy.s022
  - 11-testing-quality.s005
  - 11-testing-quality.s016
  - 11-testing-quality.s020
scope:
  - build a deterministic generated support report from generated support index entries
  - report supported card IDs, unsupported card IDs, blockers, missing primitives, unparsed spans, and parser rules used
  - use inline synthetic smoke inputs in `generated-support-report.test.ts` only
  - prove partial parse and missing capability blockers remain visible in the report
  - correct missing runtime capability evidence only if the report smoke exposes an already-approved parser rule as unsupported
  - keep fixture/card-data evidence separate from engine behavior tests
non_scope:
  - full catalog support report
  - live Poneglyph access in CI
  - parser grammar expansion
  - support index semantics changes beyond report-facing accessors
  - deck validation changes
  - gameplay behavior changes
  - custom handlers
  - server, client, API, UI, Redis, database, or replay work
dependencies:
  - CARD-008C
acceptance_criteria:
  - generated support report clearly explains supported cards, unsupported cards, missing primitives, unparsed spans, and parser rules used
  - report output is deterministic
  - report tests distinguish generated-support/card-data evidence from engine behavior tests
  - no live Poneglyph, Redis, server, client, API, or UI dependency is introduced
required_tests:
  - exact candidate story-review before implementation
  - focused generated support report smoke tests for supported and unsupported inline synthetic entries
  - run `corepack pnpm run packets:verify`
  - run `corepack pnpm run stories:validate`
  - run `corepack pnpm --filter @optcg/cards test`
  - full `corepack pnpm verify`
repo_rules:
  - generate and activate the CARD-008D packet before implementation
  - stay within allowed_touch_points
  - do not implement broad catalog reporting or live Poneglyph access
  - keep generated-support evidence separate from engine behavior test claims
ambiguity_policy: fail_and_escalate
