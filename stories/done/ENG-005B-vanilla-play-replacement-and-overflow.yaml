spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-005B
epic_id: M1-001
title: Add vanilla Stage replacement and Character overflow play
type: implementation
area: engine
primary_concern: rules
priority: high
status: done
summary: >
  Extend vanilla `playCard` from hand to handle occupied Stage Area replacement
  and full Character Area overflow using the canonical card-selection decision
  response path.
story_boundary: >
  Own only the destination-conflict behavior for already-payable vanilla Stage
  and Character play from hand. Stop before Event cards, On Play effect queueing,
  full effect runtime decisions, and client prompt projection.
allowed_touch_points:
  - packages/engine-core/**
  - tests/engine/**
