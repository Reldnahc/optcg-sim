title: Top-N search remainder runtime
type: implementation
area: engine
primary_concern: rules
priority: high
status: generated
summary: >
  Expand reusable search runtime from the current top-one character-only shape
  to top-N deck search with composed filters or unfiltered any-card selection,
  selected-card movement to hand, reveal semantics, and bottom-of-deck remainder
  ordering.
story_boundary: >
  Engine runtime story only. Do not add card parser/generated-support behavior,
  real-card fixtures, support reports, source hashes, behavior hashes, or shared
  contract/schema changes unless a contract blocker is discovered and split.
