spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-045F
epic_id: KICK-001
title: Preserve passthrough and fail-closed replacement safety
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Add integrated no-replacement passthrough, unsupported-shape, state-hash,
  event-ordering, and PlayerView hidden-info regressions for the replacement
  process foundation.
story_boundary: >
  Own only integrated regressions and any small safety hardening needed for the
  ENG-045 foundation. Do not add new replacement capabilities.
allowed_touch_points:
  - packages/engine-core/src/effect-runtime-primitives.ts
  - packages/engine-core/src/effect-runtime-target-primitives.test.ts
  - packages/engine-core/src/filter-state-for-player.ts
  - packages/engine-core/src/filter-state-for-player.test.ts
  - packages/engine-core/src/filter-state-for-player.real-states-baseline.test.ts
  - packages/engine-core/src/filter-state-for-player.real-states-battle.test.ts
  - stories/generated/ENG-045F-replacement-passthrough-fail-closed-hidden-info.yaml
  - stories/approved/ENG-045F-replacement-passthrough-fail-closed-hidden-info.yaml
  - agent-packets/ENG-045F.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s006
  - 03-game-state-events-decisions.s018
  - 04-effect-runtime.s013
  - 11-testing-quality.s004
  - 22-v6-implementation-tightening.s011
scope:
  - prove no-replacement passthrough remains unchanged after the integrated foundation
  - add fail-closed coverage for unsupported replacement triggers, multiple candidates, hidden/private target shapes, unsupported instead effects, and malformed pending process state
  - assert state hash stability and event ordering for passthrough, declined, accepted, and unsupported paths
  - assert PlayerView hides raw `replacementState`, process payloads, candidate internals, and private card identities
non_scope:
  - new replacement behavior beyond ENG-045A through ENG-045E
  - real-card fixtures or card-data integration
  - server/client/API/UI work
dependencies:
  - ENG-045A
  - ENG-045B
  - ENG-045C
  - ENG-045D
  - ENG-045E
acceptance_criteria:
  - no-replacement selected-target KO passthrough remains deterministic
  - unsupported replacement shapes fail closed without state mutation
  - event sequencing and state hashes are covered for all supported paths
  - PlayerView does not leak replacement internals or hidden information
required_tests:
  - run `corepack pnpm exec vitest run packages/engine-core/src/effect-runtime-target-primitives.test.ts packages/engine-core/src/filter-state-for-player.test.ts packages/engine-core/src/filter-state-for-player.real-states-baseline.test.ts packages/engine-core/src/filter-state-for-player.real-states-battle.test.ts`
  - run `corepack pnpm --filter @optcg/engine-core typecheck`
  - run `corepack pnpm run packets:verify`
  - run `corepack pnpm run verify`
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-045F packet while implementing this story
  - stay within allowed_touch_points
  - target the ENG-045 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
ambiguity_policy: fail_and_escalate
