spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-027
epic_id: KICK-001
title: K.O. trigger foundation
type: implementation
area: engine
primary_concern: rules
priority: high
status: generated
summary: >
  Deliver the first supported K.O.-trigger timing slice through
  concern-scoped child stories.
story_boundary: >
  This parent story is not directly implementable. It coordinates detection,
  queueing, source-presence handling, and regression coverage for supported
  effects that trigger from battle K.O. events. Each child story owns one
  reviewable concern and must preserve fail-closed behavior for unsupported
  effects.
allowed_touch_points:
  - stories/generated/ENG-027-ko-trigger-foundation-parent.yaml
  - stories/approved/ENG-027A-detect-battle-ko-trigger-candidates.yaml
  - stories/approved/ENG-027B-queue-supported-ko-trigger-effects.yaml
  - stories/approved/ENG-027C-resolve-ko-effects-from-trash-or-lki.yaml
  - stories/approved/ENG-027D-verify-ko-trigger-resolution-safety.yaml
spec_refs:
  - 02-engine-mechanics.s021 (Damage Step)
  - 02-engine-mechanics.s041 (Auto-effect timing details)
  - 03-game-state-events-decisions.s005 (Event journal)
  - 03-game-state-events-decisions.s020 (State hashing)
  - 04-effect-runtime.s006 (Effect queue entry)
  - 04-effect-runtime.s007 (Source presence policy)
  - 04-effect-runtime.s008 (Trigger detection from events)
  - 04-effect-runtime.s009 (Effect queue ordering)
  - 04-effect-runtime.s010 (Queue processing)
  - 04-effect-runtime.s011 (Conditions and costs)
  - 05-effect-dsl-reference.s005 (Triggers)
  - 05-effect-dsl-reference.s012 (Effects)
  - 05-effect-dsl-reference.s029 (Schema coverage policy)
  - 06-visibility-security.s004 (PlayerView shape)
  - 09-card-data-and-support-policy.s011 (Support policy by mode)
  - 11-testing-quality.s007 (Interaction tests)
  - 11-testing-quality.s008 (Invariant tests)
  - 11-testing-quality.s011 (Hidden-information tests)
  - 18-acceptance-tests.s004 (Effect runtime acceptance tests)
scope:
  - decompose supported K.O.-trigger behavior into approved child stories
  - detect K.O. trigger candidates from public battle K.O. events without adding other trigger categories
  - queue supported K.O. effects deterministically after the battle K.O. process
  - use existing source-presence policy handling for trash and last-known-information resolution
  - resolve only currently supported no-choice effect primitives
  - preserve fail-closed behavior for unsupported K.O. effect shapes and unsupported surrounding battle work
  - preserve deterministic event ordering, stable hashes, and hidden-info-safe PlayerView projection
non_scope:
  - direct implementation from this parent story
  - approving or packetizing this parent story as an active implementation story
  - Life Triggers
  - replacement effects
  - target selection unless story-review requires a separate prerequisite
  - custom handlers
  - optional activation
  - once-per-turn behavior
  - server/client/UI
  - replay schema or replay storage
dependencies:
  - ENG-026
child_stories:
  - id: ENG-027A
    title: Detect battle K.O. trigger candidates
    concern: Identify supported K.O. trigger candidates from battle cardKOd/cardMoved event batches while unsupported candidates fail closed without mutation.
    depends_on: [ENG-026]
  - id: ENG-027B
    title: Queue supported K.O. trigger effects
    concern: Convert supported K.O. candidates into deterministic effect queue entries after battle K.O. resolution.
    depends_on: [ENG-027A]
  - id: ENG-027C
    title: Resolve K.O. effects from trash or last-known info
    concern: Resolve queued no-choice K.O. effects using existing resolveFromDestinationZone and resolveFromLastKnownInformation policy behavior.
    depends_on: [ENG-027B]
  - id: ENG-027D
    title: Verify K.O. trigger resolution safety
    concern: Prove supported K.O. trigger resolution composes with battle cleanup, event sequencing, state hashes, and PlayerView filtering.
    depends_on: [ENG-027C]
acceptance_criteria:
  - child stories exist and pass set-level and exact per-story story-review before implementation
  - child stories cover K.O. candidate detection, deterministic queueing, trash or last-known source presence, no-choice resolution, fail-closed unsupported behavior, and hidden-info-safe projection
  - parent integration review confirms all child stories compose without broadening into Life Triggers, replacement effects, target selection, custom handlers, optional activation, server/client/UI, or replay schema
required_tests:
  - run corepack pnpm run stories:validate
  - run corepack pnpm run packets:verify for each active child story
  - run corepack pnpm run verify before parent PR handoff
repo_rules:
  - do not approve, packetize, or activate ENG-027 itself as an implementation story
  - approve and implement only ENG-027A through ENG-027D as child stories
  - story-review must pass before presenting this story group as approval-ready
  - a set-level story-review does not satisfy exact per-story story-review for any child
  - run exact per-story story-review for each child story before moving it to approved or implementing it
  - use a parent integration branch
  - open child PRs into the parent integration branch
  - keep one active child packet at a time
  - substory human review is deferred only because the user explicitly requested the parent integration branch workflow for this group
  - do not run packets:complete for children until the parent branch lands on main
  - run parent integration review before merging to main
  - after the parent branch merges to main, run packets:complete-many for ENG-027A through ENG-027D
ambiguity_policy: fail_and_escalate
