story_schema_version: 1.0.0
id: ENG-029
epic_id: KICK-001
title: Target selection foundation
type: implementation
area: engine
primary_concern: rules
priority: high
status: generated
summary: >
  Deliver the first reusable engine path for effects that require player-selected
  targets through concern-scoped child stories.
story_boundary: >
  This parent story is not directly implementable. It coordinates authoritative
  target candidate resolution, selectTargets decision creation, response
  validation, supported target-effect integration if a current primitive can use
  it, and hidden-information regression coverage for target candidates.
allowed_touch_points:
  - stories/generated/ENG-029-target-selection-foundation-parent.yaml
  - stories/approved/ENG-029A-resolve-target-candidates.yaml
  - stories/approved/ENG-029B-create-select-targets-decision.yaml
  - stories/approved/ENG-029C-validate-select-targets-response.yaml
  - stories/approved/ENG-029D-integrate-simple-target-effect.yaml
  - stories/approved/ENG-029E-verify-target-candidate-visibility.yaml
