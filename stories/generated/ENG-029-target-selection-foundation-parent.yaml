scope:
  - decompose target selection into approved child stories
  - build target candidate sets from authoritative GameState instead of display or client-provided data
  - create selectTargets PendingDecision values only for supported target requests with deterministic candidates
  - validate selected target responses against the active decision, current state, min/max rules, duplicate rules, and candidate legality
  - preserve a deterministic fail-closed path for target-based effect resolution because the current runtime has no supported target-based primitive
  - defer actual target-effect primitive resolution to a later exact primitive story
  - project selectTargets pending decisions through the existing minimal PublicDecision shape without candidate arrays unless a later contract story authorizes a public candidate DTO
  - fail closed when candidate visibility, target legality, or source authority is ambiguous
non_scope:
  - direct implementation from this parent story
  - approving or packetizing this parent story as an active implementation story
  - search, look, or reveal transient sets
  - replacement effects
  - optional activation beyond existing landed behavior
  - custom handlers
  - new gameplay keywords
  - server/client/UI
  - replay schema or replay storage
dependencies:
  - ENG-028E
child_stories:
  - id: ENG-029A
    title: Resolve target candidates
    concern: Introduce a reusable authoritative helper that resolves supported target candidate sets and fails closed for unsupported or ambiguous requests.
    depends_on: [ENG-028E]
  - id: ENG-029B
    title: Create selectTargets decision
    concern: Pause supported target-requiring effect work with a deterministic selectTargets pending decision for the chooser without exposing executable target responses yet.
    depends_on: [ENG-029A]
  - id: ENG-029C
    title: Validate selectTargets response
    concern: Expose executable selectTargets legal actions only after adding response validation, then validate target answers against current candidate legality and resume deterministically.
    depends_on: [ENG-029B]
  - id: ENG-029D
    title: Guard target effect primitive gap
    concern: Lock in deterministic fail-closed behavior for selected-target continuation while no target-based primitive is supported.
    depends_on: [ENG-029C]
  - id: ENG-029E
    title: Verify target candidate visibility
    concern: Prove selectTargets decisions, legal actions, events, and PlayerView projection do not leak hidden or private candidate information.
    depends_on: [ENG-029D]
acceptance_criteria:
  - child stories exist and pass set-level and exact per-story story-review before implementation
  - child stories cover authoritative candidate resolution, decision creation, response validation, deterministic fail-closed primitive gap handling, and hidden-info-safe projection
  - target candidates are computed from GameState and never from client display data or submitted raw target IDs outside the active decision context
  - parent integration review confirms all child stories compose without broadening into search/look/reveal transient sets, replacement effects, optional activation, custom handlers, server/client/UI, or replay schema
required_tests:
  - run corepack pnpm run stories:validate
  - run corepack pnpm run packets:verify for each active child story
  - run corepack pnpm run verify before parent PR handoff
repo_rules:
  - do not approve, packetize, or activate ENG-029 itself as an implementation story
  - approve and implement only ENG-029A through ENG-029E as child stories
  - story-review must pass before presenting this story group as approval-ready
  - a set-level story-review does not satisfy exact per-story story-review for any child
  - run exact per-story story-review for each child story before moving it to approved or implementing it
  - use a parent integration branch
  - open child PRs into the parent integration branch
  - keep one active child packet at a time
  - substory human review is deferred only because the user explicitly requested the parent integration branch workflow for this group
  - do not run packets:complete for children until the parent branch lands on main
  - run parent integration review before merging to main
  - after the parent branch merges to main, run packets:complete-many for ENG-029A through ENG-029E
ambiguity_policy: fail_and_escalate
