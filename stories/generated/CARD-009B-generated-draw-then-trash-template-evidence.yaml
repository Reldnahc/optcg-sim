summary: >
  Certify generated parser/capability/index/report behavior for the narrow
  `Draw N cards and trash M cards from your hand` template using ENG-050 runtime
  capability evidence.
story_boundary: >
  Own only cards-package generated-support parser, capability, support-index,
  and report behavior for draw-then-trash templates. Do not add engine runtime
  behavior or OP10-045 fixture support in this story.
