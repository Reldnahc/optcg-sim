id: CARD-020
epic_id: CARD-020
title: Generic support-probe diagnostics parent
type: implementation
area: cards
primary_concern: verification
priority: high
status: generated
summary: >
  Coordinate a cards-side diagnostics story set that makes the support probe
  useful for arbitrary card text by decomposing unsupported text into reusable
  diagnostic components and exact missing layers, without adding generated
  playable support or card-specific prop-ups.
story_boundary: >
  Parent planning story only. Do not implement this parent directly. Implement
  CARD-020A through CARD-020D one at a time after distinct parent and child
  story-review evidence exists. This parent authorizes replacing the cards-side
  support-probe/report diagnostic internals if needed, but only for diagnostics.
  It must not add engine runtime behavior, shared schema authority, fixture
  support, source hash changes, behavior hash changes, overlays, or generated
  playable support.
