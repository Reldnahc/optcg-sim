  - CARD-018A
  - CARD-019B
child_stories:
  - id: CARD-020A
    title: Generic card-text diagnostic scanner
    concern: Build a reusable package-local scanner that recognizes wrappers, condition fragments, connectors, cardinality, targets, predicates, actions, modifiers, restrictions, durations, costs, destinations, and sequence boundaries as diagnostic components for arbitrary card text.
    depends_on: [CARD-017C, CARD-018A, CARD-019B]
  - id: CARD-020B
    title: Probe/report diagnostic integration
    concern: Integrate the generic diagnostic scan into support-probe and generated-support-report output so unsupported text reports the deepest recognized layer and the exact missing component/layer without changing support status.
    depends_on: [CARD-020A]
  - id: CARD-020C
    title: Arbitrary-card probe proof bundle
    concern: Add representative probe/report proof cases for arbitrary unsupported card text, including slash wrappers, condition chains, comparator phrases, sequence connectors, unsupported actions, and wrapper/cost boundaries, without broadening generated playable support.
    depends_on: [CARD-020B]
  - id: CARD-020D
    title: Generated support proof/certificate reporting
    concern: Add generated-support proof/certificate reporting so probe/report output distinguishes parse success, schema validity, runtime capability coverage, engine proof evidence, and final playable support without making any new card playable.
    depends_on: [CARD-020B]
scope:
  - replace or refactor cards-side support-probe/report diagnostic internals where needed so diagnostics are generated from reusable component scanning, not card-specific or full-effect-shape prop-ups
  - "keep CARD-020 as a cards diagnostic and support-gating layer above the engine: it may explain printed source text and missing support layers, but it must not execute rules, reimplement engine behavior, or enumerate effect permutations as a substitute for reusable diagnostic components"
  - require diagnostics for arbitrary card text to report recognized components when they can be safely identified, even when the full card remains unsupported
  - separate diagnostic recognition from generated-support certification; recognized diagnostic components must not by themselves create DSL, runtime capability evidence, support metadata, source integrity, or playable status
  - separate parse success from playable support by requiring generated-support proof/certificate reporting for the full support chain before any output can describe a card as playable
  - require proof/certificate output to list source hash and behavior hash status, parse completeness, generated DSL schema validation status, component evidence IDs, required runtime capability IDs, missing runtime capability IDs, engine-proof/test-evidence status where the repo can currently represent it, and a final playable decision derived from the full chain
  - require missing-layer reporting for parser, schema, runtime capability, source integrity, metadata/review/test status, stale hash, unsupported primitive, unsupported trigger, unsupported cost, unsupported optionality, unsupported condition, unsupported cardinality, unsupported target, unsupported destination, unsupported duration, unsupported modifier/restriction, unsupported saved-reference, and unsupported sequence/action composition
  - preserve existing blocker identities for `unparsed-span`, `ambiguous-wording`, `custom-handler-required`, `unsupported-primitive`, `stale-hash`, `invalid-dsl-schema`, and `missing-runtime-capability`
  - keep stale hash as highest-priority and never silently refresh or rewrite fixture evidence
  - allow whole-card unsupported diagnostics only when no reusable scanner component safely matches a narrower span
  - require representative coverage rather than a cartesian product of every card, wrapper, condition, and body
non_scope:
  - direct parent implementation
  - generated playable support for new cards or effects
  - parser certification for new playable support
  - using parse success, schema validity, scanner recognition, or component discovery alone as playable-support authority
  - engine runtime behavior
  - runtime capability records
  - shared TYP/contracts/schema changes; if implementation or story-review finds a real shared authority gap, stop and split a prerequisite TYP/contracts story instead of carrying the work in CARD-020
  - real-card fixture support, fixture capture, fixture recapture, source hash updates, behavior hash updates, overlays, or support manifest changes
  - server, client, API, UI, database, replay, WebSocket, Redis, or live Poneglyph work
  - exact card-text branches, exact full-effect branches, per-card allowlists, or synthetic fake evidence used to make an example look supported
card_source_integrity:
  - not applicable for direct parent implementation because this parent does not enable or change gameplay support for any card
  - children must not edit source fixtures, source hashes, behavior hashes, overlays, supported-card manifests, or manually reviewed source evidence
  - printed examples may be used as support-probe inputs only; if a child accidentally makes any example generated-supported, it must fail review unless every existing source-integrity, schema, runtime capability, metadata, test, and review gate already passes without new fixture or hash work
engine_capability_preflight:
  - not applicable for direct parent implementation because this parent adds no runtime capability or gameplay behavior
  - children must treat runtime capability evidence as read-only diagnostic input
  - missing runtime support must be reported as a missing layer, not hidden by cards-side diagnostic logic
acceptance_criteria:
  - CARD-020 is not implemented directly
  - CARD-020A, CARD-020B, CARD-020C, and CARD-020D are independently reviewable child stories
  - parent and every child story-review artifact exists with distinct assignment identity and distinct durable artifact identity before approval handoff, packet generation, activation, implementation handoff, or PR handoff
  - support-probe diagnostics can be run against arbitrary card text and produce actionable component output when known components are present
  - unsupported text remains unsupported unless existing generated-support gates already make the complete behavior playable
  - probe/report output makes it impossible to confuse parsed successfully, generated DSL schema-valid, runtime capabilities covered, engine proof exists, and playable supported
  - parsing alone is never reported as card works, playable, supported, or verified playable support
  - final playable support is derived from the full generated-support proof chain, not parser success, diagnostic recognition, or schema validity alone
  - diagnostics are component-driven and reusable; they do not depend on exact card IDs, exact full printed text, or one-off full-effect branches
  - a child implementation fails review if its proof examples pass only because the exact sample text, card ID, or complete effect sentence appears in implementation logic
  - a child implementation also fails review if its proof examples pass through sample-shaped templates, sample-specific regular expressions, or complete sample-effect branches that do not decompose through reusable component scanner paths
  - whole-card unsupported diagnostics are used only when no narrower reusable component can safely match
  - existing CARD-008, CARD-009, CARD-012, CARD-013, CARD-014, CARD-015, CARD-016, CARD-017, CARD-018, and CARD-019 support behavior remains compatible
  - parent PR cleanup metadata lists CARD-020A through CARD-020D and binds the non-packetized CARD-020 parent closeout after merge to main
required_tests:
  - story-review for CARD-020 parent before approval handoff
  - story-review for CARD-020A before approval handoff
  - story-review for CARD-020B before approval handoff
  - story-review for CARD-020C before approval handoff
  - story-review for CARD-020D before approval handoff
  - reconstruct a parent/child story-review matrix with distinct assignment and artifact identities per row before approval or implementation handoff
  - story-specific tests from CARD-020A, CARD-020B, CARD-020C, and CARD-020D
  - per-child reviewed commit evidence, AI review record, revision response, and verification evidence for CARD-020A through CARD-020D before parent PR handoff
  - role packet extraction output before each implementation handoff and before each code-review handoff
  - final parent PR full-story integration review covering all child commits, packet history, cleanup metadata, CI, verification, and unresolved comments before human-review handoff
  - cleanup metadata handoff preflight against the actual PR body or durable handoff comment, fetched changed files, fetched head branch, fetched status checks, and reviewed PR evidence before reviewer or human-review handoff
  - confirm the remote `cleanup-metadata-guard` check is present and passing before reviewer or human-review handoff
  - run `corepack pnpm run stories:validate`
  - run `corepack pnpm run packets:verify`
  - run `corepack pnpm --filter @optcg/cards test`
  - full `corepack pnpm verify`
repo_rules:
  - use the parent/substory workflow
  - do not activate or implement CARD-020 directly
  - generate and activate one CARD-020 child packet at a time
  - do not complete child packets until the parent branch lands on main
  - keep CARD-020A through CARD-020D work on one parent integration branch with reviewed child commits
  - do not open child PRs to main; use one final parent PR to main
  - parent PR cleanup metadata must list CARD-020A through CARD-020D and bind the non-packetized CARD-020 parent closeout
  - run role packet extraction before implementation and code-review handoffs
  - run cleanup metadata handoff preflight and confirm passing remote `cleanup-metadata-guard` before reviewer and human-review handoff
  - fail closed on any diagnostic ambiguity that could accidentally mark unsupported text playable
ambiguity_policy: fail_and_escalate
