repo_rules:
  - use the parent/substory workflow
  - do not activate or implement SUP-002 directly
  - generate and activate one SUP-002 child packet at a time
  - implement SUP-002A, SUP-002H, SUP-002I, and SUP-002B through SUP-002D before SUP-002E through SUP-002G
  - do not complete child packets until the parent branch lands on main
  - keep SUP-002A through SUP-002I work on one parent integration branch with reviewed child commits
  - do not open child PRs to main; use one final parent PR to main
  - parent PR cleanup metadata must list SUP-002A through SUP-002I and bind the non-packetized SUP-002 parent closeout
  - run role packet extraction before implementation and code-review handoffs
  - fail closed on any parser, schema, runtime capability, source integrity, metadata, review, test, or wording ambiguity that could accidentally mark unsupported text playable
