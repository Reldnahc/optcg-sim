summary: >
  Coordinate the contract, engine, and cards-layer work needed for three
  reusable support families: optional hand-trash costs that gate targeted K.O.,
  conditional continuous base-power setters, and top-N deck search with composed
  filters or unfiltered any-card selection plus bottom-of-deck remainder
  ordering. This parent keeps the full support chain visible while each child
  stays in one concern.
story_boundary: >
  Parent planning story only. Do not implement this parent directly. Implement
  SUP-002A through SUP-002I one at a time after distinct parent and child
  story-review evidence exists. Contract authorability must land before engine
  runtime behavior that consumes it, and engine runtime behavior must land
  before cards-layer parser/generated-support promotion cites it.
