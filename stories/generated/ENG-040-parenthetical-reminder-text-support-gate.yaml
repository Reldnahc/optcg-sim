scope:
  - add an engine-core support-gate helper that removes parenthetical spans from printed effect text only for internal unsupported-rules-text checks
  - use the helper across the narrow engine gates that currently reject OP04-014 solely because explanatory-note text makes `effectText` non-empty: combat metadata, vanilla Character play metadata, and start-of-main board-card metadata
  - treat parenthetical text as `02-engine-mechanics.s045` explanatory notes for these support gates, including explanatory notes for keyword effects and other card effects
  - keep the support-gate decision aligned with `02-engine-mechanics.s045`: explanatory notes do not influence gameplay
  - after explanatory-note stripping, allow only already-supported complete combat keyword bodies such as exact `[Banish]` to pass these gates; non-keyword or unsupported remaining effect text must still fail closed
  - preserve raw Poneglyph payloads, normalized ResolvedCard.effectText, sourceTextHash, behaviorHash, manifest display text, and PlayerView card text exactly as produced before this story
  - keep the explanatory-note-stripped text out of persistent card metadata unless existing contracts already have an internal-only support-gate field; prefer a local engine helper over new manifest fields
  - use the helper only to decide whether the narrow combat, vanilla Character play, and start-of-main board support gates have unsupported extra rules text; do not use it to parse, execute, or generate effects
  - allow OP04-014 to move from unsupported to vanilla-confirmed only if the engine can consume the real manifest card as-is and apply already-implemented Banish keyword behavior
  - update the real-card DSL manifest fixture so OP04-014 carries reviewed support metadata only after the engine runtime test passes with unchanged effectText
  - add positive engine-core coverage proving OP04-014 from the checked-in real manifest deals Banish leader damage and moves the damaged Life card to trash without creating a Trigger decision
  - add positive engine-core coverage proving OP04-014 can pass vanilla Character play metadata and start-of-main board-card checks without mutating its printed text
  - add negative engine-core coverage proving non-parenthetical extra effect text still fails closed
  - add negative engine-core coverage proving malformed or mixed text does not become supported merely because it contains parentheses
  - preserve package-boundary behavior: engine-core consumes plain MatchCardManifest data only and must not import @optcg/cards or live Poneglyph surfaces
  - update or close the CARD-006 OP04-014 blocker note only to reflect the reviewed resolution, if the implementation resolves it
non_scope:
  - changing Poneglyph API, Poneglyph fixtures, or cards normalization semantics
  - stripping or mutating ResolvedCard.effectText, raw payloads, PlayerView card text, sourceTextHash, behaviorHash, or manifest display text
  - broad real-fixture search, capture, or classification beyond OP04-014
  - supporting Double Attack, Rush, Blocker, or other real keyword cards unless they are needed as narrow negative tests and already present in checked-in fixtures
  - new combat keyword behavior
  - new effect DSL primitives, effect generation, custom handlers, target shapes, optional effects, once-per-turn, replacement effects, search/reveal, Counter Events, Life Trigger changes, permanent modifiers, or multi-damage
  - server, client, API, WebSocket, database, deck-builder, or UI integration
  - live Poneglyph, live Redis, Postgres, browser, or UI requirements in tests or CI
  - changing engine-core to import @optcg/cards, Poneglyph HTTP, Redis, Postgres, server, client, or UI code
acceptance_criteria:
  - OP04-014 remains display-identical in the real-card manifest, including its parenthetical Banish explanatory note
  - OP04-014 support metadata becomes supportable only through reviewed existing Banish keyword behavior and without effectDefinitionId or customHandlerIds
  - OP04-014 engine-core runtime coverage consumes plain checked-in manifest data and proves Banish damage trashes Life without activating Trigger flow
  - OP04-014 engine-core support coverage proves the same manifest card can pass play-card and start-of-main board gates that would otherwise reject non-empty explanatory-note effect text
  - 'play-card and start-of-main support gates still fail closed when stripped text is `[Banish]` but the resolved card lacks matching `printedKeywords: ["banish"]`'
  - parenthetical explanatory-note removal is limited to internal support-gate unsupported-text checks and does not mutate hashes or persisted/display card text
  - non-parenthetical extra effect text remains unsupported and fails closed in combat, play-card, and start-of-main board gates
  - malformed or mixed parenthetical text cases fail closed when the remaining printed text is not an already-supported keyword-only combat body
  - unsupported CARD-005 real fixtures do not accidentally gain support, effectDefinitionId, or customHandlerIds
  - engine-core package-boundary tests continue to prove no @optcg/cards or live card-data imports enter engine-core
required_tests:
  - engine-core unit tests for the internal explanatory-note support-gate helper covering empty text, parenthetical-only text, keyword plus parenthetical text, extra non-parenthetical text, mixed text, and malformed parenthetical input
  - engine-core play-card support test proving OP04-014-style `[Banish] (...)` text is accepted only when support status and printed keyword metadata are otherwise supportable
  - engine-core start-of-main board-card support test proving OP04-014-style `[Banish] (...)` text is accepted only with matching printed keyword metadata while unsupported extra board text still fails closed
  - engine-core real-card runtime test proving OP04-014 from fixtures/cards/real-card-dsl-match-card-manifest.json applies Banish damage using unchanged effectText
  - engine-core fail-closed regression proving a real or synthetic combat card with additional non-parenthetical effect text remains rejected
  - package-local real fixture test proving OP04-014 support metadata has no effectDefinitionId/customHandlerIds, remains display-identical, and keeps sourceTextHash/behaviorHash stable relative to normalized printed text
  - package-local assertion that unsupported CARD-005 fixtures remain unsupported and no manifest effectDefinitions are added beyond reviewed implemented fixtures
  - package-boundary assertion or existing boundary test proving engine-core does not import @optcg/cards, Poneglyph HTTP, Redis, Postgres, server, client, or UI surfaces
  - "engine-core command covering the explanatory-note gate and OP04-014 Banish runtime tests"
  - "root `corepack pnpm test -- packages/cards`"
  - "`corepack pnpm run packets:verify`"
  - "full `corepack pnpm run verify`"
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - use TDD by adding failing support-gate and OP04-014 runtime tests before changing engine support-gate behavior or card support metadata
  - cite `02-engine-mechanics.s045` in implementation notes and tests that explain parenthetical explanatory-note handling
  - keep explanatory-note stripping inside engine-core support-gate classification; do not strip in @optcg/cards normalization
  - keep Poneglyph data as printed/display metadata authority
  - keep simulator overlay as gameplay implementation authority
  - do not add effect definitions or custom handlers for OP04-014 Banish
  - fail closed on explanatory-note text, support-status, runtime execution, hidden-information behavior, or deck-validation ambiguity
  - do not weaken TypeScript strictness
ambiguity_policy: fail_and_escalate
