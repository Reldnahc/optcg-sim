summary: >
  Allow narrow engine support gates to treat parenthetical printed text as
  `02-engine-mechanics.s045` explanatory notes when deciding whether OP04-014
  has unsupported rules text across combat metadata, vanilla Character play
  metadata, and start-of-main board metadata, without mutating Poneglyph text,
  normalized card metadata, source text hashes, behavior hashes, or
  display-facing manifest data.
story_boundary: >
  Own only engine-level `02-engine-mechanics.s045` parenthetical
  explanatory-note handling for the narrow support-gate classification needed by
  OP04-014 across combat metadata, vanilla Character play metadata, and
  start-of-main board metadata, plus the minimal OP04-014 real-fixture metadata
  promotion made possible by those gates. Do not change Poneglyph normalization,
  raw printed text, source hashing, behavior hashing, card display text, keyword
  behavior, effect DSL semantics, custom handlers, server/client/API/UI
  integration, or broad real-card fixture classification.
