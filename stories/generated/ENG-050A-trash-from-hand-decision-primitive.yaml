title: Trash-from-hand decision primitive
type: implementation
area: engine
primary_concern: rules
priority: high
status: generated
summary: >
  Add the first narrow self trash-from-hand effect runtime decision path with
  private choice validation, deterministic events, and fail-closed invalid
  responses.
story_boundary: >
  Own only the narrow `trashFromHand` effect primitive for the source
  controller choosing cards from their own hand. Do not add parser grammar,
  generated support fixture changes, broad discard semantics, costs, or
  sequence execution in this story.
