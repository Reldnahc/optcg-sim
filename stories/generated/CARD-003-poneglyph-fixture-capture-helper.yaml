story_schema_version: 1.0.0
id: CARD-003
epic_id: CARD-003
title: Add Poneglyph fixture capture helper
type: tooling
area: cards
primary_concern: tooling
priority: high
status: generated
summary: >
  Add a package-local helper for maintainers to capture selected live Poneglyph
  card-detail responses into deterministic checked-in fixtures without making
  CI or tests depend on live Poneglyph.
story_boundary: >
  Own only local/dev fixture capture for selected card IDs and deterministic
  fixture validation. Do not broaden into full catalog sync, server integration,
  client display, deck-builder UI, gameplay implementation, or CI live-network
  dependencies.
allowed_touch_points:
  - packages/cards/**
  - fixtures/poneglyph/cards/**
  - docs/workflow/card-fixture-capture.md
  - stories/generated/CARD-003-poneglyph-fixture-capture-helper.yaml
  - stories/approved/CARD-003-poneglyph-fixture-capture-helper.yaml
  - agent-packets/CARD-003.md
  - agent-packets/active.json
