spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-025
epic_id: KICK-001
title: Same-player trigger ordering foundation
type: implementation
area: engine
primary_concern: rules
priority: high
status: generated
summary: >
  Parent coordination story for choosing the order of multiple simultaneous
  triggered effects controlled by the same player in one timing bucket.
story_boundary: >
  Coordinate child stories only. This parent does not directly implement
  runtime behavior; each child story owns one reviewable concern.
allowed_touch_points:
  - stories/generated/ENG-025-same-player-trigger-ordering-parent.yaml
  - stories/approved/ENG-025A-detect-same-player-trigger-order-buckets.yaml
  - stories/approved/ENG-025B-create-trigger-order-decision.yaml
  - stories/approved/ENG-025C-validate-trigger-order-response.yaml
  - stories/approved/ENG-025D-resume-trigger-queue-after-order-choice.yaml
  - stories/approved/ENG-025E-project-trigger-order-decision-safely.yaml
spec_refs:
  - 03-game-state-events-decisions.s009 (Decisions)
  - 03-game-state-events-decisions.s010 (Trigger order decision)
  - 03-game-state-events-decisions.s017 (Canonical decision routing)
  - 04-effect-runtime.s006 (Effect queue entry)
  - 04-effect-runtime.s009 (Queue ordering and timing)
  - 04-effect-runtime.s012 (Pending decisions)
  - 06-visibility-security.s004 (PlayerView shape)
  - 06-visibility-security.s007 (Legal-action visibility)
  - 11-testing-quality.s007 (Interaction tests)
  - 23-repo-tooling-and-enforcement.s016 (CI merge gates)
scope:
  - decompose same-player simultaneous trigger ordering into approved child stories
  - require story-review for the child-story set and each exact child story before implementation
  - use a parent integration branch and one active child packet at a time
  - preserve turn-player bucket ordering before non-turn-player bucket ordering
  - preserve deterministic no-choice queue ordering when no trigger-order decision is required
non_scope:
  - new trigger categories
  - Life Trigger reveal path
  - optional activation
  - target selection
  - replacement effects
  - server/client/UI
dependencies:
  - ENG-024
child_stories:
  - id: ENG-025A
    title: Detect same-player trigger order buckets
    concern: Identify the earliest same-player timing bucket that requires chooseTriggerOrder while preserving no-choice ordering behavior.
    depends_on: [ENG-024]
  - id: ENG-025B
    title: Create trigger order decision
    concern: Pause effect queue processing with a deterministic chooseTriggerOrder PendingDecision for a choice-required bucket.
    depends_on: [ENG-025A]
  - id: ENG-025C
    title: Validate trigger order response
    concern: Route and validate orderedIds responses for chooseTriggerOrder without resolving queued effects after the response.
    depends_on: [ENG-025B]
  - id: ENG-025D
    title: Resume trigger queue after order choice
    concern: Resume queued effect processing after a valid chosen order while preserving bucket and generation ordering.
    depends_on: [ENG-025C]
  - id: ENG-025E
    title: Project trigger order decision safely
    concern: Expose chooseTriggerOrder decisions and response actions only through hidden-info-safe player-facing surfaces.
    depends_on: [ENG-025D]
acceptance_criteria:
  - child stories exist and pass set-level and exact per-story story-review before implementation
  - child stories cover detection, decision creation, response validation, deterministic resume, and hidden-info-safe projection
  - parent integration review confirms all child stories compose without broadening scope
required_tests:
  - run corepack pnpm run stories:validate
  - run corepack pnpm run packets:verify for each active child story
  - run corepack pnpm run verify before parent PR handoff
repo_rules:
  - do not approve, packetize, or activate ENG-025 itself as an implementation story
  - approve and implement only ENG-025A through ENG-025E as child stories
  - story-review must pass before presenting this story group as approval-ready
  - a set-level story-review does not satisfy exact per-story story-review for any child
  - run exact per-story story-review for each child story before moving it to approved or implementing it
  - use a parent integration branch
  - open child PRs into the parent integration branch
  - keep one active child packet at a time
  - substory human review is deferred only because the user explicitly requested the parent integration branch workflow for this group
  - do not run packets:complete for children until the parent branch lands on main
  - run parent integration review before merging to main
  - after the parent branch merges to main, run packets:complete-many for ENG-025A through ENG-025E
ambiguity_policy: fail_and_escalate
