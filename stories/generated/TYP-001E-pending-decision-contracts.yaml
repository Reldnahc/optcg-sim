spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: TYP-001E
epic_id: M1-001
title: Add pending-decision and decision-response contracts
type: implementation
area: contracts
primary_concern: contract
priority: critical
status: generated
summary: >
  Add the shared pending-decision and decision-response contracts used by engine
  pauses, terminal responses, and future filtered views.
story_boundary: >
  Own only decision and response type exports. Do not implement decision
  creation, decision validation, timers, client prompts, or effect-runtime logic.
allowed_touch_points:
  - packages/types/src/**
spec_refs:
  - 03-game-state-events-decisions.s009 (Pending decisions)
  - 03-game-state-events-decisions.s017 (Decision answer action)
  - 16-typescript-interface-draft.s008 (Actions and decisions)
scope:
  - export `PendingDecision` union members and shared base-decision fields
  - export `DecisionResponse` union
  - ensure decision contracts identify the responding player and preserve visibility metadata needed by later filtering
non_scope:
  - legal response computation
  - engine pause/resume behavior
  - optional-effect timing rules
  - client UX or prompt rendering
  - effect queue processing
dependencies:
  - TYP-001A
  - TYP-001C
  - TYP-001D
acceptance_criteria:
  - pending decisions can represent mulligan, cost payment, target/card selection, effect option, trigger, ordering, replacement, and rollback-consent decisions described by the spec
  - decision responses are represented as pure data
  - the action contract can reference decision responses without circular runtime dependencies
required_tests:
  - package type test compiling one representative decision for each decision category
  - package type test compiling the `respondToDecision` action with a typed decision response
repo_rules:
  - fail closed on ambiguous decision categories
  - do not implement decision behavior in the types package
  - must pass `corepack pnpm run verify`
ambiguity_policy: fail_and_escalate
