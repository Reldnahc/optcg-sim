dependencies: []
scope:
  - "add optional `trashFromHand` to the `OptionalCost` contract shape with count, optional filter, chooser, and `optional: true`"
  - preserve the distinction between optional cost decline and optional effect activation
  - preserve existing non-optional `Cost.trashFromHand` behavior and schema compatibility
  - update the `05-effect-dsl-reference.s029` fixture-supported subset only for the optional `trashFromHand` cost-clause shape; non-optional `Cost.trashFromHand` remains planned/not fixture-authorable unless separately authorized
  - 'prove that optional `trashFromHand` can be embedded in `{ type: "payCost"; cost: OptionalCost }` sequence segments'
  - add positive and negative schema fixtures proving optional hand-trash cost authorability and fail-closed rejection of malformed optional hand-trash costs
  - document that authorability does not imply runtime executable support, parser certification, generated support, or playability
non_scope:
  - engine runtime payment behavior
  - legal action generation for optional hand-trash costs
  - parser, generated-support, runtime capability matrix, support reports, overlays, fixture capture, or card promotion
  - new cost families beyond optional `trashFromHand`
  - broad optional-cost grammar or alternate "may" semantics
acceptance_criteria:
  - "`OptionalCost` in specs, contracts, and package types includes a reusable optional `trashFromHand` shape"
  - the optional `trashFromHand` shape requires a positive integer count in tests and preserves optional decline semantics through the `PaymentDeclinedResponse` contract
  - "`05-effect-dsl-reference.s029` distinguishes optional `trashFromHand` cost-clause authorability from still-planned non-optional `Cost.trashFromHand` authorability"
  - schema/type tests prove representative optional hand-trash cost authorability without runtime execution
  - contract fixture validation proves positive and negative schema rows for optional hand-trash costs
  - no production code treats optional hand-trash cost authorability as runtime support
required_tests:
  - "`corepack pnpm --filter @optcg/types test`"
  - "`corepack pnpm run contracts:validate-effects`"
  - "`corepack pnpm run test:contracts`"
  - "`corepack pnpm run stories:validate`"
  - "`corepack pnpm run packets:verify`"
repo_rules:
  - implement only SUP-002A while its packet is active
  - do not touch engine or cards packages except type import fallout required by contract tests
  - fail closed if optional hand-trash cost cannot be expressed without blurring optional cost and optional effect semantics
ambiguity_policy: fail_and_escalate
