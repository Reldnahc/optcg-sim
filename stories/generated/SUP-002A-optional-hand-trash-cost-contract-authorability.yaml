epic_id: SUP-002
title: Optional hand-trash cost contract authorability
type: implementation
area: contracts
primary_concern: contract
priority: high
status: generated
summary: >
  Authorize optional `trashFromHand` cost segments in the shared Effect DSL so
  engine sequence runtime can represent text shaped like `You may trash N cards
  from your hand:` as a cost decision rather than an optional effect clause.
story_boundary: >
  Contract/schema/type story only. Do not implement runtime payment behavior,
  parser support, generated support, runtime capability metadata, support
  reports, real-card fixture evidence, or card promotion.
allowed_touch_points:
  - stories/generated/SUP-002A-optional-hand-trash-cost-contract-authorability.yaml
