acceptance_criteria:
  - child stories exist for Counter Step pass/auto-pass, Character Counter from hand, and Counter Event fail-closed handling
  - this parent story remains non-implementable and is not packetized directly
  - all child stories can be reviewed as a set before any child approval
  - each child story also receives exact per-story story-review before approval or implementation
  - only child stories ENG-019A through ENG-019C are presented as approval-ready implementation candidates for this rules parent
required_tests:
  - story-review agent must verify this parent is replaced by concern-scoped child stories before implementation begins
repo_rules:
  - do not approve or packetize this parent story
  - approve only concern-scoped child stories for implementation
  - a set-level story-review does not satisfy exact per-story story-review for a child
  - run exact per-story story-review for each child story before moving it to approved or implementing it
  - implement one active child story at a time
  - use the parent integration branch workflow for the ENG-019 group
  - child PRs target the ENG-019 parent integration branch, not main
  - keep exactly one active packet while each child story is being implemented or reviewed
  - do not run packets:complete for child stories until the parent branch has merged to main
  - run full parent PR integration review and human review before merging ENG-019 to main
  - after parent merge, run packets:complete-many for the ENG-019 child story set
  - keep engine-core deterministic and pure
