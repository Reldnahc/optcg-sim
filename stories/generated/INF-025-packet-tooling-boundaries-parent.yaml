  - 23-repo-tooling-and-enforcement.s008
  - 23-repo-tooling-and-enforcement.s016
  - 11-testing-quality.s008
scope:
  - split tests/contracts/agent-packet-contract.test.mjs by existing parser, rendering, activation, verification, and completion behavior
  - extract cohesive helpers from tools/build-agent-packet.ts only when command behavior and generated output remain byte-equivalent
  - preserve packet CLI command names, arguments, output paths, manifest shape, packet content, story lifecycle behavior, and fail-closed validation
  - keep existing workflow docs and story schema behavior unchanged unless an exact child story and story-review authorize a compatibility-preserving import update
non_scope:
