  - changing packet markdown content or metadata format except for byte-equivalent extraction
  - changing active story manifest semantics
  - changing story lifecycle rules
  - changing branch protection, GitHub sync, or review-gate behavior
  - changing engine, CLI gameplay, server, client, or replay behavior
