acceptance_criteria:
  - every child story is explicitly behavior-preserving and includes no packet workflow behavior change
  - moved tests continue to exercise the same scenarios with the same expected outcomes
  - generated packet content, active manifest behavior, metadata, and CLI-visible output remain byte-equivalent for covered fixtures; if that cannot be preserved, stop and split or record an ambiguity instead of approving the child
  - parent integration review confirms build-agent-packet.ts and agent-packet-contract.test.mjs are smaller or records justified exceptions
required_tests:
  - run corepack pnpm run stories:validate
  - run corepack pnpm run packets:verify for each active child story
  - run focused agent-packet contract tests for each child story
  - run corepack pnpm run contracts
  - run corepack pnpm run verify before parent PR handoff
repo_rules:
  - do not approve, packetize, or activate INF-025 itself as an implementation story
  - story-review must confirm the child split is behavior-preserving before any child is approved
  - child stories must be implemented one at a time on a parent integration branch
  - no child may change workflow contracts, story schema, packet lifecycle, or CLI command behavior
  - line-count reduction is secondary to preserving workflow determinism and generated output stability
ambiguity_policy: fail_and_escalate
