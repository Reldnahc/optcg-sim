status: generated
summary: >
  Add a broader real-card regression set for mechanics already implemented and
  already represented by reviewed real fixtures, proving the cards-produced
  manifest exercises those mechanics through engine-core without adding new
  gameplay behavior or broadening unsupported card support.
story_boundary: >
  Own only real fixture-backed regression tests and package-local assertions
  for the closed set of currently reviewed supported real fixture mechanics:
  EB01-023 On Play draw and OP04-014 Banish. Do not audit or promote additional
  real cards, add new engine primitives, add new effect definitions for
  unsupported cards, add custom handlers, add live Poneglyph/Redis/server/client
  dependencies, or partially support cards whose full printed behavior is not
  implemented.
