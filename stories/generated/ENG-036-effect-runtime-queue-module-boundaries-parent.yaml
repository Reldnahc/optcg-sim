story_schema_version: 1.0.0
id: ENG-036
epic_id: KICK-001
title: Effect runtime queue module boundaries
type: refactor
area: engine
primary_concern: rules
priority: medium
status: generated
summary: >
  Split oversized effect runtime trigger-queueing and queue-processing modules
  into focused implementation and test files without changing trigger
  semantics, queue ordering, source-presence behavior, event output,
  decisions, state hashes, visibility, or effect DSL behavior.
story_boundary: >
  This parent story is not directly implementable. It coordinates
  behavior-preserving follow-on decomposition for effect-runtime modules created
  by ENG-030 that still exceed the repo size threshold.
allowed_touch_points:
  - stories/generated/ENG-036-effect-runtime-queue-module-boundaries-parent.yaml
  - stories/generated/ENG-036A-*.yaml
  - stories/generated/ENG-036B-*.yaml
  - stories/generated/ENG-036C-*.yaml
  - stories/generated/ENG-036D-*.yaml
  - stories/generated/ENG-036E-*.yaml
  - stories/generated/ENG-036F-*.yaml
spec_refs:
  - 03-game-state-events-decisions.s004
  - 03-game-state-events-decisions.s005
  - 03-game-state-events-decisions.s020
  - 04-effect-runtime.s006
  - 04-effect-runtime.s007
  - 04-effect-runtime.s008
  - 04-effect-runtime.s009
  - 04-effect-runtime.s010
  - 04-effect-runtime.s012
  - 04-effect-runtime.s016
  - 06-visibility-security.s006
  - 11-testing-quality.s007
  - 11-testing-quality.s008
  - 23-repo-tooling-and-enforcement.s006
  - 23-repo-tooling-and-enforcement.s008
  - 23-repo-tooling-and-enforcement.s016
scope:
  - split effect-runtime-trigger-queueing.test.ts into behavior-focused trigger queueing suites before production extraction
  - extract source lookup, event matching, snapshot, and trigger-category helpers from effect-runtime-trigger-queueing.ts only when behavior remains equivalent
  - split effect-runtime-queue-processing.test.ts into behavior-focused queue processing suites before production extraction
  - extract source-presence, Life Trigger cleanup, queue ordering, target-decision, and result assembly helpers from effect-runtime-queue-processing.ts only when behavior remains equivalent
  - preserve exported runtime APIs or update package-internal imports only within exact child story boundaries
  - reduce large queue modules toward focused files under the repo size threshold, or record story-review-approved exceptions
non_scope:
  - changing trigger detection or queueing behavior
  - changing queue ordering, trigger-order choice, target-decision, or no-choice processing behavior
  - changing source-presence policy or Life Trigger cleanup semantics
  - changing event payloads, state hashes, error shapes, visibility, or effect DSL semantics
  - adding new effect primitives, trigger categories, or runtime features
  - changing server, client, replay, database, or UI behavior
dependencies:
  - ENG-030
child_stories:
  - id: ENG-036A
    title: Split trigger queueing behavior tests
    concern: Move trigger queueing tests into focused On Play, attack, source-presence, and determinism suites with no behavior change.
    depends_on: []
  - id: ENG-036B
    title: Extract trigger source lookup helpers
    concern: Move trigger source lookup, event matching, and snapshot helpers out of effect-runtime-trigger-queueing.ts without changing fail-closed behavior.
    depends_on: [ENG-036A]
  - id: ENG-036C
    title: Extract trigger category queueing helpers
    concern: Move On Play, attacking, opponent-attack, K.O., and effect-resolved category queueing helpers into focused modules without changing queue entries.
    depends_on: [ENG-036B]
  - id: ENG-036D
    title: Split queue processing behavior tests
    concern: Move queue processing tests into focused no-choice, ordering, target-decision, source-presence, and stability suites.
    depends_on: [ENG-036C]
  - id: ENG-036E
    title: Extract queue source-presence and cleanup helpers
    concern: Move queued source-presence validation and Life Trigger cleanup helpers out of effect-runtime-queue-processing.ts with no behavior change.
    depends_on: [ENG-036D]
  - id: ENG-036F
    title: Extract queue ordering and result helpers
    concern: Move queue ordering, target-decision, continuation, and result assembly helpers into focused modules without changing deterministic output.
    depends_on: [ENG-036E]
acceptance_criteria:
  - every child story is explicitly behavior-preserving and includes no gameplay, DSL, event, hash, decision, or visibility behavior change
  - moved tests continue to exercise the same scenarios with the same expected outcomes
  - extracted helpers preserve existing public imports or update package-internal imports only within the child story boundary
  - parent integration review confirms the two target modules and their tests are smaller or records justified exceptions
required_tests:
  - run corepack pnpm run stories:validate
  - run corepack pnpm run packets:verify for each active child story
  - run focused engine-core effect runtime queue tests for each child story
  - run corepack pnpm run coverage
  - run corepack pnpm run verify before parent PR handoff
repo_rules:
  - do not approve, packetize, or activate ENG-036 itself as an implementation story
  - story-review must confirm the child split is behavior-preserving before any child is approved
  - child stories must be implemented one at a time on a parent integration branch
  - no child may add new rules behavior or weaken existing fail-closed behavior
  - line-count reduction is secondary to preserving behavior and reviewability
ambiguity_policy: fail_and_escalate
