title: Collapse agent workflow to parent/substory only
type: refactor
area: docs
primary_concern: docs
priority: critical
status: generated
summary: >
  Remove the two-path story execution model and the unused or extra
  story-author/story-orchestrator/pr-gate roles from canonical workflow
  authority, repo workflow docs, packet tooling, review-plan tooling, and tests
  so agents have one execution path: parent/substory integration with Session
  Orchestrator as the owner.
story_boundary: >
  Own only workflow authority, packet role extraction/rendering, a deterministic
  story-review planning tool, package scripts, and tests needed to make the
  parent/substory-only execution model internally consistent. Do not change
  story content for unrelated epics or alter product/runtime behavior.
