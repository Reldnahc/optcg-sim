title: Resolve no-choice Main Event effects
type: implementation
area: engine
primary_concern: rules
priority: high
status: generated
summary: >
  Queue and resolve the first supported no-choice Main Event effect after the
  Event is played to trash.
story_boundary: >
  Own only no-choice Main Event effect queueing and resolution for the current
  supported primitive surface. Stop before target-based Event resolution,
  Counter Events, Life Triggers, replacement effects, optional activation,
  once-per-turn, custom handlers, CLI, server, client, or UI behavior.
