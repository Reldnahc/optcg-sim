scope:
  - certify parameterized Draw N parser rules for `[On Play] Draw N card(s).`
  - certify parameterized Draw N parser rules for `[When Attacking] Draw N card(s).`
  - use one reviewed parser-rule family for positive safe-integer counts rather than one parser rule per number
  - validate singular/plural card wording for the parsed count
  - reject zero, negative, decimal, word-number, malformed, and unsafe-integer counts
  - generate deterministic EffectDefinition output with the parsed draw count
  - update runtime capability evidence so supported draw count capability is parameterized rather than draw-1-only
  - keep complete-parse index/report behavior deterministic with the new parameterized parser-rule evidence
non_scope:
  - trash-from-hand parser or runtime behavior
  - draw-then-trash sequence support
  - "`[Once Per Turn]` parser support"
  - OP10-045 fixture/support evidence
  - new engine runtime behavior
  - deck validation behavior changes
  - broad parser grammar
  - server, client, API, UI, Redis, database, replay, or live Poneglyph work
dependencies:
  - CARD-008
acceptance_criteria:
  - "`[On Play] Draw 1 card.` remains supported"
  - "`[On Play] Draw 3 cards.` parses to generated DSL with draw count 3 and is supported by capability checks"
  - "`[When Attacking] Draw 2 cards.` parses to generated DSL with draw count 2 and is supported by capability checks"
  - zero, negative, decimal, word-number, malformed, and unsafe-integer counts fail closed with blocker evidence
  - singular/plural mismatches fail closed
  - generated support index/report tests use parameterized capability evidence and remain deterministic
required_tests:
  - exact candidate story-review before implementation
  - focused parser tests for Draw N success and invalid-count fail-closed cases
  - focused capability matrix tests for parameterized draw support evidence
  - focused generated support index/report tests proving supported Draw N and unsupported invalid-count blockers
  - run `corepack pnpm run packets:verify`
  - run `corepack pnpm run stories:validate`
  - run `corepack pnpm --filter @optcg/cards test`
  - full `corepack pnpm verify`
repo_rules:
  - generate and activate the CARD-009A packet before implementation
  - stay within allowed_touch_points
  - do not implement trash-from-hand, sequences, OP10-045 fixture support, or gameplay behavior in this story
  - fail closed if parser-rule certification cannot precisely bound numeric input
ambiguity_policy: fail_and_escalate
