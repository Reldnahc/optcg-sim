spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: CARD-020A
epic_id: CARD-020
title: Generic card-text diagnostic scanner
type: implementation
area: cards
primary_concern: verification
priority: high
status: generated
summary: >
  Build a reusable package-local diagnostic scanner for arbitrary card text so
  unsupported support-probe input can be decomposed into recognizable wrappers,
  conditions, connectors, quantities, targets, actions, and missing components
  without making the card playable.
story_boundary: >
  Own only cards-side diagnostic scanning infrastructure and scanner tests. The
  scanner may reuse existing parser/component helpers or replace diagnostic-only
  probe internals, but it must not create generated DSL, admit generated
  support, add runtime capability records, change engine behavior, or edit
  fixtures/hashes. Diagnostic examples are not templates and must not be
  implemented as exact card-text branches.
allowed_touch_points:
  - packages/cards/src/support-probe.ts
  - packages/cards/src/support-probe.test.ts
  - packages/cards/src/generated-support-report.ts
  - packages/cards/src/generated-support-report.test.ts
  - packages/cards/src/generated-support-index.ts
  - packages/cards/src/generated-support-types.ts
  - packages/cards/src/composed-parser-builder.ts
  - packages/cards/src/composed-parser-builder.test.ts
  - packages/cards/src/conditional-parser-components.ts
  - packages/cards/src/conditional-parser-components.test.ts
  - packages/cards/src/*support*.test.ts
  - packages/cards/src/*diagnostic*.ts
  - packages/cards/src/*diagnostic*.test.ts
  - agent-packets/CARD-020A.md
  - stories/generated/CARD-020*.yaml
  - stories/approved/CARD-020*.yaml
  - agent-packets/active.json
