id: ENG-059D
epic_id: ENG-059
title: Synthetic conditional protection composition proof
type: implementation
area: engine
primary_concern: verification
priority: high
status: generated
summary: >
  Prove the ENG-059 runtime primitives compose in a synthetic engine fixture
  built from phrase-level primitive shapes: a public trash-count condition
  grants Blocker and opponent effect-removal protection while existing On K.O.
  draw behavior still works for allowed K.O. processes.
story_boundary: >
  Own only engine-core synthetic fixture/proof tests that compose
  already-reviewed ENG-059 primitives. Do not add production engine behavior,
  parser support, generated-support records, real-card fixtures, cards package
  changes, source hashes, behavior hashes, or production card-ID branches. If
  the proof requires production integration glue, stop and split a prerequisite
  implementation story instead of widening ENG-059D.
allowed_touch_points:
