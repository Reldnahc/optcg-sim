scope:
  - define child stories for computed Blocker eligibility, Block Step decision/decline routing, blocker selection/activation, blocked-battle resolution, and regression guards
  - keep Blocker delivery on a parent integration branch so the mechanic lands as one reviewed vertical
  - preserve fail-closed behavior for On Block effects, Counter Step actions, Unblockable, replacement effects, pending runtime queues, deferred triggers, Double Attack combinations, and unsupported timing windows until their own stories
non_scope:
