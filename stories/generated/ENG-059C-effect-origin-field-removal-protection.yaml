id: ENG-059C
epic_id: ENG-059
title: Effect-origin field removal protection
type: implementation
area: engine
primary_concern: rules
priority: high
status: generated
summary: >
  Add a reusable engine protection layer that classifies field-removal attempts
  by process and source controller so a supported Character can be protected
  from opponent effect removal without blocking battle K.O., rule-process trash,
  costs, or controller-owned effects.
story_boundary: >
  Own only engine-core field-removal protection classification, application,
  and tests. Do not change card parser support, generated-support records,
  real-card fixtures, conditional keyword grants, or unrelated replacement
  behavior.
allowed_touch_points:
