  - 11-testing-quality.s012 (Replay determinism)
  - 12-roadmap.s005 (Milestone 1: terminal engine)
  - 18-acceptance-tests.s003 (Milestone 1 - terminal engine)
  - 22-v6-implementation-tightening.s008 (Life orientation)
scope:
  - define the vanilla combat and damage delivery group
  - split canonical manifest state authority, computed combat view, attack declaration, damage/K.O. resolution, defeat checks, and replay smoke into child stories
  - keep the group on a parent integration branch before merging to main if the group is approved
non_scope:
  - direct implementation from this parent story
  - browser client, server protocol, database, Redis, WebSocket, React, or live HTTP behavior
  - full card effect runtime
  - card play implementation
  - blocker activation, counter actions, trigger activation, replacement effects, Banish, Double Attack, or Rush-granting effects
  - CLI runner implementation
dependencies:
  - ENG-002A
  - ENG-002B
  - ENG-002C
  - ENG-002D
  - ENG-002E
  - ENG-002F
acceptance_criteria:
  - child stories exist for the first vanilla combat and damage concerns
  - this parent story remains non-implementable and is not packetized
  - child stories can be story-reviewed as a set before approval
required_tests:
  - story-review agent must verify this parent is replaced by concern-scoped child stories before implementation begins
repo_rules:
  - do not approve or packetize this parent story
  - use a parent integration branch for the ENG-003 child-story group if the group is approved
  - keep one active child-story packet at a time
  - approve only concern-scoped child stories for implementation
  - engine-core must stay pure and free of browser, server, Redis, Postgres, WebSocket, React, and live HTTP dependencies
ambiguity_policy: fail_and_escalate
