spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-003
epic_id: M1-001
title: Add vanilla combat and damage foundation
type: implementation
area: engine
primary_concern: rules
priority: critical
status: replaced
summary: >
  Add the Milestone 1 vanilla combat and damage layer after deterministic setup,
  mulligan, phase progression, legal actions, action application, and replay
  smoke coverage exist.
story_boundary: >
  This parent story is not implementable. It preserves the combat and damage
  delivery context and is replaced by concern-scoped child stories ENG-003A
  through ENG-003E.
allowed_touch_points:
  - contracts/canonical-types.ts
  - packages/types/src/**
  - packages/engine-core/**
  - fixtures/replays/**
  - tests/contracts/**
  - tests/engine/**
spec_refs:
  - 02-engine-mechanics.s003 (Rule-processing checkpoints)
  - 02-engine-mechanics.s014 (Main Phase)
  - 02-engine-mechanics.s017 (Battle sequence)
  - 02-engine-mechanics.s018 (Attack Step)
  - 02-engine-mechanics.s019 (Block Step)
  - 02-engine-mechanics.s020 (Counter Step)
  - 02-engine-mechanics.s021 (Damage Step)
  - 02-engine-mechanics.s022 (End of Battle)
  - 02-engine-mechanics.s023 (Damage processing)
  - 02-engine-mechanics.s025 (Keyword behavior)
  - 02-engine-mechanics.s035 (Exact win/loss conditions)
  - 02-engine-mechanics.s036 (DON!! card mechanics)
  - 02-engine-mechanics.s037 (First-turn restrictions)
  - 03-game-state-events-decisions.s003 (Base state vs. computed view)
  - 03-game-state-events-decisions.s004 (Engine result shape)
  - 03-game-state-events-decisions.s005 (Event journal)
  - 03-game-state-events-decisions.s015 (Legal actions)
  - 03-game-state-events-decisions.s016 (Action contract)
  - 03-game-state-events-decisions.s018 (Canonical event visibility)
  - 09-card-data-and-support-policy.s013 (Match-time card manifest)
