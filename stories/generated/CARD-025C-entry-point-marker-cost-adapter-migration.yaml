summary: >
  Migrate current cards-layer entry-point, marker, cost, source-presence, and
  non-runtime deck-rule recognition to reusable adapter evidence. Supported
  bodies must compose with certified wrappers and costs through primitive
  evidence rather than requiring exact wrapper-body sample parser rules.
story_boundary: >
  Own only cards-layer wrapper, timing marker, cost, source-policy, and external
  non-runtime adapter parsing/evidence for currently supported generated-support
  implementations. Do not add new body effects, engine runtime behavior, shared
  schema, real-card fixtures, manifests, source hashes, behavior hashes, or
  overlays.
