summary: >
  Replace the older story-named `card014g-composed-parser.ts` exact-template
  production parser with reusable primitive parsing for the same CARD-014G
  supported behavior. The existing file maps exact full On Play sentences to
  generated DSL and fixed values; this story raises that production path to the
  same scalable component-composition standard as SUP-001G.
story_boundary: >
  Own only the cards-layer CARD-014G parser replacement, parser-rule evidence,
  generated-support tests, diagnostics, and local test helpers needed to
  preserve existing CARD-014G-supported behavior through reusable primitives.
  Do not add engine runtime behavior, shared schema/type authority, real-card
  fixtures, source hash changes, behavior hash changes, overlays, support
  manifest edits, cards-produced manifest regeneration, or new card promotion.
