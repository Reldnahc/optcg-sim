scope:
  - add a broad real mechanics fixture regression matrix over the existing checked-in real-card manifest and CARD-005 `realEffectShapeFixtureCorpus`, covering the supported real cards plus the unsupported real effect-shape corpus by card ID, printed effect family, current support expectation, and rationale
  - include every CARD-005 corpus entry in package-local classification assertions so the broad suite covers roughly 50 distinct real printed effect shapes, not just EB01-023 and OP04-014
  - keep EB01-023 as the real implemented-dsl On Play draw runtime regression and OP04-014 as the real Banish runtime regression
  - add or extend engine-core real-card regressions for a representative broad subset of unsupported real fixture families, using plain checked-in manifest data, to prove unsupported cards fail closed through the current legal-action/runtime gates instead of behaving as vanilla or partially supported
  - representative engine-core fail-closed coverage should include at least eight distinct real fixture families when present in the corpus, such as target K.O., Main Event, Counter Event, Trigger, search/reveal, optional choice, replacement/permanent modifier, Double Attack/Rush/Blocker with extra unsupported text, or Banish with extra unsupported text
  - assert unsupported CARD-005 cards remain unsupported, untested for gameplay support, without effectDefinitionId/customHandlerIds, absent from the manifest effect definition registry, and rejected outside allowed dev/sandbox policy
  - assert supported real cards remain limited to reviewed existing support entries and that manifest effect definitions remain limited to reviewed implemented real fixture definitions
  - if a real fixture appears to match an already-implemented mechanic but has any extra printed behavior, FAQ, errata, timing, trigger, optionality, cost, once-per-turn, replacement, search/reveal, or custom-handler need, keep it unsupported and record that rationale in test data
  - if the implementation discovers a real fixture whose entire printed behavior truly matches existing engine behavior, record it as a follow-up story or ambiguity instead of promoting support in this story
  - engine-core tests must consume only plain checked-in MatchCardManifest/effect definition data and must not import @optcg/cards or live card-data surfaces
non_scope:
  - adding new real Poneglyph card fixtures
  - live Poneglyph, live Redis, server, client, Postgres, browser, or UI requirements in tests or CI
  - implementing Poneglyph search as production package API
  - automatic effect generation from printed text
  - new DSL primitives, target shapes, keyword behavior, custom handlers, optional effects, once-per-turn, replacement effects, search/reveal, Counter Events, Life Trigger changes, permanent modifiers, multi-damage, or new gameplay semantics
  - marking a real card supported when only part of its printed behavior is implemented
  - adding production effect definitions or production support metadata for unsupported CARD-005 fixture cards
  - changing engine-core to import @optcg/cards, Poneglyph HTTP, Redis, Postgres, server, client, or UI code
  - server, client, API, WebSocket, database, deck-builder, or UI integration
dependencies:
  - CARD-004
  - CARD-005
  - CARD-006
  - ENG-038
  - ENG-039
  - ENG-040
acceptance_criteria:
  - a broad real mechanics fixture regression matrix exists in package-local tests and covers every CARD-005 `realEffectShapeFixtureCorpus` entry plus the reviewed supported real cards
  - the matrix records card ID, effect family, expected support status, expected runtime stance, and rationale for each unsupported real fixture family
  - EB01-023 remains executable through engine-core as a real On Play draw regression from plain manifest/effect definition data
  - OP04-014 remains executable through engine-core as a real Banish regression from plain manifest data, including Life-to-trash, no Trigger decision, and no Trigger draw
  - at least eight distinct unsupported real fixture families have engine-core fail-closed coverage proving real unsupported cards do not expose legal actions or runtime behavior as if they were supported
  - unsupported CARD-005 real effect-shape fixtures remain unsupported, untested for gameplay support, without effectDefinitionId/customHandlerIds, rejected outside allowed dev/sandbox policy, and absent from manifest effectDefinitions
  - supported real cards and manifest effectDefinitions are not broadened beyond the reviewed implemented fixtures already present before this story
  - engine-core tests consume only plain checked-in manifest/effect-definition data and never import @optcg/cards or live card-data surfaces
  - no test requires live Poneglyph, live Redis, server, client, Postgres, browser, or UI code
  - possible additional complete-card matches are deferred to a separate story or ambiguity note instead of being promoted in this story
required_tests:
  - package-local broad real mechanics matrix test covering all CARD-005 corpus entries plus supported real fixture cards
  - package-local assertion that each matrix entry exists in the checked-in real-card manifest with expected support status, tested metadata, effectDefinitionId/customHandlerIds, sourceTextHash, and behaviorHash stance
  - package-local assertion that unsupported CARD-005 fixtures remain unsupported, have tested false, and have no effectDefinitionId/customHandlerIds
  - package-local assertion that manifest effectDefinitions are limited to reviewed implemented real fixture definitions
  - package-local deck/loadout validation coverage proving unsupported non-vanilla real fixtures are rejected in ranked mode while supported real fixtures can be accepted when deck policy otherwise allows
  - engine-core real-card runtime coverage for EB01-023 On Play draw using only plain checked-in manifest/effect definition data
  - engine-core real-card runtime coverage for OP04-014 Banish using only plain checked-in manifest data and explicitly checking trash movement plus Trigger/draw suppression
  - engine-core real-card fail-closed table covering at least eight distinct unsupported CARD-005 fixture families through appropriate current gates such as play-card legality, start-of-main board support, combat support, damage/life trigger handling, or effect runtime lookup
  - package-boundary assertion or existing boundary test proving engine-core does not import @optcg/cards, Poneglyph HTTP, Redis, Postgres, server, client, or UI surfaces
  - "root `corepack pnpm exec vitest run packages/cards/src/real-card-fixtures.test.ts packages/engine-core/src/real-card-dsl-runtime.test.ts`"
  - "`corepack pnpm run packets:verify`"
  - "full `corepack pnpm run verify`"
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - use TDD by adding or extending failing real-fixture regression tests before changing test helpers or support assertions
  - do not add new fixtures, production effect definitions, production support metadata, or engine runtime behavior
  - use live Poneglyph only as an optional local maintainer discovery step; never make tests or CI call live Poneglyph
  - keep Poneglyph data as printed/display metadata authority only
  - keep simulator overlay as gameplay implementation authority
  - fail closed on fixture schema, printed-text completeness, support-status, effect-definition linkage, runtime execution, hidden-information behavior, or deck-validation ambiguity
  - do not weaken TypeScript strictness
ambiguity_policy: fail_and_escalate
