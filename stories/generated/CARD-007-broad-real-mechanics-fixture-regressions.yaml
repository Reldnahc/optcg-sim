summary: >
  Add a broad real-card fixture regression suite that runs the existing
  cards-produced manifest and CARD-005 real effect-shape corpus against
  already-implemented engine/card support behavior, so many real printed card
  shapes are checked honestly without adding new engine mechanics or pretending
  partial card support exists.
story_boundary: >
  Own only broad real fixture regression tests, classification/rationale test
  data, and narrow test-local scaffolding needed to exercise existing behavior.
  Do not add new engine primitives, new production support metadata, new
  checked-in Poneglyph fixtures, new production effect definitions, custom
  handlers, live Poneglyph/Redis/server/client dependencies, or partial support
  for cards whose full printed behavior is not implemented.
