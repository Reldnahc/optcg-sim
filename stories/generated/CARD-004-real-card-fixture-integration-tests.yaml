  Add a small reviewed set of real Poneglyph card-detail fixtures and hermetic
  tests proving the existing @optcg/cards validation, normalization, overlay,
  manifest, deck/loadout validation, and effect DSL execution surfaces work
  against real checked-in card payloads rather than synthetic-only data.
