acceptance_criteria:
  - child stories exist for queue validation, choice-bucket grouping, no-choice ordering, empty/unsupported processing, legal-action gating, start-of-main integration, battle integration, and regression guard coverage
  - this parent story remains non-implementable and is not packetized
  - child stories can be story-reviewed as a set before any child approval
required_tests:
  - story-review agent must verify this parent is replaced by concern-scoped child stories before implementation begins
repo_rules:
  - do not approve or packetize this parent story
  - approve only concern-scoped child stories for implementation
  - implement one active child story at a time
  - use a parent integration branch only if the human explicitly chooses multi-PR parent integration for the ENG-010 group
  - keep engine-core deterministic and pure
ambiguity_policy: fail_and_escalate
