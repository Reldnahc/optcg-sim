summary: >
  Start the Milestone 2 engine subseries by introducing effect queue validation,
  grouping, no-choice ordering, fail-closed runtime processing, legal-action
  gating, and integration scaffolding as separate child stories before
  implementing blocker, counter, triggers, replacements, or card-specific
  effects.
