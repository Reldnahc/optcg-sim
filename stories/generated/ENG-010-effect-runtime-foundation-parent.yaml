scope:
  - define the effect runtime foundation delivery group
  - split pending queue validation, choice-bucket grouping, no-choice ordering, empty/unsupported queue processing, legal-action gating, start-of-main integration, battle integration, and regression guard coverage into child stories
  - keep blocker, counter, life trigger, replacement, continuous-effect, and card-specific effect execution stories after this foundation group
non_scope:
  - direct implementation from this parent story
  - approving or packetizing this parent story
  - implementing blocker, counter, life trigger, replacement, continuous-effect, source-presence resolution, effect execution, or card-specific behavior
  - server, client, database, Redis, WebSocket, React, live HTTP, or Poneglyph adapter behavior
