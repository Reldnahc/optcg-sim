spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: SEC-001A
epic_id: KICK-001
title: Define hidden-information fixture assertion contract
type: verification
area: security
primary_concern: verification
priority: critical
status: generated
summary: >
  Define the first hidden-information fixture and assertion contract so future
  filtered-view stories can express leakage expectations without inventing a new
  harness or placeholder gameplay behavior.
story_boundary: >
  Own only the hidden-information fixture shape and assertion harness smoke tests.
  Do not add package scripts, CI wiring, production engine APIs, spectator behavior,
  replay behavior, or client rendering logic in this story.
allowed_touch_points:
  - tests/hidden-info/**
  - fixtures/hidden-info/**
spec_refs:
  - 06-visibility-security.s004 (Player view contract)
  - 06-visibility-security.s023 (Security regression checklist)
  - 11-testing-quality.s011 (Hidden-information tests)
  - 23-repo-tooling-and-enforcement.s012 (Hidden-information safety enforcement)
scope:
  - define a fixture shape for hidden-information absence assertions
  - define assertion categories for opponent hand contents, deck order, face-down life identity, RNG state, and non-public queue internals
  - add smoke tests proving the harness can evaluate allowed public fields and rejected private paths against fixture payloads
non_scope:
  - package script wiring
  - CI workflow wiring
  - production filterStateForPlayer implementation
  - temporary reveal timing scenarios
  - declined-trigger leakage scenarios
  - spectator mode behavior
  - spectator-policy fixture cases
  - replay serializer policy
  - client or browser bundle safeguards
dependencies:
  - INF-004
acceptance_criteria:
  - hidden-information fixtures can describe public fields that may be present and private paths that must be absent
  - the assertion harness fails a fixture containing opponent hand card IDs, deck order, face-down life identity, RNG state, or non-public queue internals
  - the assertion harness passes a fixture that omits those private fields while preserving explicitly public fields
required_tests:
  - hidden-information fixture smoke test for a passing filtered player-view fixture
  - hidden-information fixture smoke test for a failing fixture with representative private-field leaks
repo_rules:
  - do not create placeholder gameplay, spectator, replay, or client behavior
  - temporary reveal, declined-trigger, and spectator-policy cases are deferred to later behavior-specific stories
  - future view-filtering stories must extend this fixture/assertion contract instead of creating one-off checks
ambiguity_policy: fail_and_escalate
