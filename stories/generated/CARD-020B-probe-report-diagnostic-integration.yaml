spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: CARD-020B
epic_id: CARD-020
title: Probe/report diagnostic integration
type: implementation
area: cards
primary_concern: verification
priority: high
status: generated
summary: >
  Integrate generic card-text diagnostic components into support-probe and
  generated-support-report output so unsupported cards explain what was
  recognized, what layer failed, and what text remains unsupported.
story_boundary: >
  Own only cards-side support-probe/report diagnostic presentation and metadata
  propagation over the CARD-020A diagnostic scanner. Do not add parser
  certification, generated DSL construction, generated playable support, engine
  runtime behavior, runtime capability records, or fixture/hash changes.
allowed_touch_points:
  - packages/cards/src/support-probe.ts
  - packages/cards/src/support-probe.test.ts
  - packages/cards/src/generated-support-report.ts
  - packages/cards/src/generated-support-report.test.ts
  - packages/cards/src/generated-support-index.ts
  - packages/cards/src/generated-support-types.ts
  - packages/cards/src/*support*.test.ts
  - packages/cards/src/*diagnostic*.ts
  - packages/cards/src/*diagnostic*.test.ts
  - agent-packets/CARD-020B.md
  - stories/generated/CARD-020*.yaml
  - stories/approved/CARD-020*.yaml
  - agent-packets/active.json
