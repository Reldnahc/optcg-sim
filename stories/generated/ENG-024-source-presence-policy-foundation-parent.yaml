scope:
  - centralize queued-effect source-presence policy evaluation for current effect runtime callers
  - preserve mustRemainInSameZone semantics for supported field-sourced timing effects
  - define deterministic helper behavior for resolveFromDestinationZone, resolveFromLastKnownInformation, and noSourceRequired under the existing EffectQueueEntry source/sourceSnapshot shape without adding new trigger timing implementations
  - treat entry.source.zone as the expected live zone for mustRemainInSameZone and resolveFromDestinationZone checks, failing closed when it is missing or cannot be proven
  - treat entry.sourceSnapshot as the last-known-information authority for resolveFromLastKnownInformation only when sourceSnapshot.instanceId matches entry.source.instanceId, sourceSnapshot.cardId matches entry.source.cardId, and sourceSnapshot.controllerId matches entry.source.playerId
  - treat noSourceRequired as independent from live source-zone presence while still preserving the current required entry.source field
  - keep unsupported or unprovable source-presence cases fail-closed with stable runtime-error behavior compatible with existing lifecycle events
  - integrate the centralized helper into the existing no-choice queue processor
  - preserve deterministic event ordering, eventJournal append behavior, and state hashes for identical inputs
non_scope:
  - direct implementation from this parent story
  - approving or packetizing this parent story as an active implementation story
  - new DSL primitives
  - Life Triggers
  - On K.O. implementation
  - target selection
  - replacement effects
  - custom handlers
  - server, browser client, UI, database, Redis, WebSocket, replay schema, or CLI behavior
dependencies:
  - ENG-023
child_stories:
  - id: ENG-024A
    title: Add source presence policy helper
    concern: Introduce a centralized helper that evaluates all SourcePresencePolicy values against current GameState and queue-entry source data without changing queue processor behavior.
    depends_on: [ENG-023]
  - id: ENG-024B
    title: Regress same-zone source presence
    concern: Move existing mustRemainInSameZone checks onto the helper and prove current missing, stale, and mismatched source behavior remains fail-closed.
    depends_on: [ENG-024A]
  - id: ENG-024C
    title: Regress destination and last-known source presence
    concern: Add policy-level coverage for resolveFromDestinationZone and resolveFromLastKnownInformation using existing queue-entry data and direct runtime fixtures without implementing new timing windows.
    depends_on: [ENG-024B]
  - id: ENG-024D
    title: Regress no-source-required policy
    concern: Add policy-level coverage proving noSourceRequired does not depend on live source-zone presence while unsupported runtime work remains fail-closed.
    depends_on: [ENG-024C]
  - id: ENG-024E
    title: Integrate source presence policy in queue processing
    concern: Use the centralized policy helper in the existing no-choice queue processor and preserve deterministic lifecycle/event behavior.
    depends_on: [ENG-024D]
acceptance_criteria:
  - child stories exist and pass set-level and exact per-story story-review before implementation
  - all SourcePresencePolicy values have centralized deterministic evaluation semantics
  - current mustRemainInSameZone behavior remains unchanged for supported On Play, When Attacking, and On Your Opponent's Attack no-choice draw paths
  - resolveFromDestinationZone, resolveFromLastKnownInformation, and noSourceRequired are covered through helper or runtime fixtures using fabricated queue-entry states without introducing new gameplay timing implementations
  - queue processing uses the centralized helper for source-presence checks
  - unsupported or unprovable policies fail closed without hidden-information leaks, partial mutation, nondeterministic events, or unstable hashes
  - final parent branch passes packet verification, focused effect runtime tests, engine-core typecheck, coverage, and full verify
required_tests:
  - story-review agent must verify this parent is replaced by concern-scoped child stories before implementation begins
repo_rules:
  - story-review must pass before presenting this story group as approval-ready
  - use the parent integration branch workflow if this parent story is approved
  - do not approve or packetize this parent story as an active implementation story
  - approve only ENG-024A through ENG-024E as implementation candidates
  - a set-level story-review does not satisfy exact per-story story-review for any child
  - run exact per-story story-review for each child story before moving it to approved or implementing it
  - implement one active substory packet at a time
  - substory PRs target the ENG-024 parent integration branch
  - do not run packets:complete for substories until the parent branch lands on main
  - run full parent PR integration review and human review before merging ENG-024 to main
  - after parent merge, run packets:complete-many for ENG-024A through ENG-024E
  - if policy support requires new DSL primitives, Life Triggers, On K.O. implementation, target selection, replacement effects, or custom handlers, stop and split or record the blocker
ambiguity_policy: fail_and_escalate
