spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: TYP-001
epic_id: M1-001
title: Replace placeholder shared type package with canonical contracts
type: implementation
area: contracts
primary_concern: contract
priority: critical
status: replaced
summary: >
  Replace the placeholder `@optcg/types` package with the shared contract
  surface required before engine-core implementation can begin.
story_boundary: >
  This parent story is not implementable. It preserves the full shared-types
  context and is replaced by smaller child stories TYP-001A through TYP-001H.
allowed_touch_points:
  - packages/types/**
spec_refs:
  - 12-roadmap.s003 (Revised build order)
  - 12-roadmap.s015 (Immediate next tasks)
  - 15-implementation-kickoff.s005 (Step 1 - @optcg/types)
  - 16-typescript-interface-draft.s003 (Brand and primitive identifiers)
  - 16-typescript-interface-draft.s004 (Card metadata)
  - 16-typescript-interface-draft.s005 (Game state)
  - 16-typescript-interface-draft.s008 (Actions and decisions)
  - 16-typescript-interface-draft.s009 (Engine result)
  - 22-v6-implementation-tightening.s006 (Canonical type contract)
scope:
  - define the full shared type package delivery context
  - split implementation into concern-scoped child stories
  - "canonical ownership map: TYP-001A owns `Brand`, branded identifiers, and global scalar/reference primitives; TYP-001B owns card metadata, card refs/snapshots, Poneglyph-derived canonical support types, decklists, manifests, and loadouts; TYP-001C owns engine event, event visibility, and causality contracts; TYP-001D owns effect definition, filter, target, duration, and effect DSL support contracts; TYP-001E owns decision/action contracts and their directly required support contracts; TYP-001F owns runtime support structures; TYP-001G owns GameState, engine result, engine error, custom handler, state hash input, and atomic mutation contracts; TYP-001H owns export cohesion only"
non_scope:
  - direct implementation from this parent story
  - engine-core behavior
  - card-data adapter behavior
  - server protocol implementation
  - browser client implementation
dependencies: []
acceptance_criteria:
  - child stories exist for the shared type concerns needed by Milestone 1
  - this parent story remains non-implementable and is not packetized
required_tests:
  - story review must verify this parent is replaced by child stories before any shared-types implementation begins
repo_rules:
  - do not approve or packetize this parent story
  - child stories may be approved together on the parent integration branch, but only one child story may be active in `agent-packets/active.json` at a time
  - child stories merged only into the parent integration branch remain approved until the parent branch lands on `main`
  - after the parent branch lands on `main`, complete included child stories with `pnpm run packets:complete-many`
  - each child story must cite exact spec sections and stay within `packages/types/**`
  - if older spec prose conflicts with `contracts/canonical-types.ts`, treat `22-v6-implementation-tightening.s006` and the canonical contract as the implementation authority
  - each canonical export added to `@optcg/types` must be owned by exactly one child story before implementation begins
ambiguity_policy: fail_and_escalate
