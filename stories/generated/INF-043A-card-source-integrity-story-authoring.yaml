  - 24-story-schema.s021
  - 25-story-template.s008
  - 25-story-template.s009
  - 27-spec-driven-story-generation-workflow.s006
  - 27-spec-driven-story-generation-workflow.s007
  - 27-spec-driven-story-generation-workflow.s017
scope:
  - define card source integrity as a required section for approved cards-area implementation stories
  - require fixture capture or explicit checked-in fixture provenance for target real cards
  - require behavior-sensitive field assertions for card type, color, cost, power, counter, types, effect, trigger, and release metadata where present
  - require manifest regeneration when fixture or support evidence changes
non_scope:
  - schema or validator enforcement beyond documentation-focused contract coverage
  - real-card fixture updates
  - generated support updates
  - engine behavior
dependencies: []
acceptance_criteria:
  - workflow docs say CARD implementation stories must include card source integrity evidence
  - story template shows a copy-ready `card_source_integrity` block
  - docs distinguish real Poneglyph fixture provenance from helper-test fake payloads
  - story-review guidance tells reviewers to reject vague source integrity before approval
required_tests:
  - documentation contract or targeted text assertion covering card source integrity guidance
  - run `corepack pnpm run specs:verify-metadata` if specs are changed
repo_rules:
  - do not change fixtures or manifests
  - do not introduce live Poneglyph requirements in CI
ambiguity_policy: fail_and_escalate
