scope:
  - move applyAction declareAttack supported trigger life damage decision creation coverage from battle-damage-banish.test.ts, preserving that the damaged defending player owns the pending decision
  - move respondToDecision addToHand decline resolution and hidden hand movement coverage from battle-damage-banish.test.ts, preserving that the declined trigger card moves to the damaged defending player's hand
  - move malformed Life Trigger response rejection and mutation-safety coverage from battle-damage-banish.test.ts
  - preserve decision IDs, event ordering, hidden-information visibility, state hash, and mutation expectations
non_scope:
  - changing production code
  - changing Life Trigger, damage, Banish, K.O., or decision response behavior
  - moving vanilla damage, Banish, Character K.O., Blocker, Counter, attack timing, or pipeline regression tests
dependencies:
  - ENG-032F
acceptance_criteria:
  - battle-damage-banish.test.ts no longer contains the moved battle Life Trigger test groups
  - battle-damage-life-trigger.test.ts covers the same battle Life Trigger scenarios with behavior-equivalent expectations
  - no production files change
  - focused tests, coverage, and full verify pass
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/battle-damage-banish.test.ts packages/engine-core/src/battle-damage-character-ko.test.ts packages/engine-core/src/battle-damage-life-trigger.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-032J packet while implementing this story
  - target the ENG-032 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - this is a behavior-preserving test organization story; if a production change appears necessary, stop and split or record an ambiguity
ambiguity_policy: fail_and_escalate
