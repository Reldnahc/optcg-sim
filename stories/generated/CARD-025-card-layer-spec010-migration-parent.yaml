priority: high
status: generated
summary: >
  Migrate current cards-layer generated-support implementations to the SPEC-010
  primitive-boundary authority model. Existing support must remain compatible,
  but support authority must come from reusable wrapper, marker, cost,
  condition, target, filter, body, source-policy, and composition evidence
  rather than exact full-effect text, exact wrapper-body samples, story-named
  production parsers, real card IDs, external card lists, or sample-shaped
  allowlists.
story_boundary: >
  Parent planning story only. Do not implement this parent directly. Implement
  CARD-025A through CARD-025G one at a time after distinct parent and child
  story-review evidence exists. This parent coordinates only the cards-layer
  migration of current generated-support implementations; it does not add new
  engine runtime capability, shared schema authority, real-card promotion, or
  fixture/source-integrity work.
