id: CARD-025F
epic_id: CARD-025
title: Composition parser migration
type: implementation
area: cards
primary_concern: rules
priority: high
status: generated
summary: >
  Migrate current cards-layer composition paths to compose primitive evidence
  from wrappers, costs, conditions, targets, bodies, and sequence boundaries.
  Line-separated, conditional, sequence, costed-body, and continuous
  compositions must not authorize support by exact full-line or exact
  full-definition samples.
story_boundary: >
  Own only cards-layer composition parser/composer behavior and tests for
  currently supported generated-support implementations. Do not add new wrapper,
  condition, target, body, engine runtime, schema, real-card fixture, manifest,
  source-hash, behavior-hash, or overlay behavior.
