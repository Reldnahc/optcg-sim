spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-042D
epic_id: KICK-001
title: Verify optional decisions are private and fail closed
type: implementation
area: engine
primary_concern: rules
priority: high
status: generated
summary: >
  Add PlayerView, legal-action, invalid-response, malformed-response, and
  unsupported-shape regressions for optional activation decisions.
story_boundary: >
  Own only projection and fail-closed regressions for chooseOptionalActivation.
  Stop before adding UI/API affordances, real-card fixtures, optional costs, or
  optional target effects.
allowed_touch_points:
  - packages/engine-core/src/actions.ts
  - packages/engine-core/src/optional-activation-actions.ts
  - packages/engine-core/src/filter-state-for-player.ts
  - packages/engine-core/src/actions-pending-decision.test.ts
  - packages/engine-core/src/effect-runtime-optional-activation.test.ts
  - packages/engine-core/src/filter-state-for-player.optional-activation.test.ts
  - stories/generated/ENG-042D-optional-view-hidden-info-invalid-response.yaml
  - stories/approved/ENG-042D-optional-view-hidden-info-invalid-response.yaml
  - agent-packets/ENG-042D.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s009
  - 03-game-state-events-decisions.s011
  - 03-game-state-events-decisions.s015
  - 03-game-state-events-decisions.s016
  - 03-game-state-events-decisions.s017
  - 04-effect-runtime.s009
  - 04-effect-runtime.s012
  - 06-visibility-security.s004
  - 06-visibility-security.s006
  - 06-visibility-security.s007
  - 06-visibility-security.s017
  - 11-testing-quality.s004
  - 11-testing-quality.s008
scope:
  - expose optional activation legal responses only to the pending decision player
  - keep the pending optional activation decision absent from opponent PlayerView
  - ensure public PlayerView/legal actions do not leak effect queue internals
  - prove non-decision players receive no optional activation legal responses in engine legal-action and PlayerView projection
  - reject wrong-decision-id, wrong-response-type, invalid-choice, and malformed optional activation responses without mutation
  - prove unsupported optional cost/target/custom shapes still fail closed with no partial mutation
  - include deterministic hash checks for invalid-response no-mutation cases
non_scope:
  - UI labels or client command surfaces
  - server/API response validation
  - real-card fixture capture
  - supporting optional costs, targets, replacements, or card selection
dependencies:
  - ENG-042A
  - ENG-042B
  - ENG-042C
acceptance_criteria:
  - only the choosing player receives activate/decline legal actions
  - opponent PlayerView has no optional pendingDecision and no effect queue internals
  - malformed optional activation responses return invalid/illegal errors without state mutation
  - unsupported optional shapes fail closed rather than creating a decision or resolving
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/actions-pending-decision.test.ts packages/engine-core/src/effect-runtime-optional-activation.test.ts packages/engine-core/src/filter-state-for-player.optional-activation.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-042D packet while implementing this story
  - run corepack pnpm run packets:verify before implementation and review handoff
  - stay within allowed_touch_points
  - target the ENG-042 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
ambiguity_policy: fail_and_escalate
