child_stories:
  - id: ENG-059A
    title: Public trash-count condition runtime
    concern: Add reusable engine condition evaluation for public trash-count predicates and comparators while preserving hidden-information, fail-closed, and deterministic runtime behavior.
    depends_on: [ENG-058A]
  - id: ENG-059B
    title: Conditional continuous keyword grants
    concern: Add a reusable continuous modifier path for conditionally granting the allowlisted supported public combat keywords through the same computed-view path without mutating canonical card state.
    depends_on:
      [ENG-014A, ENG-014B, ENG-014C, ENG-014D, ENG-014E, ENG-044, ENG-059A]
  - id: ENG-059C
    title: Effect-origin field removal protection
    concern: Add a reusable engine protection layer that classifies field removal by process and source controller so opponent-effect removal can be prevented without blocking battle K.O., rule-process trash, costs, or own effects.
    depends_on: [TYP-012A, ENG-045, ENG-059A]
  - id: ENG-059D
    title: Synthetic conditional protection composition proof
    concern: Prove the ENG-059 primitives compose in a synthetic engine fixture built from the decomposed effect parts with no parser, generated-support, real-card fixture, or production card-ID special case.
    depends_on: [ENG-056B, ENG-059A, ENG-059B, ENG-059C]
scope:
  - coordinate ENG-059A through ENG-059D as reusable engine-only child stories
  - require every production behavior to be expressed as a general runtime primitive, not a card-ID branch or full-text template
  - decompose the conditional predicate into primitive shapes such as "If you have", "7 or more", "cards in your trash", and public zone "trash"; the implementation may represent this as a reusable self trash-count `gte 7` condition
  - decompose the keyword grant into primitive shapes such as target "this Character", grant verb "gains", and a supported public keyword such as "[Blocker]"; the implementation must represent this as a reusable conditional continuous keyword grant, not a Blocker-only branch
  - decompose the protection text into primitive shapes such as protected object "this Character", removal process "removed from the field", source controller "opponent", and source kind "effects"; the implementation must represent this as reusable field-removal protection metadata
  - reuse existing triggered primitive shapes for "[On K.O.]", "Draw", and "1 card" rather than reimplementing On K.O. draw behavior
  - prove the primitive parts compose with existing On K.O. draw support in a synthetic engine fixture
  - preserve deterministic events, replay behavior, state hashes, hidden information, source presence, and fail-closed unsupported behavior
  - provide runtime capability truth for later CARD/parser work without changing card parser or generated support in this parent
non_scope:
  - direct parent implementation
  - production references to any real card ID or external card list
  - full-card text matching or production branches for one printed effect
  - packages/cards changes, parser certification, generated-support component evidence, support reports, support probes, real-card fixtures, overlays, source hashes, or behavior hashes
  - making any real card playable
  - parser diagnostic wording cleanup
  - broad continuous-effect layering beyond supported keyword grants needed by the child stories
  - protection against battle K.O., rule-process trash, controller costs, controller-owned effects, or unsupported/ambiguous removal processes
  - server, client, API, UI, database, replay UI, WebSocket, Redis, or live Poneglyph work
acceptance_criteria:
  - ENG-059 is not implemented directly
  - ENG-059A through ENG-059D are independently reviewable child stories
  - each child stays engine-only and does not import @optcg/cards
  - no production engine code checks a real card ID, the full effect text as one string, or any external-card-list identifier
  - public trash-count conditions, conditional keyword grants, and opponent-effect field-removal protection are reusable by other cards with the same mechanics
  - ENG-059C consumes TYP-012A field-removal protection contracts instead of widening protection types inside engine runtime work
  - similar cards can benefit later only because they use the same runtime primitives, not because their full text or IDs were known during implementation
  - later CARD/parser work may add partial or complete generated-support evidence for cards with matching primitives, but ENG-059 itself does not add parser or generated-support behavior
  - unsupported or ambiguous condition, modifier, protection, process, source-policy, hidden-info, replay, or ordering cases continue to fail closed
required_tests:
  - story-review for ENG-059 parent before approval handoff
  - story-review for ENG-059A before approval handoff
  - story-review for ENG-059B before approval handoff
  - story-review for ENG-059C before approval handoff
  - story-review for ENG-059D before approval handoff
  - reconstruct a parent/child story-review matrix with distinct assignment and artifact identities per row before approval or implementation handoff
  - run `corepack pnpm run stories:validate`
repo_rules:
  - use the parent/substory workflow
  - keep one active child packet at a time
  - activate ENG-059A first; do not activate ENG-059B or ENG-059C until ENG-059A has landed as reviewed commit evidence on the parent branch
  - do not activate ENG-059D until ENG-059A, ENG-059B, and ENG-059C have landed as reviewed commit evidence on the parent branch
  - do not complete child packets until the parent branch lands on main
  - do not open child PRs to main; use one final parent PR after all children are reviewed on the parent branch
  - fail closed on hidden-information, event-order, replay, source-presence, protection, or condition ambiguity
ambiguity_policy: fail_and_escalate
