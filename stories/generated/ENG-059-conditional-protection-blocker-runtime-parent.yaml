title: Conditional protection and blocker runtime parent
type: implementation
area: engine
primary_concern: rules
priority: high
status: generated
summary: >
  Coordinate reusable engine runtime primitives for public trash-count
  conditions, conditional continuous keyword grants, effect-origin field
  removal protection, and triggered On K.O. composition so the runtime can be
  proved from reusable primitive parts without hardcoding any full card text,
  card ID, parser rule, or external card list.
story_boundary: >
  Parent planning story only. Do not implement this parent directly. Implement
  ENG-059A through ENG-059D one at a time only after separate ENG-059 parent
  and child story-review artifacts exist. This parent owns engine-only runtime
  capability work. Production engine code must express reusable condition,
  continuous modifier, removal-protection, and trigger-composition primitives
  that can support any card with the same mechanics. The story set must work
  from phrase-level primitive shapes, not from one full-card solution.
