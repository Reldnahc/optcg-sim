summary: >
  Add the canonical effect-definition support contracts that decisions,
  runtime queues, continuous effects, and card implementation metadata depend
  on, without implementing effect execution behavior.
story_boundary: >
  Own only pure effect DSL/support type exports needed for compile-ready later
  type slices. Do not add pending decisions, actions, GameState, engine
  results, runtime queues, custom handlers, or effect execution behavior.
