title: Top-N search request contract authorability
type: implementation
area: contracts
primary_concern: contract
priority: high
status: generated
summary: >
  Make the scoped top-N deck `search` request shape fixture-authorable before
  engine search runtime or cards generated-support work consumes it.
story_boundary: >
  Contract/schema/type story only. Do not implement runtime search behavior,
  ordering decisions, parser support, generated support, runtime capability
  metadata, support reports, real-card fixture evidence, or card promotion.
