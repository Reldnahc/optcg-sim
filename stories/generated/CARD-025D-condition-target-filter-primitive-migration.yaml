title: Condition target and filter primitive migration
type: implementation
area: cards
primary_concern: rules
priority: high
status: generated
summary: >
  Migrate current condition, target, filter, cardinality, and duration parser
  support to reusable primitive evidence. Larger supported phrases must be
  proven as compositions of smaller valid primitives rather than single
  full-sentence or sample-value parser branches.
story_boundary: >
  Own only cards-layer condition, target, filter, cardinality, duration, and
  diagnostic parser components for currently supported generated-support
  implementations. Do not add new body effects, engine runtime behavior, shared
  schema, real-card fixtures, manifests, source hashes, behavior hashes, or
  overlays.
