dependencies:
  - CARD-025B
scope:
  - migrate current trash-count, hand-count, leader-color-count, DON-field-count, attached-DON, and turn-state condition support to primitive condition evidence where currently supported
  - migrate condition comparators and numeric thresholds to parsed numeric primitives, not sample-specific branches
  - migrate supported boolean condition connectors to explicit composition evidence
  - migrate current target owner, zone, Character/Leader/Stage/card type, subtype, color, name exclusion, base-cost, cardinality, saved-target, and duration filters to primitive evidence where currently supported
  - update existing generated-support tests that directly provide parser-certification evidence for migrated condition, target, filter, cardinality, and duration primitives so they use the new primitive IDs rather than legacy bundled IDs
  - prove valid subsets of larger supported target/filter phrases work independently unless explicitly out of scope in the current implementation
  - keep unsupported target/filter/duration wording fail-closed with narrow diagnostics
non_scope:
  - new condition families, new target zones, new filter families, or new durations not already supported by current generated-support behavior
  - engine runtime or schema changes
  - body effect migration owned by CARD-025E
  - real-card fixture or manifest work
card_source_integrity:
  - not applicable because this story migrates parser/generated-support primitives using synthetic inputs and does not enable or change gameplay support for any real card
  - new tests must not cite real card IDs or real fixtures as acceptance evidence
engine_capability_preflight:
  - no new runtime capability is introduced
  - parsed primitive shapes decompose as condition evidence for supported trash-count, hand-count, leader-color-count, DON-field-count, attached-DON, and turn-state predicates; comparator and threshold evidence for supported numeric comparisons; target evidence for supported owner, zone, object-kind, and saved-target references; filter evidence for supported type, color, name exclusion, and base-cost filters; cardinality evidence for supported exact, up-to, and all target counts; and duration evidence for supported this-turn, this-battle, or continuous durations
  - wrapper or entry-point, markers, costs, and source-presence policy evidence are delegated to CARD-025C and may only be consumed here as already-certified prerequisite evidence
  - effect body/request evidence is delegated to CARD-025E and may only be consumed here as already-certified prerequisite evidence
  - composition evidence is limited to condition connector composition and target/filter/cardinality/duration assembly for current supported shapes; broader line, sequence, conditional, and costed-body composition is delegated to CARD-025F
  - decision/visibility needs are limited to current public target/filter visibility and search/filter visibility boundaries already represented by existing generated-support entries; hidden-information or chooser decision runtime behavior is not introduced here
  - supported capability group includes existing condition, target/filter, cardinality, duration, public visibility, and saved-target runtime capability evidence already referenced by current generated-support entries
  - missing capability group is none for current supported condition/target/filter rows
acceptance_criteria:
  - current supported conditions emit primitive condition, comparator, owner, zone, and threshold evidence
  - current supported targets and filters emit primitive owner, zone, object-kind, type/color/name/base-cost, cardinality, saved-target, and duration evidence as applicable
  - numeric condition thresholds and target filter values vary through parsed primitives, not sample-specific support branches
  - generated-support tests fail closed when any required condition, target, filter, cardinality, or duration primitive evidence is absent
  - anti-shape tests fail on exact full-condition or exact target-filter phrase authorization where reusable primitives should be used
required_tests:
  - story-review for CARD-025D before approval handoff
  - parser primitive matrix tests for current supported condition families and numeric comparator variation
  - parser primitive matrix tests for current supported target, filter, cardinality, saved-target, and duration families, including numeric variation for supported target/filter/cardinality values
  - generated-support tests proving missing condition, target, filter, cardinality, or duration primitive evidence fails closed
  - existing generated-support tests that feed parser-certification evidence for migrated D primitives remain green by supplying primitive parser-certification IDs rather than compatibility aliases or bundled exact phrase IDs
  - fail-closed tests for absent cardinality evidence and absent duration evidence on shapes that require those primitives
  - anti-shape source scan or equivalent test proving no exact full-condition or full target-filter phrase authorizes current support
  - run `corepack pnpm run packets:verify`
  - run `corepack pnpm run stories:validate`
  - run `corepack pnpm --filter @optcg/cards test`
  - run full `corepack pnpm verify`
repo_rules:
  - generate and activate the CARD-025D packet before implementation
  - stay within allowed_touch_points
  - do not add new runtime or schema capability
  - fail closed when a currently supported phrase cannot be decomposed into reusable primitives without broadening scope
ambiguity_policy: fail_and_escalate
