scope:
  - decompose ordinary-damage life-trigger behavior into approved child stories
  - detect supported Trigger metadata only when a Life card is taken by non-Banish Leader damage
  - create and resolve a confirmLifeTrigger decision for the damaged player without exposing declined trigger identity to the opponent
  - move declined trigger cards to the damaged player's hand through the normal hidden life-to-hand path
  - reveal activated trigger cards publicly, keep them in no zone while supported resolution runs, then trash them unless current supported effect behavior says otherwise
  - support only implemented-dsl Trigger cards with exactly one auto Trigger effect that draws 1 card for the damaged player without cost, condition, optional activation, target selection, replacement behavior, custom handler, or source-moving behavior
  - preserve deterministic event ordering, state hashes, fail-closed unsupported behavior, and hidden-info-safe PlayerView projection
non_scope:
  - direct implementation from this parent story
  - approving or packetizing this parent story as an active implementation story
  - Banish changes
  - Double Attack or multiple damage handling
  - replacement effects
  - complex Trigger effects
  - search, look, or reveal primitives
  - target selection
  - optional activation beyond the life-trigger confirm decision
  - server/client/UI
  - replay schema or replay storage
dependencies:
  - ENG-027D
child_stories:
  - id: ENG-028A
    title: Detect life trigger and create decision
    concern: Detect supported trigger metadata from ordinary Leader damage and pause with a hidden-info-safe confirmLifeTrigger decision.
    depends_on: [ENG-027D]
  - id: ENG-028B
    title: Resolve life trigger decline to hand
    concern: Validate addToHand responses and move the taken Life card to the damaged player's hand without public reveal.
    depends_on: [ENG-028A]
  - id: ENG-028C
    title: Handle activated life trigger no-zone
    concern: Validate activateTrigger responses, reveal the card publicly, and represent it as resolving from no zone.
    depends_on: [ENG-028B]
  - id: ENG-028D
    title: Resolve simple life trigger effect
    concern: Resolve one supported no-choice Trigger effect shape through the existing runtime and trash the activated card afterward.
    depends_on: [ENG-028C]
  - id: ENG-028E
    title: Verify life trigger hidden information
    concern: Prove reveal, decline, activation, no-zone, event, legal-action, and PlayerView projections do not leak hidden information.
    depends_on: [ENG-028D]
acceptance_criteria:
  - child stories exist and pass set-level and exact per-story story-review before implementation
  - child stories cover detection, decision creation, decline-to-hand, activated reveal/no-zone handling, supported no-choice resolution, trash-after-resolution, fail-closed unsupported behavior, and hidden-info-safe projection
  - parent integration review confirms all child stories compose without broadening into Banish changes, Double Attack, replacement effects, complex Trigger effects, search/look/reveal primitives, target selection, server/client/UI, or replay schema
required_tests:
  - run corepack pnpm run stories:validate
  - run corepack pnpm run packets:verify for each active child story
  - run corepack pnpm run verify before parent PR handoff
repo_rules:
  - do not approve, packetize, or activate ENG-028 itself as an implementation story
  - approve and implement only ENG-028A through ENG-028E as child stories
  - story-review must pass before presenting this story group as approval-ready
  - a set-level story-review does not satisfy exact per-story story-review for any child
  - run exact per-story story-review for each child story before moving it to approved or implementing it
  - use a parent integration branch
  - open child PRs into the parent integration branch
  - keep one active child packet at a time
  - substory human review is deferred only because the user explicitly requested the parent integration branch workflow for this group
  - do not run packets:complete for children until the parent branch lands on main
  - run parent integration review before merging to main
  - after the parent branch merges to main, run packets:complete-many for ENG-028A through ENG-028E
ambiguity_policy: fail_and_escalate
