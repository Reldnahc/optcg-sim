id: INF-043
epic_id: INF-043
title: Harden card implementation story authoring
type: tooling
area: infra
primary_concern: tooling
priority: high
status: generated
summary: >
  Make future CARD implementation stories explicitly prove real-card source
  integrity and reusable engine capability readiness before card support work is
  approved.
story_boundary: >
  Own only story-authoring documentation, schema/tooling guardrails, and draft
  substory decomposition for future CARD implementation stories. Do not change
  gameplay behavior, card fixtures, generated support, or engine runtime code.
allowed_touch_points:
  - docs/workflow/card-fixture-capture.md
  - docs/workflow/story-execution.md
  - docs/workflow/review-gate.md
  - specs/24-story-schema.md
  - specs/25-story-template.md
  - specs/spec-manifest.json
  - specs/section-index.json
  - contracts/story.schema.json
  - tools/validate-stories.ts
  - tests/contracts/story-schema-contract.test.mjs
  - tests/contracts/committed-story-validation.test.mjs
  - stories/generated/INF-043-card-implementation-story-authoring-parent.yaml
  - stories/generated/INF-043A-card-source-integrity-story-authoring.yaml
  - stories/generated/INF-043B-engine-capability-preflight-story-authoring.yaml
  - stories/generated/INF-043C-enforce-card-story-authoring-guards.yaml
spec_refs:
  - 24-story-schema.s002
  - 24-story-schema.s004
  - 24-story-schema.s020
  - 24-story-schema.s021
  - 24-story-schema.s025
  - 25-story-template.s002
  - 25-story-template.s008
  - 25-story-template.s009
  - 27-spec-driven-story-generation-workflow.s006
  - 27-spec-driven-story-generation-workflow.s007
  - 27-spec-driven-story-generation-workflow.s017
  - 27-spec-driven-story-generation-workflow.s008
scope:
  - define card source integrity requirements for approved cards-area implementation stories
  - define engine capability preflight requirements for approved cards-area implementation stories
  - add tooling enforcement so approved cards-area implementation stories cannot omit those preflight blocks
  - add story-review guidance to reject vague or empty preflight content before approval
  - preserve generated backlog compatibility while blocking future approval without the required blocks
non_scope:
  - gameplay engine behavior
  - parser behavior
  - generated support behavior
  - Poneglyph fixture capture or fixture edits
  - manifest regeneration
  - server, client, API, UI, Redis, database, or replay behavior
dependencies: []
acceptance_criteria:
  - future approved cards-area implementation stories require explicit card source integrity evidence or an explicit not-applicable explanation
  - future approved cards-area implementation stories require explicit engine capability preflight evidence or an explicit not-applicable explanation
  - story docs and templates explain how to split reusable ENG prerequisites from CARD support stories
  - committed-story validation fails an approved CARD implementation story missing either guard
  - story-review guidance tells reviewers to flag vague source integrity or capability preflight content
required_tests:
  - story schema contract test for card source integrity and engine capability preflight fields
  - committed-story validation test rejecting approved CARD implementation stories missing the new guards
  - committed-story validation test accepting generated CARD implementation drafts without blocking backlog review
  - run `corepack pnpm run stories:validate`
  - run targeted contract tests for story schema and committed story validation
repo_rules:
  - do not modify card fixtures or generated support
  - do not change engine runtime behavior
  - keep approved-story enforcement narrow enough not to break historical done stories or generated backlog drafts
ambiguity_policy: fail_and_escalate
child_stories:
  - id: INF-043A
    title: Require real-card source integrity in CARD stories
    concern: documentation
    depends_on: []
  - id: INF-043B
    title: Require engine capability preflight in CARD stories
    concern: documentation
    depends_on: []
  - id: INF-043C
    title: Enforce CARD story authoring guard sections
    concern: tooling
    depends_on: [INF-043A, INF-043B]
