title: Add real fixture coverage for implemented primitives
type: implementation
area: cards
primary_concern: verification
priority: high
status: generated
summary: >
  Promote a small reviewed set of real Poneglyph-backed fixtures into
  implemented-primitive regression coverage only where the card's complete
  printed behavior is already supported by the current engine runtime, so
  previously implemented primitives are tested against real card data without
  granting partial or ambiguous gameplay support.
story_boundary: >
  Own only real fixture-backed verification and overlay/effect-definition
  linkage for primitives already implemented before this story. Do not add new
  primitives, keyword behavior, effect DSL semantics, custom handlers, full
  catalog support, server/client/API/UI integration, live-network tests, or
  partial support for cards whose full printed behavior is not implemented.
