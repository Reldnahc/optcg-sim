spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-045D
epic_id: KICK-001
title: Apply selected KO replacement and emit event
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Apply the accepted supported KO replacement through existing deterministic
  engine result paths and emit `replacementApplied`.
story_boundary: >
  Own only the accepted single-candidate KO replacement execution path. Do not
  add broad replacement priority, replay storage, or other process kinds.
allowed_touch_points:
  - packages/engine-core/src/actions.ts
  - packages/engine-core/src/action-results.ts
  - packages/engine-core/src/effect-runtime.ts
  - packages/engine-core/src/effect-runtime-replacement-application.test.ts
  - packages/engine-core/src/effect-runtime-primitives.ts
  - packages/engine-core/src/effect-runtime-target-primitives.test.ts
  - packages/types/src/events.ts
  - packages/types/src/events.test.ts
  - stories/generated/ENG-045D-ko-replacement-application-event.yaml
  - stories/approved/ENG-045D-ko-replacement-application-event.yaml
  - agent-packets/ENG-045D.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s007
  - 03-game-state-events-decisions.s008
  - 04-effect-runtime.s013
  - 05-effect-dsl-reference.s002
  - 05-effect-dsl-reference.s003
  - 05-effect-dsl-reference.s004
  - 05-effect-dsl-reference.s012
  - 11-testing-quality.s004
  - 22-v6-implementation-tightening.s011
scope:
  - apply the accepted supported replacement by skipping the KO mutation and executing exactly the replacement block's `draw 1 self` body through the existing no-choice draw primitive with `self` bound to the replacement/source controller
  - emit `replacementApplied` before the replacement effect's own events
  - include deterministic process id, replacement id, previous payload hash, and transformed payload hash or equivalent stable payload evidence
  - ensure canonical state hash and event order are deterministic
  - keep replacement application visible only as safe public/replay-safe event data
  - do not create, enqueue, or re-enter a nested or secondary draw replaceable process when executing the replacement draw body
non_scope:
  - multiple replacements or priority sorting
  - replacement effects other than the reviewed `draw 1 self` body
  - rollback/replay artifact storage
  - real-card fixtures or card-data integration
dependencies:
  - ENG-045A
  - ENG-045B
  - ENG-045C
acceptance_criteria:
  - accepting the supported replacement skips the original KO mutation
  - accepted replacement emits `replacementApplied` and then the replacement draw events in deterministic order
  - accepted replacement does not create a draw replacement process or detect draw replacements
  - event journal and returned events match
  - state hash coverage proves deterministic canonical output
required_tests:
  - run `corepack pnpm exec vitest run packages/types/src/events.test.ts packages/engine-core/src/effect-runtime-target-primitives.test.ts packages/engine-core/src/effect-runtime-replacement-application.test.ts`
  - run `corepack pnpm --filter @optcg/engine-core typecheck`
  - run `corepack pnpm run packets:verify`
  - run `corepack pnpm run verify`
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-045D packet while implementing this story
  - stay within allowed_touch_points
  - target the ENG-045 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
ambiguity_policy: fail_and_escalate
