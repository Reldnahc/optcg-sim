spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-047
epic_id: KICK-001
title: Search reveal transient set foundation parent
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Coordinate the first narrow search/reveal transient set lifecycle so a
  supported synthetic search/look path can reveal allowed candidates, create a
  choice when needed, resolve the chosen card movement, and deterministically
  clean up hidden-info-safe transient reveal state.
story_boundary: >
  This parent is not directly implementable. It coordinates ENG-047A through
  ENG-047E on a parent integration branch. The first supported path is the
  exact synthetic top-of-deck search shape: controller searches the top 1 card
  of their own deck for up to 1 Character card using `type: search`, `zone:
  deck`, `player: self`, `lookCount: 1`, `filter: categories character`, `min:
  0`, `max: 1`, `destination: hand`, `revealTo: chooserOnly`, and
  `shuffleAfter: false`. Do not add real-card fixture capture, broad search
  grammar, client UI, server protocol, or card-data integration.
allowed_touch_points:
  - stories/generated/ENG-047*.yaml
  - stories/approved/ENG-047*.yaml
