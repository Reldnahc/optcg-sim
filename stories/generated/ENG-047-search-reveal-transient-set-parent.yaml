  - 27-spec-driven-story-generation-workflow.s015
  - 27-spec-driven-story-generation-workflow.s017
scope:
  - coordinate a parent integration branch for ENG-047A through ENG-047E
  - define one narrow transient revealed set for the exact supported synthetic top-1 deck search shape
  - reveal only matching Character candidates to the chooser-only visibility scope
  - create no decision, reveal no card identity, and leave deck order unchanged when the top card is absent or ineligible
  - create and resolve a required choice decision when the supported path has eligible revealed candidates
  - "validate chosen cards against the transient set and `categories: [character]` candidate filter"
  - move chosen cards to hand and return unchosen revealed cards to deck top in original order face-down
  - prevent stale reveal candidates after decision completion, zero-selection cleanup, or early exit
  - prove PlayerView, event, legal-action, metadata, state-hash, and event-order hidden-info safety
non_scope:
  - direct implementation from this parent story
  - packetizing or activating this parent story as an active implementation story
  - real-card fixture capture or card-data integration
  - full search grammar or full card-type search support
  - broad deck reordering or searching all card types
  - client UI or search display
  - server protocol, replay viewer, database, Redis, live Poneglyph, or UI work
  - engine-core importing @optcg/cards
dependencies:
  - ENG-046
child_stories:
  - id: ENG-047A
    title: Add transient reveal set model and support gate
    concern: Represent the first narrow transient reveal set and fail closed for unsupported reveal/search shapes.
    depends_on: []
  - id: ENG-047B
    title: Create reveal choice decisions
    concern: Reveal allowed candidates with correct visibility and create a private/public-safe choice decision for the supported path.
    depends_on: [ENG-047A]
  - id: ENG-047C
    title: Resolve choices and clean up transient sets
    concern: Validate selected candidates, move chosen cards, and remove all stale transient reveal state.
    depends_on: [ENG-047A, ENG-047B]
  - id: ENG-047D
    title: Add hidden-info view and legal-action regressions
    concern: Prove PlayerView, events, legal actions, and metadata do not leak deck order or hidden cards.
    depends_on: [ENG-047A, ENG-047B, ENG-047C]
  - id: ENG-047E
    title: Add event-order and state-hash regressions
    concern: Prove deterministic reveal, decision, movement, cleanup event sequencing and state hashes.
    depends_on: [ENG-047A, ENG-047B, ENG-047C, ENG-047D]
acceptance_criteria:
  - ENG-047A through ENG-047E are reviewed as a coherent transient reveal set foundation group
  - each child story has a usable exact per-story story-review result before approval
  - child PRs target the ENG-047 parent integration branch if the group is approved
  - the exact supported synthetic top-1 Character deck search path creates a transient revealed set only for an eligible top card
  - only matching candidates are visible to the chooser-only scope while the decision is active
  - required choice decisions are created for the correct player and reject malformed or stale responses
  - chosen cards move to hand and unchosen revealed cards return to deck top face-down in original order
  - deck order and hidden cards do not leak through PlayerView, public events, legal actions, or metadata
  - deterministic event ordering and state hashes are covered
  - parent PR cleanup metadata and lifecycle evidence bind ENG-047 plus ENG-047A through ENG-047E, and cleanup is deferred until the parent PR lands on main
required_tests:
  - set-level story-review for ENG-047 parent and children
  - per-story story-review for ENG-047 parent before approval
  - per-story story-review for ENG-047A through ENG-047E before approval
  - story-specific tests from every child story
  - full `corepack pnpm run verify` on every child PR and parent PR
repo_rules:
  - do not implement ENG-047 directly
  - use the parent integration branch workflow if this group is approved
  - keep one active child packet at a time
  - do not run packet completion for child stories until the parent branch lands on main
  - require parent PR cleanup metadata and lifecycle evidence for ENG-047 and every included child story
  - use `packets:complete-many` only after the parent PR lands on main or as documented operational fallback
  - if story-review finds the first supported search/look path ambiguous, record the ambiguity and stop instead of implementing
ambiguity_policy: fail_and_escalate
