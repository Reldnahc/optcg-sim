spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-037
epic_id: KICK-001
title: Canonical contract type boundaries
type: refactor
area: contracts
primary_concern: contract
priority: medium
status: generated
summary: >
  Split the oversized canonical TypeScript contract into focused domain
  modules while preserving the `contracts/canonical-types.ts` compatibility
  surface and all exported type/interface names.
story_boundary: >
  Own only behavior-preserving organization of canonical TypeScript contract
  declarations and tests that read those declarations. This story may not
  change contract shapes, package public exports, gameplay behavior, schema
  validation semantics, or consumer-facing import paths.
allowed_touch_points:
  - contracts/canonical-types.ts
  - contracts/types/primitives.ts
  - contracts/types/card-metadata.ts
  - contracts/types/events.ts
  - contracts/types/view.ts
  - contracts/types/game-state.ts
  - contracts/types/effects.ts
  - contracts/types/decisions.ts
  - contracts/types/runtime.ts
  - contracts/tsconfig.json
  - packages/types/src/export-cohesion.test.ts
  - tests/contracts/canonical-types-shape.test.mjs
  - tests/contracts/canonical-types-compile.test.mjs
  - tests/contracts/canonical-types-export-surface.test.mjs
  - stories/generated/ENG-037-canonical-contract-type-boundaries.yaml
  - stories/approved/ENG-037-canonical-contract-type-boundaries.yaml
  - agent-packets/ENG-037.md
  - agent-packets/active.json
spec_refs:
  - 01-system-architecture.s003
  - 03-game-state-events-decisions.s001
  - 04-effect-runtime.s001
  - 05-effect-dsl-reference.s001
  - 09-card-data-and-support-policy.s014
  - 11-testing-quality.s021
  - 18-acceptance-tests.s016
  - 22-v6-implementation-tightening.s002
  - 22-v6-implementation-tightening.s003
  - 23-repo-tooling-and-enforcement.s010
  - 23-repo-tooling-and-enforcement.s016
  - 28-machine-readable-conventions.s002
scope:
  - keep `contracts/canonical-types.ts` as the compatibility barrel for the canonical TypeScript contract
  - move primitive, card metadata, deck/loadout, event, view, game state, effect DSL, decision, action, and runtime helper declarations into focused `contracts/types/*.ts` modules
  - update contract typechecking to include the focused canonical modules
  - update export-surface and shape tests so they validate declarations across the module set instead of relying on one physical file
  - keep `@optcg/types` public exports and ownership manifest semantics unchanged
non_scope:
  - changing any exported type or interface name
  - changing any property name, optionality, union member, or generic shape
  - changing `@optcg/types` implementation modules or runtime package behavior
  - changing effect DSL JSON Schema, database schema, story schema, server, client, replay, or engine behavior
  - adding new contract features or removing deprecated aliases
dependencies:
  - TYP-001
  - TYP-002
acceptance_criteria:
  - "`contracts/canonical-types.ts` still exposes every existing canonical type/interface name through type-only exports"
  - focused `contracts/types/*.ts` modules compile under the contracts TypeScript project with strict settings
  - package export-cohesion coverage compares the ownership manifest to the canonical module export surface, not only one source file
  - existing canonical shape tests continue to validate the same contract declarations after the split
  - no consumer-facing package exports, gameplay behavior, schema validation, or hidden-information behavior changes
required_tests:
  - run corepack pnpm run packets:generate --story stories/approved/ENG-037-canonical-contract-type-boundaries.yaml --activate
  - run corepack pnpm run packets:verify
  - run corepack pnpm exec vitest run packages/types/src/export-cohesion.test.ts tests/contracts/canonical-types-shape.test.mjs tests/contracts/canonical-types-compile.test.mjs
  - run corepack pnpm run contracts
  - run corepack pnpm run verify
repo_rules:
  - this is a pure contract-organization refactor; if any contract shape needs to change, stop and split a separate contract story
  - use type-only imports and exports across canonical contract modules
  - do not weaken TypeScript strictness, schema validation, export-cohesion tests, or shape tests
  - keep the active packet current before implementation, review, and PR handoff
ambiguity_policy: fail_and_escalate
