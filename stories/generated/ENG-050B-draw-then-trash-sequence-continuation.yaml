title: Draw-then-trash sequence continuation
type: implementation
area: engine
primary_concern: rules
priority: high
status: generated
summary: >
  Compose existing draw and new trash-from-hand primitives so draw resolves
  first, then runtime pauses for private trash choice and resumes
  deterministically.
story_boundary: >
  Own only the narrow sequence runtime path for draw followed by self
  trash-from-hand. Do not add parser grammar, real-card fixture support, broad
  sequence semantics, or new card-data behavior in this story.
allowed_touch_points:
  - packages/engine-core/src/effect-runtime-*.ts
  - packages/engine-core/src/*decision*.ts
  - packages/engine-core/src/*effect-runtime*.test.ts
  - packages/engine-core/src/*event-sequencing*.test.ts
  - packages/engine-core/src/*state-hash*.test.ts
  - packages/engine-core/src/*hidden-info*.test.ts
  - stories/generated/ENG-050B-draw-then-trash-sequence-continuation.yaml
  - stories/approved/ENG-050B-draw-then-trash-sequence-continuation.yaml
  - agent-packets/ENG-050B.md
  - agent-packets/active.json
