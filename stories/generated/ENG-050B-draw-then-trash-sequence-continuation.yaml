scope:
  - 'execute only this narrow sequence shape: first segment connector `always` with `{ type: "draw", player: "self", count: N }`, second segment connector `then` with `{ type: "trashFromHand", player: "self", chooser: "self", count: M }`'
  - draw cards before creating the private trash decision
  - preserve existing draw primitive event order and hidden-info projection
  - pause runtime processing while the trash decision is pending
  - resume and complete the sequence after a valid trash decision response
  - fail closed for unsupported sequence length, unsupported sequence order, unsupported primitive shapes, malformed continuations, and invalid decision responses
  - preserve once-per-turn consumption behavior from the existing commitment point when the sequence effect is accepted
  - preserve deterministic event sequencing and state hashes
non_scope:
  - parser grammar changes
  - generated support index/report changes
  - real-card fixture/support evidence
  - broad sequence composition
  - conditional branching
  - optional activation changes
  - new cost semantics
  - replacement effects
  - server, client, API, UI, Redis, database, replay, or live Poneglyph work
dependencies:
  - ENG-050A
acceptance_criteria:
  - draw-then-trash sequence resolves draw before creating the trash decision
  - valid trash response completes the sequence and no extra effect is queued
  - invalid trash response fails closed without leaking hidden hand contents
  - unsupported sequence shapes fail closed
  - once-per-turn metadata composes with the accepted sequence without changing once-per-turn semantics
  - event sequencing and state hash coverage prove deterministic sequence behavior
required_tests:
  - exact candidate story-review before implementation
  - synthetic engine runtime tests proving draw-before-trash ordering
  - private decision creation and valid response completion tests
  - invalid response, unsupported shape, hidden-info, event-order, and state-hash regression tests
  - no-choice draw baseline regression
  - run `corepack pnpm run packets:verify`
  - run `corepack pnpm run stories:validate`
  - run `corepack pnpm --filter @optcg/engine-core test`
  - full `corepack pnpm verify`
repo_rules:
  - generate and activate the ENG-050B packet before implementation
  - stay within allowed_touch_points
  - keep engine behavior synthetic/unit covered before card fixture stories consume it
  - preserve engine-core purity and hidden-information boundaries
ambiguity_policy: fail_and_escalate
