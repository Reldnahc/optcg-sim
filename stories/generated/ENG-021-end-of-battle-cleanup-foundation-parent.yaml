summary: >
  Make supported End of Battle cleanup explicit and deterministic after battle
  timing and damage work completes, while preserving existing fail-closed
  boundaries for unsupported effects.
story_boundary: >
  This parent story is not directly implementable. It defines the End of Battle
  cleanup delivery group and should be replaced by child stories ENG-021A
  through ENG-021D implemented one active substory at a time on a parent
  integration branch.
child_stories:
  - id: ENG-021A
    title: Centralize supported End of Battle cleanup
    concern: explicit cleanup helper or equivalent centralized path after supported battle work
    depends_on: [ENG-020]
  - id: ENG-021B
    title: Expire battle-duration state at cleanup
    concern: Character Counter battle power and existing thisBattle continuous-effect records expire through cleanup without enabling unsupported effect behavior
    depends_on: [ENG-021A]
  - id: ENG-021C
    title: Guard battle-context clear timing
    concern: regression coverage proving battle context clears only after supported timing and damage work emits its events
    depends_on: [ENG-021B]
  - id: ENG-021D
    title: Verify cleanup across supported battle mechanics
    concern: integration coverage across vanilla damage, Character K.O., Blocker, Counter, and Banish paths
    depends_on: [ENG-021C]
