scope:
  - define child stories for explicit supported End of Battle cleanup, battle-duration expiration, battle-context clearing regressions, and cross-mechanic cleanup integration coverage
  - keep the delivery group on a parent integration branch so cleanup behavior lands as one reviewed vertical
  - ensure supported battle resolution keeps battle context until battle timing and damage work is complete, then expires battle-duration state, appends deterministic cleanup events, clears battle context, runs rule processing, and returns to Main Phase
  - preserve existing fail-closed behavior for unsupported End of Battle triggers, Life Triggers, On K.O., replacement effects, protection, custom handlers, production replay schema, and server/client/UI behavior
non_scope:
  - direct implementation from this parent story
  - approving or packetizing this parent story as an active implementation story
  - new card effects or new effect-runtime DSL primitives
  - Life Triggers
  - On K.O.
  - replacement effects
  - production replay schema, rollback, recovery, or replay viewer behavior
  - match server, browser client, spectator mode, UI, database, Redis, or WebSocket behavior
dependencies:
  - ENG-020
acceptance_criteria:
  - child stories exist for explicit cleanup path, battle-duration expiration, battle-context clear timing, and integration coverage across supported battle mechanics
  - this parent story remains non-implementable and is not packetized directly
  - all child stories can be story-reviewed as a set before any child approval
  - each child story also receives exact per-story story-review before approval or implementation
  - only child stories ENG-021A through ENG-021D are presented as approval-ready implementation candidates for this rules parent
required_tests:
  - story-review agent must verify this parent is replaced by concern-scoped child stories before implementation begins
repo_rules:
  - do not approve or packetize this parent story
  - approve only concern-scoped child stories for implementation
  - a set-level story-review does not satisfy exact per-story story-review for a child
  - run exact per-story story-review for each child story before moving it to approved or implementing it
  - implement one active child story at a time
  - use the parent integration branch workflow for the ENG-021 group
  - child PRs target the ENG-021 parent integration branch, not main
  - keep exactly one active packet while each child story is being implemented or reviewed
  - do not run packets:complete for child stories until the parent branch has merged to main
  - run full parent PR integration review and human review before merging ENG-021 to main
  - after parent merge, run packets:complete-many for the ENG-021 child story set
  - keep engine-core deterministic and pure
ambiguity_policy: fail_and_escalate
