child_stories:
  - id: SUP-001A
    title: DON field-count condition contract fixture authority
    concern: Pin existing fieldCount plus CardFilter authorability for public DON-on-field count conditions without adding a new condition primitive, runtime behavior, or card parser behavior.
    depends_on: []
  - id: SUP-001B
    title: DON field-count condition runtime
    concern: Evaluate public DON-on-field count conditions in engine runtime using reusable public state primitives.
    depends_on: [SUP-001A]
  - id: SUP-001C
    title: DON-minus cost wrapper card components
    concern: Parse and diagnose reusable DON-minus cost wrappers such as `DON!! -1:` and `DON!! −1:` without binding to one effect body.
    depends_on: [CARD-020D, ENG-055F]
  - id: SUP-001D
    title: DON-minus draw generated support
    concern: Compose a DON-minus On Play cost wrapper with existing draw generated-support primitives.
    depends_on: [SUP-001C, ENG-012F, CARD-009A]
  - id: SUP-001E
    title: DON field-count condition card components
    concern: Parse and diagnose reusable `If you have N or less DON!! cards on your field` condition primitives.
    depends_on: [SUP-001A, SUP-001B, CARD-020D]
  - id: SUP-001F
    title: Conditional opponent power modifier card components
    concern: Compose When Attacking conditional wrappers, opponent Character up-to-one target selection, and this-turn power modification.
    depends_on: [SUP-001B, SUP-001E, CARD-014G, CARD-019B, ENG-057A, ENG-058B]
  - id: SUP-001G
    title: DON-minus conditional power generated-support promotion
    concern: Promote only fully gated DON-minus draw plus conditional opponent power modifier parses into generated support while preserving fail-closed diagnostics and avoiding real-card or sample-specific branches.
    depends_on: [SUP-001D, SUP-001F]
scope:
  - keep the full support chain in one parent story so the final generated-support promotion child is visible before implementation starts
  - decompose the printed source into reusable primitives rather than exact full-card text or exact full-effect sentence branches
  - cover the `DON!! -N:` / `DON!! −N:` cost wrapper as an authorable cost prefix independent of draw or play-selected bodies
  - cover the public condition primitive shape `If you have` + `N or less` + `DON!! cards` + `on your field`
  - define `DON!! cards on your field` as public DON controlled by the player in field-visible gameplay zones, including cost-area DON and attached DON, excluding DON deck and non-field/off-board zones
  - reuse existing draw, When Attacking timing, up-to-one opponent Character target selection, and this-turn power modifier primitives wherever they already exist
  - support negative power values such as `-1000` and Unicode minus `−1000` as the same numeric modifier data where the parser safely recognizes the primitive
  - promote complete generated support only after parser certification, schema validation, runtime capability evidence, support metadata, review state, tested state, source integrity, and behavior hash gates pass
  - keep any real card identity, real-card fixture, human-held adjacent-card list, source hash, behavior hash, overlay, or support manifest outside story authority
non_scope:
  - direct parent implementation
  - a single child that changes contracts, engine runtime, and cards generated support together
  - real card IDs, real-card fixture capture, real-card source hash updates, real-card behavior hash updates, overlays, support manifest edits, or cards-produced manifest regeneration
  - production branches for exact full card text, exact full effect lines, one real card, one external card list, or sample-specific sentence templates
  - new draw behavior, new return-DON cost payment behavior, new target-selection behavior, or new power-modifier runtime behavior except where a child explicitly identifies a missing reusable runtime capability
  - DON deck/private-zone counting, hidden-information predicates, arbitrary zone-count query language, or broad natural-language inference
  - server, client, API, UI, database, replay UI, WebSocket, Redis, or live Poneglyph work
acceptance_criteria:
  - SUP-001 is not implemented directly
  - SUP-001A through SUP-001G are independently reviewable child stories
  - parent and every child story-review artifact exists with distinct assignment identity and distinct durable artifact identity before approval handoff, packet generation, activation, implementation handoff, or PR handoff
  - the contract child authorizes any missing DSL shape before engine or cards children consume it
  - the engine child proves any missing runtime capability before cards generated-support promotion cites it
  - cards children can recognize the two printed lines through reusable components without exact full-card or full-effect hardcoding
  - complete generated support remains unsupported unless the full generated-support chain passes, including parser certification, schema validation, runtime capability evidence, engine proof/test evidence, metadata, review, tested state, source integrity, and behavior hash evidence
  - no implementation or test depends on real card IDs, the human-held adjacent-card list, exact full printed text, or one-off full-effect sentence branches
  - existing generated-support behavior for CARD-014, CARD-020, and CARD-021 remains compatible
  - parent PR cleanup metadata lists SUP-001A through SUP-001G and binds the non-packetized SUP-001 parent closeout after merge to main
card_source_integrity:
  - parent does not implement directly and does not name or target any real card
  - children must not edit source fixtures, source hashes, behavior hashes, overlays, supported-card manifests, cards-produced manifests, or manually reviewed source evidence
  - real cards and any human-held adjacent-card list are deliberately excluded from story authority; matching real cards may be discovered by generated-support probing only through the reviewed generic parser/support gates, not through card-specific branches
engine_capability_preflight:
  - parent does not implement directly and delegates executable capability proof to SUP-001A through SUP-001G
  - "parsed effect shape is two independent line-separated blocks: `[On Play] DON!! -N: Draw M card(s).` and `[When Attacking] If <player> has N-or-less DON!! cards on their field, give up to one opponent Character -P power during this turn.`"
  - "supported prerequisites named by the parent include existing fieldCount DSL authority, ENG-012F/CARD-009A draw support, ENG-055F return-DON cost support, ENG-057A zero-choice choose-target support, ENG-058B conditional queued wrapper reachability, CARD-014G modifyPower composition, CARD-019B conditional generated-support composition, CARD-020D diagnostics, and CARD-021E line-separated composition"
  - "missing prerequisites are represented by SUP-001A through SUP-001G until each child lands; no parent implementation may treat them as already complete"
