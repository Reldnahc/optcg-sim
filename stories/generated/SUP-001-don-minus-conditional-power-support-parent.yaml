  - story-review for SUP-001 parent before approval handoff
  - story-review for SUP-001A before approval handoff
  - story-review for SUP-001B before approval handoff
  - story-review for SUP-001C before approval handoff
  - story-review for SUP-001D before approval handoff
  - story-review for SUP-001E before approval handoff
  - story-review for SUP-001F before approval handoff
  - story-review for SUP-001G before approval handoff
