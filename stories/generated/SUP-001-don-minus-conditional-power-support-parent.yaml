summary: >
  Coordinate the contract, engine, and cards-layer work needed to support a
  reusable two-line generated-support shape containing a DON-minus On Play draw
  and a conditional When Attacking opponent-Character power modifier. This
  parent exists to keep the full support chain visible from the start, while
  each executable child remains scoped to one domain.
story_boundary: >
  Parent planning story only. Do not implement this parent directly. Implement
  SUP-001A through SUP-001G one at a time after distinct parent and child
  story-review evidence exists. This parent coordinates contract
  authorability, engine runtime capability, and cards-layer parser/generated
  support promotion, but no child may mix contracts, engine runtime behavior,
  and cards generated-support implementation in one patch.
