title: Read-only support probe CLI
type: implementation
area: cards
primary_concern: cli
priority: high
status: generated
summary: >
  Add a read-only @optcg/cards command that fetches one explicit card from live
  Poneglyph, runs the generated-support playability evaluator, prints playable
  evidence or blockers, and writes no files.
story_boundary: >
  Own only the support probe CLI and its package-local test seam. Do not change
  evaluator semantics beyond consuming CARD-011A, do not write fixtures or
  manifests, and do not add Redis, server match loading, parser grammar, runtime
  behavior, or engine-core imports from @optcg/cards.
