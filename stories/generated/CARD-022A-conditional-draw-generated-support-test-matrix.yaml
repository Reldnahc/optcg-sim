scope:
  - add top-level generated-support matrix tests for conditional draw source text using `your Leader is multicolored` plus hand-count conditions
  - prove the same generated-support path works when hand-count threshold changes from the representative value to at least two non-representative values
  - prove the same generated-support path works for both `or less` and `or more` hand-count comparators where the current reusable parser/runtime already supports them
  - prove the same generated-support path works when the draw count changes, including singular and plural card wording, without adding a new parser rule family
  - prove at least one supported non-On-Play wrapper still composes with the same condition primitives and draw body
  - assert structured generated DSL condition output, not just `Playable: yes`, including `leaderColorCount:self:gte:2`, `handCount:self:<op>:<value>`, boolean `and`, and the parsed draw count
  - assert parser-rule IDs, component evidence IDs, required runtime capability IDs, and proof/report output remain stable across the primitive-variation matrix
  - keep existing fail-closed cases for ambiguous mixed `and`/`or`, unsupported hand owner wording, unsupported condition fragments, missing runtime capability evidence, stale source hash, and stale behavior hash
  - add a production-source search or equivalent test proving the conditional draw support path is not implemented by exact full-text branches for the representative multicolor-plus-hand sentence
non_scope:
  - production parser, composer, generated-support, runtime capability, or engine behavior changes
  - refactoring older exact-template parser maps such as CARD-014G composed support; CARD-022B owns that separately
  - new condition families, new boolean precedence rules, parenthesized condition expressions, broad natural-language parsing, or additional runtime capabilities
  - real card IDs, real-card fixture capture, source hash updates, behavior hash updates, overlays, support manifest edits, cards-produced manifest regeneration, or card-specific branches
  - "changing the semantic mapping of printed `your Leader is multicolored`, which remains `leaderColorCount` with `player: self`, `op: gte`, and `value: 2`"
card_source_integrity:
  - not applicable to real-card source integrity because this story does not enable or change gameplay support for any real card
  - new proof and matrix tests must construct synthetic normalized card inputs directly and must not load fixture-backed real-card shells, then overwrite fields, as evidence for this story
  - existing legacy fixture-backed tests may remain, but new CARD-022A evidence must not depend on them
  - this story must not edit fixtures, source hashes, behavior hashes, overlays, supported-card manifests, cards-produced manifests, or manually reviewed source evidence
engine_capability_preflight:
  - parsed shape under test is a supported trigger wrapper containing `If your Leader is multicolored and you have <N> or less/more cards in your hand, draw <M> card(s).`
  - supported capability group includes `condition:leaderColorCount`, `condition:handCount`, `condition-connector:and`, `effect:draw:self:count:positive-safe-integer`, conditional queued trigger reachability from ENG-058B, and the already-supported trigger wrapper capability for each matrix row
  - CARD-019B is the card-layer authority for composing supported conditional wrappers and draw bodies
  - ENG-058A and earlier draw runtime stories are reusable runtime authority for evaluating leaderColorCount, handCount, boolean and, On Play trigger execution, and self draw counts
  - ENG-058B is reusable runtime authority for conditional queued trigger reachability on supported non-On-Play wrappers
  - missing capability group is none for the matrix rows in this story
  - this story adds no new engine capability; if a row needs a capability outside the supported group, that row must remain unsupported or be split into a prerequisite ENG/TYP story
acceptance_criteria:
  - conditional draw generated support has a SUP-001G-style matrix test proving non-sample primitive values use the same parser-rule family, component evidence family, and runtime capability family
  - the representative conditional draw source text still becomes playable with no blockers when all existing gates pass
  - at least two non-representative hand thresholds become playable through the same generated-support path and assert structured `handCount` values in generated DSL
  - at least one `or more` hand-count row becomes playable through the same generated-support path when paired with `your Leader is multicolored`
  - at least one non-representative draw count becomes playable through the same generated-support path and asserts the structured draw count
  - at least one supported non-On-Play trigger wrapper composes with the same condition primitives and draw body
  - proof/report tests assert required runtime capabilities include `condition:leaderColorCount`, `condition:handCount`, `condition-connector:and`, the relevant trigger, and draw self positive-safe-integer capability
  - support-probe or support-evaluator tests assert no blockers for at least one non-representative matrix row, not only the original representative sentence
  - negative tests continue to prove ambiguous mixed connectors and invalid hand-owner wording fail closed with narrow diagnostics
  - tests fail if production cards code contains an exact full-text branch for the representative multicolor-plus-hand conditional draw sentence outside test/story/fixture text
required_tests:
  - story-review for CARD-022A before approval handoff
  - conditional generated-support matrix test covering representative and non-representative hand thresholds, comparator direction, trigger wrapper, and draw count
  - generated-support-index or support-evaluator test asserting structured generated DSL condition and draw output for each matrix row
  - generated-support-report or proof-certificate test asserting required runtime capability IDs remain complete for at least one non-representative matrix row
  - "support-probe diagnostic test proving a non-representative conditional draw row reports `Playable: yes` and `Blockers: none`"
  - negative regression tests for mixed `and`/`or`, invalid hand-owner wording, missing condition capability, stale source hash, and stale behavior hash as applicable to touched files
  - production-code search or equivalent test proving no exact full-text branch for the representative multicolor-plus-hand conditional draw sentence exists in production cards code
  - run `corepack pnpm run packets:verify`
  - run `corepack pnpm run stories:validate`
  - run `corepack pnpm --filter @optcg/cards test`
  - run full `corepack pnpm verify`
repo_rules:
  - generate and activate the CARD-022A packet before implementation
  - stay within allowed_touch_points
  - do not add production behavior to make a weak test pass; tests should prove already-authorized reusable behavior
  - if implementation discovers a real production hardcode in the conditional draw path, stop and raise the ambiguity or draft a separate implementation story instead of silently broadening this verification story
ambiguity_policy: fail_and_escalate
