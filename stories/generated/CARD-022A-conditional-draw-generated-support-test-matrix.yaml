id: CARD-022A
epic_id: CARD-022
title: Conditional draw generated-support test matrix
type: implementation
area: cards
primary_concern: verification
priority: high
status: generated
summary: >
  Raise the existing conditional draw generated-support tests to the same
  regression standard as SUP-001G. The current implementation decomposes Leader
  multicolor and hand-count conditions through reusable primitives, but the
  top-level generated-support proof is still centered on one representative
  conditional draw sentence.
story_boundary: >
  Own only cards-package tests needed to prove existing
  conditional draw generated-support behavior is primitive-composed and not
  sample-text hardcoded. Do not add new helper files; any helper extraction
  must stay local to the touched test file. Do not add production parser
  behavior, engine runtime behavior, shared schema/type authority, real-card
  fixtures, source hash updates, behavior hash updates, overlays, support
  manifest edits, cards-produced manifest regeneration, or new playable card
  promotion.
