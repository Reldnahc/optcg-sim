scope:
  - treat Poneglyph as the authoritative card-data source owned by this project
  - expose a cards-package support evaluator that accepts normalized Poneglyph card data and returns playable or not playable with parser status, generated support evidence, effect definition, and blockers
  - mark a card playable only when complete parse, certified parser rule evidence, generated DSL validation, source hash evidence, behavior hash evidence, and runtime capability evidence all pass
  - mark unsupported cards not playable with blocker evidence when text is partial, unparsed, ambiguous, stale, unsupported, custom-handler-only, or missing runtime capability evidence
  - prove checked-in OP03-044 Kaya fixture data evaluates as playable through the already-certified On Play draw-then-trash template
  - preserve reviewed non-generated support semantics for EB01-023 manual DSL and OP04-014 Banish keyword support by not routing them through generated support unless they satisfy the generated-support contract
non_scope:
  - support probe CLI
  - live Poneglyph fetching
  - checked-in real-card DSL manifest boundary changes
  - fixture writes
  - parser grammar expansion
  - runtime behavior expansion
  - Redis cache implementation
  - server match-time lazy loading
  - broad live Poneglyph catalog fetching
  - automatically fetching or committing every released card
  - engine-core importing @optcg/cards
  - OP03-054 Usopp's Rubber Band of Doom support
dependencies:
  - CARD-009B
  - ENG-050B
card_source_integrity:
  - evaluator tests must use the checked-in OP03-044 Kaya fixture at fixtures/poneglyph/cards/OP03-044.kaya.json, captured from authoritative Poneglyph with `corepack pnpm --filter @optcg/cards capture:fixture -- --card OP03-044`
  - OP03-044 fixture assertions must cover behavior-sensitive fields including card_type Character, color Blue, cost 1, power 0, counter 2000, types East Blue, trigger null, and effect text `[On Play] Draw 2 cards and trash 2 cards from your hand.`
  - if OP03-044 fixture data or support evidence changes, regenerate or update the affected fixture/support evidence in the same story patch and rerun the card fixture/support tests
  - generated support must use normalized sourceTextHash and behaviorHash from authoritative Poneglyph data, not hand-authored hash placeholders
  - Poneglyph contract failures are infrastructure/data-pipeline failures, not ordinary card support outcomes
engine_capability_preflight:
  - parsed OP03-044 effect shape is an On Play auto sequence that draws self count 2, then trashFromHand self chooser self count 2
  - supported required runtime capabilities are trigger:onPlay, category:auto, effect:draw:self:count:positive-safe-integer, effect:sequence:ordered, effect:trashFromHand:self:count:positive-safe-integer:owner-chooses, and sourcePresencePolicy:mustRemainInSameZone
  - missing required runtime capabilities are none
  - supported runtime capability evidence comes from CARD-009B and ENG-050B; no new ENG story is required for OP03-044
acceptance_criteria:
  - generated-support playability is computed from authoritative Poneglyph card data plus parser, DSL validation, hashes, and runtime capability evidence
  - certified common-template playability does not depend on adding each card ID to a manual TypeScript allowlist or manual card-to-mechanic map
  - checked-in OP03-044 Kaya fixture data reports playable yes with `op03-044.generated-support`
  - unsupported generated-support candidates report playable no with blocker evidence
  - existing reviewed support for EB01-023 and OP04-014 remains unchanged
required_tests:
  - exact candidate story-review before implementation
  - package-local support evaluator tests for supported checked-in OP03-044 Kaya fixture data
  - package-local support evaluator tests for unsupported blocker cases
  - generated support index/report test proving OP03-044 is supported from certified parser and capability evidence
  - package-boundary assertion or existing boundary test proving engine-core does not import @optcg/cards
  - run `corepack pnpm run packets:verify`
  - run `corepack pnpm run stories:validate`
  - run `corepack pnpm --filter @optcg/cards test`
  - full `corepack pnpm verify`
repo_rules:
  - generate and activate the CARD-011A packet before implementation
  - stay within allowed_touch_points
  - preserve generated-support fail-closed behavior when any parsed component lacks certified parser or runtime capability evidence
  - do not broaden into CLI, Redis, server lazy loading, live catalog ingestion, fixture manifests, or full released-card support
ambiguity_policy: fail_and_escalate
