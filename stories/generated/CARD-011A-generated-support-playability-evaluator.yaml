title: Generated-support playability evaluator
type: implementation
area: cards
primary_concern: verification
priority: high
status: generated
summary: >
  Add a cards-package evaluator that determines whether normalized
  authoritative Poneglyph card data is playable through generated support,
  without manual per-card admission or a preloaded supported-card manifest.
story_boundary: >
  Own only the evaluator boundary inside @optcg/cards. The evaluator consumes
  normalized card data and existing generated-support parser/capability
  evidence. Do not add a CLI, live Poneglyph fetch path, fixture-manifest
  boundary changes, parser grammar, runtime behavior, Redis, server loading, or
  engine-core imports from @optcg/cards.
