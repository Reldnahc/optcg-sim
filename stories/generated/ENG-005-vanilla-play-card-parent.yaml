spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-005
epic_id: M1-001
title: Implement vanilla play-card behavior for Characters and Stages
type: implementation
area: engine
primary_concern: rules
priority: high
status: replaced
summary: >
  Add the Milestone 1 engine path for playing vanilla Character and Stage cards
  from hand after deterministic setup, Main Phase action application,
  manifest-backed card metadata, and vanilla combat are in place.
story_boundary: >
  This parent story is not implementable. It preserves the play-card delivery
  context and is replaced by concern-scoped child stories ENG-005A through
  ENG-005C.
allowed_touch_points:
  - packages/engine-core/**
  - fixtures/replays/**
  - tests/engine/**
spec_refs:
  - 02-engine-mechanics.s007 (Card categories)
  - 02-engine-mechanics.s014 (Main Phase)
  - 02-engine-mechanics.s016 (Playing a card)
  - 02-engine-mechanics.s036 (DON!! card mechanics)
  - 03-game-state-events-decisions.s003 (Base state vs. computed view)
  - 03-game-state-events-decisions.s004 (Engine result shape)
  - 03-game-state-events-decisions.s005 (Event journal)
  - 03-game-state-events-decisions.s015 (Legal actions)
  - 03-game-state-events-decisions.s016 (Action contract)
  - 03-game-state-events-decisions.s017 (Canonical decision routing)
  - 03-game-state-events-decisions.s018 (Canonical event visibility)
  - 03-game-state-events-decisions.s020 (State hashing)
  - 03-game-state-events-decisions.s021 (Invariant hooks)
  - 09-card-data-and-support-policy.s010 (Card implementation records)
  - 09-card-data-and-support-policy.s013 (Match-time card manifest)
  - 11-testing-quality.s004 (Primitive tests)
  - 11-testing-quality.s008 (Invariant tests)
  - 11-testing-quality.s010 (Golden replay tests)
  - 11-testing-quality.s012 (Replay determinism)
  - 18-acceptance-tests.s003 (Milestone 1 - terminal engine)
scope:
  - define the vanilla Character and Stage play-card delivery group
  - split no-overflow play from hand, replacement or overflow handling, and replay verification into child stories
  - include canonical `PayCostDecision` and `respondToDecision` payment routing in the no-overflow child story
  - keep the group on a parent integration branch before merging to main if the group is implemented as multiple substory PRs
non_scope:
  - direct implementation from this parent story
  - Event card play or Event effect resolution
  - On Play effect queueing or full effect runtime behavior
  - cost modifiers beyond manifest-derived printed cost clamped to zero
  - "`respondToDecision` implementation outside the payment and overflow responses needed by the child stories"
  - browser client, server protocol, database, Redis, WebSocket, React, or live HTTP behavior
dependencies:
  - ENG-002E
  - ENG-003A
  - ENG-003E
  - TYP-001E
acceptance_criteria:
  - child stories exist for no-overflow vanilla play, replacement or overflow play, and replay verification
  - this parent story remains non-implementable and is not packetized
  - child stories can be story-reviewed as a set before approval
required_tests:
  - story-review agent must verify this parent is replaced by concern-scoped child stories before implementation begins
repo_rules:
  - do not approve or packetize this parent story
  - use a parent integration branch for the ENG-005 child-story group if the group is approved for multi-PR implementation
  - keep one active child-story packet at a time
  - approve only concern-scoped child stories for implementation
  - engine-core must stay pure and free of browser, server, Redis, Postgres, WebSocket, React, and live HTTP dependencies
ambiguity_policy: fail_and_escalate
