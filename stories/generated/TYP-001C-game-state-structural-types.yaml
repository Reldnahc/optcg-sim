spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: TYP-001C
epic_id: M1-001
title: Add canonical game-state structural contracts
type: implementation
area: contracts
primary_concern: contract
priority: critical
status: generated
summary: >
  Add the server-only GameState, player state, zone, turn, timer, battle, RNG,
  and internal queue structural contracts needed before engine-core can create
  deterministic state.
story_boundary: >
  Own only shared structural type exports for canonical state. Do not implement
  setup, mutation, hashing, legal actions, filtering, or engine-core behavior.
allowed_touch_points:
  - packages/types/src/**
spec_refs:
  - 03-game-state-events-decisions.s002 (Canonical state rules)
  - 03-game-state-events-decisions.s003 (State layering)
  - 16-typescript-interface-draft.s005 (Game state)
  - 15-implementation-kickoff.s006 (Step 2 - @optcg/engine-core)
scope:
  - export `GameState` and related structural state interfaces
  - export zone, turn, phase, timer, battle, card-instance, RNG, effect-queue, and audit metadata types needed by state shape
  - ensure canonical state can represent hidden zones and server-only internals without client DTOs
non_scope:
  - action unions
  - pending decision unions
  - event journal contracts beyond references required by state shape
  - player-view or spectator-view DTOs
  - engine initialization or mutation code
dependencies:
  - TYP-001A
  - TYP-001B
acceptance_criteria:
  - "`GameState` includes hidden zones, RNG state, internal queues, audit metadata, and match status fields"
  - state contracts use serializable arrays and records rather than raw JavaScript `Set`
  - client/public view DTOs are not mixed into canonical state types
required_tests:
  - package type test compiling a minimal canonical `GameState` fixture
  - package type test proving hidden-zone fields are represented in canonical state
repo_rules:
  - canonical state is server-only and may include hidden information
  - do not add filtering behavior in this contract story
  - must pass `corepack pnpm run verify`
ambiguity_policy: fail_and_escalate
