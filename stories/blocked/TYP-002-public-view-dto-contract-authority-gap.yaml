spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: TYP-002
epic_id: M1-001
title: Resolve public/player/spectator view DTO contract authority gap
type: specification
area: contracts
primary_concern: view
priority: high
status: blocked
summary: >
  The visibility specs describe player and spectator view DTO requirements, but
  the canonical v6 implementation contract does not currently define
  `PlayerView` or `SpectatorView`. This gap must be resolved before generating
  implementable public view DTO stories.
story_boundary: >
  Own only the authority gap record and future spec/canonical-contract alignment
  decision. Do not implement public view DTOs, filtering behavior, spectator
  policy, hidden-info fixtures, or client rendering from this blocked story.
allowed_touch_points:
  - specs/**
  - contracts/canonical-types.ts
  - stories/**
spec_refs:
  - 06-visibility-security.s004 (PlayerView shape)
  - 06-visibility-security.s008 (Spectator policy)
  - 06-visibility-security.s020 (Ranked spectator policy)
  - 06-visibility-security.s021 (View contract summary)
  - 22-v6-implementation-tightening.s006 (Canonical type contract)
scope:
  - document that `PlayerView` and `SpectatorView` are not defined by the canonical v6 type contract
  - require a future spec/canonical-contract update before public view DTO implementation stories are approved
non_scope:
  - implementing view DTOs in `@optcg/types`
  - implementing `filterStateForPlayer`
  - spectator delay buffers
  - replay view policy
  - browser/client package code
dependencies:
  - TYP-001G
acceptance_criteria:
  - a future replacement story cites exact canonical DTO definitions before implementation begins
  - public DTO implementation remains blocked until the authority conflict is resolved
required_tests:
  - story review must confirm this remains blocked until the canonical contract defines exact view DTO names and shapes
repo_rules:
  - fail closed on hidden-information DTO ambiguity
  - do not approve or packetize this story while status is `blocked`
ambiguity_policy: fail_and_escalate
