scope:
  - add an explicit deterministic start-of-main gate to DON!! to Main Phase progression before ordinary Main Phase legal actions are exposed
  - for known trigger-free states, accept DON!! to Main Phase progression, emit `phaseStarted(main)` only after the gate passes, and auto-continue into ordinary Main Phase action priority without creating a pending decision
  - define known trigger-free for this story as an active state with empty `effectQueue`, empty `deferredTriggers`, and only manifest-backed, effect-free `vanilla-confirmed` cards in Leader, Character, and Stage areas
  - treat any non-empty `effectQueue` or `deferredTriggers` at the start-of-main gate as unsupported effect runtime and reject the phase progression with an `effectRuntimeError`
  - treat any Leader, Character, or Stage on board whose manifest metadata is missing, not `vanilla-confirmed`, has `effectDefinitionId`, has `customHandlerIds`, has non-empty `effectText`, or has non-empty `triggerText` as unsupported effect runtime and reject phase progression with an `effectRuntimeError`
  - rejected start-of-main gate checks must not mutate state, append events, or move the turn into Main Phase
  - ensure states that have not accepted DON!! to Main Phase progression do not expose `endMainPhase`, `playCard`, `attachDon`, or `declareAttack` legal actions
  - preserve concession behavior where already allowed
  - keep event sequence allocation deterministic and append events one at a time
  - run rule processing and invariants after accepted phase progression
  - add replay or smoke coverage proving the known-trigger-free start-of-main path is stable
non_scope:
  - implementing general effect detection
  - resolving automatic effects, Event effects, On Play effects, `[Start of Main Phase]` card text, or effect queues
  - implementing `chooseTriggerOrder`, `chooseOptionalActivation`, target/card selection, or effect option decisions
  - blocker, counter, trigger-from-life, replacement, Banish, Double Attack, Rush, or continuous-effect behavior
  - adding new shared type contracts or a new start-of-main state marker
  - new CLI command grammar, terminal UX, production replay schema, server protocol, browser UI, database, Redis, WebSocket, React, or live HTTP behavior
dependencies:
  - ENG-002D
  - ENG-002E
  - ENG-003D
  - TYP-001F
  - TYP-001G
acceptance_criteria:
  - DON!! to Main Phase progression exposes ordinary Main Phase legal actions only after the start-of-main gate accepts the state as known trigger-free
  - an accepted known-trigger-free path emits `phaseStarted(main)` and auto-continues without creating a pending decision
  - repeated execution of the known-trigger-free start-of-main path produces the same event sequence and state hash
  - a state with non-empty `effectQueue` or `deferredTriggers` fails closed with `EngineError.type` equal to `effectRuntimeError`, does not mutate state, and does not expose ordinary Main Phase actions
  - a state with an effect-capable or manifest-unsupported Leader, Character, or Stage fails closed with `EngineError.type` equal to `effectRuntimeError`, does not mutate state, and does not expose ordinary Main Phase actions
  - legal-action reads do not mutate state or append events after the start-of-main gate is complete
  - rule processing, event journal sequencing, state hashing, and invariant checks remain deterministic for accepted phase progression
required_tests:
  - unit test proving known-trigger-free DON!! to Main Phase progression emits `phaseStarted(main)`, creates no pending decision, and exposes ordinary Main Phase legal actions afterward
  - unit test proving ordinary Main Phase legal actions are not exposed before accepted DON!! to Main Phase progression
  - unit test proving non-empty `effectQueue` and non-empty `deferredTriggers` each return `effectRuntimeError` without mutating state, appending events, or exposing ordinary Main Phase actions
  - unit test proving an on-board card with `[Start of Main Phase]` or other non-empty effect text returns `effectRuntimeError` without mutating state, appending events, or exposing ordinary Main Phase actions
  - unit test proving an on-board card with non-empty `triggerText` returns `effectRuntimeError` without mutating state, appending events, or exposing ordinary Main Phase actions
  - unit test proving an on-board card with missing manifest metadata, non-`vanilla-confirmed` support, `effectDefinitionId`, or `customHandlerIds` returns `effectRuntimeError` without mutating state, appending events, or exposing ordinary Main Phase actions
  - unit test proving concession remains available where already allowed before accepted DON!! to Main Phase progression
  - unit test proving legal-action reads after the gate completes do not mutate state or append events
  - unit test proving event sequence, event journal, and state hash are stable for repeated known-trigger-free start-of-main progression
  - replay or smoke test covering deterministic known-trigger-free start-of-main progression through Main Phase action priority
repo_rules:
  - this story is independent of ENG-006 and may be approved or implemented separately, though implementation still remains one active story at a time
  - fail closed on ambiguous start-of-main timing, effect queue, or pending-decision behavior
  - keep engine-core deterministic and pure
  - do not introduce live Poneglyph access or a card-data package dependency into engine-core
  - do not implement the first effect-runtime subseries in this story
  - must pass `corepack pnpm run verify`
ambiguity_policy: fail_and_escalate
