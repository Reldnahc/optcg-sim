id: ENG-007
epic_id: M1-001
title: Add trigger-free start-of-main gate
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Add the Milestone 1 start-of-main timing gate for known trigger-free states so
  Main Phase action priority is not exposed until the engine has
  deterministically checked that unsupported effect runtime is not required.
story_boundary: >
  Own only the trigger-free start-of-main gate during DON!! to Main Phase
  progression. Stop before general effect detection, effect queue execution,
  trigger ordering, card-specific effect behavior, new state contracts, client
  projection, CLI grammar changes, or server protocol behavior.
