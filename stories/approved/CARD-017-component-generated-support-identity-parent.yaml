spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: CARD-017
epic_id: CARD-017
title: Component generated-support identity parent
type: implementation
area: cards
primary_concern: rules
priority: high
status: approved
summary: >
  Coordinate a CARD story set that migrates generated-support identity away
  from full-template parser rule IDs and onto reusable component evidence,
  with no loss of currently supported card-layer generated support.
story_boundary: >
  Parent planning story only. Do not implement this parent directly. Implement
  CARD-017A through CARD-017C one active child at a time on a parent integration
  branch after story-review approval and packet activation. Keep this set
  package-local to cards parser/generated-support, support indexing,
  diagnostics, and tests over already-existing schema/runtime capability
  evidence. This set must not add ENG runtime behavior, new runtime capability
  records, shared TYP/contracts authority, fixture recapture, or broad new
  playable support outside the explicit child proof.
allowed_touch_points:
  - stories/approved/CARD-017*.yaml
  - stories/approved/CARD-017*.yaml
  - agent-packets/CARD-017*.md
  - agent-packets/active.json
spec_refs:
  - 01-system-architecture.s023
  - 04-effect-runtime.s005
  - 05-effect-dsl-reference.s003
  - 05-effect-dsl-reference.s013
  - 09-card-data-and-support-policy.s010
  - 09-card-data-and-support-policy.s011
  - 09-card-data-and-support-policy.s012
  - 09-card-data-and-support-policy.s013
  - 09-card-data-and-support-policy.s014
  - 09-card-data-and-support-policy.s015
  - 09-card-data-and-support-policy.s016
  - 09-card-data-and-support-policy.s022
  - 09-card-data-and-support-policy.s024
  - 11-testing-quality.s020
dependencies:
  - CARD-014I
  - CARD-015A
  - CARD-016A
child_stories:
  - id: CARD-017A
    title: Generated-support component evidence model
    concern: Define a package-local component evidence model that separates trigger wrappers, bodies, costs, conditions, targets, durations, source policies, and metadata gates from full-template parser identity.
    depends_on: [CARD-016A]
  - id: CARD-017B
    title: Capability evaluator component migration
    concern: Migrate runtime capability lookup and support indexing to component evidence, remove full-template capability binding, and prove no current generated support is lost.
    depends_on: [CARD-017A]
  - id: CARD-017C
    title: Parser diagnostics and test ID migration
    concern: Migrate parser output, probe/report diagnostics, support metadata, and cards-package tests to component evidence IDs with no remaining generated-support dependency on legacy full-template IDs.
    depends_on: [CARD-017B]
scope:
  - coordinate CARD-017A through CARD-017C as a parent integration branch story set
  - remove legacy full-template parser rule IDs as generated-support authority across parser output, runtime capability evidence, support index binding, diagnostics, and tests
  - require all existing generated-support IDs and capability links to migrate to reusable component evidence with no loss of current support
  - keep generated support fail-closed when any component is unparsed, ambiguous, stale, schema-invalid, source-invalid, metadata-invalid, unsupported by runtime capability evidence, or unsupported by wrapper/source policy evidence
  - preserve all currently supported CARD-008, CARD-009, CARD-012, CARD-013, CARD-014, CARD-015, and CARD-016 generated-support behavior through parity tests
  - make trigger wrappers, body actions, costs, conditions, cardinality, target grammar, durations, modifiers, restrictions, saved references, source presence policy, and support metadata independently visible as evidence components
  - allow wrapper/body recomposition only through explicit component evidence and existing schema/runtime capability gates
  - require focused component, representative composition, negative gate, and support-parity tests rather than exhaustive per-card or wrapper/body cartesian-product tests
  - keep cards-internal helper types in packages/cards unless story-review proves missing shared contract/schema authority
non_scope:
  - direct implementation from this parent story
  - ENG runtime behavior or runtime capability records
  - shared TYP/contracts stories or effect DSL schema changes unless story-review proves a real shared authority gap
  - real-card fixture support, fixture capture, fixture recapture, overlay updates, source hash updates, or behavior hash updates
  - Trigger wrapper support, Trigger wrapper proof, real-card Trigger fixture promotion, or playable Trigger generated support
  - generic life-trigger runtime behavior, which must be split into a prerequisite ENG story before any later CARD Trigger story can make Trigger generated support playable
  - Activate Main support
  - Stage or Event play support
  - replacement generalization
  - server, client, API, UI, database, replay, WebSocket, Redis, or live Poneglyph work
card_source_integrity:
  - not applicable for direct parent implementation because this parent is planning-only and does not enable or change gameplay support for any card
  - children must not edit source fixtures, source hashes, behavior hashes, overlays, or manually reviewed source evidence
  - child examples may use printed text snippets as parser/support probes only; real-card playable support requires existing source integrity and generated-support metadata gates
engine_capability_preflight:
  - not applicable for direct parent implementation because this parent adds no runtime capability or gameplay behavior
  - children must inventory current generated-support capability records before migration and prove every supported record remains covered by migrated component evidence
  - missing runtime or schema authority must be recorded as a blocker or split into a prerequisite TYP/ENG story instead of being hidden in CARD work
acceptance_criteria:
  - CARD-017 is not implemented directly
  - each child is independently reviewable and can be activated one at a time
  - every child has a distinct story-review assignment identity and durable story-review artifact identity before approval
  - all generated-support authority migrates from full-template parser rule identity to component evidence identity
  - no currently supported generated-support shape loses support because of the migration
  - legacy full-template parser rule IDs are not required by cards generated-support runtime source, capability evidence, support indexing, diagnostics, or tests after the migration children complete
  - generated support remains fail-closed for incomplete parser/component evidence, missing schema authority, missing runtime capability, source integrity gaps, stale hashes, metadata/review/test gaps, unsupported wrappers, unsupported source policies, unsupported targets, unsupported durations, unsupported modifiers, unsupported restrictions, and ambiguous connectors
  - tests prove composability through focused component coverage and representative wrapper/body combinations, not by enumerating every card or every effect under every trigger
  - parent PR cleanup metadata lists CARD-017A through CARD-017C and durable parent lifecycle evidence binds the changed non-packetized CARD-017 parent story for closeout
required_tests:
  - set-level story-review planning for CARD-017 parent and children before approval
  - per-story story-review for CARD-017 before approval
  - per-story story-review for CARD-017A through CARD-017C before approval
  - story-specific tests from every child story
  - support parity tests proving all currently supported generated-support shapes remain supported after ID migration
  - regression tests proving unsupported generated-support text remains unsupported after ID migration
  - tests proving generated support is gated by component evidence rather than full-template parser rule identity
  - guard test or documented test plan proving the suite avoids exhaustive per-card and wrapper/body cartesian-product testing while still covering component behavior, representative composition, negative gates, and existing support parity
  - run `corepack pnpm run stories:validate`
  - run `corepack pnpm --filter @optcg/cards test`
  - full `corepack pnpm verify` on every child commit and on the final parent PR
repo_rules:
  - do not activate or implement CARD-017 directly
  - use the parent integration branch workflow if this group is approved
  - keep one active child packet at a time
  - do not complete child packets until the parent branch lands on main
  - do not open child PRs to main; land reviewed child commits on the parent integration branch, then open one final parent PR to main
  - use parent PR cleanup metadata for CARD-017A through CARD-017C and bound CARD-017 parent closeout
  - fail closed on gameplay support ambiguity, source integrity gaps, runtime capability gaps, parser residue, and review metadata gaps
ambiguity_policy: fail_and_escalate
