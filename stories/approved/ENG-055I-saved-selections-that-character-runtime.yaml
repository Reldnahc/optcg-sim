spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-055I
epic_id: ENG-055
title: Saved selections and that Character runtime
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Implement execution-context saved result references so later sequence steps
  can reuse approved saved objects, including "that Character" patterns where
  a contract-authorized target/result consumer exists.
story_boundary: >
  Own only saved result/reference runtime behavior inside composed effect
  execution contexts. Do not implement parser support or new card support.
allowed_touch_points:
  - packages/engine-core/src/effect-runtime*.ts
  - packages/engine-core/src/effect-runtime*.test.ts
  - packages/engine-core/src/effect-runtime-target*.ts
  - packages/engine-core/src/effect-runtime-target*.test.ts
  - packages/engine-core/src/target-selection-actions.ts
  - tests/hidden-info/**
  - stories/generated/ENG-055*.yaml
  - stories/approved/ENG-055*.yaml
  - agent-packets/ENG-055I.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s022
  - 04-effect-runtime.s002
  - 04-effect-runtime.s005
  - 04-effect-runtime.s010
  - 04-effect-runtime.s012
  - 04-effect-runtime.s016
  - 05-effect-dsl-reference.s013
  - 05-effect-dsl-reference.s026
  - 11-testing-quality.s004
  - 11-testing-quality.s008
  - 22-v6-implementation-tightening.s007
dependencies:
  - ENG-055B
  - TYP-007B
  - TYP-009B
  - TYP-010
scope:
  - store saved selections/result references in the execution context
  - allow later sequence steps to resolve saved `selectedTargets` and `producedObjects` references only for generic field-object `TargetSpec` selection consumers in the same supported execution frame
  - implement positive saved `selectedTargets` reachability only after TYP-010 defines the selectedTargets producer contract; otherwise fail closed rather than inventing a producer shape
  - keep positive saved-reference consumer coverage limited to generic field-object target resolution; modifier, protection, restriction, hand-selection, and playSelected consumers remain unsupported unless named by another child story
  - fail closed when the saved object is gone, illegal, hidden, not a field object, or unsupported under the primitive policy
  - fail closed for saved `selectedCards`, `paidCost`, hand-selection, modifier/restriction target, and other unsupported saved-reference families
  - fail closed when a saved object is used as a modifier/restriction target without a proper field-target saved-reference contract
  - add hidden-info, event-order, replay, and state-hash tests
non_scope:
  - parser/card support
  - new target families unrelated to saved references
  - using HandSelectionId or other hand-selection references as targets for modifyPower, cannotAttack, or cannotBlock
  - playSelected saved hand-selection consumption, which belongs to ENG-055G
  - replacement generalization
acceptance_criteria:
  - later sequence steps can resolve valid saved selected-target or produced-object field references deterministically for generic field-object `TargetSpec` selection consumers in the same supported execution frame
  - gone or illegal saved objects fail closed under the primitive policy
  - unsupported saved-object target use fails closed
  - hidden-info, event-order, deterministic replay, and state-hash safety is preserved
required_tests:
  - saved selection/result reference runtime tests for generic field-object `TargetSpec` selection consumers in the same supported execution frame
  - gone-object and illegal-object fail-closed tests
  - unsupported saved-reference family tests for selectedCards, paidCost, hand-selection, and modifier/restriction target use
  - hidden-info, event-order, replay, `state.seq`, and state-hash tests
  - run `corepack pnpm --filter @optcg/engine-core typecheck`
  - run `corepack pnpm run stories:validate`
repo_rules:
  - do not import @optcg/cards
  - do not leak hidden saved object identities
  - fail closed on saved-reference legality ambiguity
ambiguity_policy: fail_and_escalate
