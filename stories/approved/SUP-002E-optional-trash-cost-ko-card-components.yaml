  Cards-layer story only. Contract/schema prerequisites must already be
  implemented by SUP-002A and runtime prerequisites must already be implemented
  by SUP-002B. Do not add new engine runtime behavior, shared
  contract/schema changes, real-card fixture promotion, source hashes, behavior
  hashes, overlays, or card-specific branches.
