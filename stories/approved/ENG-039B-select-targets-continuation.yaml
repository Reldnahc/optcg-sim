spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-039B
epic_id: KICK-001
title: Resume queued effect after selected targets
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Replace the current selected-target fail-closed continuation with a narrow
  reviewed continuation for queued target KO effects after selectTargets
  response validation succeeds.
story_boundary: >
  Own only selectTargets decision continuation for the exact queued KO target
  primitive accepted by ENG-039A. Stop before broadening play legality for Main
  Events or adding additional target primitives.
allowed_touch_points:
  - packages/engine-core/src/target-selection-actions.ts
  - packages/engine-core/src/target-selection-actions.test.ts
  - packages/engine-core/src/effect-runtime-queue-target-decisions.ts
  - packages/engine-core/src/effect-runtime-queue-processing.ts
  - packages/engine-core/src/effect-runtime.ts
  - packages/engine-core/src/effect-runtime-queue-processing-targets.test.ts
  - packages/engine-core/src/effect-runtime-target-primitives.test.ts
  - stories/generated/ENG-039B-select-targets-continuation.yaml
  - stories/approved/ENG-039B-select-targets-continuation.yaml
  - agent-packets/ENG-039B.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s005
  - 03-game-state-events-decisions.s013
  - 03-game-state-events-decisions.s017
  - 03-game-state-events-decisions.s020
  - 04-effect-runtime.s010
  - 04-effect-runtime.s012
  - 05-effect-dsl-reference.s008
  - 05-effect-dsl-reference.s012
  - 05-effect-dsl-reference.s029
  - 06-visibility-security.s006
  - 06-visibility-security.s007
  - 11-testing-quality.s004
  - 11-testing-quality.s008
scope:
  - after existing selectTargets validation succeeds, resolve the matching queued effect only when it is the reviewed KO target shape
  - consume or update the resolved effect queue entry deterministically so stale continuations cannot replay
  - preserve the existing decisionResolved event and append primitive resolution events in stable order
  - keep unsupported target effects using the existing fail-closed error behavior without partial mutation
  - preserve legal-action projection for selectTargets decisions and wrong-player responses
  - keep all response validation server-side and independent from client-trusted candidate data
non_scope:
  - opening Main Event play legality for target effects
  - adding new target candidate shapes
  - Counter Events
  - optional effects
  - once-per-turn behavior
  - permanent modifiers
  - replacement effects
  - search or reveal effects
  - server, client, API, WebSocket, database, or UI work
dependencies:
  - ENG-039A
  - ENG-029C
  - ENG-038D
acceptance_criteria:
  - valid selectTargets responses for the reviewed KO target shape resolve the queued effect and clear pendingDecision
  - invalid, stale, duplicate, wrong-player, and unsupported responses continue to reject without mutation
  - unsupported queued target effects still fail closed instead of silently resolving
  - event sequences and state hashes remain deterministic across repeated runs
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/target-selection-actions.test.ts packages/engine-core/src/effect-runtime-queue-processing-targets.test.ts packages/engine-core/src/effect-runtime-target-primitives.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-039B packet while implementing this story
  - run corepack pnpm run packets:verify before implementation and review handoff
  - stay within allowed_touch_points
  - target the ENG-039 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - if continuation needs new decision schema, client-trusted target IDs, or multiple active decisions, stop and split or record the blocker
ambiguity_policy: fail_and_escalate
