scope:
  - parse `[Your Turn] If <public condition>, set the base power of all of your {TYPE} type Characters to N.`
  - reuse existing condition parser primitives for trash-count greater-than-or-equal thresholds
  - emit reusable continuous `setBasePower` Effect DSL with all-target self characterArea and type filter
  - vary threshold, type name, and power value in tests to prevent exact sentence matching
  - add runtime capability matrix evidence that cites SUP-002C capability groups
non_scope:
  - engine runtime behavior or shared contract/schema changes
  - real-card fixture capture, source hash updates, behavior hash updates, overlays, supported-card manifests, or cards-produced manifests
  - exact card IDs, exact full-card text, external card lists, or one-off full-effect branches
  - opponent/all-player targets, color/name filters for continuous target matching, base-cost setters, this-turn base-power setters, or comma-list body composition
card_source_integrity:
  - this story does not enable or change support for a named real card
  - source integrity is not applicable because implementation evidence uses synthetic representative texts only
  - do not edit fixtures, source hashes, behavior hashes, overlays, supported-card manifests, cards-produced manifests, or manually reviewed source evidence
engine_capability_preflight:
  - parsed effect shape is permanent conditional continuous `setBasePower` with a public trash-count condition and all matching self typed Characters
  - supported contract/schema group is provided by SUP-002H after that story lands
  - supported runtime capability group is provided by SUP-002C after that story lands, with exact required IDs `category:permanent`, `trigger:permanent`, `sourcePresencePolicy:mustRemainInSameZone`, `condition:trashCount:self:gte`, `target:all:self:characterArea:character:typesAny`, `effect:setBasePower:self:typed-characters:permanent`, and `continuous:source-liveness:must-remain-in-same-zone`
  - missing runtime capability group is none for scoped synthetic rows only after SUP-002C capability IDs exist in the runtime capability matrix; if conditional base-power runtime evidence is absent, this story is blocked
acceptance_criteria:
  - parser/generator support is generic over condition threshold, type name, and base-power value
  - generated support fails closed when condition or base-power body is only partially parsed
  - runtime capability evidence is required before final playable/generated-support decision can pass
  - no production code checks exact full effect text, card IDs, or the representative sample as a whole string
required_tests:
  - cards parser/generated-support test for conditional all-your-type base-power setter
  - test varying threshold, type name, and base-power value
  - fail-closed tests for unsupported target wording and unsupported condition/body fragments
  - runtime capability matrix test for SUP-002C capability evidence
  - regression test that SUP-001F conditional opponent power modifier still parses independently
  - "`corepack pnpm --filter @optcg/cards test`"
  - "`corepack pnpm run stories:validate`"
  - "`corepack pnpm run packets:verify`"
repo_rules:
  - implement only SUP-002F while its packet is active
  - do not activate or implement SUP-002F until SUP-002H contract/schema evidence and SUP-002C runtime capability evidence have landed as reviewed prerequisite evidence on the active parent integration branch
  - stop and split if implementation requires new engine runtime behavior
ambiguity_policy: fail_and_escalate
