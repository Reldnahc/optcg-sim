title: External deck-rule parser evidence
type: implementation
area: cards
primary_concern: rules
priority: high
status: approved
summary: >
  Parse parameterized leader deck-construction restriction text as certified
  non-runtime evidence so generated support can distinguish external pre-match
  rules from unparsed gameplay text.
story_boundary: >
  Cards-layer story only. Do not add engine runtime behavior, shared
  contract/schema changes, deck validation enforcement, real-card fixture
  promotion, source hashes, behavior hashes, overlays, or card-specific
  branches.
