title: Composed runtime capability matrix expansion
type: implementation
area: cards
primary_concern: rules
priority: high
status: approved
summary: >
  Update cards-side runtime capability evidence so generated support can
  truthfully distinguish ENG-055-supported composed primitives from unsupported
  parser/schema/runtime shapes.
story_boundary: >
  Own only packages/cards runtime capability matrix evidence, support evaluator
  capability gating, diagnostics for missing capability, and focused cards
  tests. Do not add parser rules, generated support for new card text, DSL
  schema, or engine runtime behavior.
