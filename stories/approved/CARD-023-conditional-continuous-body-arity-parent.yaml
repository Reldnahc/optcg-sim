summary: >
  Coordinate the cards-layer fix for conditional continuous composition arity.
  The current CARD-021E implementation hardcodes the composed continuous body as
  exactly two left/right effects. This parent keeps the work in the standard
  parent/substory workflow and delegates implementation to CARD-023A.
story_boundary: >
  Coordinate only CARD-023A. Do not directly implement parser,
  generated-support, diagnostic, runtime-capability metadata, fixture, manifest,
  source-integrity, or real-card promotion changes in the parent story.
