spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-039
epic_id: KICK-001
title: Targeted effect primitive resolution parent
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Coordinate the first narrow selected-target effect primitive so target-based
  Main Events can resolve through the existing target-selection path without
  broadening into unrelated effect families or card-data authority changes.
story_boundary: >
  This parent is not directly implementable. It coordinates ENG-039A through
  ENG-039E on a parent integration branch so the KO target primitive,
  selectTargets continuation, Main Event integration, real-fixture guardrails,
  and PlayerView/event/hash regressions land as one reviewed gameplay group.
allowed_touch_points:
  - stories/generated/ENG-039*.yaml
  - stories/approved/ENG-039*.yaml
