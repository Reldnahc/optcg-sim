scope:
  - add `docs/code-standard.md`
  - link `docs/code-standard.md` from `AGENTS.md` and/or `docs/workflow/story-execution.md` as mandatory implementation guidance
  - add one narrow docs contract test proving `docs/code-standard.md` exists and is linked from a mandatory authority surface as implementation guidance
  - document TypeScript and module style expectations, including strict TypeScript, avoiding `any`, routine non-null assertions, `@ts-ignore`, `@ts-nocheck`, broad casts, and default exports
  - document separation-of-concerns guidance, including cohesive files, one primary reason to change, good and bad split examples, and warnings against over-splitting
  - "document file-size guidance: 500 effective lines as suspect, 800 effective lines as high-risk, and 1000 effective lines as the hard mechanical guard"
  - document package-boundary expectations for engine-core, client/view, cards, server/API/client, and cross-package stories
  - document deterministic engine standards for event ordering, state hashes, state-backed randomness/timestamps, mutation safety, rule processing, decisions, and effect paths
  - document hidden-information standards for PlayerView, client paths, events, decisions, legal actions, queue internals, and private/replay-only visibility
  - document testing standards that distinguish synthetic/unit/regression engine behavior tests from real-card fixture integration/card-data tests
  - document story and scope standards for approved-story boundaries, ambiguity handling, parent/substory packet lifecycle, and avoiding silent fixture/card-data absorption into engine stories
  - document review and PR standards for files changed, tests run, assumptions, blockers, scope fit, durable AI review and revision response trails, parent/substory records, and large-file explanations
non_scope:
  - packet generator changes
  - packet contract changes
  - story schema changes
  - gameplay behavior
  - server, client, API, WebSocket, database, Redis, replay, or UI behavior
  - ESLint rule changes unless story-review requires one tiny docs-alignment test
  - changing the mechanical max-lines rule
  - broad workflow rewrites
  - splitting this into a parent group unless story-review explicitly says the guide cannot stay one small story
dependencies:
  - INF-026
  - INF-037
acceptance_criteria:
  - "`docs/code-standard.md` exists"
  - "`AGENTS.md` and/or `docs/workflow/story-execution.md` link to `docs/code-standard.md` as mandatory implementation guidance"
  - a focused docs contract test proves the guide exists and is linked from mandatory guidance
  - the guide is concrete enough for implementation workers and reviewers
  - the guide distinguishes engine behavior tests from real-card fixture integration tests
  - the guide reinforces package boundaries and hidden-information rules
  - the guide includes separation-of-concerns guidance with 500 effective lines as suspect, 800 effective lines as high-risk, 1000 effective lines as the hard mechanical guard, and explicit warnings against over-splitting
  - the guide covers TypeScript/module style, deterministic engine standards, testing standards, story/scope standards, and review/PR standards
  - full `corepack pnpm run verify` passes
required_tests:
  - exact candidate story-review before approval or implementation
  - focused docs contract test for code-standard existence and mandatory guidance linkage
  - "`corepack pnpm run stories:validate`"
  - "`corepack pnpm run packets:verify`"
  - full `corepack pnpm run verify`
repo_rules:
  - do not skip story-review
  - "if story-review says this should be a parent group, split only into A: write `docs/code-standard.md` and B: link `docs/code-standard.md` from mandatory workflow surfaces"
  - keep this docs-only except for the story-review-required tiny docs/contract test
  - do not modify packet generation unless story-review says the guide cannot be made authoritative without a tiny reference update
  - stay within allowed_touch_points
  - preserve existing max-lines mechanics
  - do not add gameplay, server, client, API, UI, replay, database, or card-data behavior
ambiguity_policy: fail_and_escalate
