spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-044
epic_id: KICK-001
title: Permanent power modifier foundation parent
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Coordinate the first narrow continuous +1000 power modifier foundation so
  active modifier records are derived into computed view without mutating
  canonical card state.
story_boundary: >
  This parent is not directly implementable. It coordinates ENG-044A through
  ENG-044E on a parent integration branch so support gating, computed-view
  application, source-removal disappearance, modifier composition, hidden-info,
  and unsupported-shape regressions land as one reviewed gameplay group.
allowed_touch_points:
  - stories/generated/ENG-044*.yaml
  - stories/approved/ENG-044*.yaml
spec_refs:
  - 0003-continuous-effects-computed-view.s003
  - 0003-continuous-effects-computed-view.s004
  - 0003-continuous-effects-computed-view.s005
  - 0003-continuous-effects-computed-view.s006
  - 02-engine-mechanics.s024
  - 02-engine-mechanics.s042
  - 03-game-state-events-decisions.s005
  - 03-game-state-events-decisions.s020
  - 04-effect-runtime.s004
  - 04-effect-runtime.s011
  - 05-effect-dsl-reference.s001
  - 05-effect-dsl-reference.s027
  - 06-visibility-security.s002
  - 06-visibility-security.s017
  - 11-testing-quality.s004
  - 11-testing-quality.s008
  - 24-story-schema.s004
  - 24-story-schema.s016
  - 27-spec-driven-story-generation-workflow.s015
  - 27-spec-driven-story-generation-workflow.s017
scope:
  - coordinate a parent integration branch for ENG-044A through ENG-044E
  - support one narrow continuous `powerAdd +1000` modifier shape
  - derive the supported modifier into `computeView(state)` without mutating canonical card metadata or card instances
  - support `permanent` and `whileSourceOnField` duration records only where explicitly covered by child stories
  - make `whileSourceOnField` modifiers disappear from computed view when their source is no longer live
  - compose continuous +1000 power with attached DON and battle-duration counter power
  - keep PlayerView hidden-info safe while exposing only public computed board power as child stories define
  - prove unsupported shapes fail closed and assign deterministic hash, canonical nonmutation, and no-eventJournal-mutation coverage to the relevant child stories
non_scope:
  - direct implementation from this parent story
  - packetizing or activating this parent story as an active implementation story
  - real-card fixture capture or card-data integration
  - broad continuous-effect layering
  - base power setters
  - cost modifiers
  - keyword modifiers
  - replacement effects
  - optional effects
  - once-per-turn
  - custom handlers
  - server, client, API, WebSocket, database, Redis, live Poneglyph, or UI work
  - engine-core importing @optcg/cards
dependencies:
  - ENG-043
child_stories:
  - id: ENG-044A
    title: Gate supported continuous power modifiers
    concern: Add narrow support helpers and fail-closed tests for supported continuous +1000 power modifier records without applying them yet.
    depends_on: []
  - id: ENG-044B
    title: Apply continuous power modifiers in computed view
    concern: Derive supported permanent +1000 power modifiers into computed view without mutating canonical/base power.
    depends_on: [ENG-044A]
  - id: ENG-044C
    title: Remove while-source-on-field modifier from computed view
    concern: Support the same narrow +1000 modifier with `whileSourceOnField` duration only while the source remains live.
    depends_on: [ENG-044A, ENG-044B]
  - id: ENG-044D
    title: Compose continuous power with DON and battle modifiers
    concern: Prove continuous +1000 power composes deterministically with attached DON and existing battle-duration counter power.
    depends_on: [ENG-044A, ENG-044B, ENG-044C]
  - id: ENG-044E
    title: Project computed board power and fail closed
    concern: Expose only public computed board power through PlayerView and add hidden-info plus unsupported-shape regressions.
    depends_on: [ENG-044A, ENG-044B, ENG-044C, ENG-044D]
acceptance_criteria:
  - ENG-044A through ENG-044E are reviewed as a coherent permanent power modifier foundation group
  - each child story has a usable exact per-story story-review result before approval
  - child PRs target the ENG-044 parent integration branch if the group is approved
  - the final parent PR derives the first narrow continuous +1000 power modifier through computed view
  - canonical/base card state and manifest power are not mutated by modifier derivation
  - source-scoped modifiers disappear from computed view when the source no longer applies
  - attached DON and battle-duration modifiers compose with the continuous modifier
  - PlayerView exposes only computed/public board power and no continuous-effect internals
  - unsupported continuous modifier shapes fail closed
  - ENG-044B proves permanent modifier derivation leaves canonical state hashes and `eventJournal` unchanged
  - ENG-044C proves stale source records leave canonical state hashes and `eventJournal` unchanged while disappearing from computed view
  - parent PR cleanup metadata and lifecycle evidence bind ENG-044 plus ENG-044A through ENG-044E, and cleanup is deferred until the parent PR lands on main
required_tests:
  - set-level story-review for ENG-044 parent and children
  - per-story story-review for ENG-044 parent before approval
  - per-story story-review for ENG-044A through ENG-044E before approval
  - story-specific tests from every child story
  - full `corepack pnpm run verify` on every child PR and parent PR
repo_rules:
  - do not implement ENG-044 directly
  - use the parent integration branch workflow if this group is approved
  - keep one active child packet at a time
  - do not run packet completion for child stories until the parent branch lands on main
  - require parent PR cleanup metadata and lifecycle evidence for ENG-044 and every included child story
  - use `packets:complete-many` only after the parent PR lands on main or as documented operational fallback
  - if story-review finds PlayerView projection crosses package or UI scope too broadly, narrow ENG-044E before approval
ambiguity_policy: fail_and_escalate
