  - 27-spec-driven-story-generation-workflow.s015
  - 27-spec-driven-story-generation-workflow.s017
  - 32-codex-agent-integration.s013
scope:
  - make the PR author/review handoff checklist require cleanup metadata validation against the actual current PR body or selected durable handoff comment, not a copied example or reconstructed local text
  - make the required cleanup metadata source shape explicit in agent-facing docs: exact `Post-merge cleanup:` header, indented `mode`, `stories`, and optional `branches`, no markdown fence, and no `cleanup:` wrapper
  - add or refine a mechanical command path that can be run before AI reviewer handoff and before human-review handoff to validate fetched/current cleanup metadata source input using the same parser as the cleanup metadata guard
  - add or refine a mechanical handoff-status validation path that consumes remote check/status input and fails unless the `cleanup-metadata-guard` check is present and passing before the PR is described as ready for human review
  - require handoff docs to use the mechanical status validation path, not a prose claim that the remote guard is green
  - make the pre-handoff latch fail closed for missing metadata, multiple metadata sources, fenced YAML metadata, metadata wrapped in a `cleanup:` key, malformed indentation, and metadata that names a story or branch outside the reviewed PR scope
  - keep parent-mode behavior compatible with existing parent lifecycle evidence requirements while making parent PR handoff also wait for the same mechanical cleanup metadata guard status check
  - update the PR template and workflow docs so authors do not use a markdown heading plus fenced YAML block for cleanup metadata
  - add regression tests using the CARD-007 failure mode: a visually plausible `## Post-Merge Cleanup` fenced YAML block with `cleanup:` wrapper must fail the handoff validator, while the exact `Post-merge cleanup:` source must pass
non_scope:
  - changing post-merge packet completion command semantics
  - changing cleanup metadata source authority or making arbitrary comments authoritative
  - relaxing post-merge cleanup validation or pre-merge cleanup metadata guard behavior
  - changing the human merge-gate approval model
  - changing branch deletion policy
  - adding cleanup pull requests
  - broad GitHub branch-protection redesign or remote ruleset mutation
  - changing story schema shape
  - gameplay, engine, replay, server, client, database, or UI behavior
dependencies:
  - INF-027I
  - INF-032
acceptance_criteria:
  - agent-facing workflow docs require a cleanup metadata handoff preflight before reviewer handoff, before human review request, and before declaring a PR human-review-ready
  - the documented preflight validates fetched/current PR body and durable handoff comment input through the repo cleanup metadata parser, and tests prove it does not accept a copied valid local example when the fetched/current PR body is malformed
  - the documented preflight requires a mechanical remote-status validation input proving the `cleanup-metadata-guard` check is present and green before final handoff language is used
  - the exact accepted cleanup metadata shape is documented with no markdown fence and no `cleanup:` wrapper
  - malformed but visually plausible fenced YAML cleanup metadata is rejected by tests and documented as invalid
  - single-story cleanup metadata remains accepted when it uses the exact source shape and matches the reviewed story scope
  - parent-mode cleanup metadata remains accepted only when existing parent lifecycle evidence requirements are satisfied
  - the change does not weaken post-merge cleanup fail-closed validation, metadata binding, packet evidence checks, branch cleanup safety, or human merge-gate requirements
required_tests:
  - contract or GitHub workflow test proving a PR body with `## Post-Merge Cleanup`, a fenced YAML block, and a `cleanup:` wrapper fails cleanup handoff validation
  - contract or GitHub workflow test proving a PR body with exact `Post-merge cleanup:` metadata passes cleanup handoff validation
  - contract or GitHub workflow test proving the handoff latch validates the fetched/current PR body or durable handoff comment source, and rejects the handoff when that source is malformed even if a separate copied local example would parse
  - contract or GitHub workflow test proving durable handoff comment metadata is included in the fetched/current source set and remains subject to the exact-source and trusted-author rules
  - contract or GitHub workflow test proving missing, absent, failed, or pending `cleanup-metadata-guard` status blocks human-review-ready output
  - contract or GitHub workflow test proving exact cleanup metadata plus a present passing `cleanup-metadata-guard` status permits human-review-ready output
  - workflow docs test proving reviewer/human-review handoff instructions require running the cleanup metadata preflight against the actual PR metadata source
  - workflow docs or branch-protection test proving final handoff requires mechanical confirmation that the remote `cleanup-metadata-guard` status check passed
  - PR template test proving the template shows the exact accepted cleanup metadata shape and does not encourage fenced YAML metadata
  - parent cleanup regression test proving the latch does not bypass existing parent lifecycle evidence requirements
  - "`corepack pnpm run test -- tests/github tests/contracts/post-merge-cleanup-contract.test.mjs tests/contracts/post-merge-cleanup-preflight-contract.test.mjs tests/ci/github-workflows.test.mjs`"
  - "`corepack pnpm run packets:verify`"
  - full "`corepack pnpm run verify`"
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - do not present this generated story as approval-ready until the exact candidate has a usable per-story story-review result
  - preserve cleanup metadata as a reviewed request that must bind to trusted checked-in story and packet evidence
  - keep the cleanup metadata guard running from trusted default-branch or base-branch validation code, not PR-head-modifiable code
  - fail closed if the actual PR metadata source cannot be fetched or validated during handoff
  - do not rely on reviewer memory or author prose when a mechanical validation path exists
ambiguity_policy: fail_and_escalate
