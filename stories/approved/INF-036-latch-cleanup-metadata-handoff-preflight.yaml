story_schema_version: 1.0.0
id: INF-036
epic_id: KICK-001
title: Latch cleanup metadata handoff preflight
type: tooling
area: infra
primary_concern: tooling
priority: high
status: approved
summary: >
  Close the agent workflow gap where PR authors can provide visually plausible
  but parser-invalid cleanup metadata and still proceed through review handoff
  until the cleanup metadata guard fails or a human notices. Add a mechanical
  pre-handoff latch that validates the actual PR cleanup metadata source and
  confirms the required remote guard has passed before a PR is described as
  ready for human review.
story_boundary: >
  Own only agent-facing cleanup metadata handoff enforcement, documentation,
  PR-template guidance, and tests around the exact pre-handoff validation path.
  Do not redesign cleanup metadata authority, post-merge cleanup execution,
  story lifecycle semantics, branch deletion policy, or human review
  requirements.
allowed_touch_points:
  - AGENTS.md
  - .github/pull_request_template.md
  - .github/branch-protection.md
  - docs/workflow/parent-integration-branches.md
  - docs/workflow/review-gate.md
  - docs/workflow/story-execution.md
  - docs/workflow/reporting-and-github-sync.md
  - package.json
  - tools/post-merge-cleanup.ts
  - tools/post-merge-cleanup/metadata.ts
  - tools/post-merge-cleanup/types.ts
  - tools/post-merge-cleanup/validator.ts
  - tests/ci/github-workflows.test.mjs
  - tests/contracts/post-merge-cleanup-*.test.mjs
  - tests/github/post-merge-cleanup-evidence-builder.test.mjs
  - tests/github/review-workflow.test.mjs
  - tests/fixtures/post-merge-cleanup/**
  - stories/generated/INF-036-latch-cleanup-metadata-handoff-preflight.yaml
  - stories/approved/INF-036-latch-cleanup-metadata-handoff-preflight.yaml
  - agent-packets/INF-036.md
  - agent-packets/active.json
