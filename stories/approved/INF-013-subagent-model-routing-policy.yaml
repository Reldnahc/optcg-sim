spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-013
epic_id: KICK-001
title: Add subagent model routing policy
type: tooling
area: infra
primary_concern: verification
priority: high
status: approved
summary: >
  Make the parent, worker, and reviewer subagent model-routing policy explicit
  and enforceable so story execution records the model and reasoning levels used
  for implementation and review.
story_boundary: >
  Own workflow-policy artifacts only: AGENTS guidance, Codex integration spec
  text, GitHub review workflow artifacts, review comment templates, story packet,
  and tests that enforce model-routing provenance. Do not change CI jobs, feature
  code, story schema validation, or gameplay behavior in this story.
allowed_touch_points:
  - AGENTS.md
  - specs/32-codex-agent-integration.md
  - .github/pull_request_template.md
  - .github/branch-protection.md
  - .github/review-comments/**
  - agent-packets/**
  - stories/approved/INF-013-subagent-model-routing-policy.yaml
  - tests/github/**
spec_refs:
  - 23-repo-tooling-and-enforcement.s016
  - 32-codex-agent-integration.s008
  - 32-codex-agent-integration.s010
  - 32-codex-agent-integration.s011
  - 32-codex-agent-integration.s013
  - 32-codex-agent-integration.s014
scope:
  - document the parent orchestrator model as gpt-5.5
  - require reviewer subagents to use gpt-5.4 with high reasoning
  - require implementation worker subagents to use either gpt-5.4 with medium reasoning or gpt-5.3-codex with medium reasoning based on story complexity
  - document that simple mechanical stories should prefer gpt-5.3-codex medium while broader or riskier integration stories should prefer gpt-5.4 medium
  - update PR, AI review, fallback review, and revision-response templates to record worker and reviewer model provenance
  - add workflow tests that fail if the model-routing policy or provenance fields are removed
non_scope:
  - automated subagent launch tooling
  - CI infrastructure changes
  - story schema changes
  - gameplay, contract, engine, server, or client feature work
dependencies:
  - INF-011
  - INF-012
acceptance_criteria:
  - AGENTS.md defines the canonical parent, worker, and reviewer subagent model-routing policy
  - specs/32-codex-agent-integration.md includes the same model-routing policy as specification text
  - pull request, AI review, fallback review, and revision-response templates require model and reasoning provenance for parent, worker, and reviewer roles
  - workflow tests enforce gpt-5.5 parent orchestration, gpt-5.4 high reviewer subagents, and gpt-5.4 or gpt-5.3-codex medium implementation workers
required_tests:
  - review workflow tests covering AGENTS.md model routing
  - review workflow tests covering PR and AI review template model provenance
repo_rules:
  - parent orchestration runs on gpt-5.5 unless a higher-authority runtime constraint prevents it and the deviation is recorded
  - reviewer subagents must use gpt-5.4 with high reasoning
  - implementation worker subagents must use gpt-5.4 with medium reasoning or gpt-5.3-codex with medium reasoning unless an approved story explicitly overrides it
  - the parent agent owns worker model choice and must record model-routing deviations in the PR review trail
ambiguity_policy: implement_if_clearly_implied
