spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: CARD-022
epic_id: CARD-022
title: Card-layer regression hardening parent
type: implementation
area: cards
primary_concern: verification
priority: high
status: approved
summary: >
  Raise older card-layer generated-support areas to the regression standard set
  by SUP-001G. First, harden the already-correct conditional draw path with
  top-level primitive-variation tests. Then, replace the older CARD-014G
  story-named exact-template production parser with reusable primitive parsing
  and matching anti-hardcode tests.
story_boundary: >
  Coordinate only CARD-022A and CARD-022B. Do not directly implement parser,
  generated-support, runtime, schema, fixture, manifest, source-integrity, or
  card-promotion changes in the parent story.
allowed_touch_points:
  - stories/generated/CARD-022*.yaml
  - stories/approved/CARD-022*.yaml
  - agent-packets/CARD-022*.md
  - agent-packets/active.json
