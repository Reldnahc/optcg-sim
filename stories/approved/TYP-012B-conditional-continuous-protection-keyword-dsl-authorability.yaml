id: TYP-012B
epic_id: TYP-012
title: Conditional continuous protection and keyword DSL authorability
type: implementation
area: contracts
primary_concern: contract
priority: high
status: approved
summary: >
  Reopen the TYP-012 field-removal protection line with the missing
  Effect DSL authorability needed for reusable conditional continuous
  protection and keyword-grant definitions. This story records the contract
  and schema work that must exist before CARD stories can truthfully promote
  recognized card text into playable generated support.
story_boundary: >
  Own only shared Effect DSL contract, schema, fixture, and spec-authorability
  updates for public trash-count conditions, continuous keyword grants, and
  field-removal protection grants. Do not implement engine materialization,
  runtime capability evidence, card parser/generated-support promotion,
  support manifests, source hashes, behavior hashes, overlays, or real-card
  fixture support.
