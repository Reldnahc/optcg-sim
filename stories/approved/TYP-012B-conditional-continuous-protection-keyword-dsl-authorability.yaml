scope:
  - authorize the Effect DSL schema and exported contract types for public `trashCount` conditions using `player`, `op`, and non-negative safe-integer `value`
  - authorize the Effect DSL schema and exported contract types for continuous keyword grants using a reusable target, keyword token, and duration shape
  - add a reusable Effect DSL protection-grant primitive, such as `giveProtection`, that carries the existing TYP-012A `Protection` metadata, target, and duration without using a string template or card-specific branch
  - authorize a schema-valid permanent continuous effect block that combines a public condition with a sequence of continuous keyword-grant and field-removal protection-grant effects
  - use the existing TYP-012A field-removal protection metadata axes for opponent-controlled card-effect field removal, target scope `thisCard`, and explicit battle/rule/cost/controller-owned/custom exclusions
  - update the Effect DSL fixture-authorability policy so the newly authorable primitives move out of the planned-only list with narrow wording
  - add positive and negative schema/type fixtures proving the reusable primitive shapes, composition shape, and malformed protection metadata boundaries
  - preserve the distinction that schema/type authorability is not engine runtime support, runtime capability evidence, parser certification, generated-support playability, or real-card support
non_scope:
  - engine runtime behavior or materializing permanent/continuous Effect DSL blocks into `ContinuousEffectRecord`s
  - runtime capability matrix updates
  - card parser rules, card-layer generated support, support-probe/report promotion, support manifests, cards-produced manifests, overlays, source hashes, behavior hashes, or real-card fixture capture
  - exact full-card text branches, exact full-effect sentence branches, one real card, or a human-held adjacent-card list
  - new protection families beyond TYP-012A opponent-effect field-removal metadata
  - hidden/private conditions, private-zone predicates, arbitrary condition query language, or unsupported field-removal process classifications
  - server, client, API, UI, database, replay UI, WebSocket, Redis, or live Poneglyph work
acceptance_criteria:
  - schema/type fixtures can represent a permanent continuous effect block gated by `trashCount` and containing both a continuous keyword grant and a field-removal protection grant
  - the protection-grant primitive uses structured TYP-012A `Protection` metadata instead of text, card IDs, or full-sentence templates
  - malformed protection metadata, unsupported protection families, malformed condition values, and unsupported composition shapes reject through contract/schema validation
  - the updated Effect DSL reference clearly marks only the newly covered primitives as fixture-authorable and keeps still-unsupported nearby primitives planned-only
  - tests or fixtures prove schema-valid authorability does not imply runtime capability evidence, parser certification, generated-support status, or card playability
  - downstream ENG and CARD stories can cite this story as the missing contract/schema prerequisite without changing contracts again for this protection/keyword/condition composition shape
required_tests:
  - story-review for TYP-012B before approval handoff
  - positive schema fixture for a permanent continuous block with `trashCount` condition, `giveKeyword`, and field-removal `giveProtection`
  - positive type tests for the new protection-grant effect contract and the reusable conditional continuous composition shape
  - negative schema fixtures for malformed protection metadata, unsupported protection family, malformed trash-count condition, malformed keyword grant, and unsupported composition shapes
  - contract-layer guard test or fixture assertion proving schema-valid DSL remains authorability-only and does not claim runtime capability, parser certification, generated support, or card playability
  - run `corepack pnpm exec tsc -p packages/types/tsconfig.json --noEmit`
  - run `corepack pnpm exec vitest run packages/types/src/effects.test.ts packages/types/src/runtime.test.ts packages/types/src/export-cohesion.test.ts`
  - run `corepack pnpm run types:sync:check`
  - run `corepack pnpm run contracts:validate-effects`
  - run `corepack pnpm run test:contracts`
  - run `corepack pnpm run stories:validate`
repo_rules:
  - generate and activate the TYP-012B packet before implementation
  - stay within allowed touch points
  - keep the patch contract/schema focused and do not add engine-core runtime behavior
  - do not update `packages/cards` runtime capability matrix or generated-support admission in this story
  - fail closed if the protection-grant primitive cannot be represented with structured TYP-012A metadata
  - fail closed if the proposed composition would require card-specific text authority or broad natural-language inference
ambiguity_policy: fail_and_escalate
