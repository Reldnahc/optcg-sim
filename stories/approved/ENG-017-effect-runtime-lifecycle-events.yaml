spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-017
epic_id: KICK-001
title: Emit effect runtime lifecycle events for resolved queue entries
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Add deterministic lifecycle event coverage and production emission for
  supported no-choice effect queue resolution so replay and debug traces can
  identify when a queued effect entry resolves.
story_boundary: >
  Own only engine-core effect-runtime lifecycle event emission for currently
  supported no-choice queue resolution, plus the focused engine-core tests that
  prove event payload stability, ordering, and rule-processing continuation. Do
  not add new event schema members, DSL primitives, target selection, triggers,
  replacements, custom handlers, replay schema, server, client, or CLI behavior.
allowed_touch_points:
  - packages/engine-core/src/effect-runtime.ts
  - packages/engine-core/src/effect-runtime.test.ts
  - packages/engine-core/src/play-card.test.ts
  - packages/engine-core/src/event-sequencing-regression.test.ts
  - stories/approved/ENG-017-effect-runtime-lifecycle-events.yaml
  - agent-packets/ENG-017.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s004 (Engine result)
  - 03-game-state-events-decisions.s005 (Event journal)
  - 03-game-state-events-decisions.s020 (State hashing)
  - 03-game-state-events-decisions.s021 (Invariant hooks)
  - 04-effect-runtime.s006 (Effect queue entry)
  - 04-effect-runtime.s009 (Queue ordering)
  - 04-effect-runtime.s010 (Queue processing)
  - 11-testing-quality.s010 (Golden tests)
  - 18-acceptance-tests.s004 (Milestone 2 - first effect runtime)
scope:
  - emit the existing `effectResolved` event type when a currently supported no-choice effect queue entry resolves successfully
  - 'include stable audit/replay references in the `effectResolved` payload using exactly these keys: `queueEntryId`, `timingWindowId`, `generation`, `effectBlockId`, optional `triggerEventId`, `sourcePresencePolicy`, `orderingGroup`, and `status: "resolved"`'
  - attach deterministic effect causality to the lifecycle event using the resolved queue entry id and effect block id
  - preserve deterministic event order for queue resolution, with the lifecycle event emitted after primitive effect execution events and before the post-resolution rule-processing checkpoint
  - prove rule processing still runs after successful queue resolution by asserting the rule-processing checkpoint remains present after `effectResolved`
  - add or update focused tests showing the supported no-choice On Play draw path emits `effectResolved` through direct queue processing and through real play-card resolution
  - keep unsupported, unresolvable, cancelled, or otherwise unsupported queue entries fail-closed without mutation or partial events because the current public event model has `effectResolved` but no cancellation lifecycle event type
  - add or update coverage documenting that unsupported/unresolvable queue entries return no mutation, no `effectResolved`, and no synthesized `effectCancelled` or `effectCanceled` event under the current event model
non_scope:
  - new effect event types such as `effectCancelled`
  - event schema redesign
  - replay schema changes
  - new DSL primitives
  - target selection
  - trigger expansion
  - replacement effects
  - custom handlers
  - effect runtime support for choice effects, optional effects, costs, conditions, deferred triggers, or unsupported effect shapes
  - match server, browser client, spectator mode, replay viewer, rollback, recovery, or persisted replay storage
dependencies:
  - ENG-012G
  - ENG-016
acceptance_criteria:
  - successful supported no-choice queued draw resolution emits exactly one public `effectResolved` lifecycle event
  - 'the `effectResolved` event payload is exactly `queueEntryId`, `timingWindowId`, `generation`, `effectBlockId`, optional `triggerEventId`, `sourcePresencePolicy`, `orderingGroup`, and `status: "resolved"` and does not expose hidden deck order, hand contents, or private card identities beyond existing public source references'
  - 'the `effectResolved` event causedBy value is `{ type: "effect", queueEntryId, effectId }` for the resolved queue entry'
  - event ordering is deterministic across repeated identical inputs and places primitive draw events before `effectResolved` and the rule-processing checkpoint after `effectResolved`
  - state.eventJournal appends the full EngineResult.events sequence as its suffix and remains strictly increasing by event seq
  - state hash remains deterministic across repeated identical supported queue-resolution inputs
  - unsupported, unresolvable, cancelled, or otherwise unsupported queue entries continue to fail closed without state mutation, without `effectResolved`, and without synthesized `effectCancelled` or `effectCanceled` events unless the current event model directly supports the appropriate cancellation lifecycle event
  - no new DSL primitives, target selection, trigger behavior, replacement behavior, custom handlers, replay schema, server, client, or CLI behavior is added
required_tests:
  - add or update packages/engine-core/src/effect-runtime.test.ts
  - add or update a negative packages/engine-core/src/effect-runtime.test.ts assertion that unsupported or unresolvable queued input returns no mutation, no `effectResolved`, and no synthesized `effectCancelled` or `effectCanceled`
  - update packages/engine-core/src/play-card.test.ts for the new deterministic event sequence
  - update packages/engine-core/src/event-sequencing-regression.test.ts for the supported effect-runtime lifecycle event
  - run corepack pnpm exec vitest run packages/engine-core/src/effect-runtime.test.ts packages/engine-core/src/play-card.test.ts packages/engine-core/src/event-sequencing-regression.test.ts
  - run corepack pnpm run test -- packages/engine-core/src
  - run corepack pnpm run typecheck
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving the story to approved or implementing
  - generate and activate the packet before worker handoff
  - run corepack pnpm run packets:verify before implementation and review handoff
  - stay within allowed_touch_points
  - do not add new event types; if cancellation lifecycle events require an event schema addition, stop and split that into a separate story
  - do not redesign event schema, replay schema, or effect runtime
  - implementation-review gate is required after the PR is opened
ambiguity_policy: fail_and_escalate
