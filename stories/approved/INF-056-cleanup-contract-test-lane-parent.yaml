spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-056
epic_id: INF-056
title: Contract test lane separation parent
type: tooling
area: infra
primary_concern: verification
priority: high
status: approved
summary: >
  Coordinate verification-lane repairs that keep expensive tooling and
  workflow tests out of the default root test lane while preserving their
  enforcement in explicit verification gates.
story_boundary: >
  This parent is not directly implementable. It coordinates child stories that
  separate slow cleanup and tooling-heavy tests from default test discovery,
  add explicit lane ownership, and update CI/script contract evidence so
  contract coverage remains enforced without blocking unrelated product test
  runs through workflow-only or tooling-heavy suites.
allowed_touch_points:
  - stories/generated/INF-056*.yaml
  - stories/approved/INF-056*.yaml
spec_refs:
  - 11-testing-quality.s003
  - 11-testing-quality.s022
  - 23-repo-tooling-and-enforcement.s005
  - 23-repo-tooling-and-enforcement.s010
  - 23-repo-tooling-and-enforcement.s016
  - 23-repo-tooling-and-enforcement.s023
  - 24-story-schema.s016
  - 24-story-schema.s031
  - 24-story-schema.s032
  - 27-spec-driven-story-generation-workflow.s015
  - 27-spec-driven-story-generation-workflow.s017
scope:
  - coordinate executable children for explicit cleanup and tooling-heavy test lane ownership
  - require children to preserve verification coverage instead of deleting or skipping it
  - require children to keep default root test runs focused on normal unit, package, and fast smoke tests
  - require children to keep cleanup/workflow/tooling failures visible in the appropriate explicit verification gate
non_scope:
  - direct implementation from this parent story
  - deleting post-merge cleanup tests or weakening cleanup automation coverage
  - changing cleanup metadata syntax, cleanup guard semantics, packet completion semantics, or post-merge cleanup behavior
  - changing gameplay, engine, card, server, client, replay, persistence, security, or UI behavior
  - bypassing reviewer-subagent review, cleanup metadata validation, human review, or merge gates
dependencies: []
child_stories:
  - id: INF-056A
    title: Separate slow cleanup contracts into explicit lane
    concern: Move slow post-merge cleanup workflow contract coverage out of default root test discovery and into an explicit cleanup or workflow contract lane with CI and script-contract enforcement.
    depends_on: []
  - id: INF-056B
    title: Separate tooling contracts from default test lane
    concern: Move broad tooling-heavy contract, CLI, and lint-config suites out of default root test discovery while keeping them enforced through canonical explicit verification gates.
    depends_on: [INF-056A]
acceptance_criteria:
  - INF-056A owns cleanup-heavy contract lane separation
  - INF-056B owns broad tooling-heavy contract, CLI, and lint-config lane separation
  - default `pnpm test` no longer discovers slow cleanup, workflow, or tooling-heavy contract suites
  - default `pnpm test` no longer discovers CLI or lint-config tooling suites moved to explicit tooling lanes
  - moved contract coverage remains enforced by explicit contract lanes reachable from `contracts` and `verify`
  - moved CLI and lint-config coverage remains enforced by an explicit tooling lane reachable from `verify` and CI
  - CI and local scripts make lane ownership visible and deterministic
  - no contract coverage is deleted, skipped, or hidden to make unrelated story verification pass
required_tests:
  - distinct story-review artifact for INF-056 parent before approval
  - distinct story-review artifact for INF-056A child before approval
  - distinct story-review artifact for INF-056B child before approval
  - story-specific tests from INF-056A
  - story-specific tests from INF-056B
  - full `corepack pnpm run verify` for each reviewed child commit on the parent integration branch and for the final parent PR
repo_rules:
  - do not implement INF-056 directly
  - use the parent/substory integration workflow
  - keep one active child packet at a time
  - do not run packet completion for INF-056A or INF-056B until the parent branch lands on main
  - lane separation may move slow tooling-heavy tests out of default `pnpm test`, but canonical `pnpm contracts`, `pnpm verify`, and CI must still invoke the explicit replacement lanes
ambiguity_policy: fail_and_escalate
