spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-028E
epic_id: KICK-001
title: Verify life trigger hidden information
type: verification
area: engine
primary_concern: visibility
priority: high
status: approved
summary: >
  Prove life-trigger reveal, decline, activation, no-zone, legal-action, event,
  and PlayerView projections preserve hidden information.
story_boundary: >
  Own only integration/regression coverage and the smallest necessary repair if
  the regression exposes a landed bug in ENG-028A through ENG-028D. Do not add
  new life-trigger behavior beyond the landed child stories.
allowed_touch_points:
  - packages/engine-core/src/life-trigger-actions.test.ts
  - packages/engine-core/src/filter-state-for-player.test.ts
  - packages/engine-core/src/filter-state-for-player.real-states.test.ts
  - packages/engine-core/src/filter-state-for-player.ts
  - packages/engine-core/src/actions.test.ts
  - packages/engine-core/src/event-sequencing-regression.test.ts
  - packages/engine-core/src/battle-pipeline-regression.test.ts
  - packages/engine-core/src/battle-damage-banish.test.ts
  - packages/engine-core/src/life-trigger-actions.ts
  - packages/engine-core/src/effect-runtime.ts
  - stories/approved/ENG-028E-verify-life-trigger-hidden-info.yaml
  - agent-packets/ENG-028E.md
  - agent-packets/active.json
spec_refs:
  - 02-engine-mechanics.s023
  - 02-engine-mechanics.s040
  - 03-game-state-events-decisions.s014
  - 03-game-state-events-decisions.s015
  - 03-game-state-events-decisions.s018
  - 03-game-state-events-decisions.s020
  - 06-visibility-security.s004
  - 06-visibility-security.s005
  - 06-visibility-security.s006
  - 06-visibility-security.s007
  - 11-testing-quality.s011
  - 18-acceptance-tests.s004
scope:
  - verify declined Trigger cards never reveal card identity or Trigger metadata to the opponent
  - verify activated Trigger cards reveal publicly only after activateTrigger response
  - verify no-zone activated Trigger state does not leak server-only runtime internals or hidden adjacent Life/deck/hand identities
  - verify legal actions expose the confirmLifeTrigger response only to the damaged player
  - verify event filtering hides private decline details and keeps public activation audit data deterministic
  - verify Banish still bypasses the normal trigger/hand path
  - verify event sequencing and state hashes remain stable across decline and activation paths
non_scope:
  - new life-trigger behavior beyond ENG-028A through ENG-028D
  - Banish changes
  - Double Attack or multiple damage handling
  - replacement effects
  - complex Trigger effects
  - search, look, or reveal primitives
  - target selection
  - server/client/UI
dependencies:
  - ENG-028D
acceptance_criteria:
  - real-state PlayerView tests cover pre-decision, declined, activated/no-zone, and resolved Trigger states
  - opponent views never include declined Trigger card identity, adjacent Life identities, deck order, hidden hand contents, effectQueue internals, or transient no-zone internals
  - both players see activated Trigger identity only during the public reveal/no-zone window and public trash state after supported resolution
  - legal actions for the non-recipient do not reveal that a hidden Trigger decision exists beyond allowed public battle pause state
  - event sequencing and state hash regression coverage includes both decline and activation paths
  - Banish regression confirms no life-trigger decision or reveal is created
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/life-trigger-actions.test.ts packages/engine-core/src/filter-state-for-player.test.ts packages/engine-core/src/filter-state-for-player.real-states.test.ts packages/engine-core/src/actions.test.ts packages/engine-core/src/event-sequencing-regression.test.ts packages/engine-core/src/battle-pipeline-regression.test.ts packages/engine-core/src/battle-damage-banish.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-028E packet while implementing this story
  - run corepack pnpm run packets:verify before implementation and review handoff
  - stay within allowed_touch_points
  - target the ENG-028 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - if verification requires new gameplay behavior rather than a narrow repair to landed ENG-028 behavior, stop and split or record the blocker
ambiguity_policy: fail_and_escalate
