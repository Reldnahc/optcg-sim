spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-051
epic_id: INF-051
title: Remove generated draft story backlog
type: tooling
area: infra
primary_concern: tooling
priority: high
status: approved
summary: >
  Remove the unapproved generated story backlog so dormant draft artifacts no
  longer obscure the approved, blocked, replaced, and completed story queues.
story_boundary: >
  Own only deletion of generated draft story files and the lifecycle evidence
  needed for post-merge cleanup of this cleanup story. Do not change approved,
  blocked, replaced, or completed stories, packet tooling, specs, workflow
  rules, code, contracts, tests, or runtime behavior.
allowed_touch_points:
  - stories/generated/**
  - stories/approved/INF-051-remove-generated-draft-story-backlog.yaml
  - agent-packets/INF-051.md
  - agent-packets/active.json
spec_refs:
  - 24-story-schema.s004
  - 24-story-schema.s026
  - 27-spec-driven-story-generation-workflow.s011
  - 27-spec-driven-story-generation-workflow.s015
  - 27-spec-driven-story-generation-workflow.s016
scope:
  - delete unapproved generated draft story YAML files from `stories/generated/`
  - leave approved, blocked, replaced, and done story lifecycle directories unchanged
  - generate and activate the packet for this cleanup story so post-merge cleanup can complete the story normally
  - record cleanup metadata for this story in the PR body
non_scope:
  - changing gameplay, engine, card, server, client, replay, database, protocol, DTO, hidden-info, or UI behavior
  - changing specs, workflow docs, story schema, packet tooling, cleanup tooling, or PR gate behavior
  - deleting approved, blocked, replaced, or completed story files
  - editing generated story contents instead of removing the generated backlog
dependencies: []
acceptance_criteria:
  - "`stories/generated/` contains no generated story YAML files after the cleanup"
  - approved, blocked, replaced, and completed story directories are not pruned by this story
  - active packet state points only at this cleanup story before merge and can be completed by normal post-merge cleanup
  - cleanup metadata names this approved cleanup story and the PR head branch
  - no code, spec, contract, runtime, DTO, replay, protocol, hidden-info, card-data, or gameplay behavior changes are included
required_tests:
  - "run `corepack pnpm run stories:validate`"
  - "run `corepack pnpm run packets:verify`"
  - "run `corepack pnpm run verify`"
repo_rules:
  - "use `corepack pnpm`, not plain `pnpm`, when running repo commands in this environment"
  - keep the cleanup limited to generated draft story lifecycle artifacts and this story packet evidence
  - do not add a no-op or fake cleanup metadata block; cleanup metadata must name the reviewed approved story path
ambiguity_policy: fail_and_escalate
