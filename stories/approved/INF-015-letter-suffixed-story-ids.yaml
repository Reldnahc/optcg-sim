spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-015
epic_id: KICK-001
title: Support letter-suffixed split story identifiers
type: tooling
area: infra
primary_concern: tooling
priority: high
status: approved
summary: >
  Align story schema and workflow validation with the approved split-story
  identifier format used by INF-006A through INF-006D so active packet
  verification and repo-wide tests can run while those stories are active.
story_boundary: >
  Own story identifier validation for approved story files and active packet
  workflow tests only. Do not change packet lifecycle semantics, board sync,
  story generation, or any gameplay, contract fixture, engine, server, client,
  replay, or database behavior.
allowed_touch_points:
  - contracts/story.schema.json
  - specs/24-story-schema.md
  - stories/approved/INF-015-letter-suffixed-story-ids.yaml
  - agent-packets/**
  - tests/contracts/**
  - tests/github/**
spec_refs:
  - 24-story-schema.s009
  - 24-story-schema.s019
  - 24-story-schema.s027
  - 24-story-schema.s032
  - 26-agent-packet-template.s005
  - 27-spec-driven-story-generation-workflow.s012
scope:
  - allow story IDs with an optional single uppercase letter suffix after the three-digit sequence
  - keep epic IDs numeric-only unless separately changed by a future story
  - update workflow tests that hard-code numeric-only active story IDs
  - add or update contract tests proving approved split-story IDs validate
non_scope:
  - changing active packet lifecycle semantics
  - changing board sync behavior
  - renaming existing approved stories
  - changing gameplay, contract fixture, engine, server, client, replay, or database code
dependencies:
  - INF-014
acceptance_criteria:
  - contracts/story.schema.json accepts approved story IDs such as INF-006A
  - contracts/story.schema.json still accepts numeric story IDs such as INF-015
  - active packet workflow tests accept the current active story if its ID has a single uppercase letter suffix
  - packet verification still requires the packet path to match the active story ID exactly
  - repo-wide verification can run with a letter-suffixed active story ID after this prerequisite merges
required_tests:
  - story schema contract test for a letter-suffixed approved story ID
  - review workflow test update for letter-suffixed active story IDs
  - packet contract test update if active packet validation has numeric-only assumptions
repo_rules:
  - keep the identifier format explicit and reviewable
  - do not broaden story IDs to arbitrary suffixes
  - no live external services are required
ambiguity_policy: implement_if_clearly_implied
