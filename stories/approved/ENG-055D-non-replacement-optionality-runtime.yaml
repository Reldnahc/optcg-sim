spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-055D
epic_id: ENG-055
title: Non-replacement optionality runtime
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Implement runtime semantics for non-replacement optional activation,
  optional cost, and optional effect clauses in composed effects.
story_boundary: >
  Own only non-replacement optionality runtime semantics and focused tests. Do
  not change replacement optionality, parser support, or card support metadata.
allowed_touch_points:
  - packages/engine-core/src/optional-activation-actions.ts
  - packages/engine-core/src/effect-runtime*.ts
  - packages/engine-core/src/effect-runtime-optional-activation*.test.ts
  - packages/engine-core/src/actions-pending-decision.test.ts
  - tests/hidden-info/**
  - stories/generated/ENG-055*.yaml
  - stories/approved/ENG-055*.yaml
  - agent-packets/ENG-055D.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s017
  - 04-effect-runtime.s002
  - 04-effect-runtime.s009
  - 04-effect-runtime.s011
  - 04-effect-runtime.s012
  - 05-effect-dsl-reference.s004
  - 05-effect-dsl-reference.s013
  - 11-testing-quality.s004
  - 11-testing-quality.s008
dependencies:
  - ENG-055B
  - TYP-007C
scope:
  - implement optional activation semantics for composed effect frames
  - update choose-optional-activation response handling only as needed to route composed-frame accept/decline pause and resume behavior
  - implement optional cost and optional effect clause semantics
  - preserve correct acceptance and commitment timing
  - "record optional cost decline or failure as `paidCost: false` segment results and optional effect decline as `playerDeclined: true` segment results, with connector behavior driven by those records"
  - preserve deterministic replay for accept and decline branches through pending-decision pause/resume
  - add invalid response, stale decision, decline, acceptance, hidden-info, event-order, and hash coverage
non_scope:
  - replacement optionality or chooseReplacement behavior
  - condition evaluator expansion beyond required integration points
  - parser/card support
acceptance_criteria:
  - declined optional activation/effect/cost paths do not commit effects incorrectly
  - accepted optional paths commit at the correct point
  - failed optional costs do not consume once-per-turn usage; once-per-turn usage is marked only after the `04-effect-runtime.s011` legal-commitment point
  - "optional cost decline/failure records `paidCost: false`, optional effect decline records `playerDeclined: true`, and dependent connector branches consume those segment results deterministically"
  - hidden-info behavior is preserved for optional decisions and responses
  - replacement optionality is unchanged
  - optional activation, optional cost, and optional effect accept/decline branches replay deterministically without changing canonical event order or state hash
required_tests:
  - focused optional activation/cost/effect runtime tests
  - "segment-result and connector tests covering `paidCost: false`, `playerDeclined: true`, and dependent branch skip/continue behavior"
  - invalid response and stale decision tests
  - replay regression across `respondToDecision` accept and decline paths for optional activation, optional cost, and optional effect clauses
  - hidden-info, event-order, and state-hash regression tests
  - run `corepack pnpm --filter @optcg/engine-core typecheck`
  - run `corepack pnpm run stories:validate`
repo_rules:
  - no replacement generalization
  - do not import @optcg/cards
  - fail closed on commitment timing ambiguity
ambiguity_policy: fail_and_escalate
