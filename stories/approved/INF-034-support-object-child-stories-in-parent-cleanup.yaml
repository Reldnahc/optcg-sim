spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-034
epic_id: INF-027
title: Support object child stories in parent cleanup
type: tooling
area: infra
primary_concern: tooling
priority: high
status: approved
summary: >
  Make parent-mode cleanup tooling read the canonical object-form
  `child_stories[].id` shape so schema-valid parent stories can be closed by
  bound parent cleanup without requiring schema-invalid scalar child story
  lists.
story_boundary: >
  Own only parent-cleanup parsing compatibility for canonical object-form
  child_stories. Do not change cleanup metadata authority, parent closeout
  evidence requirements, packet lifecycle semantics, story schema shape, branch
  deletion policy, or gameplay behavior.
allowed_touch_points:
  - tools/agent-packet-parser.ts
  - tools/agent-packet-lifecycle.ts
  - tools/post-merge-cleanup/validator.ts
  - tests/contracts/agent-packet-parser-contract.test.mjs
  - tools/validate-stories.ts
  - tests/contracts/agent-packet-completion-contract.test.mjs
  - tests/contracts/post-merge-cleanup-parent-contract.test.mjs
  - tests/contracts/committed-story-validation.test.mjs
  - stories/generated/INF-034-support-object-child-stories-in-parent-cleanup.yaml
  - stories/approved/INF-034-support-object-child-stories-in-parent-cleanup.yaml
  - agent-packets/INF-034.md
  - agent-packets/active.json
spec_refs:
  - 23-repo-tooling-and-enforcement.s005
  - 23-repo-tooling-and-enforcement.s016
  - 23-repo-tooling-and-enforcement.s023
  - 24-story-schema.s004
  - 24-story-schema.s009
  - 24-story-schema.s014
  - 24-story-schema.s025
  - 24-story-schema.s027
  - 27-spec-driven-story-generation-workflow.s015
  - 32-codex-agent-integration.s013
scope:
  - extend the shared agent-packet story parser only as needed to parse schema-valid object-form child_stories entries used by parent cleanup
  - update parent cleanup planning to read canonical `child_stories[].id` entries from approved parent stories
  - update packet completion parent closeout to compare cleanup child IDs against canonical object-form `child_stories[].id`
  - preserve fail-closed behavior when parent child story IDs are absent, malformed, ambiguous, duplicated, or mismatched
  - keep any legacy scalar-list fixture support only if existing tests require it and it does not weaken canonical object-form validation
  - update committed story validation helper behavior if needed so stale approved parent detection continues to read object-form child IDs
  - add regression tests using schema-valid object-form parent stories for parent cleanup planning and packet completion closeout
non_scope:
  - changing story schema shape
  - changing parent cleanup metadata source selection
  - changing parent lifecycle evidence requirements
  - changing packet generation or active packet semantics
  - adding packets for parent stories
  - changing branch deletion policy
  - changing gameplay, engine, cards, server, client, replay, database, or UI behavior
dependencies:
  - INF-033
acceptance_criteria:
  - parent cleanup planning accepts a schema-valid approved parent with object-form `child_stories` whose IDs exactly match cleanup child stories
  - "`packets:complete-many` bound parent closeout accepts a schema-valid approved parent with object-form `child_stories` whose IDs exactly match completed child stories"
  - parent cleanup still fails closed for mismatched, missing, duplicated, or malformed child story IDs
  - stale approved parent story validation still detects schema-valid object-form parents whose children are all done
  - existing scalar-list cleanup fixtures either keep passing as backwards compatibility or are replaced with schema-valid object-form fixtures
required_tests:
  - agent-packet-parser regression coverage for object-form `child_stories`
  - contract test proving parent cleanup planning accepts object-form parent `child_stories`
  - packet completion contract test proving bound parent closeout accepts object-form parent `child_stories`
  - contract test proving missing, mismatched, duplicated, and malformed object-form child story IDs still fail closed
  - committed story validation regression for stale object-form approved parent stories
  - "focused `corepack pnpm exec vitest run tests/contracts/agent-packet-parser-contract.test.mjs tests/contracts/agent-packet-completion-contract.test.mjs tests/contracts/post-merge-cleanup-parent-contract.test.mjs tests/contracts/committed-story-validation.test.mjs`"
  - "`corepack pnpm run stories:validate`"
  - "`corepack pnpm run verify`"
repo_rules:
  - use TDD by first adding failing object-form parent cleanup tests
  - prefer structured story parsing over ad hoc text parsing where practical
  - keep cleanup metadata a reviewed request bound to existing evidence
  - do not weaken parent cleanup mismatch, stale-evidence, packetized-parent, or already-done-parent failures
ambiguity_policy: fail_and_escalate
