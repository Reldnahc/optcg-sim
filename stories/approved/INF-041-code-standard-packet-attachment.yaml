id: INF-041
epic_id: KICK-001
title: Attach code standard guidance to generated packets
type: tooling
area: infra
primary_concern: tooling
priority: high
status: approved
summary: >
  Update agent packet generation so every newly generated packet carries a
  compact Code Standard attachment that points implementation agents to
  docs/code-standard.md and summarizes the non-negotiable implementation rules.
story_boundary: >
  Own only packet rendering and active-packet verification for the compact code
  standard attachment. Keep the packet concise, preserve all existing story
  metadata and story-derived sections, and do not rewrite historical packets
  except the active packet required for this story.
