spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-024E
epic_id: KICK-001
title: Integrate source presence policy in queue processing
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Use the centralized source-presence policy helper in existing no-choice queue
  processing and preserve lifecycle/event behavior.
story_boundary: >
  Own only queue-processor integration of the centralized helper, deterministic
  cancellation/fail-closed behavior, and regression tests for current no-choice
  queue processing.
allowed_touch_points:
  - packages/engine-core/src/effect-runtime.ts
  - packages/engine-core/src/effect-runtime.test.ts
  - packages/engine-core/src/effect-queue-ordering.test.ts
  - stories/approved/ENG-024E-integrate-source-presence-policy-in-queue-processing.yaml
  - agent-packets/ENG-024E.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s005 (Event journal)
  - 03-game-state-events-decisions.s020 (State hashing)
  - 04-effect-runtime.s006 (Effect queue entry)
  - 04-effect-runtime.s007 (Source presence policy)
  - 04-effect-runtime.s008 (Trigger detection from events)
  - 04-effect-runtime.s009 (Effect queue ordering)
  - 04-effect-runtime.s011 (Conditions and costs)
  - 11-testing-quality.s007 (Interaction tests)
  - 11-testing-quality.s008 (Invariant tests)
  - 23-repo-tooling-and-enforcement.s006 (TypeScript enforcement)
  - 23-repo-tooling-and-enforcement.s008 (Boundary enforcement)
  - 23-repo-tooling-and-enforcement.s016 (CI merge gates)
scope:
  - replace queue-processor source-presence branching with the centralized helper
  - preserve effectResolved lifecycle payload compatibility for successful supported no-choice effects
  - preserve deterministic unsupported/fail-closed behavior for unsupported or unprovable source-presence policies
  - preserve current no-event runtime-error behavior for failed source-presence evaluation: original input state, no emitted events, and no effectResolved/effectCancelled lifecycle events
  - keep rule processing checkpoints running after successful resolution
  - prove event order, event IDs, eventJournal append behavior, and state hashes remain stable
non_scope:
  - new effect primitives
  - new trigger timing implementations
  - Counter Step changes
  - Life Triggers
  - On K.O.
  - target selection
  - replacement effects
  - custom handlers
  - server/client/UI or replay schema
dependencies:
  - ENG-024D
acceptance_criteria:
  - no-choice queue processing calls the centralized source-presence helper
  - successful supported no-choice effects still emit compatible effectResolved lifecycle events and subsequent rule-processing events
  - unsupported or failed source-presence evaluation remains deterministic and fail-closed without partial mutation or new lifecycle events
  - event sequencing and state hash regression coverage remains stable for accepted queue processing
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/source-presence.test.ts packages/engine-core/src/effect-runtime.test.ts packages/engine-core/src/effect-queue-ordering.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-024E packet while implementing this story
  - run corepack pnpm run packets:verify before implementation and review handoff
  - stay within allowed_touch_points
  - target the ENG-024 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - if integration requires new effect primitives, trigger timing, Counter Step changes, Life Triggers, On K.O., target selection, replacement effects, or custom handlers, stop and split or record the blocker
  - implementation-review gate is required after the PR is opened
ambiguity_policy: fail_and_escalate
