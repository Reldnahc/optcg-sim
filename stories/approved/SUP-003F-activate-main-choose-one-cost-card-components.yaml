scope:
  - "define parser primitives separately before composing them: `[Activate: Main]` wrapper, `[Once Per Turn]` marker, optional cost marker `You may`, choose-one connector `or`, typed self Character field-trash alternative, unfiltered hand-trash alternative, colon cost/body separator, and draw-N body"
  - "parse `[Activate: Main] [Once Per Turn] You may trash N of your {TYPE} type Characters or M card(s) from your hand: Draw K card(s).`"
  - "emit reusable Effect DSL as category `activate`, trigger `activateMain`, oncePerTurn true, and a sequence whose first segment is optional choose-one payCost and whose dependent segment draws only if the cost was paid"
  - compose CardFilter category/type primitives for the field-trash alternative without hardcoding one type name
  - keep hand-trash alternative unfiltered unless printed text supplies a scoped hand filter in a later story
  - vary field-trash count, hand-trash count, draw count, and type name in tests to prevent exact sentence matching
  - add runtime capability matrix evidence that cites SUP-003B and SUP-003C capability groups plus existing draw capability evidence
non_scope:
  - engine runtime behavior or shared contract/schema changes
  - real-card fixture capture, source hash updates, behavior hash updates, overlays, supported-card manifests, or cards-produced manifests
  - exact card IDs, exact full-card text, external card lists, or one-off full-effect branches
  - Activate Main effects without Once Per Turn, non-optional required costs, non-trash costs, nested alternatives, comma-separated alternatives, target selection bodies, or bodies other than draw
  - field-trash alternatives for opponent cards, Stages, Leaders, DON!!, or arbitrary field zones
card_source_integrity:
  - this story does not enable or change support for a named real card
  - source integrity is not applicable because implementation evidence uses synthetic representative texts only
  - do not edit fixtures, source hashes, behavior hashes, overlays, supported-card manifests, cards-produced manifests, or manually reviewed source evidence
engine_capability_preflight:
  - parsed effect shape is Activate Main Once Per Turn sequence with optional choose-one payCost followed by ifYouDo draw
  - supported contract/schema group is provided by SUP-003A after that story lands
  - supported runtime capability group is provided by SUP-003B and SUP-003C after those stories land, with exact required IDs `category:activate`, `trigger:activateMain`, `activateMain:source:leader-character-stage`, `activateMain:oncePerTurn:legal-commitment`, `sequence:genericFrames`, `payCost:chooseOne:optional:trashFromField-or-trashFromHand:self`, `payCost:trashFromField:self:characterArea:character:typesAny:count-exact:optional`, `payCost:trashFromHand:self:count-exact:optional`, `sourcePresencePolicy:mustRemainInSameZone`, and `effect:draw:self:count:positive-safe-integer`
  - missing runtime capability group is none for scoped synthetic rows only after SUP-003B and SUP-003C capability IDs exist in the runtime capability matrix; if capability evidence is absent, this story is blocked
acceptance_criteria:
  - parser/generator support is generic over type name and positive integer counts for each scoped primitive
  - parser/generator implementation must expose or test primitive boundaries for wrapper, once-per-turn marker, optional cost marker, choose-one connector, field-trash alternative, hand-trash alternative, cost/body separator, and draw body
  - full-line success plus value variation is not sufficient evidence
  - "generated-support tests that assert `status: supported` must validate the produced Effect DSL with the real schema validator"
  - generated-support promotion requires current parser-rule certification evidence for each scoped primitive and for the composed Activate Main cost/draw shape
  - generated-support parser certification must explicitly include durable primitive IDs for `[Activate: Main]`, `[Once Per Turn]`, `You may`, choose-one `or`, typed self Character field-trash alternative, unfiltered hand-trash alternative, colon cost/body separator, draw-N body, and the composed Activate Main optional choose-one trash cost into draw shape
  - the production/default generated-support path must supply current parser-rule certification evidence; lower-level tests with manually injected evidence are not sufficient if support-probe reports missing certification
  - generated support fails closed when any primitive is only partially parsed
  - no production code checks exact full effect text, card IDs, or one representative sample as a whole string
required_tests:
  - cards parser primitive-boundary tests for Activate Main wrapper and Once Per Turn marker independent of the cost/body parser
  - cards parser primitive-boundary tests for optional choose-one trash cost alternatives independent of the draw body
  - "parser composition/residue test proving `[Activate: Main]`, `[Once Per Turn]`, optional choose-one cost, `or`, colon separator, and draw body are separate reusable components and not one full-line branch"
  - cards parser/generated-support matrix varying field-trash count, hand-trash count, draw count, and type name
  - real-schema generated-support regression for each supported Activate Main matrix row
  - support-evaluator or support-probe regression proving the production/default path has no missing parser-certification blockers for the scoped Activate Main shape
  - fail-closed tests for unsupported alternative costs, missing `or`, missing colon, unsupported body, unsupported field target, and stale/missing certification evidence
  - runtime capability matrix test for SUP-003B/SUP-003C capability evidence
  - regression test for existing supported On Play, When Attacking, and optional cost generated-support rows
  - "`corepack pnpm --filter @optcg/cards test`"
  - "`corepack pnpm run stories:validate`"
  - "`corepack pnpm run packets:verify`"
repo_rules:
  - implement only SUP-003F while its packet is active
  - do not activate or implement SUP-003F until SUP-003A, SUP-003B, and SUP-003C have landed as reviewed prerequisite evidence on the active parent integration branch
  - stop and split if implementation requires new engine runtime behavior or shared contract/schema work
ambiguity_policy: fail_and_escalate
