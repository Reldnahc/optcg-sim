title: Reusable queued entry-point body adapters
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Replace exact wrapper-body queued support checks with reusable entry-point
  adapters composed with shared effect body and sequence support predicates.
story_boundary: >
  Own engine-core support-shape architecture for queued implemented-DSL entry
  points. Keep entry-point responsibilities separate from body and composition
  support. Do not add cards-layer runtime capability matrix rows, parser rules,
  generated-support promotion, or real-card enablement.
