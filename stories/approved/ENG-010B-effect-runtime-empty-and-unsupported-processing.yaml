spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-010B
epic_id: M1-001
title: Add empty and unsupported effect runtime processing
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Add the first `effect-runtime.ts` processor surface: empty queues are a
  deterministic no-op and non-empty queues or deferred triggers fail closed
  without mutating state or appending events.
story_boundary: >
  Own only empty-queue and unsupported non-empty queue processing. Stop before
  effect execution, trigger detection, source-presence checks, queue entry
  creation, pending decision creation, legal-action gating, or integration into
  phase, play-card, or battle paths.
allowed_touch_points:
  - packages/engine-core/src/effect-runtime.ts
  - packages/engine-core/src/effect-runtime.test.ts
spec_refs:
  - 03-game-state-events-decisions.s002 (Game state)
  - 06-visibility-security.s002 (Raw state boundary)
  - 06-visibility-security.s003 (Player zone visibility)
  - 04-effect-runtime.s002 (Overview)
  - 04-effect-runtime.s006 (Effect queue entry)
  - 04-effect-runtime.s007 (Source presence policy)
  - 04-effect-runtime.s009 (Queue ordering)
  - 04-effect-runtime.s010 (Queue processing)
  - 03-game-state-events-decisions.s004 (Engine result shape)
  - 03-game-state-events-decisions.s005 (Event journal)
  - 03-game-state-events-decisions.s020 (State hashing)
  - 03-game-state-events-decisions.s021 (Invariant hooks)
  - 03-game-state-events-decisions.s023 (Error handling inside the engine)
  - 11-testing-quality.s008 (Invariant tests)
  - 23-repo-tooling-and-enforcement.s006 (TypeScript enforcement)
  - 23-repo-tooling-and-enforcement.s008 (Boundary enforcement)
  - 15-implementation-kickoff.s012 (Guardrails)
scope:
  - create an `effect-runtime.ts` module with a narrow processor function for the current `GameState.effectQueue` and `GameState.deferredTriggers`
  - expose a pure pending-runtime-work detector with content-agnostic diagnostics for downstream integration stories
  - return a deterministic `EngineResult`-compatible shape for empty queues with no events, no errors, no newly created pending decision, and the same state hash
  - 'return `effectRuntimeError` for non-empty `effectQueue` without mutating state or appending events, using `effectId: "unsupported-effect-queue"` and details `{ reason: "unsupported-pending-runtime-work", kind: "effectQueue", count: number }`'
  - 'return `effectRuntimeError` for non-empty `deferredTriggers` without mutating state or appending events, using `effectId: "unsupported-deferred-triggers"` and details `{ reason: "unsupported-pending-runtime-work", kind: "deferredTriggers", count: number }`'
  - 'when both `effectQueue` and `deferredTriggers` are non-empty, fail closed with a single `effectQueue`-precedence `effectRuntimeError` using `effectId: "unsupported-effect-queue"` and `kind: "effectQueue"` details'
non_scope:
  - executing effect blocks, DSL operations, or custom handlers
  - detecting triggers from events
  - creating `chooseTriggerOrder`, `chooseOptionalActivation`, target, replacement, or life-trigger decisions
  - checking source presence beyond returning unsupported runtime errors
  - integrating processor calls into actions, phases, battle, play-card, replay, CLI, server, client, database, Redis, WebSocket, React, live HTTP, or Poneglyph code
dependencies:
  - ENG-001C
  - TYP-001F
  - TYP-001G
acceptance_criteria:
  - empty queue processing appends no events, creates no `EngineResult.decisions`, creates or replaces no `state.pendingDecision`, does not mutate state or increment state seq, and preserves state hash
  - the pending-runtime-work detector returns content-agnostic diagnostics with only pending work kind and count
  - 'non-empty `effectQueue` fails closed with `EngineError.type` equal to `effectRuntimeError`, `effectId: "unsupported-effect-queue"`, and details `{ reason: "unsupported-pending-runtime-work", kind: "effectQueue", count: number }`'
  - 'non-empty `deferredTriggers` fails closed with `EngineError.type` equal to `effectRuntimeError`, `effectId: "unsupported-deferred-triggers"`, and details `{ reason: "unsupported-pending-runtime-work", kind: "deferredTriggers", count: number }`'
  - 'combined non-empty `effectQueue` and `deferredTriggers` fails closed with one deterministic `effectQueue`-precedence error using `effectId: "unsupported-effect-queue"` and `kind: "effectQueue"` details'
  - unsupported diagnostics are content-agnostic and do not expose `sourceSnapshot.cardId`, hidden-zone card identity, or other hidden card contents
  - failure paths do not mutate state, append events, increment state seq, replace existing pending decisions, or create pending decisions
  - engine-core boundary remains pure and package entrypoints are unchanged
required_tests:
  - unit test proving empty processing returns no events, no errors, no `EngineResult.decisions`, no new or replaced `state.pendingDecision`, no state mutation or seq increment, and same state hash
  - unit test proving the pending-runtime-work detector returns content-agnostic diagnostics with only pending work kind and count
  - 'unit test proving non-empty `effectQueue` returns `effectRuntimeError` with `effectId: "unsupported-effect-queue"` and exact deterministic details'
  - 'unit test proving non-empty `deferredTriggers` returns `effectRuntimeError` with `effectId: "unsupported-deferred-triggers"` and exact deterministic details'
  - 'unit test proving combined non-empty `effectQueue` and `deferredTriggers` returns one `effectQueue`-precedence `effectRuntimeError` with `effectId: "unsupported-effect-queue"` and `kind: "effectQueue"` details'
  - unit test proving non-empty `effectQueue` diagnostics are content-agnostic and do not expose `sourceSnapshot.cardId`, hidden-zone card identity, or other hidden card contents
  - unit test proving non-empty `deferredTriggers` diagnostics are content-agnostic and do not expose hidden card contents
  - unit test proving non-empty `effectQueue` failure does not mutate state, append events, increment state seq, replace an existing pending decision, or create a pending decision
  - unit test proving non-empty `deferredTriggers` failure does not mutate state, append events, increment state seq, replace an existing pending decision, or create a pending decision
  - unit test proving existing pending decisions are preserved rather than replaced on empty processing
  - "`corepack pnpm --filter @optcg/engine-core typecheck` must pass"
  - "`corepack pnpm run verify` must pass"
repo_rules:
  - fail closed on ambiguous runtime behavior
  - keep the processor behavior-preserving for current vanilla paths
  - keep engine-core deterministic and pure
  - do not introduce live Poneglyph access or a card-data package dependency into engine-core
ambiguity_policy: fail_and_escalate
