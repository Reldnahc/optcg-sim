spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-030
epic_id: KICK-001
title: Effect runtime boundaries
type: refactor
area: engine
primary_concern: verification
priority: medium
status: approved
summary: >
  Split oversized effect runtime implementation and test files into focused
  modules without changing engine behavior, public contracts, event output,
  state hashes, or supported effect semantics.
story_boundary: >
  This parent story is not directly implementable. It coordinates
  behavior-preserving refactor and test-organization child stories for
  effect-runtime files that exceed the repo size threshold.
allowed_touch_points:
  - stories/generated/ENG-030-effect-runtime-boundaries-parent.yaml
  - stories/generated/ENG-030A-*.yaml
  - stories/generated/ENG-030B-*.yaml
  - stories/generated/ENG-030C-*.yaml
  - stories/generated/ENG-030D-*.yaml
  - stories/generated/ENG-030E-*.yaml
  - stories/generated/ENG-030F-*.yaml
  - stories/generated/ENG-030G-*.yaml
spec_refs:
  - 03-game-state-events-decisions.s004
  - 03-game-state-events-decisions.s005
  - 03-game-state-events-decisions.s020
  - 04-effect-runtime.s006
  - 04-effect-runtime.s007
  - 04-effect-runtime.s008
  - 04-effect-runtime.s009
  - 04-effect-runtime.s010
  - 04-effect-runtime.s011
  - 04-effect-runtime.s012
  - 05-effect-dsl-reference.s003
  - 05-effect-dsl-reference.s004
  - 06-visibility-security.s006
  - 11-testing-quality.s007
  - 11-testing-quality.s008
  - 23-repo-tooling-and-enforcement.s006
  - 23-repo-tooling-and-enforcement.s008
  - 23-repo-tooling-and-enforcement.s016
scope:
  - split packages/engine-core/src/effect-runtime.test.ts by existing behavior areas without changing assertions or fixture meaning
  - extract cohesive helpers from packages/engine-core/src/effect-runtime.ts only when imports, exports, and behavior remain equivalent
  - preserve all currently supported effect runtime behavior, fail-closed behavior, event ordering, state hashes, and hidden-information guarantees
  - keep any public exports stable unless an exact child story and story-review approve a compatibility-preserving import update
  - reduce the largest runtime files toward focused files under the repo size threshold, or record story-review-approved exceptions
non_scope:
  - adding new effect primitives
  - changing effect DSL semantics
  - changing source-presence behavior
  - changing trigger timing, queue ordering, state hash, event schema, or visibility behavior
  - changing public contracts or package boundaries
  - server/client/UI/replay behavior
dependencies: []
child_stories:
  - id: ENG-030A
    title: Split runtime sentinel and draw primitive tests
    concern: Move pending-runtime sentinel and direct draw primitive tests into focused test files with no behavior change.
    depends_on: []
  - id: ENG-030B
    title: Split effect metadata lookup tests
    concern: Move implemented-DSL support and metadata validation tests into a focused test file with no behavior change.
    depends_on: [ENG-030A]
  - id: ENG-030C
    title: Split trigger queueing tests
    concern: Move On Play, attack timing, On K.O., and Life Trigger queueing tests into focused files without changing runtime semantics.
    depends_on: [ENG-030B]
  - id: ENG-030D
    title: Split queue processing tests
    concern: Move no-choice queue processing, ordering, trigger-order response, and hash stability tests into focused files.
    depends_on: [ENG-030C]
  - id: ENG-030E
    title: Extract primitive execution helpers
    concern: Move primitive execution helpers out of effect-runtime.ts while preserving exports, errors, events, and state mutation behavior.
    depends_on: [ENG-030D]
  - id: ENG-030F
    title: Extract trigger queueing helpers
    concern: Move trigger candidate and queueing helpers out of effect-runtime.ts without changing queue entries or lifecycle events.
    depends_on: [ENG-030E]
  - id: ENG-030G
    title: Extract queue processing helpers
    concern: Move queue processing and trigger-order continuation helpers out of effect-runtime.ts without changing deterministic ordering.
    depends_on: [ENG-030F]
acceptance_criteria:
  - every child story is explicitly behavior-preserving and includes no gameplay, DSL, event, hash, or visibility behavior change
  - moved tests continue to exercise the same scenarios with the same expected outcomes
  - extracted helpers preserve existing public imports or update internal imports only within the child story boundary
  - parent integration review confirms effect-runtime.ts and effect-runtime.test.ts are smaller or records a justified exception
required_tests:
  - run corepack pnpm run stories:validate
  - run corepack pnpm run packets:verify for each active child story
  - run focused engine-core effect runtime tests for each child story
  - run corepack pnpm run coverage
  - run corepack pnpm run verify before parent PR handoff
repo_rules:
  - do not approve, packetize, or activate ENG-030 itself as an implementation story
  - story-review must confirm the child split is behavior-preserving before any child is approved
  - child stories must be implemented one at a time on a parent integration branch
  - no child may add new rules behavior or weaken existing fail-closed behavior
  - line-count reduction is secondary to preserving behavior and reviewability
ambiguity_policy: fail_and_escalate
