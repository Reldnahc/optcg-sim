spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: CARD-020A
epic_id: CARD-020
title: Unsupported wrapper and component diagnostics
type: implementation
area: cards
primary_concern: verification
priority: high
status: approved
summary: >
  Improve cards-side support-probe and generated-support report diagnostics for
  unsupported composed-effect text by decomposing recognized wrapper,
  condition, action, and body candidates from exact unsupported components while
  preserving fail-closed generated support.
story_boundary: >
  Own only package-local diagnostics and diagnostic metadata for unsupported
  generated-support text. Do not certify new parser rules, add generated DSL
  admission, add runtime capability records, add engine behavior, edit real-card
  fixtures, change source or behavior hashes, or make any new card/effect shape
  playable.
allowed_touch_points:
  - packages/cards/src/support-probe.ts
  - packages/cards/src/support-probe.test.ts
  - packages/cards/src/generated-support-report.ts
  - packages/cards/src/generated-support-report.test.ts
  - packages/cards/src/generated-support-diagnostics.ts
  - packages/cards/src/generated-support-index.ts
  - packages/cards/src/generated-support-types.ts
  - packages/cards/src/*support*.test.ts
  - stories/generated/CARD-020*.yaml
  - stories/approved/CARD-020*.yaml
  - agent-packets/CARD-020A.md
  - agent-packets/active.json
