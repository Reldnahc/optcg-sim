spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-056B
epic_id: ENG-056
title: On K.O. reusable queued-body runtime
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Generalize [On K.O.] trigger candidate detection and queueing so existing
  supported onKO-compatible queued effect bodies can run from destination-zone
  or last-known-information source presence, instead of limiting On K.O. to
  draw-only support shapes.
story_boundary: >
  Own only engine-core On K.O. candidate detection, support-shape gating,
  queue-entry creation, and tests needed for existing supported queued effect
  bodies to run under `trigger: { type: "onKO" }`. Do not add new effect
  primitives, parser support, generated support metadata, real-card fixtures,
  or CARD package changes.
allowed_touch_points:
