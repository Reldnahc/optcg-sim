dependencies:
  - ENG-027D
  - ENG-055
scope:
  - replace the current draw-only On K.O. candidate support gate with a reusable onKO-compatible queued-body gate
  - support only bodies already executable by the current queue runtime when their source-presence policy is valid for K.O. destination-zone or last-known-information resolution
  - preserve battle K.O. `cardKOd` and matching `cardMoved` event validation before any trigger queueing
  - preserve deterministic queueEntryId, timingWindowId, generation, orderingGroup, createdAtEventSeq, queuedAtStateSeq, triggerEventId, sourceSnapshot, and causedBy metadata
  - preserve ordering with turn-player and non-turn-player trigger groups and existing chooseTriggerOrder behavior
  - preserve fail-closed behavior when multiple On K.O. effects, unsupported bodies, unsupported source policies, malformed K.O. event batches, missing definitions, untested metadata, or unreviewed metadata are encountered
  - prove On K.O. queued bodies that pause for existing supported decisions keep replay/event/state-hash behavior stable
non_scope:
  - adding parser support for `[On K.O.]`
  - generated-support runtime capability matrix or cards-package component evidence updates
  - real-card On K.O. fixture support or source hash updates
  - new effect body primitives
  - life [Trigger], On Play, When Attacking, On Opponent Attack, Main Event, or other trigger wrappers
  - replacement generalization beyond already-supported K.O. replacement interactions
  - changing battle K.O. rules, character overflow trash rules, or non-K.O. trash trigger behavior
  - server, client, API, UI, database, replay UI, WebSocket, Redis, or live Poneglyph work
acceptance_criteria:
  - existing supported On K.O. draw behavior remains unchanged
  - at least one existing supported queued body beyond draw-only can be detected, queued, and resolved or paused from On K.O. without adding a new primitive
  - On K.O. source presence remains truthful for `resolveFromDestinationZone` and `resolveFromLastKnownInformation`
  - K.O. battle events always precede On K.O. `effectQueued` and later resolution events
  - simultaneous and same-player On K.O. trigger ordering remains deterministic and uses the existing queue-order decision path where needed
  - unsupported On K.O. definitions do not partially queue, mutate, or emit runtime events
  - no CARD parser/generated-support behavior changes in this story
required_tests:
  - story-review for ENG-056B before approval handoff
  - regression for existing supported On K.O. draw detection, queueing, and resolution
  - detection/queue/resolution test for at least one existing supported queued body beyond draw-only that does not require new primitives
  - test for an existing supported queued body that pauses for a decision, proving queue metadata, event order, and state hash remain stable
  - fail-closed tests for unsupported cost, unsupported condition or condition timing, unsupported target/saved-reference/replacement shape, unsupported source-presence policy, malformed K.O. event batch, multiple On K.O. effects, untested metadata, and unreviewed metadata
  - ordering regression for simultaneous On K.O. effects, including same-player chooseTriggerOrder where applicable
  - battle pipeline regression proving K.O. events precede On K.O. queue/resolution events
  - run `corepack pnpm exec vitest run packages/engine-core/src/effect-runtime-trigger-queueing-ko.test.ts packages/engine-core/src/effect-runtime-ko-triggers.test.ts packages/engine-core/src/battle-damage-character-ko.test.ts packages/engine-core/src/battle-pipeline-ko-regression.test.ts packages/engine-core/src/effect-runtime-queue-processing-no-choice.test.ts packages/engine-core/src/effect-runtime-queue-processing-targets.test.ts`
  - run `corepack pnpm --filter @optcg/engine-core typecheck`
  - run `corepack pnpm run stories:validate`
repo_rules:
  - generate and activate the ENG-056B packet before implementation
  - stay within allowed_touch_points
  - do not import @optcg/cards
  - do not add parser/generated-support/card fixture work
  - fail closed if a queued body depends on source, target, replacement, or cleanup semantics that are not valid after K.O. movement
ambiguity_policy: fail_and_escalate
