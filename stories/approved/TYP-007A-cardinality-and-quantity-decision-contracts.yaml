spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: TYP-007A
epic_id: TYP-007
title: Cardinality and quantity decision contracts
type: implementation
area: contracts
primary_concern: contract
priority: high
status: approved
summary: >
  Add canonical contract and exported type support for exact-N and up-to-N
  cardinality, plus chooseQuantity decision/action/legal-action shapes needed by
  later composed effect runtime stories.
story_boundary: >
  Own only canonical contracts, package type sync, and contract tests for
  cardinality and chooseQuantity DTOs, plus the narrow existing PlayerView
  projection adaptation needed to preserve the declared public pendingDecision
  shape. Do not implement runtime decision creation, response validation,
  parser certification, card support, or UI behavior.
allowed_touch_points:
  - contracts/canonical-types.ts
  - contracts/types/decisions.ts
  - contracts/types/effects.ts
  - contracts/types/view.ts
  - packages/types/src/decisions.ts
  - packages/types/src/decisions.test.ts
  - packages/types/src/effects.ts
  - packages/types/src/effects.test.ts
  - packages/types/src/export-cohesion.test.ts
  - packages/types/src/export-ownership.manifest.ts
  - packages/types/src/view.ts
  - packages/types/src/view.test.ts
  - packages/types/src/index.ts
  - packages/engine-core/src/filter-state-for-player.ts
  - tests/contracts/**
  - tools/sync-package-types.ts
  - stories/generated/TYP-007*.yaml
  - stories/approved/TYP-007*.yaml
  - agent-packets/TYP-007A.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s009
  - 03-game-state-events-decisions.s015
  - 03-game-state-events-decisions.s016
  - 03-game-state-events-decisions.s017
  - 05-effect-dsl-reference.s008
  - 05-effect-dsl-reference.s012
  - 11-testing-quality.s013
  - 22-v6-implementation-tightening.s006
scope:
  - define canonical exact-N and up-to-N cardinality contract shapes for reusable selection and quantity use
  - 'define exact-N representation as `mode: "exact"`, `min: N`, and `max: N`; literal-specialized exact contracts such as `ExactCardinality<N>` must reject mismatched min/max values'
  - document that unbounded structural `number` DTOs cannot prove min/max equality at the TypeScript type layer; general malformed exact-range rejection remains a runtime/schema validation responsibility for later ENG/schema stories
  - define canonical chooseQuantity pending decision, response, action, and legal-action DTO shapes
  - define public PlayerView pendingDecision exposure for chooseQuantity using only safe public fields such as decision identity, prompt text, min, max, and mode
  - adapt the existing PlayerView pendingDecision projection so chooseQuantity bounds and mode are not erased if an active chooseQuantity decision is projected
  - keep PlayerView legal actions for chooseQuantity decision-id-only unless an existing canonical public-action pattern requires otherwise
  - add exported package type coverage synchronized from canonical contracts
  - add contract/type tests for valid and invalid chooseQuantity/cardinality shapes
non_scope:
  - engine decision creation, response validation, legal-action projection, stale-decision handling, or quantity runtime behavior beyond the narrow PlayerView projection shape adaptation
  - card parser rules or generated-support certification
  - replacement generalization
  - server, client, API, UI, replay, database, or gameplay behavior
dependencies: []
acceptance_criteria:
  - canonical and package-exported types include exact-N and up-to-N cardinality support
  - 'literal-specialized exact-N contracts reject `mode: "exact"` shapes where `min` and `max` differ'
  - unbounded general structural DTOs do not introduce an uncited finite numeric cap or required runtime-only brand to force min/max equality
  - canonical and package-exported types include chooseQuantity decision, action, response, and legal-action support
  - public pendingDecision DTOs expose chooseQuantity bounds and mode without hidden candidate counts or hidden card identities
  - public legal-action DTOs for chooseQuantity remain decision-id-only unless an existing canonical public-action pattern requires otherwise
  - contract tests prove intended valid shapes compile/validate and malformed shapes fail
  - no runtime or parser support is added
required_tests:
  - focused contract/type tests for cardinality and chooseQuantity DTOs
  - focused view/public pendingDecision and legal-action type tests for chooseQuantity exposure
  - focused export ownership/cohesion tests if new package exports are added
  - run `corepack pnpm run types:sync:check`
  - run `corepack pnpm --filter @optcg/types test`
  - run `corepack pnpm run test:contracts`
  - run `corepack pnpm run stories:validate`
repo_rules:
  - keep canonical contracts as the source of truth
  - do not use package-only type definitions as authority
  - fail closed on public decision contract ambiguity
ambiguity_policy: fail_and_escalate
