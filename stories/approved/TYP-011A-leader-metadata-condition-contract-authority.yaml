spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: TYP-011A
epic_id: TYP-011
title: Leader metadata condition contract authority
type: implementation
area: contracts
primary_concern: contract
priority: high
status: approved
summary: >
  Add the missing shared DSL/schema/type authority for public Leader color-count
  conditions and document that Leader type and Leader attribute checks should use
  existing public Leader-zone CardFilter predicates where sufficient.
story_boundary: >
  Own only shared contract/spec/schema/type authority for public Leader metadata
  condition representation. Do not implement engine condition evaluation, card
  parser support, generated support admission, support diagnostics, or real-card
  fixture support.
allowed_touch_points:
  - specs/04-effect-runtime.md
  - specs/05-effect-dsl-reference.md
  - specs/09-card-data-and-support-policy.md
  - specs/section-index.json
