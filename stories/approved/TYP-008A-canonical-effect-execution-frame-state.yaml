spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: TYP-008A
epic_id: TYP-008
title: Canonical effect execution frame state
type: implementation
area: contracts
primary_concern: contract
priority: high
status: approved
summary: >
  Add canonical serialized GameState authority for resumable effect execution
  frames so ENG-055B can pause and resume composed sequences without
  process-local state.
story_boundary: >
  Own only the contract/spec/test authority for serialized effect execution
  frames. Do not implement generic sequence execution, pause/resume behavior,
  optionality, costs, playSelected, drawUpTo, saved-reference consumers, or
  card support.
