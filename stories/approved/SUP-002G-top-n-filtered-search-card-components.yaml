title: Top-N search card components
type: implementation
area: cards
primary_concern: rules
priority: high
status: approved
summary: >
  Parse and promote reusable cards-layer support for top-N deck searches with
  composed color/type/name-exclusion filters or unfiltered any-card selection,
  add-to-hand selection, reveal semantics, and bottom-of-deck remainder
  placement.
story_boundary: >
  Cards-layer story only. Contract/schema prerequisites must already be
  implemented by SUP-002I and runtime prerequisites must already be implemented
  by SUP-002D. Do not add new engine runtime behavior, shared contract/schema
  changes, real-card fixture promotion, source hashes, behavior hashes, overlays,
  or card-specific branches.
