spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-027
epic_id: KICK-001
title: Post-merge story lifecycle automation
type: tooling
area: infra
primary_concern: tooling
priority: high
status: approved
summary: >
  Replace routine manual post-merge packet completion with a safe post-merge
  workflow series that first adds specification authority, then binds cleanup
  metadata to reviewed PR evidence, then isolates validation, direct cleanup
  pushing, and merged-branch deletion into separately reviewable stories.
story_boundary: >
  This parent story coordinates workflow/tooling behavior for post-merge story
  lifecycle automation only. It does not own gameplay, engine behavior, GitHub
  board sync, issue/project automation, broad branch-protection redesign, or
  cleanup PR creation.
allowed_touch_points:
  - stories/generated/INF-027*.yaml
  - stories/approved/INF-027*.yaml
spec_refs:
  - 23-repo-tooling-and-enforcement.s016
  - 23-repo-tooling-and-enforcement.s023
  - 26-agent-packet-template.s005
  - 27-spec-driven-story-generation-workflow.s015
  - 27-spec-driven-story-generation-workflow.s017
  - 32-codex-agent-integration.s008
  - 32-codex-agent-integration.s010
  - 32-codex-agent-integration.s013
scope:
  - rely on landed SPEC-004 authority for the narrow post-merge packet-cleanup bypass and metadata trust boundary
  - document cleanup metadata, direct-cleanup-commit semantics, no-cleanup-PR policy, and operational manual fallback
  - add cleanup metadata parsing and dry-run validation for single-story and parent cleanup
  - bind cleanup metadata to reviewed PR evidence and trusted checked-in story/packet state rather than treating PR text as authority by itself
  - add a non-privileged post-merge workflow preflight that runs from trusted main code and proves metadata/eligibility before any write token is used
  - add the privileged direct cleanup push only after spec authority, metadata binding, and preflight validation exist
  - add safe merged story/substory branch deletion after successful packet cleanup
  - add integration tests and documentation closeout proving ordinary branch protection remains intact
non_scope:
  - gameplay rules
  - engine behavior
  - effect runtime behavior
  - GitHub board sync
  - issue/project automation
  - broad branch-protection redesign
  - cleanup PR creation
  - deleting unmerged branches
  - deleting protected branches
  - cleanup of arbitrary old branches
  - changing `packets:complete` or `packets:complete-many` semantics except through focused helpers needed by a child story
  - allowing arbitrary bot pushes to main
  - allowing arbitrary GitHub Actions workflows to bypass branch protection
dependencies:
  - SPEC-004
  - INF-014
  - INF-025G
child_stories:
  - id: INF-027A
    title: Document post-merge cleanup policy
    concern: Update workflow docs and PR template to use the SPEC-004 policy without adding GitHub Actions or implementation tooling.
    depends_on: []
  - id: INF-027B
    title: Add cleanup metadata parser and eligibility validator
    concern: Add dry-run tooling that parses cleanup metadata and validates story paths, story IDs, packet evidence, and completion eligibility without calling GitHub or editing files.
    depends_on: [INF-027A]
  - id: INF-027C
    title: Bind cleanup metadata to reviewed PR evidence
    concern: Extend validation so cleanup metadata is only an input request and must be bound to reviewed PR evidence, merge state, story/packet state on trusted main, and parent/substory inclusion evidence.
    depends_on: [INF-027B]
  - id: INF-027D
    title: Add non-privileged post-merge cleanup preflight workflow
    concern: Add workflow wiring that runs after PR merge, checks out trusted main, reads metadata, runs validation/preflight, and reports failures without any branch-protection bypass token or direct push.
    depends_on: [INF-027C]
  - id: INF-027E
    title: Add privileged direct packet cleanup push
    concern: Add the isolated workflow step/tooling that uses the dedicated cleanup actor to run packet completion, verify exact output, run repo verification, and push one deterministic cleanup commit to main.
    depends_on: [INF-027D]
  - id: INF-027F
    title: Add safe merged branch cleanup
    concern: Add safe merged branch deletion after successful packet cleanup, with dry-run/logging and protected/unmerged/unrelated branch guards.
    depends_on: [INF-027E]
  - id: INF-027G
    title: Close cleanup automation docs and tests
    concern: Add final integration tests and documentation consistency checks proving no automation-created cleanup PRs, narrow bypass, metadata binding, and ordinary branch protection.
    depends_on: [INF-027F]
  - id: INF-027H
    title: Bind parent cleanup evidence and reviewed metadata source
    concern: Add durable handoff-comment metadata support, source-ref audit computation, and parent lifecycle evidence required by parent cleanup validation.
    depends_on: [INF-027G]
  - id: INF-027I
    title: Treat human merge as cleanup metadata approval
    concern: Remove the manual source-ref paste requirement while preserving internal metadata hashing, human-controlled merge authority, parent lifecycle evidence, and fail-closed packet cleanup validation.
    depends_on: [INF-027H]
acceptance_criteria:
  - SPEC-004 is done and provides enough spec authority for the narrow cleanup bypass before INF-027A is approved
  - cleanup metadata is treated as a cleanup request and never as sufficient authority by itself
  - validation binds requested stories to trusted checked-in approved story files, packet evidence, merge state, and reviewed PR evidence
  - the non-privileged workflow preflight can fail closed before any write-capable cleanup token is used
  - privileged direct cleanup push is isolated to the dedicated cleanup actor/workflow and only pushes exact packet-completion output after verification
  - single-story cleanup runs `packets:complete`; parent cleanup runs `packets:complete-many`
  - cleanup automation never opens automation-created cleanup PRs
  - merged branch deletion runs only after successful packet lifecycle cleanup and never deletes protected, unmerged, or unrelated branches
  - branch-protection documentation keeps ordinary PR protections and restricts bypass to the cleanup workflow actor
required_tests:
  - story-review for the revised parent decomposition and every child story
  - spec authority tests for the cleanup bypass and metadata trust boundary
  - docs/workflow and PR-template tests for cleanup metadata and no-cleanup-PR policy
  - parser/validator tests for single and parent cleanup metadata, malformed input, path guards, story ID guards, packet evidence, and eligibility
  - PR evidence binding tests for stale metadata, unrelated story paths, missing parent/substory evidence, and metadata that does not match the merged PR
  - workflow preflight tests for trigger, permissions, trusted checkout, fail-closed validation, and no write token usage
  - privileged cleanup tests for exact diff validation, verification-before-push, deterministic commit message, and no cleanup PR creation
  - branch cleanup tests for protected branch rejection, unrelated branch rejection, cleanup-failure skip, branch deletion failure reporting, and successful post-cleanup deletion requests
  - closeout tests proving docs, PR template, workflow, and branch-protection guidance agree on no automation-created cleanup PRs and normal PR fallback for manual edits beyond pure packet-completion output
  - full `corepack pnpm run verify` on every child PR and parent PR
repo_rules:
  - do not implement INF-027 directly; implement approved child stories one at a time on a parent integration branch
  - run set-level story-review before approving the decomposed group
  - run per-story story-review before approving each child
  - if story-review finds landed SPEC-004 authority insufficient, stop and create a new spec-authority story instead of implementing workflow code
  - if story-review finds the branch-protection bypass too risky even after SPEC-004, stop and report the blocker instead of falling back to cleanup PRs
  - if closeout finds missing behavior outside the current child boundary, stop and split instead of absorbing it
  - parent integration branch cleanup remains deferred until the parent PR lands on main
ambiguity_policy: fail_and_escalate
