spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: CARD-013B
epic_id: CARD-013
title: "Certify Rush, Rush: Character, Double Attack, and Banish generated support"
type: implementation
area: cards
primary_concern: verification
priority: high
status: approved
summary: >
  Add generated-support parser, runtime-capability, evaluator, support-probe,
  and verification coverage for the remaining printed combat keyword bodies
  that are already executed by the engine: `[Rush]`, `[Rush: Character]`,
  `[Double Attack]`, and `[Banish]`. Use only CARD-013A fixture evidence for
  real-card proof. Any text in those cards that is not one of the targeted
  already-implemented keywords must stay unsupported.
story_boundary: >
  Own only @optcg/cards certified parser rules, normalized printed keyword
  extraction, generated-support capability evidence, support evaluator/probe
  output, and cards-package tests needed to certify exact engine-supported
  printed keyword bodies. Do not change engine-core battle behavior, generated
  effect runtime semantics, replay, DTOs, protocols, hidden-info filtering,
  server loading, or broad card fixture corpus behavior.
allowed_touch_points:
  - packages/cards/src/certified-card-text-parser.ts
  - packages/cards/src/certified-card-text-parser.test.ts
  - packages/cards/src/generated-support-index.ts
  - packages/cards/src/generated-support-index.test.ts
  - packages/cards/src/generated-support-report.test.ts
