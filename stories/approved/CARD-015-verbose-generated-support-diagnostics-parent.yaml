spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: CARD-015
epic_id: CARD-015
title: Verbose generated-support diagnostics parent
type: implementation
area: cards
primary_concern: verification
priority: high
status: approved
summary: >
  Coordinate a small diagnostics-only CARD story set that improves
  cards-side generated-support probe and report output for unsupported text
  without broadening parser, schema, runtime, fixture, or playable support.
story_boundary: >
  Parent planning story only. Do not implement this parent directly. Implement
  exactly one child story, CARD-015A, after story-review approval and packet
  activation. Keep this set as cards-side diagnostics over existing
  generated-support data, blockers, parser residue, schema validation,
  runtime capability evidence, source integrity, and support metadata.
allowed_touch_points:
  - stories/generated/CARD-015*.yaml
  - stories/approved/CARD-015*.yaml
  - agent-packets/CARD-015*.md
  - agent-packets/active.json
spec_refs:
  - 01-system-architecture.s023
  - 04-effect-runtime.s005
  - 09-card-data-and-support-policy.s010
  - 09-card-data-and-support-policy.s011
  - 09-card-data-and-support-policy.s012
  - 09-card-data-and-support-policy.s013
  - 09-card-data-and-support-policy.s014
  - 09-card-data-and-support-policy.s015
  - 09-card-data-and-support-policy.s016
  - 09-card-data-and-support-policy.s022
  - 09-card-data-and-support-policy.s024
  - 11-testing-quality.s020
dependencies:
  - CARD-008
  - CARD-009
  - CARD-011
  - CARD-012
  - CARD-013
  - CARD-014
child_stories:
  - id: CARD-015A
    title: Support probe source-span and layer diagnostics
    concern: Improve read-only generated-support probe/report diagnostics with deepest successful layer, exact missing layer, narrow source spans, and diagnostic-only parser-failure decomposition while preserving fail-closed support semantics.
    depends_on: [CARD-014]
scope:
  - coordinate CARD-015A as the only child story in this diagnostics set
  - keep the story set diagnostics-only and above existing parser/generated-support/runtime-capability behavior
  - build only on CARD-014I diagnostics by adding deeper layer presentation, narrower source-span detail, and diagnostic-only decomposition of parser failures into recognized candidate pieces and unsupported blocking text; keep CARD-014I's broad missing-layer taxonomy as regression coverage rather than re-owning it
  - improve debuggability of unsupported generated-support text without changing support status
  - require stale source-hash diagnostics to remain highest-priority and non-mutating
  - preserve CARD-008, CARD-009, CARD-012, CARD-013, and CARD-014 support behavior unless the child adds compatibility tests for diagnostic formatting only
non_scope:
  - direct implementation from this parent story
  - new parser certification
  - new runtime behavior
  - new generated playable support
  - real-card fixture support
  - shared contracts or effect DSL schema changes unless story-review proves a real shared authority gap
  - server, client, API, UI, database, replay, WebSocket, Redis, or live Poneglyph work
card_source_integrity:
  - not applicable for direct parent implementation because this parent is planning-only and does not enable or change gameplay support for any card
  - stale hash remains a diagnostic blocker and must not silently refresh, rewrite, recapture, or rebaseline fixture evidence
engine_capability_preflight:
  - not applicable for direct parent implementation because this parent adds no parser grammar, generated DSL, runtime capability, support status, or gameplay behavior
  - child diagnostics may report missing runtime capability evidence but must not add or imply new runtime capability support
acceptance_criteria:
  - CARD-015 is not implemented directly
  - CARD-015A is independently reviewable and can be activated as the only child story
  - the parent and child each have distinct story-review assignment identity and durable story-review artifact identity before approval handoff or activation
  - CARD-015A is implemented on a parent integration branch for this one-child set, with no child PR to `main` and one final parent PR to `main`
  - probe/report diagnostics become more actionable without broadening generated-support, parser, schema, runtime, fixture, or playable support
  - parser failures that contain recognizable supported-action candidates inside unsupported conditions or wrappers report the candidate pieces and unsupported blockers separately while staying unsupported
  - unsupported text remains unsupported
  - stale hash remains highest-priority and non-mutating
  - parent/substory cleanup metadata lists CARD-015A and binds the non-packetized CARD-015 parent closeout after merge to main
required_tests:
  - set-level story-review planning for CARD-015 parent and CARD-015A child before approval handoff
  - per-story story-review for CARD-015 before approval handoff
  - per-story story-review for CARD-015A before approval handoff
  - story-specific tests from CARD-015A
  - full `corepack pnpm verify` on the CARD-015A child commit and on the final parent PR
  - run `corepack pnpm run stories:validate`
  - run `corepack pnpm --filter @optcg/cards test`
repo_rules:
  - do not activate or implement CARD-015 directly
  - use the parent integration branch workflow even though this set has exactly one child
  - do not open a CARD-015A child PR to `main`; land the reviewed child commit on the parent integration branch, then open one final parent PR to `main`
  - implement only CARD-015A for this set
  - keep one active child packet at a time
  - do not complete the child packet until the parent branch lands on main
  - use parent PR cleanup metadata for CARD-015A and bound CARD-015 parent closeout
  - fail closed on diagnostic ambiguity that could accidentally mark unsupported text playable
ambiguity_policy: fail_and_escalate
