id: ENG-055J
epic_id: ENG-055
title: "Duration, modifier, and restriction runtime"
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Implement temporary power modifier and TYP-007E-authorized restriction runtime
  behavior through the engine computed-view/modifier model.
story_boundary: >
  Own only runtime behavior for temporary power modifiers and TYP-007E-authorized
  restrictions such as cannotAttack/cannotBlock plus expiry tests. Do not
  implement parser/card support.
