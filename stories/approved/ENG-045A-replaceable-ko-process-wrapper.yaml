spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-045A
epic_id: KICK-001
title: Wrap selected-target KO as a replaceable process
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Introduce the first narrow replaceable process boundary around selected public
  Character KO while preserving current no-replacement behavior.
story_boundary: >
  Own only process construction and no-replacement passthrough for the existing
  synthetic selected-target KO primitive. Do not detect or apply replacement
  metadata yet except for support-gate fail-closed scaffolding required by this
  seam.
allowed_touch_points:
  - packages/engine-core/src/effect-runtime-primitives.ts
  - packages/engine-core/src/effect-runtime-target-primitives.test.ts
  - packages/types/src/runtime.ts
  - packages/types/src/runtime.test.ts
  - stories/generated/ENG-045A-replaceable-ko-process-wrapper.yaml
  - stories/approved/ENG-045A-replaceable-ko-process-wrapper.yaml
  - agent-packets/ENG-045A.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s007
  - 04-effect-runtime.s013
  - 05-effect-dsl-reference.s016
  - 11-testing-quality.s004
  - 22-v6-implementation-tightening.s011
scope:
  - build a deterministic `ReplacementProcess` for each selected public Character KO target
  - include process id, type `ko`, target, causedBy, payload, and `usedReplacementIds`
  - route no-replacement execution through the wrapper while preserving current KO events, state hash, and failure behavior
  - keep existing invalid KO target failures unchanged and nonmutating
non_scope:
  - detecting replacement effect metadata
  - creating `chooseReplacement`
  - applying replacement effects
  - multiple process kinds
  - PlayerView changes
  - real-card fixtures or card-data integration
dependencies:
  - ENG-044
acceptance_criteria:
  - selected public Character KO still moves targets to trash when no replacement applies
  - emitted KO and move events remain in deterministic order for no-replacement execution
  - state hash coverage proves no-replacement output is unchanged
  - invalid selected-target KO failures remain fail-closed without state mutation
required_tests:
  - run `corepack pnpm exec vitest run packages/types/src/runtime.test.ts packages/engine-core/src/effect-runtime-target-primitives.test.ts`
  - run `corepack pnpm --filter @optcg/engine-core typecheck`
  - run `corepack pnpm run packets:verify`
  - run `corepack pnpm run verify`
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-045A packet while implementing this story
  - stay within allowed_touch_points
  - target the ENG-045 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
ambiguity_policy: fail_and_escalate
