summary: >
  Coordinate specification and workflow documentation updates that authorize
  layered composed-effect delivery before separate contracts, engine, and cards
  implementation parent series are approved.
story_boundary: >
  Parent planning story only. Do not implement this parent directly. Implement
  the approved SPEC-008 child stories one at a time. Keep this series limited to
  specification/workflow documentation, generated spec metadata, and narrow
  authority tests for spec wording.
