spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-048
epic_id: KICK-001
title: Verify unsupported non-vanilla rejection closeout
type: implementation
area: engine
primary_concern: verification
priority: high
status: approved
summary: >
  Audit and close any remaining gaps where unsupported non-vanilla cards could
  enter public-mode validation or behave as accidental vanilla cards through
  manifest, legal-action, effect-runtime, Main Event, Counter Event, trigger,
  target, or cards-produced manifest paths.
story_boundary: >
  Own only closeout verification and minimal fail-closed fixes for unsupported
  non-vanilla rejection. Add regression tests where the audit finds gaps.
  Do not add card implementations, new primitives, broad fixture capture, or
  server/client/API/UI behavior.
allowed_touch_points:
  - packages/cards/src/**/*.ts
  - packages/engine-core/src/**/*.ts
  - tests/integration/**/*.mjs
  - tests/hidden-info/**/*.mjs
  - stories/generated/ENG-048-unsupported-nonvanilla-rejection-closeout.yaml
  - stories/approved/ENG-048-unsupported-nonvanilla-rejection-closeout.yaml
  - agent-packets/ENG-048.md
  - agent-packets/active.json
spec_refs:
  - 00-project-overview.s002
  - 04-effect-runtime.s005
  - 09-card-data-and-support-policy.s002
  - 09-card-data-and-support-policy.s010
  - 09-card-data-and-support-policy.s011
  - 09-card-data-and-support-policy.s012
  - 09-card-data-and-support-policy.s013
  - 09-card-data-and-support-policy.s022
  - 11-testing-quality.s016
  - 11-testing-quality.s020
  - 18-acceptance-tests.s004
  - 18-acceptance-tests.s007
scope:
  - audit existing unsupported non-vanilla rejection coverage across deck validation, loadout validation, manifest loading, legal actions, effect runtime, Main Event, Counter Event, trigger, target, and cards-produced manifest paths
  - verify unsupported non-vanilla cards are rejected during public-mode deck and loadout validation
  - verify unsupported cards do not create legal actions through gameplay paths
  - verify unsupported cards fail closed through queued effect runtime, Main Event, Counter Event, trigger, and target paths without state mutation or accidental vanilla behavior
  - verify cards-produced manifests preserve unsupported status for unsupported non-vanilla cards
  - add focused synthetic/unit/regression tests only where the audit finds missing closeout coverage
  - produce a concise implementation/review note in the PR trail identifying audited paths, found gaps, and fixes
non_scope:
  - new effect primitives
  - new card implementations
  - new real-card fixture capture
  - server/client/API/UI work
  - live Poneglyph access
  - broad catalog support
  - changing support statuses except explicit test fixture metadata
dependencies: []
acceptance_criteria:
  - public-mode deck validation rejects unsupported non-vanilla cards
  - public-mode loadout validation rejects unsupported non-vanilla cards
  - unsupported non-vanilla cards do not create legal actions for play, battle, Main Event, Counter Event, trigger, target, or effect-runtime paths
  - unsupported queued effects, Main Event effects, Counter Event effects, trigger effects, and target effects fail closed without mutation or accidental vanilla behavior
  - cards-produced manifest coverage proves unsupported non-vanilla cards remain unsupported rather than implemented or vanilla-confirmed
  - existing synthetic fail-closed tests are preserved and any coverage gaps are closed with focused regressions
  - PR implementation note records the audit result and any material gaps closed
required_tests:
  - focused deck/loadout validation tests for unsupported non-vanilla rejection
  - focused engine-core legal-action and effect-runtime fail-closed tests for unsupported non-vanilla gameplay paths
  - focused cards-produced manifest regression if existing fixtures expose the path without new capture
  - run `corepack pnpm run packets:verify`
  - run `corepack pnpm run verify`
repo_rules:
  - story-review must pass before implementing
  - generate and activate only the ENG-048 packet while implementing this story
  - stay within allowed_touch_points
  - keep real-card fixture capture out of scope
  - if an unsupported card currently slips through as vanilla, fix that as the material implementation change
ambiguity_policy: fail_and_escalate
