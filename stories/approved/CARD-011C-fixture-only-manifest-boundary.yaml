story_schema_version: 1.0.0
id: CARD-011C
epic_id: CARD-011
title: Fixture-only real-card manifest boundary
type: implementation
area: cards
primary_concern: verification
priority: high
status: approved
summary: >
  Preserve checked-in real-card DSL manifests for deterministic implementation
  and integration tests, while making explicit that they are fixture evidence
  only and never runtime preload, per-card admission, or generated-support
  playability authority.
story_boundary: >
  Own only fixture-manifest boundary guardrails for real-card DSL manifests.
  Keep the fixture manifests available for implementation tests. Do not delete
  fixture-only manifests, remove engine MatchCardManifest snapshots, change
  evaluator/probe semantics, add parser/runtime behavior, or import @optcg/cards
  into engine-core production code.
