spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-033
epic_id: KICK-001
title: PlayerView real-state boundaries
type: refactor
area: engine
primary_concern: visibility
priority: medium
status: approved
summary: >
  Split oversized real-state PlayerView hidden-information tests into focused
  visibility suites without changing PlayerView filtering, legal-action
  projection, hidden-information policy, or real engine behavior.
story_boundary: >
  This parent story is not directly implementable. It coordinates
  behavior-preserving test-organization child stories for real-state PlayerView
  tests that exceed the repo size threshold.
allowed_touch_points:
  - stories/generated/ENG-033-player-view-real-state-boundaries-parent.yaml
  - stories/generated/ENG-033A-*.yaml
  - stories/generated/ENG-033B-*.yaml
  - stories/generated/ENG-033C-*.yaml
  - stories/generated/ENG-033D-*.yaml
spec_refs:
  - 06-visibility-security.s003
  - 06-visibility-security.s004
  - 06-visibility-security.s005
  - 06-visibility-security.s007
  - 03-game-state-events-decisions.s015
  - 03-game-state-events-decisions.s018
  - 11-testing-quality.s008
  - 18-acceptance-tests.s004
scope:
  - split filter-state-for-player.real-states.test.ts by existing real-state visibility scenario groups
  - preserve all current hidden-information assertions and public-zone assertions
  - keep helper extraction local to tests unless an exact child story and story-review approve moving shared test helpers
  - preserve PlayerView output and legal-action projection behavior exactly
non_scope:
  - changing filterStateForPlayer production behavior
  - changing PlayerView, PublicDecision, or PublicLegalAction contracts
  - changing hidden-information policy
  - adding new real-state scenarios beyond direct coverage preservation
  - server/client/UI/replay behavior
dependencies: []
child_stories:
  - id: ENG-033A
    title: Split baseline real-state visibility tests
    concern: Move setup, mulligan, main phase, card play, completed match, face-up Life, and public-zone assertions into focused files.
    depends_on: []
  - id: ENG-033B
    title: Split battle real-state visibility tests
    concern: Move vanilla battle, Blocker, damage, and non-trigger battle visibility assertions into focused files.
    depends_on: [ENG-033A]
  - id: ENG-033C
    title: Split trigger real-state visibility tests
    concern: Move Life Trigger, no-zone, On K.O., revealed-card, and adjacent hidden-state assertions into focused files.
    depends_on: [ENG-033B]
  - id: ENG-033D
    title: Split target-selection real-state visibility tests
    concern: Move selectTargets real-state visibility and legal-action assertions into focused files.
    depends_on: [ENG-033C]
acceptance_criteria:
  - every child story is explicitly behavior-preserving and includes no PlayerView or filtering behavior change
  - moved tests continue to exercise the same hidden-information guarantees with the same expected outcomes
  - parent integration review confirms filter-state-for-player.real-states.test.ts is smaller or records a justified exception
required_tests:
  - run corepack pnpm run stories:validate
  - run corepack pnpm run packets:verify for each active child story
  - run focused filter-state-for-player real-state tests for each child story
  - run corepack pnpm run test:hidden-info
  - run corepack pnpm run coverage
  - run corepack pnpm run verify before parent PR handoff
repo_rules:
  - do not approve, packetize, or activate ENG-033 itself as an implementation story
  - story-review must confirm the child split is behavior-preserving before any child is approved
  - child stories must be implemented one at a time on a parent integration branch
  - no child may change production view/filtering behavior
  - line-count reduction is secondary to preserving hidden-information guarantees
ambiguity_policy: fail_and_escalate
