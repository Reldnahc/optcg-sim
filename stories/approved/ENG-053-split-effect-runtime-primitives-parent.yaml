spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-053
epic_id: ENG-030
title: Split effect runtime primitive responsibilities parent
type: refactor
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Coordinate the behavior-preserving split of the mixed effect runtime primitive
  module into cohesive draw, selected-target K.O., and K.O. replacement-process
  runtime modules before additional work lands in those areas.
story_boundary: >
  This parent is not directly implementable. It coordinates the single child
  story that extracts cohesive runtime primitive modules while preserving
  existing behavior, public/internal exports, event order, hidden-information
  behavior, DTOs, replay behavior, protocol behavior, and gameplay semantics.
allowed_touch_points:
  - stories/generated/ENG-053*.yaml
  - stories/approved/ENG-053*.yaml
spec_refs:
  - 01-system-architecture.s005
  - 03-game-state-events-decisions.s005
  - 03-game-state-events-decisions.s007
  - 03-game-state-events-decisions.s020
  - 11-testing-quality.s004
  - 23-repo-tooling-and-enforcement.s005
  - 23-repo-tooling-and-enforcement.s006
  - 23-repo-tooling-and-enforcement.s016
scope:
  - coordinate one executable engine refactor child story
  - require a behavior-preserving split of `packages/engine-core/src/effect-runtime-primitives.ts`
  - preserve all existing runtime semantics and compatibility exports unless the child story explicitly updates imports inside its allowed touch points
non_scope:
  - direct implementation from this parent story
  - packetizing or activating this parent story as an active implementation story
  - adding new effect primitive support or gameplay behavior
  - changing replacement priority, replacement chaining, event payloads, event visibility, state hashing, DTOs, replay behavior, protocol behavior, card data, CLI behavior, server behavior, client behavior, or hidden-information behavior
dependencies:
  - ENG-030
child_stories:
  - id: ENG-053A
    title: Split effect-runtime primitives by draw, target K.O., and replacement responsibilities
    concern: Extract cohesive draw primitive, selected-target K.O. primitive, and selected-target K.O. replacement-process modules while keeping behavior unchanged.
    depends_on: []
acceptance_criteria:
  - ENG-053A is the only executable child for this parent
  - draw, selected-target K.O., and K.O. replacement-process code no longer live in one mixed-responsibility primitive file
  - event order, event payloads, event visibility, state hashes, errors, decisions, and mutation behavior are unchanged
  - existing consumers continue to compile
  - verification evidence is recorded on the child PR
required_tests:
  - story-review for the ENG-053 parent story set using `corepack pnpm run stories:review-plan -- --parent stories/generated/ENG-053-split-effect-runtime-primitives-parent.yaml`
  - story-specific tests from ENG-053A
  - full `corepack pnpm run verify` on the child PR if feasible
repo_rules:
  - do not implement ENG-053 directly
  - use the parent/substory workflow even though this parent has one child
  - keep one active child packet at a time
  - keep the split mechanical and behavior-preserving
ambiguity_policy: fail_and_escalate
