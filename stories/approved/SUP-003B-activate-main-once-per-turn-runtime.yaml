title: Activate Main once-per-turn runtime
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Execute reusable implemented-dsl Activate Main effect blocks during the main
  phase, including legal action exposure, source validation, effect queueing,
  and once-per-turn commitment semantics.
story_boundary: >
  Engine runtime story only. Do not add card parser/generated-support behavior,
  real-card fixture evidence, support manifests, source hashes, behavior hashes,
  or contract/schema changes.
