dependencies: []
scope:
  - expose legal `activateEffect` actions for the turn player during main phase when a source card has a supported implemented-dsl effect block with category `activate` and trigger `activateMain`
  - support source cards in leader, character, or stage zones when the source zone and category are otherwise legal and visible to the controller
  - validate submitted `activateEffect` actions against current source, effect id, controller, phase, match status, battle status, pending decisions, pending runtime work, and source support status
  - queue and resolve the selected Activate Main effect block through existing runtime paths rather than card-specific branches
  - allow the existing queue result resolver to recognize the scoped Activate Main no-choice draw runtime shape without adding cards-layer support or exact printed-text branches
  - enforce `[Once Per Turn]` using existing once-per-turn key semantics without consuming use for illegal actions, stale actions, unmet activation conditions, declined optional activation, or failed activation-time costs
  - preserve existing playCard, declareAttack, attachDon, blocker, counter, trigger, and optional activation behavior
  - produce engine test evidence for Activate Main timing that later cards-layer runtime capability records can cite; do not edit the cards runtime capability matrix in this engine story
non_scope:
  - shared contract/schema changes
  - card parser, generated-support, runtime capability matrix edits in cards package, support reports, fixtures, overlays, card IDs, source hashes, or behavior hashes
  - Event main/counter activation, non-main timing windows, broad custom handlers, or unsupported activation costs
  - optional choose-one cost payment runtime; SUP-003C owns that
  - start-of-game setup effects; SUP-003D owns that
  - server, client, UI, database, API, or live card-data work
acceptance_criteria:
  - "`getLegalActions` exposes Activate Main legal actions only for the effect controller during legal main-phase windows"
  - "`applyAction` accepts a valid Activate Main action and routes execution through reusable effect runtime without checking printed text or card IDs"
  - unsupported effect blocks remain omitted from legal actions and fail closed if forged
  - once-per-turn use is consumed only on legal commitment according to `04-effect-runtime.s011`
  - repeating a once-per-turn Activate Main effect in the same turn is illegal, while a later turn can expose it again
  - legal actions and PlayerView filtering do not leak hidden state or unsupported runtime work
  - malformed, stale, wrong-player, wrong-source, wrong-effect, wrong-phase, and pending-work actions fail closed without mutation
  - no engine code imports `@optcg/cards` or checks real card IDs or exact printed text
  - queue result changes are limited to recognizing scoped Activate Main runtime shapes already validated by `effect-runtime-activation-main.ts`
required_tests:
  - engine test exposing Activate Main legal action for a supported leader effect during main phase
  - engine tests exposing and applying Activate Main effects from leader, character, and stage sources
  - engine test applying Activate Main draw effect through generic runtime
  - engine tests suppressing legal Activate Main exposure and rejecting forged submitted `activateEffect` actions without mutation outside main phase, during battle, during pending decision, and during pending runtime work
  - engine test rejecting submitted `activateEffect` actions without mutation when the match status is not active
  - engine test rejecting forged source/effect/player/action combinations without mutation
  - once-per-turn test proving legal commitment consumes use and same-turn repeat is rejected
  - once-per-turn test proving illegal or uncommitted attempts do not consume use
  - PlayerView/legal action filtering test for controller-only Activate Main exposure
  - deterministic event-order and state-hash tests for accepted and rejected Activate Main actions
  - "`corepack pnpm --filter @optcg/engine-core test`"
  - "`corepack pnpm run stories:validate`"
  - "`corepack pnpm run packets:verify`"
repo_rules:
  - implement only SUP-003B while its packet is active
  - keep engine-core free of cards package imports and live card-data adapters
  - stop and split if Activate Main requires new shared contract fields
ambiguity_policy: fail_and_escalate
