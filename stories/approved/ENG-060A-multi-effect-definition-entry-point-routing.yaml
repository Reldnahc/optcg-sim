spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-060A
epic_id: ENG-060
title: Multi-effect definition entry-point routing
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Remove engine-core assumptions that an implemented-DSL card definition must
  contain exactly one effect block before an entry point can queue, expose, or
  resolve its relevant supported effect.
story_boundary: >
  Own only engine runtime routing and legal-action exposure changes needed to
  select relevant supported effect blocks from a multi-effect generated
  EffectDefinition. Do not add new body primitives, cards-layer capability
  matrix evidence, parser certification, generated-support promotion, or real
  card support.
