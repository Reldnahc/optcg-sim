story_schema_version: 1.0.0
id: ENG-055F
epic_id: ENG-055
title: Cost and hand-selection runtime
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Implement returnDon / DON minus N cost runtime and generic filtered hand
  selection with private visibility and fail-closed response handling.
story_boundary: >
  Own only returnDon cost payment and filtered selectCards-from-hand runtime.
  Do not implement playSelected, drawUpTo, parser support, or card support.
allowed_touch_points:
  - packages/engine-core/src/effect-runtime*.ts
  - packages/engine-core/src/effect-runtime*.test.ts
  - packages/engine-core/src/actions-pending-decision.test.ts
  - tests/hidden-info/**
  - stories/generated/ENG-055*.yaml
  - stories/approved/ENG-055*.yaml
  - agent-packets/ENG-055F.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s009
  - 03-game-state-events-decisions.s012
  - 03-game-state-events-decisions.s013
  - 03-game-state-events-decisions.s015
  - 03-game-state-events-decisions.s018
  - 03-game-state-events-decisions.s017
  - 03-game-state-events-decisions.s020
  - 03-game-state-events-decisions.s022
