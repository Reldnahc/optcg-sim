title: ENG-056 and ENG-057 component generated support
type: implementation
area: cards
primary_concern: rules
priority: high
status: approved
summary: >
  Connect the completed ENG-056 trigger and On K.O. reusable queued-body
  runtime, plus the completed ENG-057 zero-choice continuous choose runtime, to
  the cards-side component generated-support layer without adding engine
  behavior, shared schema authority, or card-specific exact templates.
story_boundary: >
  Own only packages/cards parser/component evidence, runtime capability matrix,
  generated-support indexing, diagnostics, and tests needed to make currently
  runtime-supported ENG-056 and ENG-057 shapes available through componentized
  generated support. Do not add engine behavior, new effect primitives, shared
  contracts/schema authority, source fixture support, or real-card hash changes.
