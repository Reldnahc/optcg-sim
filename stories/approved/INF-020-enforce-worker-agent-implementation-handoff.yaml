spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-020
epic_id: KICK-001
title: Enforce worker-agent implementation handoff
type: tooling
area: infra
primary_concern: tooling
priority: high
status: approved
summary: >
  Make approved-story implementation harder to mis-execute by defining the
  worker-ready handoff state and adding workflow tests that preserve the parent
  orchestrator versus implementation worker separation.
story_boundary: >
  Own workflow documentation and enforcement tests for worker-agent
  implementation handoff only. Stop before changing story schema shape, packet
  lifecycle behavior, model routing defaults, PR review gate semantics, GitHub
  board sync, CI job structure, or gameplay implementation.
allowed_touch_points:
  - AGENTS.md
  - docs/workflow/story-execution.md
  - specs/27-spec-driven-story-generation-workflow.md
  - specs/32-codex-agent-integration.md
  - tests/github/review-workflow.test.mjs
spec_refs:
  - 26-agent-packet-template.s001 (Packet purpose)
  - 26-agent-packet-template.s005 (Packet lifecycle guidance)
  - 27-spec-driven-story-generation-workflow.s009 (Agent packet generation)
  - 27-spec-driven-story-generation-workflow.s012 (Minimum viable process)
  - 27-spec-driven-story-generation-workflow.s013 (Stronger process)
  - 27-spec-driven-story-generation-workflow.s015 (Recommended completion checks)
  - 32-codex-agent-integration.s006 (Root AGENTS contract)
  - 32-codex-agent-integration.s008 (Recommended execution flow)
  - 32-codex-agent-integration.s011 (GitHub-connected modes)
  - 32-codex-agent-integration.s012 (Minimal task prompt)
  - 32-codex-agent-integration.s014 (Subagent model routing)
scope:
  - define `worker-ready` for approved implementation stories as a state where the parent has read `AGENTS.md`, the approved story, and a current active packet
  - require `pnpm run packets:generate --story <stories/approved/...yaml> --activate` and `pnpm run packets:verify` before assigning an implementation worker
  - require the parent agent to stay in orchestration mode for the main implementation body when a worker subagent is available
  - require one implementation worker subagent per active story by default, with story splitting or explicitly disjoint write scopes before using multiple workers
  - require an explicit implementation note when worker subagents are unavailable and the parent must implement manually
  - keep parent-owned authority edits documented as the narrow exception for small docs/story/packet/workflow-template corrections
  - update workflow tests so removing or weakening worker-ready packet verification, parent orchestration, worker handoff, or unavailable-worker disclosure fails
non_scope:
  - changing story schema validation or adding story metadata fields
  - changing packet generation, packet verification, packet completion, or active-story manifest semantics
  - changing implementation worker model-routing defaults from INF-013
  - changing PR reviewer-subagent gate semantics or human review requirements
  - changing GitHub issue or board sync behavior
  - changing CI workflow job structure
  - changing `.github` pull request or review comment templates unless a later approved story explicitly targets evidence templates
  - implementing any gameplay, contract, engine, server, client, replay, database, or UI behavior
dependencies:
  - INF-011
  - INF-012
  - INF-013
  - INF-017
acceptance_criteria:
  - workflow guidance defines `worker-ready` for approved implementation stories in concise checked-in language
  - workflow guidance requires current packet generation and `packets:verify` before implementation worker assignment
  - workflow guidance says parent agents should not do the main implementation body when a worker subagent is available
  - workflow guidance says parent agents may perform small local glue work and parent-owned authority edits without treating that work as the main implementation body
  - workflow guidance requires one worker subagent per active story by default and directs multi-worker implementation pressure back to story splitting unless write scopes are explicitly disjoint
  - workflow guidance requires the parent to record when worker subagents are unavailable and parent implementation was used as a fallback
  - workflow tests fail if worker-ready, packet verification before worker assignment, parent/worker separation, one-worker-per-story default, or unavailable-worker fallback disclosure is removed or weakened
required_tests:
  - review workflow test covering the checked-in `worker-ready` definition
  - review workflow test covering packet generation and `packets:verify` before worker assignment
  - review workflow test covering parent orchestration, worker handoff, one-worker-per-story default, and unavailable-worker fallback disclosure
  - "`corepack pnpm exec vitest run tests/github/review-workflow.test.mjs` must pass"
  - "`corepack pnpm run verify` must pass"
repo_rules:
  - do not change story schema, packet lifecycle, model routing, or PR review gate semantics in this story
  - keep implementation-handoff wording concise enough for root instructions while preserving enforceable detail in linked docs
  - parent-owned workflow authority edits require full verification and separate reviewer-subagent review before PR handoff
  - generated story must receive per-story story-review before it is presented as approval-ready
ambiguity_policy: fail_and_escalate
