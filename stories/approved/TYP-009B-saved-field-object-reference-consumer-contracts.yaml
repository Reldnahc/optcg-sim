title: Saved field-object reference consumer contracts
type: implementation
area: contracts
primary_concern: contract
priority: high
status: approved
summary: >
  Define canonical contract and spec authority for same-frame saved field-object
  references, saved field-object consumers, and exact-card continuous-effect
  target binding so ENG-055I can consume producer authority without inventing
  target/reference behavior.
story_boundary: >
  Own only saved field-object reference contract/spec/schema/type authority and
  contract tests. Do not implement engine runtime behavior, card parser support,
  or generated card support.
