epic_id: KICK-001
title: Add root disclaimer for third-party game assets
type: implementation
area: docs
primary_concern: docs
priority: high
status: approved
summary: >
  Add a concise root disclaimer that makes clear this repository does not own
  or claim rights to ONE PIECE, the ONE PIECE Card Game, related game assets,
  characters, card content, logos, trademarks, or other third-party content.
story_boundary: >
  Own only a stable repository-level disclaimer, a minimal README pointer to
  that disclaimer, a contract/onboarding test that pins the disclaimer boundary,
  and story/packet lifecycle files. Do not create terms of service, privacy
  policy, takedown process, official asset usage policy, gameplay behavior, or
  product launch wording.
allowed_touch_points:
  - DISCLAIMER.md
  - README.md
  - tests/contracts/spec-authority-gates.test.mjs
  - stories/generated/DOC-003-add-root-disclaimer.yaml
  - stories/approved/DOC-003-add-root-disclaimer.yaml
  - agent-packets/DOC-003.md
  - agent-packets/active.json
spec_refs:
  - 13-content-publication-policy.s002
  - 13-content-publication-policy.s006
  - 13-content-publication-policy.s008
  - 13-content-publication-policy.s010
  - 13-content-publication-policy.s011
  - 13-content-publication-policy.s013
  - 27-spec-driven-story-generation-workflow.s012
  - 32-codex-agent-integration.s004
  - 32-codex-agent-integration.s008
scope:
  - add a root `DISCLAIMER.md` with concise repository-level disclaimer wording
  - state that the project is unofficial and is not affiliated with, endorsed by, sponsored by, or approved by any ONE PIECE or ONE PIECE Card Game rightsholder
  - state that this repository does not own or claim rights to ONE PIECE, the ONE PIECE Card Game, related game assets, card names, card text, card images, artwork, characters, logos, trademarks, or other third-party content
  - state that third-party names, images, text, and marks remain the property of their respective owners
  - keep the disclaimer stable and general; do not attempt to identify every rightsholder or provide legal advice
  - add a concise README pointer to `DISCLAIMER.md` near the license/onboarding area
  - add or update a contract/onboarding test that pins the disclaimer file and README pointer
non_scope:
  - terms of service, privacy policy, takedown process, content moderation policy, official asset usage policy, or legal advice
  - changing the MIT `LICENSE`, package metadata, GitHub visibility, CI settings, branch protection, deployment, package publication, server/client behavior, gameplay, engine behavior, replay behavior, database behavior, or hidden-info filtering
  - adding, removing, renaming, or changing card data, card images, game assets, trademarks, logos, branding, monetization, public gameplay, ranked, unranked, custom-lobby, spectator, tournament, or browser gameplay behavior
dependencies: []
acceptance_criteria:
  - root `DISCLAIMER.md` exists and states the project is unofficial and not affiliated with, endorsed by, sponsored by, or approved by ONE PIECE or ONE PIECE Card Game rightsholders
  - root `DISCLAIMER.md` states the repository does not own or claim rights to ONE PIECE, the ONE PIECE Card Game, related game assets, card names, card text, card images, artwork, characters, logos, trademarks, or other third-party content
  - root `DISCLAIMER.md` states third-party names, images, text, and marks remain the property of their respective owners
  - root `README.md` links to `DISCLAIMER.md` without duplicating the full disclaimer text
  - contract/onboarding tests pin the disclaimer file wording and README pointer
  - implementation review confirms no code/runtime/product behavior or public gameplay launch work was included
required_tests:
  - "add or update a contract/onboarding test that pins the root DISCLAIMER wording and README pointer"
  - "`corepack pnpm run test:contracts` must pass"
  - "`corepack pnpm run format:check` must pass"
  - "`corepack pnpm run packets:verify` must pass after packet activation"
  - "`corepack pnpm run stories:validate` must pass"
  - "`corepack pnpm run verify` must pass"
repo_rules:
  - do not skip story-review; if story-review says this lacks authority, is too broad, or should be split, stop before implementation
  - generated or normalized story must receive per-story story-review before it is presented as approval-ready
  - after story-review passes and human approval is given, move or leave the story in `stories/approved/`, generate and activate its packet, and run `packets:verify` before implementation
  - keep file implementation to `DISCLAIMER.md`, `README.md`, the contract test, and story/packet lifecycle files
  - run the normal implementation-review gate after opening the PR
ambiguity_policy: fail_and_escalate
