spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-037
epic_id: KICK-001
title: Separate real-card fixture tests from engine runtime requirements
type: verification
area: infra
primary_concern: verification
priority: high
status: approved
summary: >
  Correct workflow and future-story guidance so engine and rules stories keep
  focused synthetic/unit/regression coverage for behavior requirements, while
  real-card and cards-produced fixture coverage remains a separate
  card-data/integration lane that may produce follow-up stories when useful.
story_boundary: >
  Own only the policy and verification guidance that separates engine behavior
  tests from real-card fixture integration tests. Audit recent guidance for
  weakened or misleading requirements, restore the documented behavior-test
  expectation if needed, and add a contract-style docs test. Do not add
  gameplay behavior, DSL primitives, new real-card fixtures, or broad test-suite
  rewrites.
allowed_touch_points:
  - docs/workflow/story-execution.md
  - docs/workflow/card-fixture-capture.md
  - tests/github/review-workflow.test.mjs
  - tests/contracts/spec-authority-gates.test.mjs
  - stories/generated/INF-037-separate-real-card-fixture-tests-policy.yaml
  - stories/approved/INF-037-separate-real-card-fixture-tests-policy.yaml
  - agent-packets/INF-037.md
  - agent-packets/active.json
spec_refs:
  - 11-testing-quality.s002
  - 11-testing-quality.s003
  - 11-testing-quality.s004
  - 11-testing-quality.s007
  - 11-testing-quality.s008
  - 17-first-card-fixtures.s002
  - 17-first-card-fixtures.s007
  - 17-first-card-fixtures.s008
  - 23-repo-tooling-and-enforcement.s010
  - 24-story-schema.s016
  - 27-spec-driven-story-generation-workflow.s015
  - 27-spec-driven-story-generation-workflow.s017
scope:
  - audit current workflow docs and future-story guidance for language requiring or strongly implying that every future engine or effect-runtime story must include real-card fixture coverage
  - rewrite fixture-manifest guidance so cards-produced and real-card fixture tests are a separate card-data/integration lane, not a mandatory acceptance substitute for engine behavior tests
  - restore explicit engine/rules story guidance requiring synthetic unit tests, primitive tests, focused regression tests, unsupported-shape fail-closed tests, hidden-info tests, event-order tests, and state-hash tests where applicable
  - document that future engine stories should not be required to add real-card fixtures merely because a primitive or rule is implemented
  - document that if a gameplay story exposes a real-card integration gap, the agent should record a separate CARD/FIXTURE/verification follow-up story instead of widening the engine story
  - audit ENG-039 and recent CARD fixture-adoption guidance for any behavior-test requirement that was weakened or replaced by real-card fixture wording, and restore the guidance if found
  - keep existing useful real-card fixture tests as integration/card-data coverage unless story-review identifies specific harmful mixing worth correcting in this narrow story
  - add a docs or contract-style test locking the separation policy text
non_scope:
  - new gameplay behavior
  - new DSL primitives
  - new real-card fixtures
  - full card catalog work
  - server, client, API, WebSocket, database, or UI work
  - live Poneglyph in tests
  - engine-core importing @optcg/cards
  - broad test suite rewrite
  - deleting existing useful fixture tests because they are fixture tests
  - changing CARD-004 fixture behavior unless the audit finds a direct policy violation
dependencies:
  - CARD-002
  - CARD-004
  - ENG-039
acceptance_criteria:
  - future effect-story guidance no longer requires every engine story to include a real card or real-card fixture coverage
  - docs clearly state real-card and cards-produced fixture tests are separate integration/card-data coverage
  - engine/rules story guidance clearly requires synthetic/unit/regression tests for behavior requirements
  - docs clearly state real-card tests must not replace primitive tests, synthetic edge-case tests, hidden-info tests, fail-closed tests, event-order tests, or state-hash tests
  - guidance tells agents to create a separate CARD/FIXTURE/verification follow-up story when engine work exposes a real-card integration gap instead of widening the engine story
  - existing real-card fixture tests remain useful integration coverage and are not deleted or reframed as behavior-requirement replacements
  - any removed or weakened synthetic behavior requirement found during audit is restored or documented as already covered by equivalent synthetic/regression guidance
  - a docs or contract-style test locks the separation-policy wording
required_tests:
  - docs or contract test proving workflow guidance says real-card fixture coverage is separate integration/card-data coverage and does not replace primitive/unit/regression coverage
  - docs or contract test proving future engine/effect stories are not required to add real-card fixtures and should create separate CARD/FIXTURE/verification follow-up stories for real-card integration gaps
  - docs or contract test proving engine/rules behavior stories still require synthetic/unit/regression, fail-closed, hidden-info, event-order, and state-hash coverage where applicable
  - "`corepack pnpm run stories:validate`"
  - "`corepack pnpm run packets:verify`"
  - full "`corepack pnpm run verify`"
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - if story-review says this should be docs-only unless the audit finds an actual test regression, keep implementation docs/test-only
  - do not present this generated story as approval-ready until the exact candidate has a usable per-story story-review result
  - stay within allowed_touch_points
  - do not add gameplay behavior, real-card fixtures, or engine-core @optcg/cards imports
  - preserve existing useful real-card integration tests unless story-review identifies specific harmful mixing within this story boundary
ambiguity_policy: fail_and_escalate
