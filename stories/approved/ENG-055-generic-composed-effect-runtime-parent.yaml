spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-055
epic_id: ENG-055
title: Generic composed effect runtime parent
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Coordinate reusable engine runtime behavior for composed effect primitives
  that consume the TYP-007 contracts while preserving hidden information,
  deterministic event order, and state hashes.
story_boundary: >
  Parent planning story only. Do not implement this parent directly. Implement
  the approved ENG-055 child stories one at a time. Keep this series in
  engine-core runtime behavior, play-card support gating explicitly owned by
  child stories, and tests; engine-core must not import @optcg/cards.
allowed_touch_points:
  - tests/hidden-info/**
  - stories/generated/ENG-055*.yaml
  - stories/generated/TYP-010*.yaml
  - stories/approved/ENG-055*.yaml
  - stories/approved/TYP-010*.yaml
  - agent-packets/ENG-055*.md
  - agent-packets/TYP-010*.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s016
  - 03-game-state-events-decisions.s017
  - 03-game-state-events-decisions.s022
  - 04-effect-runtime.s002
  - 04-effect-runtime.s005
  - 04-effect-runtime.s010
  - 04-effect-runtime.s011
  - 04-effect-runtime.s012
  - 04-effect-runtime.s014
  - 04-effect-runtime.s015
  - 04-effect-runtime.s016
  - 05-effect-dsl-reference.s013
  - 11-testing-quality.s004
  - 11-testing-quality.s008
dependencies:
  - TYP-007
child_stories:
  - id: ENG-055A
    title: Quantity decision runtime
    concern: Implement chooseQuantity decision creation, response validation, legal actions, stale-decision handling, and safety tests.
    depends_on: [TYP-007A]
  - id: ENG-055B
    title: Generic resumable effect execution frames
    concern: Implement execution context/frame stack, sequence pause/resume, segment result tracking, and fail-closed unsupported sequence behavior.
    depends_on: [TYP-007B]
  - id: ENG-055C
    title: Draw-then-trash migration and Cavendish baseline
    concern: Migrate existing draw-then-trash sequence behavior onto the generic runner while preserving Cavendish behavior exactly.
    depends_on: [ENG-055B]
  - id: ENG-055D
    title: Non-replacement optionality runtime
    concern: Implement optional activation, optional cost, and optional effect clause runtime semantics with correct acceptance and commitment timing.
    depends_on: [ENG-055B, TYP-007C]
  - id: ENG-055E
    title: Condition evaluator runtime
    concern: Implement supported condition evaluators and fail-closed unsupported condition behavior.
    depends_on: [TYP-007C]
  - id: ENG-055F
    title: Cost and hand-selection runtime
    concern: Implement returnDon and generic filtered selectCards from hand with private visibility and invalid-response coverage.
    depends_on: [ENG-055B, TYP-007D]
  - id: ENG-055G
    title: playSelected and play-from-hand runtime
    concern: Implement playSelected from hand, up-to cardinality integration, area-capacity handling, and forced-trash consequences.
    depends_on: [ENG-055A, ENG-055B, ENG-055F, TYP-007D]
  - id: ENG-055H
    title: drawUpTo runtime primitive and sequence support
    concern: Implement reusable draw up to N queue and sequence runtime through chooseQuantity with zero, partial deck, event-order, state-hash, and hidden-info coverage.
    depends_on: [ENG-055A, ENG-055B, TYP-007D]
  - id: ENG-055K
    title: drawUpTo play-card reachability
    concern: Allow supported Character On Play and Main Event drawUpTo definitions to pass normal play-card support gating into the ENG-055H runtime.
    depends_on: [ENG-055H]
  - id: ENG-055I
    title: Saved selections and that Character runtime
    concern: Implement saved result references for later approved consumers and fail closed when saved objects are gone, illegal, or unsupported.
    depends_on: [ENG-055B, TYP-007B, TYP-009B, TYP-010]
  - id: ENG-055J
    title: "Duration, modifier, and restriction runtime"
    concern: Implement temporary power modifier and TYP-007E-authorized restriction runtime with expiry tests.
    depends_on: [TYP-007E]
  - id: TYP-010
    title: SelectedTargets producer contract
    concern: Define the concrete same-frame public field-object selectedTargets producer contract required before ENG-055I can implement reachable saved selected-target references.
    depends_on: [TYP-009B]
scope:
  - define executable engine-runtime child stories for composed effect support
  - require every child to preserve event order, hidden-info boundaries, state hashes, and deterministic replay behavior
  - keep connector and failure-policy behavior fail-closed unless directly authorized by cited spec sections
  - keep runtime behavior separate from card parser certification and generated-support metadata
non_scope:
  - direct parent implementation
  - TYP contract/schema changes except through declared dependencies
  - card parser rules, generated-support reports, real-card fixtures, or support metadata beyond explicit play-card support gating owned by a child story
  - replacement generalization
  - refresh-lock or cannot-become-active-next-refresh runtime until contract/schema authority exists
  - server, client, API, UI, database, or live Poneglyph work
acceptance_criteria:
  - ENG-055 is not implemented directly
  - ENG-055 and every declared child story have usable per-story story-review evidence before approval handoff, with one distinct story-review assignment identity and one distinct durable artifact identity per parent/child row
  - the parent/child story-set review-status matrix can be reconstructed before approval handoff, child activation, packet generation, parent PR opening, and parent PR handoff
  - each ENG-055 child consumes TYP-007 contracts and remains independently reviewable
  - engine-core does not import @optcg/cards
  - no parser support, generated support, real-card fixture work, or card-data admission broadening is added by this series; explicit play-card support gating is allowed only where a child story owns it
required_tests:
  - record set-level story-review for the ENG-055 parent story set
  - record per-story story-review for ENG-055 and each declared child story with one distinct story-review assignment identity and one distinct durable artifact identity per required row
  - reconstruct the compact story-set review-status matrix before approval handoff, child activation, packet generation, parent PR opening, and parent PR handoff
  - run `corepack pnpm run stories:validate`
repo_rules:
  - use the parent/substory workflow
  - activate only one approved ENG-055 child packet at a time
  - fail closed on hidden-information, replay, event-order, or gameplay ambiguity
  - do not broaden into replacement generalization
ambiguity_policy: fail_and_escalate
