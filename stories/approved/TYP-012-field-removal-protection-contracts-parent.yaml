spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: TYP-012
epic_id: TYP-012
title: Field-removal protection contracts parent
type: implementation
area: contracts
primary_concern: contract
priority: high
status: approved
summary: >
  Coordinate contract/type authority for reusable field-removal protection
  metadata before engine runtime implements opponent-effect removal immunity.
story_boundary: >
  Parent planning story only. Do not implement this parent directly. Implement
  TYP-012A as the executable child after distinct parent and child story-review
  artifacts exist. This parent must not add engine runtime behavior, parser
  support, generated-support records, or real-card fixtures.
allowed_touch_points:
  - stories/generated/TYP-012*.yaml
  - stories/approved/TYP-012*.yaml
  - agent-packets/TYP-012*.md
  - agent-packets/active.json
spec_refs:
  - 02-engine-mechanics.s021
  - 02-engine-mechanics.s038
  - 03-game-state-events-decisions.s005
  - 03-game-state-events-decisions.s020
  - 04-effect-runtime.s011
  - 04-effect-runtime.s013
  - 04-effect-runtime.s014
  - 05-effect-dsl-reference.s012
  - 05-effect-dsl-reference.s016
  - 24-story-schema.s025
  - 11-testing-quality.s004
  - 11-testing-quality.s008
dependencies:
  - TYP-001F
child_stories:
  - id: TYP-012A
    title: Field-removal protection contract shape
    concern: Extend canonical type contracts so protection metadata can express field-removal process classification, effect source kind, source controller relation, and explicit exclusions without engine runtime behavior.
    depends_on: [TYP-001F]
scope:
  - coordinate one contracts-only child story for field-removal protection shape authority
  - keep the contract reusable for engine work such as ENG-059C
  - require the shape to distinguish protected field-removal processes from battle K.O., rule-process trash, costs, controller-owned effects, and ambiguous custom handlers
non_scope:
  - direct parent implementation
  - engine runtime behavior
  - parser support, generated-support evidence, support reports, support probes, real-card fixtures, source hashes, behavior hashes, or runtime capability matrix updates
  - server, client, API, UI, database, replay UI, WebSocket, Redis, or live Poneglyph work
acceptance_criteria:
  - TYP-012A is the only executable child story
  - TYP-012 has one distinct parent-story review assignment and durable artifact before approval handoff
  - TYP-012A has one distinct child-story review assignment and durable artifact before approval handoff
  - the reconstructed parent/child review-status matrix records distinct assignment and artifact identities for both rows before approval handoff, packet generation, activation, implementation handoff, or PR handoff
  - the child defines contract-owned axes for field-removal process classification, source kind, source-controller relation, protected object scope, and explicit exclusions or fail-closed unsupported cases
  - no engine runtime behavior is implemented by this story set
required_tests:
  - story-review for TYP-012 parent before approval handoff
  - story-review for TYP-012A before approval handoff
  - reconstruct a parent/child story-review matrix with distinct assignment and artifact identities per row before approval or implementation handoff
  - run `corepack pnpm run stories:validate`
repo_rules:
  - do not activate or implement TYP-012 directly
  - TYP-012A is the only worker-ready activation target in this parent set
  - use the parent/substory workflow even though this set has exactly one child
  - keep one active child packet at a time
  - do not complete the child packet until the parent branch lands on main
  - do not open child PRs to main; use one final parent PR after the child is reviewed on the parent branch
ambiguity_policy: fail_and_escalate
