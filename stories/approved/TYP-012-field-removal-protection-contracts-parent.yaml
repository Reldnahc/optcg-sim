    concern: Extend shared Effect DSL contract and schema authority so downstream stories can author reusable trash-count gated continuous keyword and field-removal protection grants without card-specific branches.
    depends_on: [TYP-012A]
scope:
  - record that TYP-012 has reopened because completed TYP-012A authorized protection metadata but did not authorize the composed Effect DSL authoring shape needed by downstream stories
  - coordinate one contracts-only child story for conditional continuous Effect DSL authorability over public trash-count conditions, keyword grants, and structured field-removal protection grants
  - keep the reopened contract work reusable for engine materialization and card generated-support promotion stories without requiring another shared contract change for this composition shape
  - preserve the historical fact that TYP-012A remains completed and is a prerequisite, not work to redo in this reopened pass
non_scope:
  - direct parent implementation
  - changes to the completed TYP-012A contract shape except as cited prerequisite authority
  - engine runtime behavior
  - parser support, generated-support evidence, support reports, support probes, real-card fixtures, source hashes, behavior hashes, or runtime capability matrix updates
  - server, client, API, UI, database, replay UI, WebSocket, Redis, or live Poneglyph work
acceptance_criteria:
  - TYP-012 is visibly no longer done while this reopened pass is active
  - TYP-012B is the only executable child story in this reopened parent pass
  - TYP-012A remains recorded as a completed prerequisite and is not reimplemented or repacketized by this reopened pass
  - TYP-012 has one distinct reopened-parent story-review assignment and durable artifact before approval handoff
  - TYP-012B has one distinct child-story review assignment and durable artifact before approval handoff
  - the reconstructed reopened parent/child review-status matrix records distinct assignment and artifact identities for both rows before approval handoff, packet generation, activation, implementation handoff, or PR handoff
  - the child owns only contract/schema authorability for the reusable conditional continuous composition shape needed by downstream ENG and CARD stories
  - no engine runtime behavior is implemented by this story set
required_tests:
  - story-review for reopened TYP-012 parent before approval handoff
  - story-review for TYP-012B before approval handoff
  - reconstruct a reopened parent/child story-review matrix with distinct assignment and artifact identities per row before approval or implementation handoff
  - run `corepack pnpm run stories:validate`
repo_rules:
  - do not activate or implement TYP-012 directly
  - TYP-012B is the only worker-ready activation target in this reopened parent set
  - use the parent/substory workflow even though this reopened set has exactly one active child
  - keep one active child packet at a time
  - do not complete the child packet until the parent branch lands on main
  - do not open child PRs to main; use one final reopened-parent PR after the child is reviewed on the parent branch
ambiguity_policy: fail_and_escalate
