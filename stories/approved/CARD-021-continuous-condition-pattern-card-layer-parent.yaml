id: CARD-021
epic_id: CARD-021
title: Continuous condition pattern card-layer parent
type: implementation
area: cards
primary_concern: rules
priority: high
status: approved
summary: >
  Coordinate cards-layer parser, generated-support evidence, and probe/report
  diagnostics for reusable public trash-count conditions, conditional keyword
  grants, opponent-effect field-removal protection text, and composition with
  existing On K.O. draw support, then promote the fully gated composition
  through generated support without naming or targeting any real card.
story_boundary: >
  Parent planning story only. Do not implement this parent directly. Implement
  CARD-021A through CARD-021E one at a time after distinct parent and child
  story-review evidence exists. This parent owns cards-layer parser/component
  and generated-support gating work only; it must not add engine runtime
  behavior, shared contract/schema authority, fixture support, source hash
  changes, behavior hash changes, overlays, or real-card support promotion.
