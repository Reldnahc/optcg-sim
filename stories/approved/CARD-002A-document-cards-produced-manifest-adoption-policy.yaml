spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: CARD-002A
epic_id: CARD-002
title: Document cards-produced manifest adoption policy
type: implementation
area: docs
primary_concern: docs
priority: high
status: approved
summary: >
  Document the repo policy that cards-produced MatchCardManifest fixtures are
  the default local integration surface for engine, CLI, hidden-info, and future
  effect-runtime work while engine-core consumes only plain manifest data.
story_boundary: >
  Own documentation and workflow guidance for card-manifest adoption only. Do
  not add fixtures, package code, CLI behavior, hidden-info behavior, or
  gameplay semantics in this story.
allowed_touch_points:
  - docs/**
  - docs/workflow/**
  - stories/generated/CARD-002A-document-cards-produced-manifest-adoption-policy.yaml
  - stories/approved/CARD-002A-document-cards-produced-manifest-adoption-policy.yaml
  - agent-packets/CARD-002A.md
  - agent-packets/active.json
spec_refs:
  - 04-effect-runtime.s002
  - 04-effect-runtime.s005
  - 06-visibility-security.s002
  - 09-card-data-and-support-policy.s011
  - 09-card-data-and-support-policy.s012
  - 09-card-data-and-support-policy.s013
  - 19-poneglyph-api-contract.s002
  - 19-poneglyph-api-contract.s007
  - 19-poneglyph-api-contract.s011
  - 23-repo-tooling-and-enforcement.s005
  - 24-story-schema.s016
  - 27-spec-driven-story-generation-workflow.s015
scope:
  - document that @optcg/cards may produce manifests and @optcg/engine-core consumes only plain MatchCardManifest data
  - document that engine actions must not fetch live Poneglyph or call @optcg/cards
  - document that root integration tests may import @optcg/cards and @optcg/engine-core together
  - document that engine package tests may load plain JSON or data fixtures but must not import @optcg/cards
  - document that CLI tests may load local fixture manifests but must not require live Poneglyph or Redis
  - document that synthetic one-off manifests require a story or PR explanation when the representative fixture is insufficient
non_scope:
  - creating or changing the representative manifest fixture
  - changing package exports
  - changing engine-core, CLI, hidden-info, server, client, or UI behavior
  - changing gameplay semantics or effect primitives
dependencies:
  - CARD-001
acceptance_criteria:
  - card-manifest adoption policy is documented in a durable repo location
  - docs make the @optcg/cards producer and @optcg/engine-core consumer boundary explicit
  - docs define when root integration tests may combine @optcg/cards and @optcg/engine-core
  - docs define the synthetic one-off manifest exception and required justification
required_tests:
  - documentation link or markdown lint check if the repo has one
  - "`corepack pnpm run stories:validate`"
  - full `corepack pnpm verify`
repo_rules:
  - keep this story documentation-only except for required story and packet files
  - do not create implementation fixtures or tests in this story
  - do not mention roadmap milestone names in the title or scope
ambiguity_policy: fail_and_escalate
