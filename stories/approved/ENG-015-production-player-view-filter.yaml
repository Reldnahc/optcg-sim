spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-015
epic_id: M1-001
title: Add production player-view state filter
type: implementation
area: engine
primary_concern: visibility
priority: high
status: approved
summary: >
  Add the real engine-core `filterStateForPlayer` implementation that converts
  an authoritative `GameState` into a hidden-information-safe `PlayerView` for
  one recipient.
story_boundary: >
  Own only the production engine-side `GameState` to `PlayerView` projection and
  directly related hidden-information tests. Stop before match server transport,
  browser/client rendering, spectator filtering, replay viewer policy, rollback
  policy, or any gameplay-rule expansion beyond public legal-action projection.
allowed_touch_points:
  - packages/engine-core/src/filter-state-for-player.ts
  - packages/engine-core/src/filter-state-for-player.test.ts
  - packages/engine-core/src/index.ts
spec_refs:
  - 00-project-overview.s011 (Hidden information is a security boundary)
  - 00-project-overview.s016 (Launch blockers)
  - 03-game-state-events-decisions.s002 (Canonical state model)
  - 03-game-state-events-decisions.s006 (Event visibility)
  - 03-game-state-events-decisions.s009 (Pending decisions)
  - 03-game-state-events-decisions.s015 (Legal actions)
  - 06-visibility-security.s002 (Security principle)
  - 06-visibility-security.s003 (Player zone visibility)
  - 06-visibility-security.s004 (PlayerView shape)
  - 06-visibility-security.s007 (Legal-action visibility)
  - 06-visibility-security.s011 (Information hiding)
  - 06-visibility-security.s017 (Filter checklist)
scope:
  - "add `filterStateForPlayer(state, playerId) -> PlayerView` in engine-core using the canonical `@optcg/types` PlayerView DTOs"
  - "represent the recipient's own hand with visible card identities and public card state"
  - "represent the opponent's hand by count only"
  - "represent both players' deck and DON!! deck by counts only"
  - "represent Life as count plus face-up cards only, with face-down Life identities hidden for both players"
  - "include public board zones: trash, cost area, leader, character area, and stage for both players"
  - "exclude RNG state, effect queues, deferred triggers, replacement state, continuous-effect internals, audit/internal metadata, and any other server-only canonical state fields"
  - "surface `pendingDecision` only when the recipient is the decision player, and project it to `PublicDecision` without private candidates, defaults, payment options, target lists, or card lists"
  - "include recipient-filtered `legalActions` by projecting engine legal actions to `PublicLegalAction` without hidden card identities or private opponent reasons"
  - "filter event journal and reveal records to public records plus private records for the recipient only"
  - "map authoritative timer state into the public timer DTO without fabricating values"
  - "export the new function from `@optcg/engine-core`"
non_scope:
  - match server or transport envelopes
  - browser client or view-engine code
  - spectator mode or `filterStateForSpectator`
  - replay viewer, replay filtering, or completed-replay policy
  - rollback policy or rollback consent behavior
  - new gameplay actions, new timing windows, or legal-action generation beyond projecting existing engine legal actions
  - changing `@optcg/types` DTO contracts unless implementation proves a hard authority gap
dependencies:
  - TYP-002A
  - SEC-001C
acceptance_criteria:
  - "`@optcg/engine-core` exports `filterStateForPlayer`"
  - "a real `GameState` filtered for player 1 exposes player 1 hand card IDs but never player 2 hand card IDs"
  - "a real `GameState` filtered for player 1 exposes both players' deck and DON!! deck counts but no deck card identities or order"
  - "face-down Life identities are absent for both self and opponent; face-up Life cards are visible"
  - "public board zones for both players are visible: trash, cost area, leader, characters, and stage"
  - "RNG state, effect queue internals, deferred triggers, replacement state, continuous-effect internals, audit entries, and server-only metadata are absent from the returned view"
  - "`pendingDecision` appears only for the decision recipient and is reduced to the public decision DTO"
  - "`legalActions` are present for the recipient and do not expose opponent hidden hand, deck, or face-down Life identities"
  - "event journal and reveal records are filtered by recipient visibility"
  - "the implementation tests use real engine `GameState` output, not only static JSON fixtures"
required_tests:
  - "focused engine-core test for self hand visible, opponent hand count only, deck counts only, face-down Life hidden, face-up Life visible, public board zones visible, and server-only internals absent"
  - "focused engine-core test for recipient-only pending decisions and public decision projection"
  - "focused engine-core test for legal-action projection that includes actions without leaking hidden opponent card identities"
  - "focused engine-core test for recipient-filtered event and reveal visibility"
  - "run `corepack pnpm exec vitest run packages/engine-core/src/filter-state-for-player.test.ts tests/hidden-info`"
  - "run `corepack pnpm --filter @optcg/engine-core typecheck`"
  - "run `corepack pnpm run packets:verify`"
  - "run `corepack pnpm run verify`"
repo_rules:
  - must pass packet generation and packet verification before implementation handoff
  - must follow test-driven development for the implementation patch
  - must pass pnpm verify before completion claim
  - must run separate reviewer-subagent review after PR creation
  - must not broaden into match server, client, spectator, replay, or rollback behavior
ambiguity_policy: fail_and_escalate
