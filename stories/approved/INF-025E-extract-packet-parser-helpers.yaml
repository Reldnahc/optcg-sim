spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-025E
epic_id: KICK-001
title: Extract packet parser helpers
type: refactor
area: infra
primary_concern: tooling
priority: medium
status: approved
summary: >
  Extract packet story YAML and CLI option parsing helpers from
  build-agent-packet.ts without changing parsed values, validation failures, or
  command-line behavior.
story_boundary: >
  Own only behavior-preserving extraction of parser and option helper code used
  by packet tooling. The packet CLI must keep the same commands, arguments,
  parsed output, errors, and generated packet content.
allowed_touch_points:
  - tools/build-agent-packet.ts
  - tools/agent-packet-parser.ts
  - tests/contracts/agent-packet-parser-contract.test.mjs
  - tests/contracts/agent-packet-test-support.mjs
  - stories/generated/INF-025E-extract-packet-parser-helpers.yaml
  - stories/approved/INF-025E-extract-packet-parser-helpers.yaml
  - agent-packets/INF-025E.md
  - agent-packets/active.json
spec_refs:
  - 23-repo-tooling-and-enforcement.s005
  - 23-repo-tooling-and-enforcement.s006
  - 23-repo-tooling-and-enforcement.s016
  - 11-testing-quality.s008
scope:
  - extract story YAML parsing, scalar/list/block parsing, option map, and required-option helpers into a focused parser module
  - keep exported helper types narrow and internal to packet tooling
  - preserve all parser results and CLI error messages
  - keep packet generation output byte-equivalent for covered fixtures
non_scope:
  - changing packet rendering, spec excerpt, manifest, verification, completion, or lifecycle behavior
  - changing story schema, workflow docs, CLI command names, CLI arguments, or output paths
dependencies:
  - INF-025D
acceptance_criteria:
  - parser helper extraction reduces build-agent-packet.ts while preserving parser behavior
  - parser-focused contract tests pass without expectation changes
  - focused packet generation before and after extraction remains byte-equivalent for covered fixtures
  - contracts and full verify pass
required_tests:
  - run corepack pnpm exec vitest run tests/contracts/agent-packet-parser-contract.test.mjs tests/contracts/agent-packet-rendering-contract.test.mjs
  - run corepack pnpm run packets:verify
  - run corepack pnpm run contracts
  - run corepack pnpm run verify
repo_rules:
  - target the INF-025 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - this is a behavior-preserving extraction story; if any parser output or CLI error must change, stop and record an ambiguity
ambiguity_policy: fail_and_escalate
