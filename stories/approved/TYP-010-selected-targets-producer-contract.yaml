priority: high
status: approved
summary: >
  Define the canonical contract and spec authority for a reachable same-frame
  public field-object `selectedTargets` producer so ENG-055I can implement saved
  selected-target references without inventing DSL or runtime behavior.
story_boundary: >
  Own only selectedTargets producer contract/spec/schema/type authority and
  contract tests. Do not implement engine runtime behavior, card parser support,
  generated card support, or saved-reference consumers.
