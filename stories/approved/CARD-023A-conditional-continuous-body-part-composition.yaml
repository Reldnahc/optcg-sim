title: Conditional continuous body-part composition
type: implementation
area: cards
primary_concern: rules
priority: high
status: approved
summary: >
  Replace the CARD-021E conditional continuous composer and mirrored diagnostic
  path's exact two-body left/right assumption with a reusable one-or-more body
  part model. The card layer must parse one supported conditional continuous
  effect body or repeated `and`-separated supported continuous body parts through
  the same primitive registry, without hardcoding keyword-plus-protection,
  protection-plus-keyword, exact sentence text, or exactly two generated effects.
story_boundary: >
  Own only cards-layer conditional continuous composition arity, diagnostics,
  generated-support evidence naming, runtime-capability matrix references, and
  synthetic regression tests for already-supported continuous body primitives.
  Do not add engine runtime behavior, shared contract/schema authority, new
  continuous primitive families, comma-list grammar, real-card fixtures, source
  hash changes, behavior hash changes, overlays, support manifest edits,
  cards-produced manifest regeneration, or real-card promotion.
