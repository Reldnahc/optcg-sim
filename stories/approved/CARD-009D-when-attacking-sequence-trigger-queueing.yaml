id: CARD-009D
epic_id: CARD-009
title: When Attacking draw-then-trash trigger queueing
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Add engine trigger-queueing support for the already-certified
  `[When Attacking]` draw-then-trash generated DSL template so cards whose
  support evidence passes CARD-009B can execute through `applyDeclareAttack`
  instead of only resolving from a manually seeded queue entry.
story_boundary: >
  Own only engine-core attack-trigger queueing for supported generated
  `whenAttacking` sequence effects that draw cards and then trash cards from
  hand. Do not broaden parser grammar, card-data fixture support, manifest
  generation, or unrelated trigger timings in this story.
