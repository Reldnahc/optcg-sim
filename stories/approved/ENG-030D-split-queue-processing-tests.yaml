spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-030D
epic_id: KICK-001
title: Split queue processing tests
type: refactor
area: engine
primary_concern: verification
priority: medium
status: approved
summary: >
  Move existing effect queue processing, ordering, trigger-order response, and
  hash stability tests out of effect-runtime.test.ts into focused test files
  without changing queue behavior, event ordering, state hashes, or errors.
story_boundary: >
  Own only behavior-preserving test-file organization for effect queue
  processing and ordering tests currently covered by effect-runtime.test.ts.
  If the queue-processing slice is too broad during story-review or
  implementation, split it before proceeding.
allowed_touch_points:
  - packages/engine-core/src/effect-runtime.test.ts
  - packages/engine-core/src/effect-runtime-queue-processing.test.ts
  - packages/engine-core/src/effect-runtime-trigger-order.test.ts
  - stories/generated/ENG-030D-split-queue-processing-tests.yaml
  - stories/approved/ENG-030D-split-queue-processing-tests.yaml
  - agent-packets/ENG-030D.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s004
  - 03-game-state-events-decisions.s005
  - 03-game-state-events-decisions.s020
  - 04-effect-runtime.s006
  - 04-effect-runtime.s007
  - 04-effect-runtime.s009
  - 04-effect-runtime.s010
  - 04-effect-runtime.s011
  - 04-effect-runtime.s012
  - 11-testing-quality.s007
  - 11-testing-quality.s008
  - 23-repo-tooling-and-enforcement.s006
scope:
  - move queued no-choice effect resolution tests into effect-runtime-queue-processing.test.ts
  - move A-B-C ordering, deterministic queue order, source-presence queue processing, effect-resolved follow-up trigger, and state hash stability tests into focused files
  - move queued selectTargets decision creation, deterministic target decision creation, unsupported queued target request, and mixed ordered draw-then-target pause tests into effect-runtime-queue-processing.test.ts
  - move chooseTriggerOrder decision creation and response continuation tests into effect-runtime-trigger-order.test.ts
  - preserve assertions, fixture semantics, errors, events, event journal ordering, and state hashes
non_scope:
  - changing queue processing behavior
  - changing trigger ordering behavior
  - changing source-presence behavior
  - changing event ordering or state hashes
  - adding new queue primitives or decisions
  - changing production code
dependencies:
  - ENG-030C
acceptance_criteria:
  - effect-runtime.test.ts no longer contains queue processing, ordering, and trigger-order test groups moved by this story
  - new focused test files cover the same scenarios and expected outcomes
  - no production files change
  - focused tests, coverage, and full verify pass
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/effect-runtime.test.ts packages/engine-core/src/effect-runtime-queue-processing.test.ts packages/engine-core/src/effect-runtime-trigger-order.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-030D packet while implementing this story
  - target the ENG-030 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - this is a behavior-preserving test organization story; if production behavior changes appear necessary, stop and split or record an ambiguity
ambiguity_policy: fail_and_escalate
