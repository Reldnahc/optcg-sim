spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: CARD-009
epic_id: CARD-009
title: Generated draw and trash template support parent
type: implementation
area: cards
primary_concern: rules
priority: high
status: approved
summary: >
  Coordinate the generated-support card-data/parser expansion for common draw
  and trash-from-hand card text, using OP10-045 Cavendish as the first real-card
  fixture proof after required engine runtime support lands.
story_boundary: >
  This parent is not directly implementable. It coordinates CARD-009A through
  CARD-009C on a parent integration branch so parameterized Draw N parsing,
  generated draw-then-trash parsing/capability evidence, and OP10-045
  generated-support fixture evidence land as one reviewed card-support slice.
allowed_touch_points:
  - stories/generated/CARD-009*.yaml
  - stories/approved/CARD-009*.yaml
spec_refs:
  - 04-effect-runtime.s005
  - 05-effect-dsl-reference.s008
  - 05-effect-dsl-reference.s022
  - 06-visibility-security.s003
  - 06-visibility-security.s004
  - 09-card-data-and-support-policy.s010
  - 09-card-data-and-support-policy.s011
  - 09-card-data-and-support-policy.s012
  - 09-card-data-and-support-policy.s013
  - 09-card-data-and-support-policy.s014
  - 09-card-data-and-support-policy.s015
  - 09-card-data-and-support-policy.s016
  - 09-card-data-and-support-policy.s022
  - 11-testing-quality.s005
  - 11-testing-quality.s016
  - 11-testing-quality.s020
  - 17-first-card-fixtures.s004
  - 20-card-implementation-examples.s002
  - 24-story-schema.s016
  - 27-spec-driven-story-generation-workflow.s015
scope:
  - coordinate a parent integration branch for CARD-009A through CARD-009C
  - certify bounded positive-integer Draw N parser rules without per-number rule certification
  - support exact generated templates such as `[On Play] Draw 3 cards.` and `[When Attacking] Draw 2 cards.`
  - certify the narrow draw-then-trash wording `Draw N cards and trash M cards from your hand` under supported trigger wrappers after ENG-050 runtime support exists
  - support optional `[Once Per Turn]` immediately after `[When Attacking]` for the OP10-045 shape
  - compose draw and trash into one generated EffectDefinition without manual per-card mapping
  - add OP10-045 Cavendish checked-in fixture/support evidence only after the complete printed gameplay-relevant text is supported
  - keep generated support fail-closed for zero, negative, decimal, word-number, malformed, unsafe-integer, unparsed, ambiguous, stale, unsupported, or capability-missing text
  - preserve the package boundary that engine-core does not import @optcg/cards
non_scope:
  - direct implementation from this parent story
  - packetizing or activating this parent story as an active implementation story
  - engine runtime behavior
  - trash-from-hand decision implementation
  - sequence continuation implementation
  - leader-type conditions
  - end-of-turn effects
  - dynamic trash-until-hand-size effects
  - OP14-054 Fisher Tiger support
  - full released-card parsing
  - broad catalog auto-unlock
  - LLM-assisted parsing
  - custom handlers
  - new cost semantics
  - replacement effects
  - server, client, API, WebSocket, database, Redis, replay, or UI work
  - live Poneglyph calls in CI
  - engine-core importing @optcg/cards
dependencies:
  - CARD-008
  - ENG-050
  - ENG-049
child_stories:
  - id: CARD-009A
    title: Parameterized Draw N parser and capability evidence
    concern: Replace exact draw-1 generated support with certified bounded positive-integer Draw N templates and runtime capability evidence.
    depends_on: []
  - id: CARD-009B
    title: Generated draw-then-trash template evidence
    concern: Certify generated parsing/capability/index/report behavior for `Draw N cards and trash M cards from your hand` using ENG-050 runtime capabilities.
    depends_on: [CARD-009A, ENG-050B]
  - id: CARD-009C
    title: OP10-045 generated support fixture proof
    concern: Add OP10-045 Cavendish checked-in fixture/generated support/report evidence after the parser, capability matrix, and runtime can support its complete text.
    depends_on: [CARD-009B]
acceptance_criteria:
  - CARD-009A through CARD-009C are reviewed as a coherent generated-support group
  - each child story has a usable per-story story-review result before approval
  - child PRs target the CARD-009 parent integration branch if the group is approved
  - "`[On Play] Draw 3 cards.` is generated-supported by parameterized Draw N parsing and capability checks"
  - "`[When Attacking] Draw 2 cards and trash 1 card from your hand.` is generated-supported when the runtime sequence is supported"
  - "`[When Attacking] [Once Per Turn] Draw 2 cards and trash 1 card from your hand.` is generated-supported for OP10-045 after fixture evidence lands"
  - numeric parsing is bounded to positive safe integers and fails closed for zero, negative, decimal, word-number, malformed, and unsafe-integer counts
  - generated support does not require a manual per-card allowlist or manual per-number mapping for certified draw/trash templates
  - parent PR integration review confirms the pipeline composes without OP14, leader-condition, end-turn, server, client, live Poneglyph, UI, or broad parser scope creep
  - parent PR cleanup metadata lists CARD-009A through CARD-009C, and durable parent lifecycle evidence binds the changed non-packetized CARD-009 parent story for closeout
  - post-merge cleanup completes CARD-009A through CARD-009C and bound CARD-009 parent closeout only after the parent branch lands on main
required_tests:
  - set-level story-review for CARD-009 parent and children
  - per-story story-review for CARD-009 parent before approval
  - per-story story-review for CARD-009A through CARD-009C before approval
  - story-specific tests from every child story
  - full `corepack pnpm verify` on every child PR and parent PR
repo_rules:
  - do not implement CARD-009 directly
  - use the parent integration branch workflow if this group is approved
  - keep one active child packet at a time
  - do not run packet completion for child stories until the parent branch lands on main
  - require parent PR cleanup metadata for every included child story and reviewed closeout evidence binding the changed non-packetized CARD-009 parent story
  - use `packets:complete-many` as the operational cleanup mechanism for child cleanup and bound parent closeout after merge to main
  - if generated card-support or runtime authority is missing or ambiguous, record the blocker instead of inventing parser or gameplay behavior
ambiguity_policy: fail_and_escalate
