spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-019
epic_id: KICK-001
title: Enforce per-story approval review gate
type: tooling
area: infra
primary_concern: tooling
priority: high
status: approved
summary: >
  Make the generated-story workflow harder to misread by defining
  approval-ready as a distinct per-story review state and adding workflow tests
  that preserve the difference between decomposed-group review and candidate
  story approval review.
story_boundary: >
  Own workflow documentation and enforcement tests for the per-story approval
  review gate only. Stop before changing story schema shape, packet format,
  packet lifecycle behavior, GitHub board sync, CI job structure, or review
  metadata fields.
allowed_touch_points:
  - AGENTS.md
  - docs/workflow/story-execution.md
  - specs/27-spec-driven-story-generation-workflow.md
  - specs/32-codex-agent-integration.md
  - tests/github/review-workflow.test.mjs
spec_refs:
  - 24-story-schema.s026 (Approval rule)
  - 25-story-template.s002 (Usage rules)
  - 27-spec-driven-story-generation-workflow.s002 (Workflow summary)
  - 27-spec-driven-story-generation-workflow.s007 (Story normalization rules)
  - 27-spec-driven-story-generation-workflow.s008 (Approval rules)
  - 27-spec-driven-story-generation-workflow.s017 (Pre-presentation story-review gate)
  - 32-codex-agent-integration.s006 (Root AGENTS contract)
  - 32-codex-agent-integration.s008 (Recommended orchestration loop)
  - 32-codex-agent-integration.s010 (Review agents)
  - 32-codex-agent-integration.s014 (Subagent model routing)
scope:
  - add a concise checked-in definition of `approval-ready` for generated or normalized stories
  - require `approval-ready` to mean the exact candidate story has a usable per-story story-review result with material findings fixed, explicitly deferred, or recorded
  - preserve set-level decomposed-group review as a separate gate named for decomposition or group review
  - make clear that set-level story review does not satisfy per-story candidate approval review
  - update workflow tests so removing or weakening the per-story approval-review requirement fails
  - update workflow tests so the docs must keep group/decomposition review and candidate approval review as separate concepts
non_scope:
  - adding `story_review_status`, reviewer identity, timestamp, or review-scope fields to the story schema
  - changing `contracts/story.schema.json`
  - changing packet generation, packet verification, packet completion, or active-story manifest semantics
  - changing GitHub issue or board sync behavior
  - changing implementation PR reviewer-subagent workflow
  - changing CI workflow job structure
  - approving, packetizing, or implementing any gameplay story
dependencies:
  - INF-016
  - INF-017
acceptance_criteria:
  - "`AGENTS.md` or its linked workflow docs define `approval-ready` for generated and normalized stories in one concise location"
  - workflow guidance names group/decomposition review and per-story candidate approval review as separate required gates
  - workflow guidance explicitly says set-level story review is not a substitute for per-story candidate approval review
  - workflow guidance says each candidate story must have its own usable story-review result before the parent agent presents that exact story for approval
  - workflow tests fail if the per-story candidate approval-review gate is removed, weakened, or conflated with set-level decomposition review
required_tests:
  - review workflow test covering the checked-in `approval-ready` definition
  - review workflow test proving set-level/decomposition review and per-story candidate approval review are both required and distinct
  - "`corepack pnpm exec vitest run tests/github/review-workflow.test.mjs` must pass"
  - "`corepack pnpm run verify` must pass"
repo_rules:
  - do not change story schema or packet lifecycle semantics in this story
  - keep workflow wording concise enough for root instructions while preserving enforceable detail in linked docs
  - parent-owned workflow authority edits require full verification and separate reviewer-subagent review before PR handoff
  - generated story must receive per-story story-review before it is presented as approval-ready
ambiguity_policy: fail_and_escalate
