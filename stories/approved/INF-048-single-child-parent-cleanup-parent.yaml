spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-048
epic_id: INF-027
title: Single-child parent cleanup resilience parent
type: tooling
area: infra
primary_concern: tooling
priority: high
status: approved
summary: >
  Coordinate the cleanup-tooling repair required after PR #347 showed that
  parent-mode post-merge cleanup still rejects a valid parent/substory workflow
  when the parent has exactly one child.
story_boundary: >
  This parent is not directly implementable. It coordinates the single child
  story that aligns post-merge cleanup validation and workflow wording with the
  already-approved rule that a parent with exactly one child is valid.
allowed_touch_points:
  - stories/generated/INF-048*.yaml
  - stories/approved/INF-048*.yaml
spec_refs:
  - 24-story-schema.s004
  - 24-story-schema.s016
  - 27-spec-driven-story-generation-workflow.s002
  - 27-spec-driven-story-generation-workflow.s008
  - 27-spec-driven-story-generation-workflow.s009
  - 27-spec-driven-story-generation-workflow.s012
  - 27-spec-driven-story-generation-workflow.s017
  - 32-codex-agent-integration.s013
scope:
  - coordinate one executable cleanup-tooling child story
  - require post-merge parent-mode cleanup to accept one listed child story when a reviewed non-packetized parent story binds exactly to that child
  - preserve fail-closed cleanup metadata, parent evidence, stale story, stale packet, mismatched child, packetized parent, and already-done parent checks
  - require tests that reproduce the PR #347 cleanup failure shape before implementation
non_scope:
  - direct implementation from this parent story
  - packetizing or activating this parent story as an active implementation story
  - changing cleanup metadata syntax
  - changing human review, AI review, cleanup metadata guard, or direct-push authority
  - changing gameplay, engine, cards, server, client, replay, database, security, or UI behavior
dependencies:
  - INF-047
child_stories:
  - id: INF-048A
    title: Allow parent cleanup with one child
    concern: Update post-merge cleanup validation, focused contract tests, and narrow workflow wording so parent-mode cleanup accepts one-child parent story sets while preserving existing binding checks.
    depends_on: []
acceptance_criteria:
  - INF-048A is the only executable child for this parent
  - parent-mode cleanup validation accepts a metadata story list with exactly one child when the changed approved parent story has exactly that child in `child_stories`
  - cleanup validation continues to reject parent mode when no child story is listed
  - cleanup validation continues to reject mismatched, missing, duplicated, packetized, already-done, stale, or ambiguous parent evidence
  - workflow wording no longer implies `packets:complete-many` requires at least two child `--story` arguments
required_tests:
  - story-review for the INF-048 parent story set using `corepack pnpm run stories:review-plan -- --parent stories/generated/INF-048-single-child-parent-cleanup-parent.yaml`
  - story-specific tests from INF-048A
  - full `corepack pnpm verify` on the child PR
repo_rules:
  - do not implement INF-048 directly
  - use the parent/substory workflow even though this parent has one child
  - keep one active child packet at a time
  - use TDD and verify the one-child parent cleanup regression fails before changing cleanup validator code
ambiguity_policy: fail_and_escalate
