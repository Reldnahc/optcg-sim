spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: CARD-013
epic_id: CARD-013
title: Engine-supported printed keyword generated support parent
type: implementation
area: cards
primary_concern: verification
priority: high
status: approved
summary: >
  Split follow-up generated-support work for printed keyword bodies that the
  engine already executes but the cards package has not fully certified through
  the generated-support parser, runtime capability matrix, and Poneglyph
  support verification. Blocker remains owned by CARD-012; this parent owns the
  remaining keyword-only support surface for Rush, Rush: Character, Double
  Attack, and Banish.
story_boundary: >
  Parent planning story only. Do not implement this parent directly. Implement
  the approved child story one at a time. Keep the work in @optcg/cards and
  generated-support verification unless the child preflight proves an engine
  support-status contract gap that must be split into a separate ENG story.
allowed_touch_points:
  - stories/generated/CARD-013*.yaml
  - stories/approved/CARD-013*.yaml
  - agent-packets/CARD-013*.md
  - agent-packets/active.json
spec_refs:
  - 02-engine-mechanics.s025
  - 02-engine-mechanics.s045
  - 04-effect-runtime.s002
  - 05-effect-dsl-reference.s017
  - 05-effect-dsl-reference.s018
  - 09-card-data-and-support-policy.s010
  - 09-card-data-and-support-policy.s011
  - 09-card-data-and-support-policy.s012
  - 09-card-data-and-support-policy.s016
  - 09-card-data-and-support-policy.s024
  - 09-card-data-and-support-policy.s025
  - 11-testing-quality.s005
  - 11-testing-quality.s016
  - 11-testing-quality.s020
scope:
  - define the CARD-013 child story for generated-support certification of remaining engine-supported printed combat keywords
  - require CARD-013A to capture only OP01-025, OP04-014, EB04-011, and P-028 from the explicit card IDs supplied by the human for this keyword proof set
  - require CARD-013B to consume the reviewed fixtures from CARD-013A and implement parser/runtime-capability/generated-support verification
  - keep Blocker generated-support behavior under CARD-012 and require it to remain unchanged
  - certify only keyword bodies that existing engine runtime already executes from resolved printed keyword metadata
  - "treat EB04-011 as mixed Rush: Character residue evidence and leave its Neptunian field-count draw-then-trash text to a later story"
  - preserve generated-support complete-parse and runtime-capability fail-closed behavior
  - preserve Poneglyph as source authority and use fixtures/probe output only as verification evidence
non_scope:
  - direct parent implementation
  - new engine gameplay behavior
  - new battle timing or damage semantics
  - Counter Event support
  - Unblockable printed keyword support
  - broad parser grammar expansion for conditional keyword-granting effects
  - broad live Poneglyph catalog fetching
  - server, client, replay, database, protocol, or UI work
dependencies:
  - CARD-012
  - ENG-011
  - ENG-013
  - ENG-018
  - ENG-046
child_stories:
  - id: CARD-013A
    title: Capture human-supplied keyword proof fixtures
    concern: Capture and verify the exact Poneglyph fixtures for the human-supplied card IDs that will prove remaining engine-supported keyword text.
    depends_on: []
  - id: CARD-013B
    title: "Certify Rush, Rush: Character, Double Attack, and Banish generated support"
    concern: Add certified parser/runtime-capability/generated-support verification for remaining engine-supported printed keyword-only bodies using CARD-013A fixtures, while keeping mixed unsupported card text unsupported.
    depends_on: [CARD-013A]
card_source_integrity:
  - not applicable for direct parent implementation because this parent is planning-only and does not enable or change gameplay support for any card
  - CARD-013A human-supplied card IDs are OP01-025, OP04-014, EB04-011, and P-028; do not let implementation workers select substitute proof cards
  - CARD-013B must use the checked-in CARD-013A fixtures as source evidence and must not capture additional fixtures unless the story is revised first
engine_capability_preflight:
  - not applicable for direct parent implementation because this parent adds no parser grammar, generated DSL, runtime capability, support status, or gameplay behavior
  - child CARD stories must identify each target keyword, the existing engine tests that prove the runtime behavior, and any support-status contract caveat before implementation
  - "Rush and Rush: Character runtime authority comes from ENG-011 Rush keyword battle integration and current `battle-declare-attack-rush` / `compute-view` coverage"
  - Banish runtime authority comes from ENG-013 Banish keyword battle integration and follow-on battle pipeline coverage
  - Double Attack runtime authority comes from ENG-046 multiple-damage deferral parent and its completed children, limited to supported Double Attack leader damage and preserving fail-closed unsupported combinations
acceptance_criteria:
  - this parent remains generated until explicitly moved through story-review
  - CARD-013A and CARD-013B can be reviewed and implemented one active child at a time in the normal parent/substory workflow
  - CARD-013A is not approval-ready until OP01-025, OP04-014, EB04-011, and P-028 are mapped from Poneglyph text to their target keyword proof roles
  - CARD-013B cannot be approved or activated before CARD-013A fixture evidence exists
  - the child stories can activate without broadening into new engine behavior or per-card manual support admission
required_tests:
  - set-level story-review before presenting or approving the CARD-013 parent/child story set
  - future story-specific tests from CARD-013A and CARD-013B if approved
repo_rules:
  - do not activate or implement this parent directly
  - implement only one approved CARD-013 child story at a time
  - generate and activate the child packet before implementation
  - fail closed on gameplay support ambiguity
ambiguity_policy: fail_and_escalate
