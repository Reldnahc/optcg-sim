title: Generated-support capability factorization authority
type: specification
area: docs
primary_concern: rules
priority: high
status: approved
summary: >
  Tighten generated-support policy so parser certification and runtime
  capability evidence must expose reusable primitive boundaries instead of
  exact wrapper-body, full-line, full-card, or sample-shaped support evidence.
story_boundary: >
  Own only generated-support policy wording, explicit synthetic examples,
  generated spec metadata, and authority tests for evidence factorization. Do
  not change parser code, runtime capability records, generated-support
  metadata, contracts, schema, engine behavior, or card support.
