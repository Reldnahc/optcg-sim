id: CARD-014G
epic_id: CARD-014
title: selectTargets saved field object modifier restriction parser expansion
type: implementation
area: cards
primary_concern: rules
priority: high
status: approved
summary: >
  Add certified exact-template support for public field target selection
  producer shapes, later saved-field-object consumers, and supported temporary
  power modifier or restriction shapes.
story_boundary: >
  Own only packages/cards parser, generated DSL, capability gating, diagnostics,
  source integrity for any real-card proof, and tests for supported public field
  target, saved-field-object, modifyPower, cannotAttack, and cannotBlock shapes.
  Do not add runtime behavior or reuse hand selection as field targeting.
