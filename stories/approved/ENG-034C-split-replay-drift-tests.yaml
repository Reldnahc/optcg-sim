scope:
  - move existing ENG-002F action-script and mulligan responder drift assertions into replay-smoke-drift.test.ts
  - move existing ENG-003E action-script and manifest-stat drift assertions into replay-smoke-drift.test.ts
  - move existing ENG-005C action-script, payment-selection, overflow-response, and manifest-stat drift assertions into replay-smoke-drift.test.ts
  - preserve the same drift mutations, rejection behavior, final-hash mismatch checks, and expected assertion messages
non_scope:
  - changing replay fixtures
  - changing checkpoint or final hash values
  - changing CLI command behavior
  - changing engine behavior
  - moving pass/final-hash smoke assertions or metadata determinism assertions
