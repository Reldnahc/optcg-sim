title: Conditional generated-support composition parent
type: implementation
area: cards
primary_concern: rules
priority: high
status: approved
summary: >
  Coordinate card-layer generated-support work that parses conditional effect
  wrappers as reusable components and composes them with all currently supported
  effect trigger wrappers and bodies backed by ENG-058 runtime capability.
story_boundary: >
  Parent planning story only. Do not implement this parent directly. Implement
  CARD-019A and CARD-019B one at a time after distinct parent and child
  story-review evidence exists. This parent must not add engine runtime
  behavior, shared schema authority, fixture support, or real-card hash changes.
  Use one parent integration branch with reviewed child commits; do not open
  child PRs to main.
