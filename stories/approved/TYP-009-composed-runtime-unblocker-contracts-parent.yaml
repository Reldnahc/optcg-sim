spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: TYP-009
epic_id: TYP-009
title: Composed runtime unblocker contracts parent
type: implementation
area: contracts
primary_concern: contract
priority: high
status: approved
summary: >
  Coordinate the contract/spec work needed to unblock ENG-055D optional-cost
  runtime and ENG-055I saved field-object reference runtime without adding
  engine runtime behavior in the parent story.
story_boundary: >
  Parent planning story only. Do not implement this parent directly. Implement
  TYP-009A and TYP-009B as independently reviewed contract substories before
  ENG-055D or ENG-055I consumes the new authority.
allowed_touch_points:
  - stories/approved/TYP-009*.yaml
  - stories/generated/TYP-009*.yaml
  - agent-packets/TYP-009*.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s016
  - 03-game-state-events-decisions.s022
  - 04-effect-runtime.s010
  - 04-effect-runtime.s011
  - 04-effect-runtime.s012
  - 04-effect-runtime.s014
  - 04-effect-runtime.s016
  - 05-effect-dsl-reference.s013
  - 05-effect-dsl-reference.s021
  - 05-effect-dsl-reference.s026
  - 11-testing-quality.s008
dependencies:
  - TYP-007
  - TYP-008
child_stories:
  - id: TYP-009A
    title: Optional cost clause runtime contracts
    concern: Define optional cost representation, decision response, segment-result, use-consumption, replay, and state-hash authority for ENG-055D.
    depends_on: [TYP-007A, TYP-007B, TYP-007C, TYP-007D, TYP-008A]
  - id: TYP-009B
    title: Saved field-object reference consumer contracts
    concern: Define selectedTargets production, saved field-object consumer authority, exact-card continuous-effect target binding, and fail-closed visibility/legality rules for ENG-055I.
    depends_on: [TYP-007B, TYP-007E, TYP-008A]
scope:
  - define two contract substories that unblock ENG-055D and ENG-055I
  - keep optional-cost authority separate from saved field-object reference authority
  - preserve the distinction between contract/schema authorability and engine runtime execution
  - require distinct story-review assignments and durable artifacts for TYP-009, TYP-009A, and TYP-009B
non_scope:
  - direct parent implementation
  - ENG-055D or ENG-055I runtime implementation
  - parser/card support, generated-support admission, real-card fixtures, server, client, API, UI, database, or live Poneglyph work
acceptance_criteria:
  - TYP-009 is not implemented directly
  - TYP-009A owns optional-cost contract authority needed by ENG-055D
  - TYP-009B owns saved field-object reference contract authority needed by ENG-055I
  - no engine runtime behavior is implemented by this parent story set
  - TYP-009, TYP-009A, and TYP-009B have distinct story-review assignments and durable artifacts
required_tests:
  - record per-story story-review for TYP-009
  - record per-story story-review for TYP-009A
  - record per-story story-review for TYP-009B
  - run `corepack pnpm run stories:validate`
repo_rules:
  - use the parent/substory workflow
  - activate only one approved TYP-009 child packet at a time
  - do not treat contract authorability as engine runtime support or generated-card playability
  - fail closed on contract, hidden-information, replay, event-order, or state-hash ambiguity
ambiguity_policy: fail_and_escalate
