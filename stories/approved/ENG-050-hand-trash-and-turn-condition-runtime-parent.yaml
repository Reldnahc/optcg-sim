spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-050
epic_id: ENG-050
title: Draw/trash runtime foundation parent
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Coordinate the shared engine runtime foundations needed before generated card
  support can safely support OP10-045: private hand-trash decisions and
  draw-then-trash sequence continuation.
story_boundary: >
  This parent is not directly implementable. It coordinates ENG-050A and
  ENG-050B on a parent integration branch so reusable engine runtime behavior
  lands before CARD-009 generated-support stories claim OP10-045 real-card
  support.
allowed_touch_points:
  - stories/generated/ENG-050*.yaml
  - stories/approved/ENG-050*.yaml
spec_refs:
  - 03-game-state-events-decisions.s005
  - 03-game-state-events-decisions.s009
  - 03-game-state-events-decisions.s013
  - 03-game-state-events-decisions.s015
  - 03-game-state-events-decisions.s020
  - 04-effect-runtime.s005
  - 04-effect-runtime.s009
  - 04-effect-runtime.s010
  - 04-effect-runtime.s011
  - 05-effect-dsl-reference.s008
  - 05-effect-dsl-reference.s012
  - 05-effect-dsl-reference.s013
  - 05-effect-dsl-reference.s022
  - 06-visibility-security.s003
  - 06-visibility-security.s004
  - 06-visibility-security.s006
  - 06-visibility-security.s007
  - 11-testing-quality.s005
  - 11-testing-quality.s016
  - 11-testing-quality.s020
  - 17-first-card-fixtures.s004
  - 24-story-schema.s016
  - 27-spec-driven-story-generation-workflow.s015
scope:
  - coordinate a parent integration branch for ENG-050A and ENG-050B
  - add reusable engine behavior needed before generated card-support stories can support OP10-045
  - keep every runtime primitive synthetic/unit tested before real-card fixture proof stories consume it
  - preserve hidden-information safety for private hand choices
  - preserve deterministic event ordering and state hashes
  - keep engine-core pure and free of @optcg/cards, live Poneglyph, server, client, UI, Redis, Postgres, WebSocket, or HTTP clients
non_scope:
  - direct implementation from this parent story
  - packetizing or activating this parent story as an active implementation story
  - generated card parser rules
  - generated support index/report behavior
  - OP10-045 or OP14-054 fixture support
  - real-card fixture capture
  - leader-type conditions
  - end-of-turn timing
  - dynamic trash-until-hand-size behavior
  - server, client, API, UI, Redis, Postgres, WebSocket, or live Poneglyph work
  - engine-core importing @optcg/cards
dependencies:
  - ENG-049
child_stories:
  - id: ENG-050A
    title: Trash-from-hand decision primitive
    concern: Add the first narrow self trash-from-hand effect primitive with private choice validation, deterministic events, and fail-closed invalid responses.
    depends_on: []
  - id: ENG-050B
    title: Draw-then-trash sequence continuation
    concern: Compose existing draw and new trash-from-hand primitives so draw resolves first, then the runtime pauses for private trash choice and resumes deterministically.
    depends_on: [ENG-050A]
acceptance_criteria:
  - ENG-050A and ENG-050B are reviewed as a coherent engine runtime group
  - each child story has a usable per-story story-review result before approval
  - child PRs target the ENG-050 parent integration branch if the group is approved
  - CARD-009 can depend on ENG-050A and ENG-050B for OP10-045 runtime support
  - OP14 runtime work remains drafted separately because dynamic trash-until-hand-size needs explicit DSL authority before implementation
  - every child story proves behavior with synthetic/unit/regression/fail-closed/hidden-info/event-hash tests as relevant
  - parent PR integration review confirms no generated parser, real-card fixture, server, client, UI, live Poneglyph, or card-data scope creep
  - parent PR cleanup metadata lists ENG-050A and ENG-050B, and durable parent lifecycle evidence binds the changed non-packetized ENG-050 parent story for closeout
  - post-merge cleanup completes ENG-050A and ENG-050B and bound ENG-050 parent closeout only after the parent branch lands on main
required_tests:
  - set-level story-review for ENG-050 parent and children
  - per-story story-review for ENG-050 parent before approval
  - per-story story-review for ENG-050A and ENG-050B before approval
  - story-specific tests from every child story
  - full `corepack pnpm verify` on every child PR and parent PR
repo_rules:
  - do not implement ENG-050 directly
  - use the parent integration branch workflow if this group is approved
  - keep one active child packet at a time
  - do not run packet completion for child stories until the parent branch lands on main
  - require parent PR cleanup metadata for every included child story and reviewed closeout evidence binding the changed non-packetized ENG-050 parent story
  - use `packets:complete-many` as the operational cleanup mechanism for child cleanup and bound parent closeout after merge to main
  - if runtime authority is missing or ambiguous, record the blocker instead of inventing gameplay behavior
ambiguity_policy: fail_and_escalate
