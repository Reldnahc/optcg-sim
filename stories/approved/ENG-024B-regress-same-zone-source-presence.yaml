spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-024B
epic_id: KICK-001
title: Regress same-zone source presence
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Add focused same-zone helper regression coverage and preserve existing
  fail-closed behavior.
story_boundary: >
  Own only mustRemainInSameZone helper regression coverage and any narrow helper
  fixes required by that coverage. Queue processor production wiring remains in
  ENG-024E.
allowed_touch_points:
  - packages/engine-core/src/source-presence.ts
  - packages/engine-core/src/source-presence.test.ts
  - packages/engine-core/src/effect-runtime.test.ts
  - stories/approved/ENG-024B-regress-same-zone-source-presence.yaml
  - agent-packets/ENG-024B.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s005 (Event journal)
  - 03-game-state-events-decisions.s020 (State hashing)
  - 04-effect-runtime.s006 (Effect queue entry)
  - 04-effect-runtime.s007 (Source presence policy)
  - 04-effect-runtime.s008 (Trigger detection from events)
  - 04-effect-runtime.s009 (Effect queue ordering)
  - 04-effect-runtime.s011 (Conditions and costs)
  - 11-testing-quality.s007 (Interaction tests)
  - 11-testing-quality.s008 (Invariant tests)
  - 23-repo-tooling-and-enforcement.s006 (TypeScript enforcement)
  - 23-repo-tooling-and-enforcement.s016 (CI merge gates)
scope:
  - add helper-level regression coverage for mustRemainInSameZone checks against current queue-entry source data
  - prove current On Play, When Attacking, and On Your Opponent's Attack source-presence fixture expectations remain represented by helper semantics
  - preserve fail-closed no-mutation/no-events behavior for missing, stale, and mismatched source presence
  - preserve deterministic helper outputs and fixture state hashes for accepted same-zone source checks
non_scope:
  - queue processor integration
  - enabling resolveFromDestinationZone, resolveFromLastKnownInformation, or noSourceRequired in queue processing
  - new gameplay timing implementations
  - new DSL primitives
  - Life Triggers
  - On K.O.
  - target selection
  - replacement effects
  - custom handlers
  - server/client/UI or replay schema
dependencies:
  - ENG-024A
acceptance_criteria:
  - mustRemainInSameZone helper coverage accepts matching live source instance/card/player/zone data
  - mustRemainInSameZone helper coverage rejects missing source zone, missing live source, stale zone, and mismatched identity data
  - current same-zone runtime regression tests remain green without queue processor integration changes in this substory
  - fixture state hashes remain stable for repeated accepted same-zone source checks
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/source-presence.test.ts packages/engine-core/src/effect-runtime.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - generate and activate only the ENG-024B packet while implementing this story
  - run corepack pnpm run packets:verify before implementation and review handoff
  - stay within allowed_touch_points
  - target the ENG-024 parent integration branch
  - do not run packets:complete after merging only into the parent integration branch
  - if implementation requires queue processor integration, enabling non-same-zone policies, Counter Step test changes, or new gameplay timing, stop and split or record the blocker
  - implementation-review gate is required after the PR is opened
ambiguity_policy: fail_and_escalate
