summary: >
  Compose supported condition components with all currently supported
  generated-support trigger wrappers and effect bodies backed by ENG-058 runtime
  capability evidence.
story_boundary: >
  Own only cards-side generated-support component evidence, runtime capability
  matrix records, parser/generated DSL composition, support indexing,
  diagnostics, and tests for ENG-058-backed conditional generated support. Do
  not add engine behavior, shared schema authority, new effect primitives,
  source fixture support, or real-card hash changes.
