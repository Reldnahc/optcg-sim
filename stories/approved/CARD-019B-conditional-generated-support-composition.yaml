dependencies:
  - CARD-019A
  - ENG-058A
  - ENG-058B
scope:
  - add cards-side runtime capability evidence for ENG-058-supported condition predicates and boolean condition composition
  - add wrapper/body/condition component evidence so conditions compose with all currently supported generated-support trigger wrappers and effect bodies where ENG-058 runtime evidence is truthful
  - supported trigger wrappers include On Play, When Attacking, existing once-per-turn When Attacking where already supported, life Trigger, and On K.O.
  - supported bodies include only bodies already admitted by current generated support and backed by runtime capability evidence under the selected wrapper/source-presence policy
  - include representative conditioned optional body coverage where the corresponding unconditioned optional generated-support body is already supported and ENG-058B runtime evidence preserves optional activation behavior
  - 'generate block-level `condition` on the effect block; do not emit the Effect variant `{ type: "conditional" }` for admitted generated-support conditional wrappers'
  - preserve `conditionTiming` absence unless a later reviewed story explicitly supports it
  - require complete parse, DSL schema validation, runtime capability evidence, support metadata, tests, and review metadata before marking generated support playable in package-local synthetic/generated-support evidence
  - do not promote any previously unsupported real card to playable support in this story
  - keep support fail-closed for partial, ambiguous, stale, unsupported, schema-invalid, missing-capability, unsupported-layer, metadata-invalid, source-invalid, untested, or unreviewed output
  - prove conditional wrapper/body support is driven by reusable component evidence rather than exact conditional parser-rule identity
  - use representative composition tests instead of testing every condition with every wrapper and body
  - update support-probe/report diagnostics to name the missing condition, connector, wrapper, body, source policy, or runtime capability layer
  - preserve existing CARD-008 through CARD-018 supported and unsupported behavior unless explicitly migrated with regression tests
non_scope:
  - engine runtime behavior
  - shared TYP/contracts/schema changes
  - new effect body primitives
  - new trigger wrappers beyond those already runtime-supported
  - activate-main, event main/counter, permanent/continuous, replacement, custom-handler, optional cost, or cost-punctuation conditional support
  - real-card fixture support, fixture capture, fixture recapture, source hash updates, behavior hash updates, overlays, or supported-card manifest changes unless exact source integrity and review scope are explicitly added before approval
  - real-card playability promotion or support-manifest changes for previously unsupported real cards
  - broad natural-language inference or replacement generalization
card_source_integrity:
  - this story does not enable or change real-card gameplay support for any target card; no target card IDs are in scope
  - this story must not edit source fixtures, source hashes, behavior hashes, overlays, supported-card manifests, or manually reviewed source evidence
  - printed examples must be synthetic parser/generated-support probes unless a later story adds exact source-integrity scope
  - do not mark any previously unsupported real card playable in this story
engine_capability_preflight:
  - no new engine capability is introduced by this story
  - ENG-058A is runtime authority for supported condition predicates and boolean composition
  - ENG-058B is runtime authority for supported block-level conditions under On Play, When Attacking, life Trigger, and On K.O. queued wrappers
  - generated support must fail closed if any condition/wrapper/body/source-policy combination lacks current runtime capability evidence
  - if implementation finds that activate-main, event main/counter, permanent/continuous, replacement, or another desired shape still needs engine behavior, record the blocker and do not hide it inside CARD-019B
acceptance_criteria:
  - conditional generated support composes supported condition components with all ENG-058-supported trigger wrappers and existing supported bodies
  - 'generated DSL uses block-level `condition` and does not emit `{ type: "conditional" }` for admitted condition wrappers'
  - On Play, When Attacking, life Trigger, and On K.O. representative conditional generated-support cases pass when all gates are present
  - representative conditioned optional generated-support cases pass only where the corresponding unconditioned optional body and ENG-058B optional activation behavior are already supported
  - conditional wrapper/body/generated-support support is proven through reusable component evidence, not exact conditional parser-rule identity
  - boolean `and` and boolean `or` representative cases pass only when every child condition and connector has support evidence
  - missing condition, missing connector, missing wrapper, missing body, missing source policy, missing runtime capability, schema-invalid, stale-hash, metadata-invalid, source-invalid, untested, and unreviewed gates keep support unsupported
  - support-probe and generated-support report diagnostics identify the missing condition/component/layer
  - existing supported generated-support shapes remain supported and existing unsupported shapes remain unsupported except for ENG-058-authorized conditional shapes intentionally enabled by this story
required_tests:
  - story-review for CARD-019B before approval handoff
  - runtime capability inventory tests for ENG-058 condition predicate, connector, and wrapper reachability evidence
  - generated DSL validation tests for block-level `condition` output and absent `conditionTiming`
  - 'negative generated DSL validation proving admitted condition wrappers do not emit `{ type: "conditional" }`'
  - representative conditional On Play, When Attacking, life Trigger, and On K.O. support tests
  - representative conditional no-choice body and decision-pausing body support tests
  - representative conditioned optional body support tests and missing-gate tests for optional conditional support
  - tests proving conditional wrapper/body support is driven by reusable component evidence rather than exact conditional parser-rule identity
  - representative boolean `and` and boolean `or` support tests, including `or more` and `or less` comparator regression
  - missing runtime capability tests for condition predicate, connector, wrapper, body, and source-presence evidence
  - fail-closed tests for unsupported condition, unsupported connector, unsupported wrapper, unsupported body, unsupported source policy, residue text, word-number quantities, cost punctuation ambiguity, activate-main, event main/counter, permanent/continuous, replacement, and custom-handler conditional text
  - support-probe and generated-support report tests for missing condition/component/layer diagnostics
  - stale-hash, invalid-dsl-schema, metadata/review/test gate regressions proving those blockers keep their priority and identity
  - regression tests proving current CARD-008 through CARD-018 supported and unsupported behavior remains compatible
  - run `corepack pnpm run packets:verify`
  - run `corepack pnpm run stories:validate`
  - run `corepack pnpm --filter @optcg/cards test`
  - full `corepack pnpm verify`
repo_rules:
  - generate and activate the CARD-019B packet before implementation
  - stay within allowed_touch_points
  - do not add engine runtime behavior, shared schema authority, fixture support, source hash updates, or card-specific one-off templates
  - use component evidence and representative composition tests rather than condition/wrapper/body cartesian-product testing
  - fail closed if runtime capability, schema authority, source integrity, metadata, or review/test evidence is missing
ambiguity_policy: fail_and_escalate
