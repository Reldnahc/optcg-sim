spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-045
epic_id: INF-045
title: Decouple packet role contract tests from approved story lifecycle paths
type: tooling
area: infra
primary_concern: verification
priority: high
status: approved
summary: >
  Fix packet rendering and extraction contract coverage so role-section tests
  use lifecycle-independent story inputs instead of hard-coding completed
  stories under `stories/approved/`.
story_boundary: >
  Own only the contract-test input setup for packet role rendering and
  extraction coverage. Do not change production packet rendering, packet
  extraction, packet lifecycle cleanup, cleanup metadata validation, story
  schema behavior, or any gameplay/application code.
allowed_touch_points:
  - tests/contracts/agent-packet-rendering-contract.test.mjs
  - tests/contracts/agent-packet-extraction-contract.test.mjs
  - tests/contracts/agent-packet-test-support.mjs
  - tests/fixtures/stories/**
spec_refs:
  - 23-repo-tooling-and-enforcement.s005
  - 23-repo-tooling-and-enforcement.s010
  - 23-repo-tooling-and-enforcement.s016
  - 26-agent-packet-template.s005
  - 27-spec-driven-story-generation-workflow.s012
  - 27-spec-driven-story-generation-workflow.s015
  - 32-codex-agent-integration.s013
  - 11-testing-quality.s022
scope:
  - replace the packet rendering contract test input that currently points at `stories/approved/INF-044C-role-scoped-packet-sections.yaml`
  - use a lifecycle-independent fixture story or a temporary generated approved-story file within the test fixture repo
  - preserve deterministic assertions for post-approval role section order, role responsibilities, forbidden actions, required inputs, required outputs, checklists, and unsupported roles
  - audit packet extraction contract tests for the same live approved-story lifecycle dependency and update them only if needed
  - keep the contract tests passing after INF-044C has moved to `stories/done/`
non_scope:
  - production packet renderer changes
  - production packet parser or extraction CLI changes
  - packet completion, active manifest, or cleanup automation behavior changes
  - cleanup metadata guard changes
  - story schema changes
  - gameplay, contract, engine, server, client, replay, database, or UI changes
dependencies:
  - INF-014
  - INF-044C
acceptance_criteria:
  - packet rendering contract tests no longer resolve `stories/approved/INF-044C-role-scoped-packet-sections.yaml`
  - packet rendering role-section coverage passes when INF-044C exists only under `stories/done/`
  - the replacement test input is deterministic and independent of the live approved-story lifecycle
  - role-section assertions still prove the four supported post-approval roles are rendered in canonical order
  - role-section assertions still prove story-author, story-review, packet-agent, cleanup-sync-agent, and revision-agent sections are not rendered
  - packet extraction contract tests either already use lifecycle-independent temp fixtures or are updated to do so within the allowed touch points
  - no production tooling or application files are changed
required_tests:
  - run `corepack pnpm exec vitest run tests/contracts/agent-packet-rendering-contract.test.mjs`
  - run `corepack pnpm exec vitest run tests/contracts/agent-packet-extraction-contract.test.mjs`
  - run `corepack pnpm run test:contracts`
  - run `corepack pnpm run packets:verify`
  - run `corepack pnpm verify`
repo_rules:
  - contract tests must construct their own story lifecycle state instead of depending on live approved story files
  - do not skip or weaken role-section assertions to avoid the lifecycle failure
  - keep fixture stories schema-valid and deterministic
  - keep changes limited to test setup, test fixtures, and directly related test support
  - preserve packet lifecycle semantics and cleanup automation behavior unchanged
ambiguity_policy: fail_and_escalate
