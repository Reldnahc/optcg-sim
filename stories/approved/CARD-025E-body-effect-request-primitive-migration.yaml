scope:
  - migrate current draw and draw-up-to bodies to body primitive evidence with parsed positive-safe-integer counts
  - migrate current trash-from-hand bodies to action/source/count primitive evidence independent from the wrapper
  - migrate current standalone and granted keyword bodies to keyword primitive evidence for all currently supported keywords
  - migrate current granted protection bodies in conditional continuous support to protection body primitive evidence where currently supported
  - wire conditional continuous non-base body certification to the parsed condition primitive actually used by the parse result, consuming already-proven CARD-025D condition certification IDs without adding condition semantics
  - keep generated-support evaluator default parser-certification inventory aligned with current reusable primitive certification IDs so proof/probe paths do not rely on omitted-cert defaults
  - add a focused support-evaluator default parser-certification regression test file when existing evaluator tests would approach file-size enforcement
  - add focused parser-certification tests for standalone keyword and conditional continuous body primitives when existing generated-support tests would exceed file-size enforcement
  - update existing generated-support index tests that construct standalone keyword cards so they supply current keyword body primitive parser-certification evidence instead of relying on missing-cert defaults
  - migrate current modify-power, cannot-attack, cannot-block, K.O., protection, base-power setter, play-stage, play-selected, and search request bodies to body primitive evidence where currently supported
  - migrate current search bodies so look count, reveal/non-reveal visibility, selected-to-hand destination, bottom remainder policy, and trailing hand-trash action are separate body/request primitives
  - shared-file edits in condition/target/filter modules are limited to consuming already-proven CARD-025D primitives for body/request evidence wiring; they must not add condition, target, filter, cardinality, or duration semantics
  - preserve fail-closed behavior for unsupported body actions, counts, destinations, visibility, target filters, and durations
  - retire or demote story-named production body parser modules that authorize support by old story ID instead of body primitive domain
non_scope:
  - new body effect families not already supported
  - wrapper/cost/condition/target/filter parser expansion outside dependencies
  - engine runtime or shared schema changes
  - real-card fixture or manifest work
card_source_integrity:
  - not applicable because this story migrates existing body support through synthetic generated-support inputs and does not enable or change gameplay support for any real card
  - new acceptance tests must not cite real card IDs or real fixtures
engine_capability_preflight:
  - no new runtime capability is introduced
  - parsed body/request shapes decompose as body/action evidence for current draw, draw-up-to, trash-from-hand, standalone keyword, keyword grant, modify-power, cannot-attack, cannot-block, K.O., protection, base-power setter, stage-play, play-selected, and search request bodies
  - wrapper or entry-point, markers, costs, and source-presence policies are delegated to CARD-025C and may only be consumed here as already-certified prerequisite evidence
  - condition, target, filter, cardinality, duration, public/hidden visibility selector boundaries, and saved-target references are delegated to CARD-025D and may only be consumed here as already-certified prerequisite evidence
  - composition evidence for sequencing, line-separated text, conditional bodies, and costed bodies is delegated to CARD-025F; this child may require body/request primitives to expose the segment evidence consumed by those compositions
  - decision/visibility needs for search bodies include existing selected-card reveal/non-reveal semantics, selected-to-hand destination, bottom remainder policy, and chooser decision boundaries already implemented by prerequisite runtime stories; this child must not add hidden-information or decision runtime behavior
  - supported capability group includes existing runtime capability evidence for current draw, trash, keyword, modifier, restriction, K.O., protection, base-power, stage-play, play-selected, and search bodies, plus existing search visibility/destination/remainder capability IDs where already present
  - missing capability group is none for preserving currently supported body behavior
acceptance_criteria:
  - current supported body effects emit reusable body/action/request evidence
  - current supported numeric counts and values vary through parsed primitives, not fixed sample branches
  - body support can be composed with certified wrappers from CARD-025C and targets/filters from CARD-025D without exact full-line authorization
  - unsupported body variants remain fail-closed with narrow diagnostics
  - tests fail if a current body support path is authorized only by exact full-effect text, exact wrapper-body text, story-named production parser ownership, or sample-specific numeric values
required_tests:
  - story-review for CARD-025E before approval handoff
  - parser matrix tests for current supported body primitive families and numeric variation
  - generated-support tests proving current body families use primitive evidence and runtime capability IDs
  - generated-support tests proving standalone keyword, granted keyword, and granted protection support fail closed when body primitive parser-certification evidence is absent or stale
  - generated-support tests proving conditional continuous non-base body support fails closed only for the parsed condition primitive that is missing or stale, and remains supported when an unrelated condition primitive certification is stale
  - support-evaluator tests proving a supported conditional continuous non-base body remains supported through default parser-certification evidence without explicit parser-certification input
  - existing generated-support tests that construct supported standalone keyword cards remain green by supplying keyword body primitive parser-certification IDs explicitly
  - negative tests for unsupported body action/count/destination/visibility/duration variants
  - anti-shape tests proving no exact full-effect or story-named production body parser authorizes current support
  - run `corepack pnpm run packets:verify`
  - run `corepack pnpm run stories:validate`
  - run `corepack pnpm --filter @optcg/cards test`
  - run full `corepack pnpm verify`
repo_rules:
  - generate and activate the CARD-025E packet before implementation
  - stay within allowed_touch_points
  - do not add new runtime or schema capability
  - fail closed when a body cannot be decomposed into current reusable primitive evidence
ambiguity_policy: fail_and_escalate
