id: CARD-025E
epic_id: CARD-025
title: Body effect and request primitive migration
type: implementation
area: cards
primary_concern: rules
priority: high
status: approved
summary: >
  Migrate current cards-layer body effect and request support to reusable
  primitive evidence. Draw, trash, keyword, field modifier, restriction, K.O.,
  protection, base-power, stage-play, play-selected, and search bodies must be
  authorized by body/action primitives plus their target/filter/count/duration
  evidence, not by exact full-effect or exact wrapper-body samples.
story_boundary: >
  Own only body effect/request parser components and generated-support evidence
  for currently supported cards-layer behavior. Do not add wrapper/cost adapter
  support beyond CARD-025C, condition/target/filter support beyond CARD-025D,
  engine runtime behavior, shared schema, real-card fixtures, manifests, source
  hashes, behavior hashes, or overlays.
