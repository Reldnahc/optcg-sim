title: Support probe and report integration for composed effects
type: implementation
area: cards
primary_concern: verification
priority: high
status: approved
summary: >
  Add final cards-side generated-support and playability diagnostics for
  composed effects so reports identify the exact missing support layer.
story_boundary: >
  Own only packages/cards support-probe, support-report, generated-support
  diagnostics, and tests. Do not add new parser rules, runtime behavior,
  generated DSL support, fixtures, or card playability in this final
  diagnostics child.
