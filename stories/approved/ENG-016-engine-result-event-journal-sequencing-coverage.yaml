spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-016
epic_id: KICK-001
title: Add global EngineResult and eventJournal sequencing regression coverage
type: verification
area: engine
primary_concern: verification
priority: high
status: approved
summary: >
  Add broad regression coverage that exercises representative accepted engine
  paths and asserts EngineResult event sequencing, event ID uniqueness, appended
  eventJournal ordering, and deterministic state hashes across those paths.
story_boundary: >
  Own only engine-core regression tests and minimal test helpers for accepted
  EngineResult/eventJournal sequencing across representative existing paths. Do
  not redesign event schema, replay schema, effect runtime, or gameplay behavior.
allowed_touch_points:
  - packages/engine-core/src/event-sequencing-regression.test.ts
  - packages/engine-core/src/*test-fixtures.ts
  - stories/approved/ENG-016-engine-result-event-journal-sequencing-coverage.yaml
  - agent-packets/ENG-016.md
  - agent-packets/active.json
spec_refs:
  - 02-engine-mechanics.s019 (Block Step)
  - 02-engine-mechanics.s025 (Keyword behavior)
  - 03-game-state-events-decisions.s004 (Engine result)
  - 03-game-state-events-decisions.s005 (Event journal)
  - 03-game-state-events-decisions.s020 (State hashing)
  - 03-game-state-events-decisions.s021 (Invariant hooks)
  - 03-game-state-events-decisions.s022 (Internal state sequencing)
  - 04-effect-runtime.s010 (Queue processing)
  - 11-testing-quality.s010 (Golden tests)
  - 18-acceptance-tests.s003 (Milestone 1 - terminal engine)
  - 18-acceptance-tests.s004 (Milestone 2 - first effect runtime)
scope:
  - add shared test assertions for accepted EngineResult outputs that verify EngineResult.events seq values are strictly increasing
  - add shared test assertions that event IDs are unique within each EngineResult.events array
  - add shared test assertions that each result's appended state.eventJournal suffix matches EngineResult.events and the full state.eventJournal remains strictly increasing
  - add deterministic state-hash stability assertions for repeated identical representative paths
  - cover accepted mulligan, phase advancement, play-card, attach-DON, declare-attack, landed Blocker decision/activation/resolution, supported no-choice On Play draw/effect-queue processing, and concession or terminal-result paths
  - do not skip Blocker or supported effect-queue paths because ENG-014E and ENG-012G are landed; if another listed accepted path is genuinely unavailable, document it in the implementation note and keep the test name explicit
non_scope:
  - event schema redesign
  - replay schema changes
  - effect runtime redesign or new effect behavior
  - gameplay rule changes
  - CLI, server, client, database, fixture replay, or production replay contract changes
  - changing existing expected hashes or replay fixtures
dependencies:
  - ENG-014E
  - ENG-012G
  - SPEC-001
acceptance_criteria:
  - a focused engine-core regression test exercises representative accepted paths across setup/mulligan, phase advancement, play-card, attach-DON, declare-attack, landed Blocker decision/activation/resolution, supported no-choice On Play draw/effect-queue processing, and concession or terminal results
  - every covered accepted result asserts strictly increasing EngineResult.events seq values
  - every covered accepted result asserts event IDs are unique within that result
  - every covered accepted result asserts the appended state.eventJournal suffix equals EngineResult.events and the full state.eventJournal remains strictly increasing
  - repeated identical setup/action scripts for the representative paths produce the same event sequence and state hash
  - no production engine behavior, CLI behavior, replay fixture, replay schema, database schema, server, or client files are changed; if the new coverage exposes a real sequencing defect, stop and report/split the blocker instead of fixing it in this story
required_tests:
  - add or update packages/engine-core/src/event-sequencing-regression.test.ts
  - run corepack pnpm exec vitest run packages/engine-core/src/event-sequencing-regression.test.ts
  - run corepack pnpm run test -- packages/engine-core/src
  - run corepack pnpm run typecheck
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving the story to approved or implementing
  - generate and activate the packet before worker handoff
  - run corepack pnpm run packets:verify before implementation and review handoff
  - stay within allowed_touch_points
  - do not redesign event schema, replay schema, or effect runtime
  - do not change engine behavior; if the new tests expose a real sequencing defect, stop and report/split the blocker
  - implementation-review gate is required after the PR is opened
ambiguity_policy: fail_and_escalate
