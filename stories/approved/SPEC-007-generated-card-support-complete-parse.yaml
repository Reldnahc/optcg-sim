spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: SPEC-007
epic_id: KICK-001
title: Define generated card support from complete parse
type: specification
area: docs
primary_concern: rules
priority: high
status: approved
summary: >
  Update simulator specifications so common card support may be generated from
  complete card-text parsing plus runtime capability checks, without implying a
  manual per-card allowlist or manual card-to-mechanic map for common templates.
story_boundary: >
  Own only specification authority, generated spec metadata, and narrow
  authority-test coverage for complete-parse generated card support. Do not
  implement parser code, support-report tooling, engine behavior, card-data
  adapter behavior, real-card fixtures, server/client/API/UI behavior, or broad
  workflow changes.
