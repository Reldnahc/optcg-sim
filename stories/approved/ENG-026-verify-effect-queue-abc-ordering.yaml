spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: ENG-026
epic_id: KICK-001
title: Verify effect queue A-B-C ordering
type: verification
area: engine
primary_concern: verification
priority: high
status: approved
summary: >
  Add regression coverage proving deterministic effect queue ordering when a
  turn-player effect creates another turn-player effect while a non-turn-player
  effect is already pending.
story_boundary: >
  Own only effect queue ordering regression coverage and the smallest necessary
  repair to existing queue processing if the regression exposes a landed bug.
  PlayerView work in this story is test-only; any production visibility leak
  must stop and split into a separate visibility repair story. Do not add new
  trigger kinds, card behavior, or effect primitives.
allowed_touch_points:
  - packages/engine-core/src/effect-runtime.test.ts
  - packages/engine-core/src/effect-runtime.ts
  - packages/engine-core/src/effect-queue-ordering.test.ts
  - packages/engine-core/src/effect-queue-ordering.ts
  - packages/engine-core/src/filter-state-for-player.test.ts
  - packages/engine-core/src/filter-state-for-player.real-states.test.ts
  - stories/approved/ENG-026-verify-effect-queue-abc-ordering.yaml
  - agent-packets/ENG-026.md
  - agent-packets/active.json
spec_refs:
  - 03-game-state-events-decisions.s002 (Canonical state model)
  - 03-game-state-events-decisions.s004 (Engine result)
  - 03-game-state-events-decisions.s005 (Event journal)
  - 03-game-state-events-decisions.s020 (State hashing)
  - 04-effect-runtime.s006 (Effect queue entry)
  - 04-effect-runtime.s009 (Queue ordering)
  - 04-effect-runtime.s010 (Queue processing)
  - 06-visibility-security.s002 (Security principle)
  - 06-visibility-security.s004 (PlayerView shape)
  - 11-testing-quality.s007 (Interaction tests)
  - 11-testing-quality.s008 (Invariant tests)
  - 11-testing-quality.s011 (Hidden-information tests)
  - 18-acceptance-tests.s004 (Effect runtime acceptance tests)
scope:
  - create a representative real engine queue-processing regression where turn-player effect A and non-turn-player effect B are pending
  - prove resolving A can create new turn-player effect C in the same timing window with the next generation
  - prove the resulting resolution order is A, then B, then C
  - assert the ordering is deterministic for repeated equivalent setup
  - assert EngineResult event sequencing and appended state.eventJournal sequencing remain strictly increasing
  - assert state hashes remain stable for repeated equivalent setup
  - assert PlayerView output for both players does not expose effectQueue internals or trigger ordering internals
acceptance_criteria:
  - the regression uses production engine queue processing rather than static JSON-only fixture assertions
  - generated turn-player effect C is lower priority than already-pending non-turn-player effect B because generation ordering is applied before player bucket ordering
  - repeated equivalent states produce the same resolution event type/order summary and final state hash
  - EngineResult.events and state.eventJournal are strictly increasing by seq, with unique event IDs in the result
  - filterStateForPlayer for both players omits effectQueue, source snapshots, trigger ordering internals, and queue entry IDs
  - no new public legal actions, trigger categories, effect primitives, server protocol, client code, or UI behavior are introduced
non_scope:
  - new trigger categories
  - Life Trigger behavior
  - On K.O. behavior
  - target selection
  - replacement effects
  - optional effects
  - new gameplay keywords
  - card database changes
  - server/client/UI
  - replay schema or replay storage
dependencies:
  - ENG-025A
  - ENG-025B
  - ENG-025C
  - ENG-025D
  - ENG-025E
required_tests:
  - run corepack pnpm exec vitest run packages/engine-core/src/effect-runtime.test.ts
  - run corepack pnpm exec vitest run packages/engine-core/src/filter-state-for-player.test.ts packages/engine-core/src/filter-state-for-player.real-states.test.ts
  - run corepack pnpm --filter @optcg/engine-core typecheck
  - run corepack pnpm run packets:verify
  - run corepack pnpm run coverage
  - run corepack pnpm run verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - if story-review finds this story is too broad, lacks authority, or overlaps landed work, split it or stop before implementation
  - generate and activate only the ENG-026 packet while implementing this story
  - run corepack pnpm run packets:verify before implementation and review handoff
  - stay within allowed_touch_points
  - do not add new gameplay behavior except the smallest repair required for the regression to match the cited queue-ordering contract
  - PlayerView leak assertions are test-only in this story; if production filter code must change, stop and split a visibility repair story
  - if the regression requires new trigger categories, target selection, replacement effects, optional effects, server/client/UI, or replay schema behavior, stop and record the blocker
ambiguity_policy: fail_and_escalate
