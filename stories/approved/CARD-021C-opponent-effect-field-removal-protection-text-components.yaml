id: CARD-021C
epic_id: CARD-021
title: Opponent-effect field-removal protection text components
type: implementation
area: cards
primary_concern: rules
priority: high
status: approved
summary: >
  Add reusable cards-side parsing and diagnostics for self field-removal
  protection against opponent effects, while keeping generated support
  fail-closed unless every protection schema and runtime bridge gate is
  truthfully proven.
story_boundary: >
  Own only cards-side parser/component diagnostics, generated-support evidence
  modeling, runtime-capability gating, and tests for opponent-effect
  field-removal protection text components. Do not add engine behavior, shared
  protection contracts, real-card fixtures, source hash changes, behavior hash
  changes, overlays, support manifest edits, keyword-grant parsing, or real-card
  support promotion.
