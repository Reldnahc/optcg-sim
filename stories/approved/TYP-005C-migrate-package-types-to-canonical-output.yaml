spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: TYP-005C
epic_id: TYP-005
title: Migrate package types to canonical output
type: refactor
area: contracts
primary_concern: contract
priority: critical
status: approved
summary: >
  Run the canonical type sync mechanism against committed `@optcg/types`
  package files so package exports reflect canonical contracts, including the
  observed public view, decision, replacement, and `respondToDecision` drift.
story_boundary: >
  Own only the package type source migration to canonical-derived output and
  package type tests that prove the migrated surface. Do not change canonical
  contract shapes or behavior in engine, server, client, or replay code.
allowed_touch_points:
  - packages/types/src/**
  - packages/types/package.json
  - packages/types/tsconfig.json
  - packages/types/src/export-cohesion.test.ts
  - docs/contracts/type-authority.md
  - stories/approved/TYP-005C-migrate-package-types-to-canonical-output.yaml
spec_refs:
  - 03-game-state-events-decisions.s002
  - 03-game-state-events-decisions.s003
  - 03-game-state-events-decisions.s016
  - 06-visibility-security.s004
  - 06-visibility-security.s007
  - 06-visibility-security.s021
  - 22-v6-implementation-tightening.s006
  - 23-repo-tooling-and-enforcement.s006
  - 23-repo-tooling-and-enforcement.s011
  - 24-story-schema.s016
  - 24-story-schema.s025
  - 24-story-schema.s031
  - 24-story-schema.s032
scope:
  - apply the TYP-005B sync mechanism to committed package type files
  - make `packages/types/src/*` match the canonical contract module output under the TYP-005A strategy
  - resolve the observed package drift for `PublicCardView.currentPower`, `PublicDecision.processId`, `PublicDecision.replacementIds`, and `PublicDecision.mandatory` only by following canonical contracts
  - resolve the observed `Action.respondToDecision` `playerId` disagreement only by following canonical contracts
  - update package type tests and import witnesses so they use canonical-compatible examples
  - keep package export names available through `@optcg/types`
non_scope:
  - adding fields to canonical contracts because package files currently have them
  - removing fields from canonical contracts because package files currently lack them
  - changing engine action validation or decision routing behavior
  - changing server protocol envelopes or client action payload behavior
  - changing replay serialization, hidden-information filtering, or gameplay rules
  - adding the final whole-surface merge-blocking guard
dependencies:
  - TYP-005B
acceptance_criteria:
  - committed `packages/types/src/*` is generated or synced from canonical contract modules
  - package view and decision type declarations no longer contain one-sided drift relative to canonical contracts
  - "`Action.respondToDecision` in `@optcg/types` matches canonical contract authority"
  - if resolving `respondToDecision.playerId` requires gameplay behavior, validation, protocol, replay, or uncited contract-authority decisions, the story stops and records an ambiguity instead of choosing a behavior
  - no engine, server, client, replay, database, UI, or gameplay files are changed
required_tests:
  - exact candidate story-review before implementation
  - focused package type tests for canonical-compatible public view examples
  - focused package type tests for canonical-compatible decision and action examples
  - run the TYP-005B stale-output check against committed package files
  - run `corepack pnpm exec vitest run packages/types/src`
  - run `corepack pnpm exec vitest run packages/types/src/export-cohesion.test.ts`
  - run `corepack pnpm run typecheck`
  - run `corepack pnpm run stories:validate`
repo_rules:
  - do not edit canonical contract files in this story
  - do not make package types the authority for contract shape
  - fail closed on any uncited behavior question for `respondToDecision.playerId`
  - keep migration mechanical and reviewable from canonical source to package output
ambiguity_policy: fail_and_escalate
