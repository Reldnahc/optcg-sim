spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-053I
epic_id: INF-053
title: Deduplicate post-merge cleanup parser and evidence construction
type: refactor
area: infra
primary_concern: tooling
priority: high
status: approved
summary: >
  Refactor the large inline cleanup metadata parser and evidence builder in the
  post-merge cleanup workflow into checked-in tooling that reuses existing
  post-merge cleanup modules while preserving current fail-closed semantics.
story_boundary: >
  Own only post-merge cleanup parser/evidence de-duplication between the GitHub
  workflow and checked-in cleanup tooling. Do not change cleanup metadata syntax,
  packet completion semantics, branch-deletion policy, or cleanup authority.
allowed_touch_points:
  - .github/workflows/post-merge-packet-cleanup.yml
  - tools/post-merge-cleanup.ts
  - tools/post-merge-cleanup/**
  - tests/ci/github-workflows.test.mjs
  - tests/github/review-workflow.test.mjs
  - tests/contracts/post-merge-cleanup-contract.test.mjs
spec_refs:
  - 26-agent-packet-template.s005
  - 27-spec-driven-story-generation-workflow.s015
  - 32-codex-agent-integration.s013
dependencies:
  - INF-053H
scope:
  - move inline cleanup metadata parsing and evidence construction out of `.github/workflows/post-merge-packet-cleanup.yml`
  - reuse existing checked-in post-merge cleanup modules for parser/evidence behavior
  - keep the workflow thin and limited to data fetching, tool invocation, artifact passing, and push/delete orchestration
  - preserve existing behavior and fail-closed cleanup semantics
  - add or update contract and workflow tests for the refactored parser/evidence path
non_scope:
  - changing cleanup metadata syntax
  - changing packet completion command behavior
  - changing branch cleanup authorization rules
  - broad post-merge automation redesign outside parser/evidence de-duplication
acceptance_criteria:
  - workflow no longer contains a large independent cleanup metadata parser/evidence builder
  - checked-in cleanup tooling owns parser/evidence construction reused by the workflow
  - existing single-story and parent cleanup behavior remains fail-closed
  - contract tests cover the workflow-facing parser/evidence entry point
required_tests:
  - run `corepack pnpm run test -- tests/ci/github-workflows.test.mjs tests/github/review-workflow.test.mjs`
  - run `corepack pnpm run test:contracts`
  - run `corepack pnpm verify`, or record why unavailable
repo_rules:
  - implement this child last in the INF-053 sequence
  - preserve cleanup-scoped lifecycle verification and direct cleanup push safety
  - do not weaken trusted default-branch checkout requirements
ambiguity_policy: fail_and_escalate
