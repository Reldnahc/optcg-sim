spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-054
epic_id: INF-054
title: Make child story-review gate impossible to skip
type: tooling
area: docs
primary_concern: docs
priority: critical
status: approved
summary: >
  Make the parent/substory story-review requirement short, early, and
  mechanically protected so future runs cannot treat child story-review as a
  vague PR, AI review, implementation review, or human merge-gate artifact.
story_boundary: >
  Own only workflow authority wording and focused workflow documentation tests
  for the Story Approval Review Gate. Do not change runtime/product behavior,
  cleanup automation, story schema, model routing policy, packet lifecycle
  mechanics beyond wording that places story approval review before packet
  activation, or any mutable story-review status file.
allowed_touch_points:
  - AGENTS.md
  - docs/workflow/story-execution.md
  - docs/workflow/parent-integration-branches.md
  - docs/workflow/review-gate.md
  - specs/27-spec-driven-story-generation-workflow.md
  - specs/32-codex-agent-integration.md
  - .github/pull_request_template.md
  - tests/github/review-workflow.test.mjs
  - specs/section-index.json
  - stories/generated/INF-054-story-approval-review-gate-stop-rule.yaml
  - stories/approved/INF-054-story-approval-review-gate-stop-rule.yaml
  - agent-packets/INF-054.md
  - agent-packets/active.json
spec_refs:
  - 24-story-schema.s016
  - 24-story-schema.s025
  - 24-story-schema.s031
  - 24-story-schema.s032
  - 27-spec-driven-story-generation-workflow.s008
  - 27-spec-driven-story-generation-workflow.s009
  - 27-spec-driven-story-generation-workflow.s015
  - 27-spec-driven-story-generation-workflow.s017
  - 32-codex-agent-integration.s008
  - 32-codex-agent-integration.s010
  - 32-codex-agent-integration.s013
  - 32-codex-agent-integration.s014
dependencies:
  - INF-019
  - INF-038
  - INF-046
  - INF-053
scope:
  - rename the parent/child pre-approval story-review gate consistently to Story Approval Review Gate
  - add the concise invariant: "Story Approval Review Gate: before any parent story set is approved, packetized, activated, or handed to implementation, there must be one story-review artifact for the parent story and one story-review artifact for every child story. Parent story-review does not satisfy child story-review. Child story-review does not satisfy sibling story-review. If any row is missing, pending, unknown, or not reconstructable from durable evidence: STOP."
  - place the Story Approval Review Gate before packet generation, packet verification, worker-ready checks, implementation handoff, and PR handoff in the root checklist
  - add the concise STOP invariant before detailed parent/substory matrix rules in workflow docs
  - require parent plus every child story-review matrix evidence before child activation and before final parent PR handoff
  - clarify in PR review guidance that PR review, AI review, implementation code-review, full-story integration review, and human merge-gate review do not satisfy Story Approval Review Gate
  - align specs so parent/substory approval cannot proceed unless the parent and every child have separate story-review evidence
  - replace the vague PR-template story-review checkbox with an explicit parent artifact and child artifact evidence block
  - update focused workflow tests so the concise STOP rule, chronological placement, and parent/child/sibling separation cannot disappear silently
non_scope:
  - runtime, gameplay, engine, card, server, client, replay, database, UI, or product behavior
  - cleanup metadata parser behavior or post-merge cleanup automation
  - story schema changes or new story-review status fields
  - model-routing policy changes
  - packet lifecycle tooling mechanics beyond wording that orders review before packet activation
  - broad review workflow redesign outside the Story Approval Review Gate wording and tests
  - a new mutable story-review status file
acceptance_criteria:
  - AGENTS.md has the Story Approval Review Gate before packet generation and activation steps
  - the required STOP invariant appears in AGENTS.md or linked workflow docs with the parent artifact, every child artifact, parent-does-not-satisfy-child, child-does-not-satisfy-sibling, and missing/pending/unknown/not-reconstructable fail-closed cases intact
  - docs clearly require one story-review artifact for the parent and one story-review artifact for every child before approval, packetization or packet generation, activation, and implementation handoff
  - workflow docs clearly say every child story needs its own story-review artifact before approval and activation
  - workflow docs clearly say parent story-review does not satisfy child story-review
  - workflow docs clearly say one child story-review does not satisfy sibling child story-review
  - review-gate docs clearly say PR review does not satisfy Story Approval Review Gate
  - specs 27 and 32 align with the parent plus every child pre-approval gate
  - PR template asks explicitly for parent story-review artifact and child story-review artifact references
  - tests fail if the concise STOP rule is removed, renamed ambiguously, or moved behind packet, implementation, or PR review steps
required_tests:
  - corepack pnpm run specs:generate-metadata
  - corepack pnpm run specs:verify-metadata
  - corepack pnpm exec vitest run tests/github/review-workflow.test.mjs
  - corepack pnpm run packets:verify
  - corepack pnpm verify
repo_rules:
  - story-review must pass before moving this story to approved or implementing
  - use the normal packet, implementation-worker, code-review, PR, AI review, revision response, and human-review workflow after story approval
  - implementation handoff must include explicit file ownership and test ownership
  - keep wording concise and chronological; do not add broad process prose when a short STOP rule is enough
  - do not broaden into unrelated workflow cleanup
  - use corepack pnpm for repo commands
ambiguity_policy: fail_and_escalate
