title: Optional cost clause runtime contracts
type: implementation
area: contracts
primary_concern: contract
priority: high
status: approved
summary: >
  Define canonical contract and spec authority for optional cost clauses inside
  composed sequence execution so ENG-055D can implement optional-cost runtime
  without inventing response, segment-result, or use-consumption behavior.
story_boundary: >
  Own only optional-cost contract/spec/schema/type authority and contract tests.
  Do not implement engine runtime behavior, card parser support, or generated
  card support.
allowed_touch_points:
  - specs/03-game-state-events-decisions.md
  - specs/04-effect-runtime.md
  - specs/05-effect-dsl-reference.md
