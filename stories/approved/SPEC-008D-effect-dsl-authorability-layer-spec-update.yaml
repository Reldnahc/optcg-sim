id: SPEC-008D
epic_id: SPEC-008
title: Effect DSL authorability layer spec update
type: specification
area: docs
primary_concern: contract
priority: high
status: approved
summary: >
  Update the effect DSL reference to distinguish contract-defined,
  schema-authorable, runtime-executable, parser-certified, and generated-support
  playable layers for composed effects.
story_boundary: >
  Own only specification authority, generated spec metadata, and narrow
  authority tests for the DSL authorability layer model. Do not change canonical
  type files, effect DSL schema, engine runtime behavior, parser behavior, or
  card support metadata.
