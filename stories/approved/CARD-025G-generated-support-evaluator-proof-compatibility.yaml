spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: CARD-025G
epic_id: CARD-025
title: Generated-support evaluator proof compatibility
type: implementation
area: cards
primary_concern: verification
priority: high
status: approved
summary: >
  Align generated-support evaluator, support-probe, reports, proof
  certificates, and compatibility tests with the migrated primitive-boundary
  card-layer authority. Current supported generated-support paths must still
  pass, but reports must prove support through primitive evidence rather than
  exact parser-rule, full-line, or card-specific authority.
story_boundary: >
  Own only cards-layer evaluator, probe, report, proof-certificate, and final
  compatibility tests for the CARD-025 migration. Do not add new parser grammar,
  engine runtime behavior, shared schema, real-card fixtures, manifests, source
  hashes, behavior hashes, overlays, or real-card promotion.
