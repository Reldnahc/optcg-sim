id: ENG-006
epic_id: M1-001
title: Add vanilla Event card play skeleton
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Complete the Milestone 1 play-card skeleton by allowing supported vanilla
  Event cards to be played from hand through the existing engine play-card
  action path, while failing closed before Event effect resolution.
story_boundary: >
  Own only Main Phase play of supported vanilla Event cards from hand through
  existing engine action and payment routing. Stop before Event effect
  execution, Counter Event timing, effect queue processing, trigger handling,
  card-data package work, CLI grammar changes, or server/client behavior.
allowed_touch_points:
