title: Conditional queued trigger reachability
type: implementation
area: engine
primary_concern: rules
priority: high
status: approved
summary: >
  Allow supported block-level conditions through currently supported queued
  effect trigger wrappers so supported generated bodies can evaluate conditions
  at resolution under On Play, When Attacking, Trigger, and On K.O. timing.
story_boundary: >
  Own only engine-core support gates and tests that currently reject otherwise
  supported queued effects because an admitted `condition` field is present.
  Do not add new condition predicates, card parser support, generated-support
  records, shared contracts, or real-card fixtures.
