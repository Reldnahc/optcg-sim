spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-029
epic_id: KICK-001
title: Repair cleanup packet command execution
type: tooling
area: infra
primary_concern: tooling
priority: high
status: approved
summary: >
  Repair the post-merge cleanup executor command construction so the workflow
  invokes packet completion without passing an extra literal separator argument
  to `tools/build-agent-packet.ts`.
story_boundary: >
  Own the cleanup executor command invocation bug and the exact INF-028 manual
  packet-cleanup fallback required because automation failed after preflight.
  Do not redesign cleanup metadata, branch protection, packet lifecycle
  semantics, or workflow authorization.
allowed_touch_points:
  - tools/post-merge-cleanup/executor.ts
  - tests/contracts/post-merge-cleanup-executor-contract.test.mjs
  - agent-packets/INF-028.md
  - agent-packets/INF-029.md
  - agent-packets/active.json
  - stories/approved/INF-028-repair-post-merge-cleanup-first-run.yaml
  - stories/approved/INF-029-repair-cleanup-packet-command.yaml
  - stories/done/INF-028-repair-post-merge-cleanup-first-run.yaml
spec_refs:
  - 23-repo-tooling-and-enforcement.s010
  - 23-repo-tooling-and-enforcement.s016
  - 23-repo-tooling-and-enforcement.s023
  - 27-spec-driven-story-generation-workflow.s015
  - 32-codex-agent-integration.s013
scope:
  - "remove the extra literal `--` from the cleanup executor's `corepack pnpm run packets:complete` and `packets:complete-many` invocations"
  - "preserve executor validation, stale-plan checks, exact cleanup diff checks, deterministic commit messages, and direct-push policy"
  - "add or update tests proving selected packet completion commands match the repo's package script argument contract"
  - "include the exact manual packet-completion fallback output for INF-028 because the merged automation failed operationally after preflight"
non_scope:
  - cleanup metadata schema redesign
  - branch-protection or token changes
  - packet completion command semantic changes
  - cleanup workflow trigger or authorization changes
  - gameplay, engine, replay, client, or server behavior
dependencies:
  - INF-028
acceptance_criteria:
  - cleanup executor selects `corepack pnpm run packets:complete --story <story>` for single-story cleanup
  - cleanup executor selects `corepack pnpm run packets:complete-many --story <story> ...` for parent cleanup
  - executor tests fail if a literal `--` separator is reintroduced before `--story`
  - the INF-028 manual fallback cleanup diff is limited to exact packet completion output
  - "`pnpm verify` passes with INF-028 cleanup applied"
required_tests:
  - executor contract test proving the selected single-story command has no extra separator before `--story`
  - executor contract test proving the selected parent command has no extra separator before `--story`
  - "`pnpm run packets:verify`"
  - "`pnpm verify`"
repo_rules:
  - do not weaken cleanup validation, exact diff validation, required checks, typecheck, lint, or test rules
  - do not broaden cleanup actor/token permissions
  - preserve exact INF-028 manual cleanup output unless verification requires a separately reviewed tooling/test fix
ambiguity_policy: fail_and_escalate
