summary: >
  Add focused regression coverage for the completed Blocker vertical, proving
  computed eligibility, decision/legal-action filtering, event order,
  state-hash stability, replay smoke, and fail-closed unsupported
  blocker-adjacent paths.
story_boundary: >
  Own only test and fixture coverage for the completed ENG-014 Blocker
  vertical. Stop before production behavior changes or broadening support into
  Counter, Unblockable, On Block effects, replacement, or effect-runtime paths.
