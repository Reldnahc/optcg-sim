spec_version: v6
spec_package_name: optcg-md-specs-v6
story_schema_version: 1.0.0
id: INF-031
epic_id: KICK-001
title: Detect stale approved parent stories
type: tooling
area: infra
primary_concern: tooling
priority: high
status: approved
summary: >
  Extend committed story validation so an approved parent story fails validation
  when all of its declared child stories are already done, preventing completed
  parent placeholders from remaining in the approved backlog.
story_boundary: >
  Own only the committed-story validation guard for stale approved parent
  stories. Do not change packet generation, packet completion, story schema
  fields, GitHub sync, board automation, or implementation-story workflow.
allowed_touch_points:
  - stories/approved/INF-031-detect-stale-approved-parent-stories.yaml
  - agent-packets/INF-031.md
  - agent-packets/active.json
  - tools/validate-stories.ts
  - tests/contracts/committed-story-validation.test.mjs
spec_refs:
  - 23-repo-tooling-and-enforcement.s005 (Package scripts)
  - 23-repo-tooling-and-enforcement.s016 (CI merge gates)
  - 23-repo-tooling-and-enforcement.s023 (Definition of done for repo tooling)
  - 24-story-schema.s014 (Status)
  - 24-story-schema.s027 (Machine-readable validation contract)
  - 27-spec-driven-story-generation-workflow.s013 (Stronger process)
  - 27-spec-driven-story-generation-workflow.s015 (Recommended completion checks)
  - 32-codex-agent-integration.s013 (Completion and cleanup)
scope:
  - detect committed approved parent stories with `child_stories` where every child ID has a committed `stories/done` story with matching `id`
  - emit deterministic diagnostics naming the stale approved parent path and completed child IDs
  - keep partially completed parent stories valid while any declared child is not done
  - keep generated, blocked, done, replaced, and ambiguity stories outside this stale-approved-parent guard
  - preserve the existing approved-to-done pending move behavior in the validator
non_scope:
  - changing story schema fields or adding structured deferred metadata
  - changing packet generation, activation, verification, completion, or active manifest behavior
  - changing post-merge cleanup automation or GitHub branch protection
  - changing story-review, worker handoff, reviewer handoff, or human review policy
  - changing gameplay, engine, server, client, replay, database, card, or hidden-info behavior
dependencies:
  - INF-021
  - INF-027
acceptance_criteria:
  - "`stories:validate` fails for an approved parent story when all declared child story IDs are done"
  - the stale-parent diagnostic names the approved parent path and completed child IDs
  - "`stories:validate` passes for an approved parent story with at least one incomplete child"
  - "`stories:validate` passes for generated parent stories whose children are done"
  - existing schema validation and pending approved-to-done cleanup behavior remains unchanged
required_tests:
  - contract test proving a stale approved parent with all child stories done fails validation
  - contract test proving an approved parent with only some child stories done passes validation
  - contract test proving a generated parent with all child stories done passes validation
  - "focused `corepack pnpm exec vitest run tests/contracts/committed-story-validation.test.mjs`"
  - "`corepack pnpm run stories:validate`"
  - "`corepack pnpm run verify`"
repo_rules:
  - implement with TDD by first adding failing committed-story validation tests
  - keep diagnostics deterministic and path-based
  - do not add exceptions based on free-text uses of the word deferred
  - if the guard needs a new schema field, stop and split a separate schema story instead
ambiguity_policy: fail_and_escalate
